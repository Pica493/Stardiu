function updateDayNight(dt) {
  timeOfDay += dt / (settings.dayLength * 60);
  if (timeOfDay > 1) timeOfDay -= 1;
  const sunAngle = timeOfDay * Math.PI * 2 - Math.PI / 2;
  const sunX = Math.cos(sunAngle) * 80;
  const sunY = Math.sin(sunAngle) * 80;
  sunLight.position.set(sunX, sunY, 30);
  sunSprite.position.copy(sunLight.position).normalize().multiplyScalar(140);
  sunSprite.position.y = Math.max(-20, sunSprite.position.y);

  const elev = Math.max(0, sunY / 80);
  const isNight = elev < 0.1;
  sunLight.intensity = (isNight ? 0.15 : (0.4 + elev * 0.9)) * settings.brightness;
  ambientLight.intensity = (isNight ? 0.25 : (0.4 + elev * 0.4)) * settings.brightness;
  ambientLight.color.setHex(isNight ? 0x304070 : 0xffffff);

  const dayTop = new THREE.Color(0x1a3a6b), dayBot = new THREE.Color(0x87ceeb);
  const nightTop = new THREE.Color(0x050814), nightBot = new THREE.Color(0x1a2040);
  const sunsetTop = new THREE.Color(0x503060), sunsetBot = new THREE.Color(0xff8050);
  let top, bot;
  if (timeOfDay > 0.2 && timeOfDay < 0.3) {
    const t = (timeOfDay - 0.2) / 0.1;
    top = nightTop.clone().lerp(sunsetTop, t).lerp(dayTop, t*t);
    bot = nightBot.clone().lerp(sunsetBot, t).lerp(dayBot, t*t);
  } else if (timeOfDay > 0.7 && timeOfDay < 0.8) {
    const t = (timeOfDay - 0.7) / 0.1;
    top = dayTop.clone().lerp(sunsetTop, t).lerp(nightTop, t*t);
    bot = dayBot.clone().lerp(sunsetBot, t).lerp(nightBot, t*t);
  } else if (timeOfDay >= 0.3 && timeOfDay <= 0.7) { top = dayTop; bot = dayBot; }
  else { top = nightTop; bot = nightBot; }
  skyMat.uniforms.topColor.value.copy(top);
  skyMat.uniforms.bottomColor.value.copy(bot);
  scene.fog.color.copy(bot);
  renderer.setClearColor(bot);
}

function updateChunksProgressive() {
  if (!player || !world) return;
  const pcx = Math.floor(player.pos.x / CHUNK_W);
  const pcz = Math.floor(player.pos.z / CHUNK_D);
  const R = settings.renderDist;
  const toLoad = [];
  for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
    if (dx*dx + dz*dz > R*R) continue;
    const cx = pcx + dx, cz = pcz + dz;
    if (!world.chunks.has(world.key(cx, cz))) toLoad.push({ cx, cz, d: dx*dx + dz*dz });
  }
  toLoad.sort((a, b) => a.d - b.d);
  for (let i = 0; i < Math.min(chunkLoadBudget, toLoad.length); i++) world.loadChunk(toLoad[i].cx, toLoad[i].cz);
  chunkLoadBudget = 0;
  for (const key of Array.from(world.chunks.keys())) {
    const c = world.chunks.get(key);
    const dx = c.cx - pcx, dz = c.cz - pcz;
    if (dx*dx + dz*dz > (R + 2) * (R + 2)) world.unloadChunk(key);
  }
  world.updateChunkMeshes();
}

function updateCameraFromPlayer() {
  if (!player) return;
  const eye = player.getEyePosition();
  if (player.thirdPerson) {
    const back = new THREE.Vector3(
      Math.sin(player.yaw) * Math.cos(player.pitch),
      Math.sin(player.pitch),
      Math.cos(player.yaw) * Math.cos(player.pitch)
    );
    camera.position.copy(eye).addScaledVector(back, 4);
    camera.lookAt(eye);
    if (player.model) {
      player.model.position.copy(player.pos);
      player.model.rotation.y = player.yaw;
      player.model.visible = true;
    }
  } else {
    camera.position.copy(eye);
    camera.rotation.set(player.pitch, player.yaw, 0);
    if (player.model) player.model.visible = false;
  }
}

function cleanupWorld() {
  if (world) {
    for (const c of world.chunks.values()) {
      if (c.mesh) { scene.remove(c.mesh); c.mesh.geometry.dispose(); }
      if (c.waterMesh) { scene.remove(c.waterMesh); c.waterMesh.geometry.dispose(); }
      if (c.transMesh) { scene.remove(c.transMesh); c.transMesh.geometry.dispose(); }
    }
    world.chunks.clear();
    world.matSolid.dispose();
    world.matWater.dispose();
    world.matTransparent.dispose();
    world = null;
  }
  for (const d of drops) { scene.remove(d.mesh); if (d.geo) d.geo.dispose(); }
  drops.length = 0;
  for (const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  if (player && player.model) { scene.remove(player.model); player.model = null; }
  player = null;
  stopMining();
}

function findSpawnY(x, z) {
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const cx = Math.floor((x + dx * 8) / CHUNK_W);
    const cz = Math.floor((z + dz * 8) / CHUNK_D);
    if (!world.chunks.has(world.key(cx, cz))) world.loadChunk(cx, cz);
  }
  for (let y = CHUNK_H - 1; y > 0; y--) {
    const b = world.getBlock(x, y, z);
    if (b !== B.AIR && b !== B.WATER && BLOCKS[b] && BLOCKS[b].solid) return y + 1;
  }
  return 32;
}

function startGame(mode) {
  const seedStr = (document.getElementById('seedInput').value || '').trim();
  const seed = seedStr ? hashString(seedStr) : (Math.random() * 0x7fffffff) | 0;
  cleanupWorld();
  world = new World(seed, scene);
  const spawnY = findSpawnY(0, 0);
  player = new Player(world);
  player.pos.set(0.5, spawnY + 0.2, 0.5);
  player.mode = mode;
  player.yaw = 0; player.pitch = 0;
  player.model = buildPlayerModel(); player.model.visible = false;
  scene.add(player.model);
  hotbar = [null,null,null,null,null,null,null,null,null];
  backpack = []; selectedSlot = 0;
  if (mode === 'creative') {
    const items = [B.GRASS, B.STONE, B.PLANKS, B.LOG, B.GLASS, B.TABLE, B.TORCH, B.SAND, B.LEAVES];
    for (let i = 0; i < 9; i++) hotbar[i] = { id: items[i], count: 999 };
  }
  timeOfDay = 0.3;
  updateHotbarUI(); updateStatsUI();
  enterGame();
}

function continueGame() {
  const save = loadSave();
  if (!save) { showToast('Сохранение не найдено'); return; }
  cleanupWorld();
  world = new World(save.seed, scene);
  if (Array.isArray(save.modified)) for (const [k, v] of save.modified) world.modified.set(k, v);
  player = new Player(world);
  player.mode = save.mode || 'survival';
  // ИСПРАВЛЕНО: убрана оборванная строка, оставлен корректный вызов
  player.pos.set(save.playerPos.x, save.playerPos.y, save.playerPos.z);
  player.yaw = save.playerYaw ?? 0;
  player.pitch = save.playerPitch ?? 0;
  player.hp = save.playerHP ?? player.maxHp;
  player.air = save.playerAir ?? player.maxAir;
  hotbar = Array.isArray(save.hotbar) ? save.hotbar : [null,null,null,null,null,null,null,null,null];
  backpack = Array.isArray(save.backpack) ? save.backpack : [];
  selectedSlot = save.selectedSlot ?? 0;
  timeOfDay = save.timeOfDay ?? 0.3;
  player.model = buildPlayerModel();
  player.model.visible = false;
  scene.add(player.model);
  updateHotbarUI(); updateStatsUI();
  enterGame();
}

function applySettingsToWorld() {
  if (!camera) return;
  camera.fov = settings.fov;
  camera.updateProjectionMatrix();
  const pr = settings.quality === 'low' ? 1
            : settings.quality === 'medium' ? Math.min(1.5, window.devicePixelRatio)
            : Math.min(2, window.devicePixelRatio);
  renderer.setPixelRatio(pr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  const far = settings.renderDist * CHUNK_W * 1.2 + 40;
  scene.fog.near = Math.max(20, settings.renderDist * CHUNK_W * 0.6);
  scene.fog.far = far;
  camera.far = far + 60;
  camera.updateProjectionMatrix();
  document.getElementById('debug').style.display = settings.showDebug ? 'block' : 'none';
  if (musicGain) musicGain.gain.value = settings.musicVol;
  if (sfxGain) sfxGain.gain.value = settings.sfxVol;

  for (const key of Object.keys(KEYBIND_LABELS)) {
    const row = document.createElement('div');
    row.className = 'keybind-row';
    const label = document.createElement('span');
    label.textContent = KEYBIND_LABELS[key];
    row.appendChild(label);
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (rebindingKey === key ? ' wait' : '');
    btn.textContent = rebindingKey === key ? 'нажмите...' : codeToLabel(settings.keybinds[key]);
    btn.addEventListener('click', () => {
      rebindingKey = (rebindingKey === key) ? null : key;
      renderKeybinds();
    });
    row.appendChild(btn);
    list.appendChild(row);
  }
}

function handleEscape() {
  if (state === 'menu') {
    const settingsEl = document.getElementById('settings');
    if (!settingsEl.classList.contains('hidden')) {
      settingsEl.classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    }
    return;
  }
  if (state === 'playing' && paused) {
    const inv = document.getElementById('inventory');
    const menu = document.getElementById('menu');
    const settingsEl = document.getElementById('settings');
    if (!inv.classList.contains('hidden')) {
      closeInventory();
    } else if (!settingsEl.classList.contains('hidden')) {
      settingsEl.classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    } else if (!menu.classList.contains('hidden')) {
      document.getElementById('menu').classList.add('hidden');
      paused = false;
      if (!isTouch) canvas.requestPointerLock();
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Escape' && !rebindingKey) {
    if (state === 'menu') {
      const s = document.getElementById('settings');
      if (!s.classList.contains('hidden')) {
        e.preventDefault(); e.stopImmediatePropagation();
        handleEscape();
      }
    } else if (state === 'playing' && paused) {
      e.preventDefault(); e.stopImmediatePropagation();
      handleEscape();
    }
  }
}, true);

let menuMode = 'survival';

document.querySelectorAll('#modeSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#modeSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    menuMode = btn.dataset.mode;
  });
});

document.getElementById('btnNew').addEventListener('click', () => {
  startGame(menuMode);
});

document.getElementById('btnContinue').addEventListener('click', () => {
  if (state === 'playing' && paused) {
    document.getElementById('menu').classList.add('hidden');
    paused = false;
    if (!isTouch) canvas.requestPointerLock();
    return;
  }
  continueGame();
});

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('settings').classList.remove('hidden');
  syncSettingsUI();
  renderKeybinds();
});

document.getElementById('btnSettingsBack').addEventListener('click', () => {
  document.getElementById('settings').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  saveSettings();
});

/* =========================================================
   НАСТРОЙКИ: СЛАЙДЕРЫ
========================================================= */
function bindSlider(id, valId, key, fmt, onChange) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  if (!el) return;
  const update = () => {
    const v = parseFloat(el.value);
    settings[key] = v;
    valEl.textContent = fmt(v);
    if (onChange) onChange(v);
    saveSettings();
  };
  el.addEventListener('input', update);
}

bindSlider('rdSlider', 'rdVal', 'renderDist', v => v, () => applySettingsToWorld());
bindSlider('fovSlider', 'fovVal', 'fov', v => v, () => { camera.fov = settings.fov; camera.updateProjectionMatrix(); });
bindSlider('sensSlider', 'sensVal', 'sensitivity', v => v.toFixed(1));
bindSlider('tLookSlider', 'tLookVal', 'touchLook', v => v.toFixed(1));
bindSlider('musSlider', 'musVal', 'musicVol', v => v.toFixed(0) + '%', v => {
  settings.musicVol = v / 100;
  if (musicGain) musicGain.gain.value = settings.musicVol;
});
bindSlider('sfxSlider', 'sfxVal', 'sfxVol', v => v.toFixed(0) + '%', v => {
  settings.sfxVol = v / 100;
  if (sfxGain) sfxGain.gain.value = settings.sfxVol;
});
bindSlider('brightSlider', 'brightVal', 'brightness', v => v.toFixed(2));
bindSlider('daySlider', 'dayVal', 'dayLength', v => v.toFixed(0));

/* =========================================================
   НАСТРОЙКИ: СЕГМЕНТЫ
========================================================= */
document.querySelectorAll('#qualitySeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#qualitySeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.quality = btn.dataset.q;
    applySettingsToWorld();
    saveSettings();
  });
});
document.querySelectorAll('#invertSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#invertSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.invertY = btn.dataset.inv === '1';
    saveSettings();
  });
});
document.querySelectorAll('#debugSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#debugSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.showDebug = btn.dataset.d === '1';
    document.getElementById('debug').style.display = settings.showDebug ? 'block' : 'none';
    saveSettings();
  });
});

document.getElementById('btnResetKeys').addEventListener('click', () => {
  settings.keybinds = { ...DEFAULT_KEYBINDS };
  renderKeybinds();
  saveSettings();
  showToast('Клавиши сброшены');
});

document.getElementById('btnInvClose').addEventListener('click', () => closeInventory());

function syncSettingsUI() {
  const set = (id, val, valId, fmt) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
    if (valId) {
      const v = document.getElementById(valId);
      if (v) v.textContent = fmt ? fmt(val) : val;
    }
  };
  set('rdSlider', settings.renderDist, 'rdVal');
  set('fovSlider', settings.fov, 'fovVal');
  set('sensSlider', settings.sensitivity, 'sensVal', v => v.toFixed(1));
  set('tLookSlider', settings.touchLook, 'tLookVal', v => v.toFixed(1));
  set('musSlider', settings.musicVol * 100, 'musVal', v => v.toFixed(0) + '%');
  set('sfxSlider', settings.sfxVol * 100, 'sfxVal', v => v.toFixed(0) + '%');
  set('brightSlider', settings.brightness, 'brightVal', v => v.toFixed(2));
  set('daySlider', settings.dayLength, 'dayVal', v => v.toFixed(0));

  document.querySelectorAll('#qualitySeg .btn').forEach(b =>
    b.classList.toggle('active', b.dataset.q === settings.quality));
  document.querySelectorAll('#invertSeg .btn').forEach(b =>
    b.classList.toggle('active', (b.dataset.inv === '1') === settings.invertY));
  document.querySelectorAll('#debugSeg .btn').forEach(b =>
    b.classList.toggle('active', (b.dataset.d === '1') === settings.showDebug));
}

/* =========================================================
   АНИМАЦИЯ ФОНА МЕНЮ
========================================================= */
const menuCanvas = document.getElementById('menuCanvas');
const menuCtx = menuCanvas.getContext('2d');
const menuCubes = Array.from({ length: 18 }, () => ({
  x: Math.random(), y: Math.random(),
  size: 12 + Math.random() * 22,
  speed: 0.02 + Math.random() * 0.06,
  phase: Math.random() * Math.PI * 2,
  hue: 200 + Math.random() * 60
}));

function resizeMenuCanvas() {
  const r = menuCanvas.getBoundingClientRect();
  menuCanvas.width = Math.max(1, r.width);
  menuCanvas.height = Math.max(1, r.height);
}
window.addEventListener('resize', resizeMenuCanvas);
resizeMenuCanvas();

function animateMenu() {
  requestAnimationFrame(animateMenu);
  if (state !== 'menu') return;
  const W = menuCanvas.width, H = menuCanvas.height;
  menuCtx.clearRect(0, 0, W, H);
  const t = performance.now() / 1000;
  for (const c of menuCubes) {
    const cx = (c.x * W + Math.cos(t * c.speed + c.phase) * 60) % (W + 100) - 50;
    const cy = (c.y * H + Math.sin(t * c.speed * 1.3 + c.phase) * 40) % (H + 100) - 50;
    menuCtx.save();
    menuCtx.translate(cx, cy);
    menuCtx.rotate(t * 0.3 + c.phase);
    const g = menuCtx.createLinearGradient(-c.size/2, -c.size/2, c.size/2, c.size/2);
    g.addColorStop(0, `hsla(${c.hue}, 90%, 70%, 0.7)`);
    g.addColorStop(1, `hsla(${c.hue + 40}, 90%, 50%, 0.1)`);
    menuCtx.fillStyle = g;
    menuCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
    menuCtx.strokeStyle = `hsla(${c.hue}, 100%, 80%, 0.5)`;
    menuCtx.lineWidth = 1;
    menuCtx.strokeRect(-c.size/2, -c.size/2, c.size, c.size);
    menuCtx.restore();
  }
}
animateMenu();

/* =========================================================
   ГЛАВНЫЙ ЦИКЛ
========================================================= */
function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    fps = fpsFrames / fpsAccum;
    fpsAccum = 0; fpsFrames = 0;
  }

  if (state === 'playing' && !paused && player) {
    chunkLoadBudget = Math.max(1, Math.min(4, Math.round(40 / Math.max(20, fps))));
    player.update(dt, input);
    updateCameraFromPlayer();
    updateMining(dt);
    updateDrops(dt);
    updateParticles(dt);
    updateDayNight(dt);
    updateChunksProgressive();
    updateStatsUI();

    autoSaveTimer += dt;
    if (autoSaveTimer > 30) { autoSaveTimer = 0; saveGame(); }
  }

  if (moonSprite) {
    const sa = timeOfDay * Math.PI * 2 - Math.PI / 2;
    moonSprite.position.set(-Math.cos(sa) * 140, -Math.sin(sa) * 140, 30);
  }

  if (settings.showDebug && state === 'playing' && player && world) {
    const biome = world.getBiomeAt(Math.floor(player.pos.x), Math.floor(player.pos.z));
    document.getElementById('debug').innerHTML =
      `<b>FPS:</b> ${fps.toFixed(0)}<br>` +
      `<b>XYZ:</b> ${player.pos.x.toFixed(1)} ${player.pos.y.toFixed(1)} ${player.pos.z.toFixed(1)}<br>` +
      `<b>Биом:</b> ${BIOME_NAMES[biome] || '?'}<br>` +
      `<b>Режим:</b> ${player.mode === 'creative' ? 'Творческий' : 'Выживание'}<br>` +
      `<b>Чанки:</b> ${world.chunks.size}<br>` +
      `<b>Вода:</b> ${player.headInWater ? 'да' : 'нет'}`;
  }

  if (sky) sky.position.copy(camera.position);

  renderer.render(scene, camera);
}
requestAnimationFrame(gameLoop);

/* =========================================================
   RESIZE
========================================================= */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  resizeMenuCanvas();
});

/* =========================================================
   СТАРТОВАЯ ИНИЦИАЛИЗАЦИЯ
========================================================= */
applySettingsToWorld();
syncSettingsUI();
renderKeybinds();

if (!hasSave()) {
  document.getElementById('btnContinue').classList.add('disabled');
} else {
  document.getElementById('btnContinue').classList.remove('disabled');
}

state = 'menu';
document.getElementById('menu').classList.remove('hidden');

/* Остановка музыки при закрытии вкладки */
window.addEventListener('beforeunload', () => {
  try { stopMusic(); } catch (e) {}
  try { clearDropMaterialCache(); clearParticleMatCache(); } catch (e) {}
});

</script>
