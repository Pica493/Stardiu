<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Pixel Farm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Courier New',monospace;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;position:fixed;top:0;left:0}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#0a0a1a;overflow:hidden}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#2a3a2a,#0d0d0d);z-index:100;padding:14px;gap:8px;overflow-y:auto}
.screen.hidden{display:none}
.screen h1{font-size:clamp(24px,7vw,48px);letter-spacing:5px;color:#e8c060;text-shadow:0 4px 0 #5a3a1a;margin-bottom:8px;text-align:center}
.screen h2{font-size:clamp(16px,4.5vw,24px);color:#e8c060;margin-bottom:8px;letter-spacing:2px}
.screen button{background:#5a3a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:10px 22px;font-size:clamp(12px,3.2vw,15px);cursor:pointer;border-radius:4px;font-family:inherit;letter-spacing:1px;min-width:180px;max-width:92vw;font-weight:bold}
.screen button:hover{background:#7a4a2a;border-color:#e8c060}
.screen button:active{transform:scale(.97)}
.screen button.primary{background:#4a7a2a;border-color:#8ac04a;color:#f0ffe0}
.screen button.small{min-width:90px;padding:6px 14px;font-size:11px}
#notify{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#ffe8b0;padding:6px 14px;border-radius:4px;font-size:12px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;border:2px solid #8a5a2a;font-weight:bold;max-width:80vw;text-align:center}
#notify.show{opacity:1}
#fade{position:fixed;inset:0;background:#0a0a1a;opacity:0;pointer-events:none;z-index:60;transition:opacity .5s}
#fade.active{opacity:1}
#centerText{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:61;pointer-events:none;color:#ffe8b0;gap:6px;text-align:center;text-shadow:0 2px 12px #000}
#centerText.show{display:flex}
#centerText .big{font-size:clamp(20px,5vw,32px);letter-spacing:3px;color:#e8c060}
#centerText .small{font-size:clamp(11px,3vw,14px);color:#8ac04a}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:90;display:none;flex-direction:column;justify-content:center;align-items:center;padding:12px;gap:6px;overflow-y:auto}
.panel.show{display:flex}
.panel h2{color:#e8c060;font-size:16px;letter-spacing:2px}
.panel .sub{color:#8ac04a;font-size:11px;margin-bottom:2px}
.panel .content{display:flex;flex-direction:column;gap:3px;max-width:94vw;max-height:70vh;overflow-y:auto;padding:4px;width:min(520px,94vw)}
.row{display:flex;align-items:center;gap:6px;background:#2a1a0a;border:2px solid #8a5a2a;padding:6px 10px;border-radius:3px;justify-content:space-between}
.row .name{color:#ffe8b0;font-size:11px;flex:1;line-height:1.3}
.row .price{color:#e8c060;font-weight:bold;min-width:50px;text-align:right;font-size:11px}
.row button{min-width:60px;padding:4px 8px;font-size:10px;background:#4a7a2a;border-color:#8ac04a}
.row.selected{border-color:#e8c060;background:#4a3a1a}
.panel .close{background:#4a2020;border-color:#8a3a3a;color:#ffb0b0;padding:8px 24px;margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap;justify-content:center}
.tabs button{min-width:auto;padding:5px 10px;font-size:10px;background:#3a2a1a;border-color:#6a4a2a}
.tabs button.active{background:#4a7a2a;border-color:#8ac04a}
.swatch{width:28px;height:28px;border:2px solid #8a5a2a;border-radius:3px;cursor:pointer;display:inline-block}
.swatch.active{border-color:#e8c060;box-shadow:0 0 6px #e8c060}
.color-row{display:flex;gap:6px;flex-wrap:wrap;padding:6px;justify-content:center;background:#1a1a0a;border-radius:4px;border:1px solid #5a3a1a}
.opt-label{color:#e8c060;font-size:11px;margin-top:6px;margin-bottom:2px;text-align:center}
#questList{position:fixed;top:100px;left:4px;background:rgba(0,0,0,.8);padding:5px 8px;border-radius:3px;font-size:10px;z-index:45;color:#ffe8b0;border:1px solid #8a5a2a;max-width:200px;display:none}
#questList.show{display:block}
#questList .q{color:#e8c060;margin-bottom:2px;font-weight:bold}
</style>
</head>

<div id="panelInv" class="panel"><h2 id="invTitle">INVENTORY</h2><div class="content" id="invItems"></div><button class="close" id="closeInv">Close</button></div>
<div id="panelMap" class="panel"><h2 id="mapTitle">MAP</h2><div class="content" id="mapInfo"></div><button class="close" id="closeMap">Close</button></div>
<div id="panelQuest" class="panel"><h2 id="questTitle">QUESTS</h2><div class="content" id="questItems"></div><button class="close" id="closeQuest">Close</button></div>
<div id="panelSettings" class="panel"><h2 id="setTitle">SETTINGS</h2><div class="content" id="setItems"></div><button class="close" id="closeSet">Close</button></div>
<div id="panelCustom" class="panel"><h2 id="custTitle">CHARACTER</h2><div class="content" id="custItems"></div><button class="close" id="closeCust">Close</button></div>

<div id="menuMain" class="screen">

<div id="menuPause" class="screen hidden">

  <button id="btnSettings2" class="small">Settings</button>

const $ = id => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d',{alpha:false});
const TILE = 16;
let CW = 800, CH = 600, LW = 400, LH = 300, SCALE = 2;

function fitCanvas(){
  const w = window.innerWidth, h = window.innerHeight;
  const target = 4/3;
  let vw, vh;
  if(w/h > target){ vh = h; vw = h*target; }
  else { vw = w; vh = w/target; }
  cv.style.width = vw+'px';
  cv.style.height = vh+'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,80));

// ============================================================
// SOUND — с менеджером активных узлов, без накопления
// ============================================================
const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  activeNodes: [], musicTimer: null, musicPlaying: false,
  maxConcurrent: 4, // ограничение одновременных звуков
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.06;
      this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.85;
      this.sfxGain.connect(this.master);
    }catch(e){}
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}} },
  // регистрация узла с автоочисткой
  _track(node, stopTime){
    this.activeNodes.push({node, t:stopTime});
    // Чистка старых
    const now = performance.now();
    this.activeNodes = this.activeNodes.filter(a=>a.t>now-100);
    // Если слишком много — отсекаем старые
    if(this.activeNodes.length>this.maxConcurrent){
      const old = this.activeNodes.shift();
      try{ old.node.stop&&old.node.stop(); }catch(e){}
    }
  },
  _beep(f1,f2,dur,type,vol){
    if(!this.ctx) return;
    // не плодим звуки при кликах
    if(this.activeNodes.length >= this.maxConcurrent) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(f1,now);
    if(f2) osc.frequency.exponentialRampToValueAtTime(f2,now+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.15,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+dur);
    osc.connect(g).connect(this.sfxGain);
    osc.start(now); osc.stop(now+dur+0.02);
    this._track(osc, performance.now()+dur*1000+100);
  },
  play(type){
    if(!this.ctx) return;
    try{
      switch(type){
        case 'step': this._beep(400, 400, 0.04, 'sine', 0.04); break;
        case 'chop': this._beep(200, 70, 0.12, 'square', 0.18); break;
        case 'pick': this._beep(1400, 500, 0.06, 'square', 0.12); break;
        case 'plant': this._beep(500, 800, 0.1, 'sine', 0.09); break;
        case 'water': this._beep(2000, 1500, 0.08, 'sine', 0.1); break;
        case 'harvest': this._beep(523, 784, 0.15, 'sine', 0.11); break;
        case 'fish': this._beep(440, 1046, 0.2, 'triangle', 0.13); break;
        case 'coin': this._beep(880, 1320, 0.1, 'square', 0.09); break;
        case 'click': this._beep(900, 900, 0.03, 'square', 0.05); break;
        case 'error': this._beep(200, 100, 0.14, 'sawtooth', 0.07); break;
        case 'hurt': this._beep(300, 100, 0.18, 'sawtooth', 0.15); break;
        case 'hit': this._beep(400, 120, 0.09, 'square', 0.15); break;
        case 'levelup': this._beep(523, 1318, 0.35, 'triangle', 0.13); break;
        case 'sleep': this._beep(100, 60, 0.9, 'sine', 0.1); break;
        case 'door': this._beep(300, 500, 0.12, 'square', 0.09); break;
        case 'moo': this._beep(180, 120, 0.4, 'sawtooth', 0.11); break;
        case 'cluck': this._beep(800, 500, 0.09, 'square', 0.06); break;
        case 'neigh': this._beep(600, 300, 0.3, 'sawtooth', 0.11); break;
        case 'donate': this._beep(392, 784, 0.5, 'sine', 0.12); break;
        case 'splash': this._beep(1200, 400, 0.15, 'sine', 0.1); break;
      }
    }catch(e){}
  },
  startMusic(){
    if(!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    const mel = [392,440,494,587,523,494,440,392,349,392,440,494,440,392,349,330,294,330,349,392];
    const dur = [0.4,0.4,0.4,0.8,0.4,0.4,0.4,0.8,0.4,0.4,0.4,1.2,0.4,0.4,0.4,0.8,0.4,0.4,0.4,1.2];
    let i = 0;
    const step = ()=>{
      if(!this.musicPlaying || !this.ctx) return;
      const now = this.ctx.currentTime;
      try{
        const o1 = this.ctx.createOscillator();
        o1.type = 'triangle'; o1.frequency.value = mel[i];
        const g1 = this.ctx.createGain();
        g1.gain.setValueAtTime(0,now);
        g1.gain.linearRampToValueAtTime(0.3,now+0.03);
        g1.gain.linearRampToValueAtTime(0.07,now+dur[i]*0.5);
        g1.gain.linearRampToValueAtTime(0,now+dur[i]);
        o1.connect(g1).connect(this.musicGain);
        o1.start(now); o1.stop(now+dur[i]);
        const o2 = this.ctx.createOscillator();
        o2.type = 'sine'; o2.frequency.value = mel[i]/4;
        const g2 = this.ctx.createGain();
        g2.gain.setValueAtTime(0,now);
        g2.gain.linearRampToValueAtTime(0.1,now+0.04);
        g2.gain.linearRampToValueAtTime(0,now+dur[i]);
        o2.connect(g2).connect(this.musicGain);
        o2.start(now); o2.stop(now+dur[i]);
      }catch(e){}
      i = (i+1) % mel.length;
    };
    step();
    this.musicTimer = setInterval(step, 480);
  },
  stopMusic(){
    this.musicPlaying = false;
    if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer = null; }
  },
  stopAll(){
    // Остановить все активные SFX
    for(const a of this.activeNodes){
      try{ a.node.stop&&a.node.stop(); }catch(e){}
    }
    this.activeNodes = [];
    this.stopMusic();
  },
  pause(){
    this.stopAll();
    if(this.ctx && this.master){ try{ this.master.gain.value = 0; }catch(e){} }
  },
  unpause(){
    if(this.ctx && this.master){ try{ this.master.gain.value = 0.25; }catch(e){} }
    this.startMusic();
  }
};

const S = {};
function spr(n,w,h,fn){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  fn(g,w,h);
  S[n] = c;
  return c;
}
function rr(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,w|0,h|0); }
function mirror(a,b){
  const s = S[a]; if(!s) return;
  const c = document.createElement('canvas'); c.width = s.width; c.height = s.height;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.translate(s.width,0); g.scale(-1,1); g.drawImage(s,0,0);
  S[b] = c;
}

// --- CHARACTER (uses Custom) ---
function drawChar(g,dir,frame,state,cust){
  const skin = SKIN_TONES[cust.skin]||SKIN_TONES[0];
  const skinD = 'rgba(0,0,0,0.15)';
  const hair = HAIR_COLORS[cust.hair]||HAIR_COLORS[0];
  const hairD = 'rgba(0,0,0,0.3)';
  const shirt = SHIRT_COLORS[cust.shirt]||SHIRT_COLORS[0];
  const shirtD = 'rgba(0,0,0,0.2)';
  const pants = PANTS_COLORS[cust.pants]||PANTS_COLORS[0];
  const shoes = SHOE_COLORS[cust.shoes]||SHOE_COLORS[0];
  const eye = '#1a1a2a', mouth = '#a05040', blush = '#d06050';

  if(state==='sleep'){
    rr(g,3,20,26,7,shirt); rr(g,3,20,26,2,shirtD);
    rr(g,1,22,6,6,skin); rr(g,26,24,5,3,shoes); rr(g,22,20,5,7,pants);
    if(cust.hat===1){ rr(g,0,21,7,3,'#a88030'); rr(g,2,20,4,3,'#e8c060'); }
    else if(cust.hat===2){ rr(g,0,21,7,3,'#a03030'); }
    g.fillStyle='#fff'; g.font='bold 7px monospace'; g.fillText('z',24,16); g.fillText('Z',28,11);
    return;
  }
  const cx = 16;
  let legL=0, legR=0, bob=0, armL=0, armR=0;
  if(state==='walk'){
    const o = [0,1,0,-1];
    legL = o[frame]; legR = -o[frame];
    bob = (frame===1||frame===3) ? -1 : 0;
    armL = o[frame]; armR = -o[frame];
  }
  const fY = 31;

  // Legs
  if(dir==='l'||dir==='r'){
    rr(g,cx-3+legL,fY-8,4,8,pants); rr(g,cx-1+legR,fY-8,4,8,pants);
    rr(g,cx-4+legL,fY-2,6,2,shoes); rr(g,cx-1+legR,fY-2,5,2,shoes);
  } else {
    rr(g,cx-4,fY-8+legL,3,8,pants); rr(g,cx+1,fY-8+legR,3,8,pants);
    rr(g,cx-5,fY-2+legL,5,2,shoes); rr(g,cx+1,fY-2+legR,5,2,shoes);
  }
  const bT = fY-19+bob;
  // Body
  if(dir==='l'||dir==='r'){
    rr(g,cx-5,bT,10,11,shirt); rr(g,cx-5,bT+9,10,2,shirtD);
  } else {
    rr(g,cx-6,bT,12,11,shirt); rr(g,cx-6,bT+9,12,2,shirtD); rr(g,cx-1,bT+2,2,7,shirtD);
  }
  // Arms
  const aY = bT+2;
  if(dir==='d'){
    rr(g,cx-8,aY+armL,3,8,shirt); rr(g,cx+5,aY+armR,3,8,shirt);
    rr(g,cx-8,aY+armL+7,3,2,skin); rr(g,cx+5,aY+armR+7,3,2,skin);
  } else if(dir==='u'){
    rr(g,cx-8,aY+armL,3,8,shirt); rr(g,cx+5,aY+armR,3,8,shirt);
  } else if(dir==='l'){
    rr(g,cx-7,aY+armL,3,8,shirt); rr(g,cx+2,aY+armR,3,8,shirt);
    rr(g,cx-7,aY+armL+7,3,2,skin);
  } else {
    rr(g,cx+4,aY+armL,3,8,shirt); rr(g,cx-5,aY+armR,3,8,shirt);
    rr(g,cx+4,aY+armL+7,3,2,skin);
  }
  // Head
  const hT = bT-12;
  if(dir==='l'){
    rr(g,cx-5,hT,10,11,skin); rr(g,cx+2,hT,3,11,skinD); rr(g,cx-6,hT+2,3,7,hair);
    rr(g,cx-3,hT+5,2,2,eye); rr(g,cx-6,hT+8,2,1,blush);
  } else if(dir==='r'){
    rr(g,cx-5,hT,10,11,skin); rr(g,cx-5,hT,3,11,skinD); rr(g,cx+3,hT+2,3,7,hair);
    rr(g,cx+1,hT+5,2,2,eye); rr(g,cx+4,hT+8,2,1,blush);
  } else if(dir==='d'){
    rr(g,cx-5,hT,10,11,skin); rr(g,cx-6,hT+2,3,7,hair); rr(g,cx+3,hT+2,3,7,hair);
    rr(g,cx-3,hT+5,2,2,eye); rr(g,cx+1,hT+5,2,2,eye); rr(g,cx-1,hT+8,2,1,mouth);
    rr(g,cx-5,hT+8,2,1,blush); rr(g,cx+3,hT+8,2,1,blush);
  } else {
    rr(g,cx-5,hT,10,11,skin); rr(g,cx-6,hT+1,12,9,hair); rr(g,cx-6,hT+6,12,4,hairD);
  }
  // Hat
  if(cust.hat===1){
    rr(g,cx-7,hT-3,14,2,'#a88030'); rr(g,cx-6,hT-6,12,4,'#e8c060'); rr(g,cx-6,hT-3,12,1,'#6a3a1a');
  } else if(cust.hat===2){
    rr(g,cx-7,hT-3,14,2,'#a03030'); rr(g,cx-6,hT-6,12,4,'#c84040');
  } else if(cust.hat===3){
    rr(g,cx-6,hT-5,12,6,'#4080c0'); rr(g,cx-6,hT-1,12,2,'#305090');
  } else if(cust.hat===4){
    rr(g,cx-8,hT-2,16,3,'#3a2050'); rr(g,cx-6,hT-9,12,8,'#5a3a8a'); rr(g,cx-3,hT-11,6,3,'#5a3a8a');
  } else if(cust.hat===5){
    rr(g,cx-9,hT-2,18,2,'#6a4a20'); rr(g,cx-7,hT-6,14,4,'#8a5a30'); rr(g,cx-5,hT-8,10,3,'#8a5a30');
  }
  if(state==='use'){
    if(dir==='l'){ rr(g,cx-13,aY,4,4,'#8a5a30'); rr(g,cx-16,aY-3,6,4,'#a0a8b0'); }
    else if(dir==='r'){ rr(g,cx+9,aY,4,4,'#8a5a30'); rr(g,cx+10,aY-3,6,4,'#a0a8b0'); }
    else if(dir==='d'){ rr(g,cx+5,aY+4,4,4,'#8a5a30'); rr(g,cx+3,aY+7,8,4,'#a0a8b0'); }
    else { rr(g,cx-9,aY-8,4,4,'#8a5a30'); rr(g,cx-12,aY-12,6,4,'#a0a8b0'); }
  }
}

function regenerateChar(){
  const DIRS = ['d','u','l','r'];
  for(const d of DIRS){
    for(let f=0;f<4;f++) spr('c_'+d+'_'+f,32,32,g=>drawChar(g,d,f,'walk',Custom));
    spr('c_'+d+'_idle',32,32,g=>drawChar(g,d,0,'idle',Custom));
    spr('c_'+d+'_use',32,32,g=>drawChar(g,d,0,'use',Custom));
    spr('c_'+d+'_sleep',32,32,g=>drawChar(g,d,0,'sleep',Custom));
  }
  for(let f=0;f<4;f++) mirror('c_r_'+f,'c_l_'+f);
  mirror('c_r_idle','c_l_idle'); mirror('c_r_use','c_l_use'); mirror('c_r_sleep','c_l_sleep');
}

function tileGrass(g,v,s){
  let base,dark,light;
  if(s===0){base='#5a9a3a';dark='#3a7028';light='#78b84a';}
  else if(s===1){base='#4a8a2a';dark='#2a6018';light='#68a83a';}

  else{base='#d8dce0';dark='#b8bcc0';light='#eef0f4';}
  rr(g,0,0,16,16,base);
  if(v===0){ rr(g,3,4,2,1,dark); rr(g,9,6,2,1,dark); rr(g,5,11,3,1,light); }
  else if(v===1){ for(let i=0;i<7;i++){ const x=(i*5)%14+1,y=(i*7)%14+1; rr(g,x,y,1,2,i%2?dark:light); } }
  else if(v===2){ rr(g,4,3,1,1,'#ffd54a'); rr(g,11,7,1,1,'#ff8aa8'); }
  else { rr(g,2,3,3,1,light); rr(g,10,5,2,1,dark); }
}

const CROPS = ['wheat','carrot','tomato','potato','corn','pumpkin'];
function drawCrop(g,type,stage){
  const cx=8;
  if(stage===0){ rr(g,cx-1,14,2,2,'#5a3a1a'); rr(g,cx,13,1,1,'#4a8a2a'); return; }
  if(stage===1){ rr(g,cx-1,12,2,4,'#4a8a2a'); rr(g,cx-3,10,2,2,'#5aa04a'); return; }
  if(stage===2){ rr(g,cx-1,10,2,6,'#4a8a2a'); rr(g,cx-3,7,2,3,'#5aa04a'); rr(g,cx+1,7,2,3,'#5aa04a'); return; }
  if(stage===3){ rr(g,cx-1,6,2,10,'#4a8a2a'); rr(g,cx-4,4,3,3,'#5aa04a'); rr(g,cx+1,4,3,3,'#5aa04a'); return; }
  if(type==='wheat'){ rr(g,cx-1,2,2,14,'#c8a840'); rr(g,cx-3,4,2,3,'#e0c050'); rr(g,cx+1,4,2,3,'#e0c050'); }
  else if(type==='carrot'){ rr(g,cx-3,10,3,6,'#e07020'); rr(g,cx,10,3,6,'#e07020'); }
  else if(type==='tomato'){ rr(g,cx-4,9,4,5,'#d03030'); rr(g,cx,9,4,5,'#d03030'); }
  else if(type==='potato'){ rr(g,cx-4,10,4,5,'#a87848'); rr(g,cx,10,4,5,'#a87848'); }
  else if(type==='corn'){ rr(g,cx-1,2,2,14,'#4a8a2a'); rr(g,cx-4,4,3,6,'#c8a840'); rr(g,cx+1,4,3,6,'#c8a840'); }
  else { rr(g,cx-5,9,10,7,'#e08020'); rr(g,cx-2,9,1,7,'#c06818'); }
}
for(const t of CROPS) for(let s=0;s<5;s++) spr('crop_'+t+'_'+s,16,16,g=>drawCrop(g,t,s));

const T_GRASS=0,T_PATH=1,T_WATER=2,T_TILL=3,T_TILL_WET=4,T_FLOOR=5,T_WALL=6,T_SAND=7,T_DEEP=8,
      T_ROCK=9,T_CAVE=10,T_CU=11,T_IR=12,T_GO=13,T_IRID=14;

function makeMap(w,h,fill){ const m=[]; for(let y=0;y<h;y++){ const r=[]; for(let x=0;x<w;x++) r.push(fill); m.push(r); } return m; }
function makeFarm(){
  const m = makeMap(50,40,T_GRASS);
  for(let y=26;y<34;y++) for(let x=32;x<44;x++){ const dx=x-38,dy=y-30; if(dx*dx/1.3+dy*dy<20) m[y][x]=T_WATER; }
  for(let x=20;x<32;x++) m[18][x]=T_PATH;
  for(let y=10;y<18;y++) m[y][26]=T_PATH;
  for(let x=13;x<27;x++) m[10][x]=T_PATH;
  for(let x=22;x<28;x++) m[0][x]=T_PATH;
  for(let x=22;x<28;x++) m[39][x]=T_PATH;
  for(let y=18;y<24;y++) m[y][0]=T_PATH;
  for(let y=18;y<24;y++) m[y][49]=T_PATH;
  return m;
}
function makeTown(){
  const m = makeMap(50,40,T_GRASS);
  for(let x=0;x<50;x++) m[20][x]=T_PATH;
  for(let y=0;y<40;y++) m[y][25]=T_PATH;
  for(let y=18;y<24;y++) for(let x=22;x<30;x++) m[y][x]=T_FLOOR;
  for(let x=22;x<28;x++) m[39][x]=T_PATH;
  for(let x=22;x<28;x++) m[0][x]=T_PATH;
  return m;
}
function makeBeach(){
  const m = makeMap(50,40,T_SAND);
  for(let x=0;x<50;x++) m[0][x]=T_PATH;
  for(let y=20;y<40;y++) for(let x=0;x<50;x++) m[y][x]=T_WATER;
  for(let y=30;y<40;y++) for(let x=0;x<50;x++) m[y][x]=T_DEEP;
  return m;
}
function makeForest(){
  const m = makeMap(40,40,T_GRASS);
  for(let y=18;y<24;y++) m[y][0]=T_PATH;
  for(let y=18;y<24;y++) m[y][39]=T_PATH;
  for(let x=18;x<24;x++) m[0][x]=T_PATH;
  return m;
}
function makeMountain(){
  const m = makeMap(40,40,T_GRASS);
  for(let y=0;y<40;y++) for(let x=0;x<40;x++) if(Math.random()<0.15) m[y][x]=T_ROCK;
  for(let y=36;y<40;y++) for(let x=18;x<24;x++) m[y][x]=T_GRASS;
  for(let y=10;y<15;y++) for(let x=15;x<25;x++) m[y][x]=T_WATER;
  return m;
}

function currentMap(){ return World[Game.map]; }
function toolName(t){ return {axe:'Axe',pick:'Pickaxe',hoe:'Hoe',can:'Can',seed:'Seeds',rod:'Rod',sword:'Sword'}[t]; }
function tileAt(tx,ty){
  const m = currentMap();
  if(!m.tiles || !m.tiles[ty]) return T_ROCK;
  if(ty<0||ty>=m.tiles.length||tx<0||tx>=m.tiles[0].length) return T_ROCK;
  return m.tiles[ty][tx];
}
function findObjectAt(tx,ty){
  const m = currentMap();
  if(!m.objects) return null;
  for(const o of m.objects) if(tx===o.tx && ty===o.ty) return o;
  return null;
}
function findNPCAt(tx,ty){
  const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(Math.abs(n.x-wp.x)<20 && Math.abs(n.y-wp.y)<22) return n;
  }
  return null;
}
function findMonsterAt(tx,ty){
  const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  for(const m of Game.monsters) if(Math.abs(m.x-wp.x)<16 && Math.abs(m.y-wp.y)<16) return m;
  return null;
}
function toast(txt){
  Game.toast = txt; Game.toastTimer = 1500;
  const e = $('notify'); e.textContent = txt; e.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>e.classList.remove('show'), 1500);
}
function fadeTo(cb){
  $('fade').classList.add('active');
  setTimeout(()=>{ cb(); setTimeout(()=>$('fade').classList.remove('active'),80); }, 350);
}

// ACTIONS
// ============================================================
function startAction(t){ player.action = t; player.actionTimer = 400; }
function removeObject(o){ const m = currentMap(); if(!m.objects) return; const i = m.objects.indexOf(o); if(i>=0) m.objects.splice(i,1); }
function spawnParticle(x,y,c){ for(let i=0;i<5;i++) Game.particles.push({x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*4, vx:(Math.random()-.5)*2, vy:-Math.random()*1.5, life:600, max:600, color:c}); }
function consumeEnergy(n){ Game.energy = Math.max(0, Game.energy-n); }

function attack(tx,ty){
  const weapon = WEAPONS[Game.weaponLevel];
  const mon = findMonsterAt(tx,ty);
  if(!mon) return false;
  startAction('use');
  Snd.play('hit');
  const isCrit = Math.random() < weapon.crit;
  const dmg = Math.floor(weapon.dmg * (isCrit?2:1));
  mon.hp -= dmg;
  mon.hitTimer = 200;
  spawnParticle(mon.x, mon.y-8, isCrit?'#ffff40':'#ff4040');
  if(mon.hp<=0){
    const t = MONSTER_TYPES.find(x=>x.id===mon.typeId);
    if(t){ if(Math.random()<t.drop[1]) Game.inv[t.drop[0]] = (Game.inv[t.drop[0]]||0)+t.yield; }
    Game.kills[mon.typeId] = (Game.kills[mon.typeId]||0)+1;
    Game.gold += 2+Math.floor(Math.random()*5);
    const idx = Game.monsters.indexOf(mon);
    if(idx>=0) Game.monsters.splice(idx,1);
    toast('Killed '+mon.name);
  }
  consumeEnergy(1);
  return true;
}

function doActionAt(tx,ty){
  if(player.action || Game.sleeping) return;

  // Farm doors
  if(Game.map==='farm'){
    const hd = World.farm.houseDoor;
    if(tx===hd.x && ty===hd.y){ startSleep(); return; }
    const sd = World.farm.shopDoor;
    if(tx===sd.x && ty===sd.y){ openShop({name:'Farm Shop',role:'Goods',shop:'seeds'}); return; }
    const stD = World.farm.stableDoor;
    if(tx===stD.x && ty===stD.y){ if(!Game.onHorse) openShop({name:'Stable',role:'Horses',shop:'horses'}); return; }
    const cD = World.farm.carpenterDoor;
    if(tx===cD.x && ty===cD.y){ openShop({name:'Carpenter',role:'Build',shop:'build'}); return; }
    const comD = World.farm.communityDoor;
    if(tx===comD.x && ty===comD.y){ openCommunityPanel(); return; }
  }
  // Town building doors
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      if(b.door && tx===b.door.x && ty===b.door.y){
        if(b.type==='shop') openShop({name:'General Store',role:'Goods',shop:'seeds'});
        else if(b.type==='blacksmith') openShop({name:'Blacksmith',role:'Weapons & Armor',shop:'weapons'});
        else if(b.type==='tavern') openShop({name:'Tavern',role:'Drinks',shop:'drinks'});
        else if(b.type==='carpenter') openShop({name:'Carpenter',role:'Build',shop:'build'});
        else toast('Door locked');
        Snd.play('door');
        return;
      }
    }
  }

  const mon = findMonsterAt(tx,ty);
  if(mon){ attack(tx,ty); return; }

  if(Game.map==='farm'){
    const an = World.farm.animals.find(a=>Math.abs(a.x-(tx*TILE+8))<14 && Math.abs(a.y-(ty*TILE+16))<14);
    if(an){ collectAnimal(an); return; }
  }

  const npc = findNPCAt(tx,ty);
  if(npc){ talkToNPC(npc); return; }

  const tool = Game.hotbar[Game.selected];
  const t = tileAt(tx,ty);
  const obj = findObjectAt(tx,ty);

  if(obj && obj.type==='crop' && obj.stage===4){
    Game.inv[obj.cropType] = (Game.inv[obj.cropType]||0)+1;
    toast('+1 '+obj.cropType); Snd.play('harvest'); removeObject(obj);
    startAction('use'); consumeEnergy(1); return;
  }

  if(tool==='axe'){
    if(obj && (obj.type==='tree'||obj.type==='pine')){
      startAction('use'); obj.hp--; Snd.play('chop');
      spawnParticle(obj.x,obj.y-20,'#8a5a30'); consumeEnergy(2);
      if(obj.hp<=0){ const n = 3+Math.floor(Math.random()*3); Game.inv.wood += n; toast('+'+n+' 🪵'); removeObject(obj); }
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='pick'){
    if(obj && (obj.type==='rock_s'||obj.type==='rock_m'||obj.type==='rock_l')){
      startAction('use'); obj.hp = (obj.hp||2)-1; Snd.play('pick');
      spawnParticle(obj.x,obj.y-8,'#a0a0a8'); consumeEnergy(2);
      if(obj.hp<=0){ const n = 2+Math.floor(Math.random()*3); Game.inv.stone += n; toast('+'+n+' 🪨'); removeObject(obj); }
      return;
    }
    if(t===T_CU||t===T_IR||t===T_GO||t===T_IRID){
      startAction('use'); Snd.play('pick'); consumeEnergy(2);
      let ore = 'copper', cnt = 1+Math.floor(Math.random()*2);
      if(t===T_IR) ore='iron';
      else if(t===T_GO) ore='gold_ore';
      else if(t===T_IRID) ore='iri';
      Game.inv[ore] = (Game.inv[ore]||0)+cnt;
      currentMap().tiles[ty][tx] = T_CAVE;
      toast('+'+cnt+' '+ore);
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='hoe'){
    if(t===T_GRASS){ currentMap().tiles[ty][tx] = T_TILL; startAction('use'); consumeEnergy(2); return; }
    return;
  }
  if(tool==='can'){
    if(t===T_TILL){ currentMap().tiles[ty][tx] = T_TILL_WET; startAction('use'); Snd.play('water'); consumeEnergy(1); return; }
    return;
  }
  if(tool==='seed'){
    if(Game.inv.seeds<=0){ Snd.play('error'); toast('No seeds'); return; }
    if(t===T_TILL||t===T_TILL_WET){
      Game.inv.seeds--; consumeEnergy(1);
      const type = CROPS[Math.floor(Math.random()*CROPS.length)];
      currentMap().objects.push({type:'crop',cropType:type,x:tx*TILE+8,y:(ty+1)*TILE,tx,ty,stage:0,watered:false,solid:false,sortY:(ty+1)*TILE});
      startAction('use'); Snd.play('plant'); return;
    }
    return;
  }
  if(tool==='rod'){
    if(t===T_WATER||t===T_DEEP){ startFishing(); return; }
    Snd.play('error'); toast('Stand by water'); return;
  }
}

function startFishing(){ Game.fishing = {timer:0, duration:2500, caught:false}; startAction('use'); }

function getFishingResult(){
  const hour = Math.floor(Game.time/60)%24;
  const time = (hour<20&&hour>=6)?'day':'night';
  const loc = Game.map==='beach' ? ((player.y>20*TILE)?'deep':'beach') : (Game.map==='mountain'?'mountain':'farm');
  let pool = FISH_LIST.filter(f=>(f.loc===loc||(f.loc==='beach'&&loc==='deep')) && (f.time===time||f.time==='any') && (f.weather===Game.weather||f.weather==='any'));
  if(!pool.length) pool = FISH_LIST.filter(f=>f.loc==='beach');
  let total = 0; for(const f of pool) total += f.chance;
  let r = Math.random()*total;
  for(const f of pool){ r -= f.chance; if(r<=0) return f; }
  return pool[0];
}

function collectAnimal(a){
  startAction('use');
  if(a.growthStage<1){ toast(t('notAdult')); return; }
  if(a.type==='horse'){ toggleHorse(a); return; }
  if(a.produceReady){
    const type = ANIMAL_TYPES[a.type];
    Game.inv[type.product] = (Game.inv[type.product]||0)+1;
    a.produceReady = false; a.produceTimer = type.time;
    toast(type.icon+' +1 '+type.product);
    Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
  } else {
    Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
  }
}

function toggleHorse(horse){
  if(Game.onHorse){
    Game.onHorse = false;
    if(horse){ horse.mounted = false; player.x = horse.x-8; player.y = horse.y; }
    toast('Dismounted');
    Snd.play('neigh');
  } else {
    if(!horse) horse = World.farm.animals.find(a=>a.type==='horse'&&a.growthStage>=1);
    if(!horse){ toast(t('noHorse')); return; }
    const d = Math.hypot(player.x-horse.x, player.y-horse.y);
    if(d<60){
      Game.onHorse = true; horse.mounted = true;
      toast(t('mounted')); Snd.play('neigh');
    } else toast('Get closer to horse');
  }
}

function talkToNPC(npc){
  const active = Game.activeQuests.find(q=>q.npcId===npc.id);
  if(!npc.questGiven){
    const item = Game.inv[npc.quest.item]||0;
    if(item>=npc.quest.count && !npc.questDone){
      Game.inv[npc.quest.item] -= npc.quest.count;
      Game.gold += npc.quest.reward;
      npc.hearts = Math.min(10, npc.hearts+2);
      npc.questDone = true; npc.questGiven = true;
      toast('Quest done! +'+npc.quest.reward+' gold, +2 hearts');
      Snd.play('levelup');
      Game.completedQuests++;
      return;
    }
    npc.questGiven = true;
    Game.activeQuests.push({npcId:npc.id, item:npc.quest.item, count:npc.quest.count, reward:npc.quest.reward});
    toast(npc.name+': bring me '+npc.quest.count+' '+npc.quest.item);
    Snd.play('click');
    return;
  }
  if(npc.shop){ openShop(npc); return; }
  if(Game.inv[npc.fav] && Game.inv[npc.fav]>0 && !npc.giftedToday){
    npc.giftedToday = true;
    Game.inv[npc.fav]--;
    npc.hearts = Math.min(10, npc.hearts+1);
    toast(npc.name+' liked '+npc.fav+'! +1♥');
    Snd.play('click');
    return;
  }
  const chats = ['Hello!','Nice weather!','I love the farm.','How are you?','Good luck!'];
  toast(npc.name+': '+chats[Math.floor(Math.random()*chats.length)]);
}

function openShop(npc){
  Game.shopOpen = true; Game.shopOwner = npc;
  $('shopTitle').textContent = npc.name;
  $('shopSub').textContent = npc.role;
  $('panelShop').classList.add('show');
  Game.panelOpen = 'shop';
  renderShop();
}
function closeShop(){
  Game.shopOpen = false;
  $('panelShop').classList.remove('show');
  Game.panelOpen = null;
}
function renderShop(){
  const npc = Game.shopOwner;
  const box = $('shopItems'); box.innerHTML = '';
  const goldEl = document.createElement('div');
  goldEl.style.cssText = 'color:#e8c060;font-size:13px;text-align:center;margin-bottom:4px';
  goldEl.textContent = '🪙 '+Game.gold;
  box.appendChild(goldEl);

  function addRow(name, price, action, sell){
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<span class="name">'+name+'</span><span class="price">'+(sell?'+':'')+price+'</span>';
    const btn = document.createElement('button');
    btn.textContent = sell?t('sell'):t('buy');
    btn.onclick = ()=>{
      if(sell){
        if(action()){ Snd.play('coin'); renderShop(); } else Snd.play('error');
      } else if(Game.gold>=price){ Game.gold -= price; action(); Snd.play('coin'); renderShop(); }
      else { Snd.play('error'); toast(t('notEnoughGold')); }
    };
    r.appendChild(btn);
    box.appendChild(r);
  }

  switch(npc.shop){
    case 'seeds': addRow('🌱 Seeds ×5', 20, ()=>Game.inv.seeds+=5); break;
    case 'animals':
      for(const k of ['chicken','duck','rabbit','pig','cow','goat']){
        const at = ANIMAL_TYPES[k];
        addRow(at.name+' ('+at.product+')', at.price, ()=>spawnAnimal(k));
      }
      break;
    case 'horses': addRow('🐴 Horse', ANIMAL_TYPES.horse.price, ()=>spawnAnimal('horse')); break;
    case 'weapons':
      for(let i=1;i<WEAPONS.length;i++){
        const w = WEAPONS[i];
        addRow('⚔ '+w.name+' (dmg '+w.dmg+', crit '+(w.crit*100)+'%)', w.price, ()=>{ if(Game.weaponLevel<i) Game.weaponLevel=i; });
      }
      for(let i=1;i<ARMORS.length;i++){
        const a = ARMORS[i];
        addRow('🛡 '+a.name+' (+'+a.hp+' HP)', a.price, ()=>{ if(Game.armorLevel<i){ Game.armorLevel=i; Game.maxHp = 100+a.hp; } });
      }
      break;
    case 'ores':
      addRow('Copper ×5', 40, ()=>Game.inv.copper+=5);
      addRow('Iron ×3', 80, ()=>Game.inv.iron+=3);
      addRow('Gold ×2', 150, ()=>Game.inv.gold_ore+=2);
      addRow('Iridium ×1', 300, ()=>Game.inv.iri+=1);
      break;
    case 'build':
      addRow('🏠 Cabin (30🪵 500🪙)', 500, ()=>{ if(Game.inv.wood>=30){ Game.inv.wood-=30; Game.builtBuildings.push({type:'cabin',x:Math.floor(player.x/TILE)+2,y:Math.floor(player.y/TILE),w:5,h:4}); toast('Built!'); } else { toast(t('notEnoughRes')); throw 0; } });
      addRow('🏚 Barn (60🪵 1000🪙)', 1000, ()=>{ if(Game.inv.wood>=60){ Game.inv.wood-=60; Game.builtBuildings.push({type:'house',x:Math.floor(player.x/TILE)+2,y:Math.floor(player.y/TILE),w:5,h:4}); toast('Built!'); } else { toast(t('notEnoughRes')); throw 0; } });
      break;
    case 'food': addRow('🍞 Bread ×3', 25, ()=>Game.inv.food+=3); break;
    case 'heal':
      addRow('❤ Potion', 60, ()=>Game.inv.potion=(Game.inv.potion||0)+1);
      addRow('💊 Full heal', 100, ()=>{ Game.hp = Game.maxHp; });
      break;
    case 'drinks': addRow('🍺 Ale', 20, ()=>Game.inv.food+=1); break;
    case 'exotic': addRow('🌱 Rare seeds ×3', 90, ()=>Game.inv.seeds+=3); break;
    case 'fish': addRow('Sell all fish', 15, ()=>{ let n = Game.inv.fish||0; if(n>0){ Game.gold += n*15; Game.inv.fish = 0; return true; } return false; }, true); break;
  }

  // Universal sell
  addRow('Sell raw goods', 8, ()=>{
    let sum = 0;
    for(const k of ['wood','stone','copper','iron','gold_ore','iri','fish','egg','milk','wool','slime','bone','feather']){
      if(Game.inv[k]){ sum += Game.inv[k]*8; Game.inv[k] = 0; }
    }
    if(sum>0){ Game.gold += sum; toast('+'+sum+'🪙'); return true; }
    return false;
  }, true);
}
$('closeShop').onclick = ()=>{ Snd.play('click'); closeShop(); };

function openCommunityPanel(){
  Game.shopOpen = true; Game.panelOpen = 'shop';
  $('shopTitle').textContent = 'Community Center';
  $('shopSub').textContent = 'Donate goods';
  $('panelShop').classList.add('show');
  const box = $('shopItems'); box.innerHTML = '';

  for(const b of Game.bundles){
    const r = document.createElement('div'); r.className = 'row';
    let html = '<span class="name"><b>'+b.name+'</b>'+(b.done?' ✓':'')+'<br>';
    for(const k in b.items){
      const need = b.items[k];
      const have = Game.inv[k]||0;
      html += k+': '+Math.min(have,need)+'/'+need+' ';
    }
    html += '<br><span style="color:#ffd54a">+'+b.reward+'🪙</span></span>';
    r.innerHTML = html;
    if(!b.done){
      const btn = document.createElement('button');
      btn.textContent = 'Donate';
      btn.onclick = ()=>{
        let can = true;
        for(const k in b.items) if((Game.inv[k]||0)<b.items[k]) can = false;
        if(can){
          for(const k in b.items) Game.inv[k] -= b.items[k];
          b.done = true; Game.gold += b.reward;
          Snd.play('donate');
          toast('Bundle complete! +'+b.reward+'🪙');
          closeShop(); setTimeout(openCommunityPanel, 100);
        } else { Snd.play('error'); toast(t('notEnoughRes')); }
      };
      r.appendChild(btn);
    }
    box.appendChild(r);
  }
}

function generateMine(depth){
  const m = World.mine;
  m.w = 30; m.h = 30;
  m.tiles = makeMap(30,30,T_ROCK);
  const rooms = [];
  const numRooms = 3+Math.min(8,Math.floor(depth/10));
  for(let i=0;i<numRooms;i++){
    const rw = 4+Math.floor(Math.random()*5);
    const rh = 4+Math.floor(Math.random()*5);
    const rx = 2+Math.floor(Math.random()*(26-rw));
    const ry = 2+Math.floor(Math.random()*(26-rh));
    rooms.push({x:rx,y:ry,w:rw,h:rh});
    for(let y=ry;y<ry+rh;y++) for(let x=rx;x<rx+rw;x++) m.tiles[y][x] = T_CAVE;
  }
  for(let i=1;i<rooms.length;i++){
    const a = rooms[i-1], b = rooms[i];
    const ax = Math.floor(a.x+a.w/2), ay = Math.floor(a.y+a.h/2);
    const bx = Math.floor(b.x+b.w/2), by = Math.floor(b.y+b.h/2);
    for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) m.tiles[ay][x] = T_CAVE;
    for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) m.tiles[y][bx] = T_CAVE;
  }
  m.objects = [];
  for(const r of rooms){
    for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++){
      if(m.tiles[y][x]!==T_CAVE) continue;
      if(Math.random()<0.08){
        let ore = T_CU;
        const r0 = Math.random();
        if(depth>60 && r0<0.15) ore = T_IRID;
        else if(depth>40 && r0<0.35) ore = T_GO;
        else if(depth>20 && r0<0.5) ore = T_IR;
        m.tiles[y][x] = ore;
      }
    }
  }
  const last = rooms[rooms.length-1];
  m.ladder = {x:last.x+Math.floor(last.w/2), y:last.y+Math.floor(last.h/2)};

  Game.monsters = [];
  const avail = MONSTER_TYPES.filter((t,i)=>{
    if(i===0) return true;
    if(i===1&&depth>5) return true;
    if(i===2&&depth>15) return true;
    if(i===3&&depth>25) return true;
    if(i===4&&depth>40) return true;
    return false;
  });
  const count = 2+Math.min(8, Math.floor(depth/5));
  for(let i=0;i<count;i++){
    const r = rooms[Math.floor(Math.random()*rooms.length)];
    const ty = avail[Math.floor(Math.random()*avail.length)];
    const mm = { typeId:ty.id, name:ty.name, sprite:ty.sprite,
      x:(r.x+1+Math.random()*(r.w-2))*TILE+8,
      y:(r.y+1+Math.random()*(r.h-2))*TILE+16,
      hp:ty.hp, maxHp:ty.hp, dmg:ty.dmg,
      dir:1, frame:0, frameTimer:0, hitTimer:0, moveTimer:1500,
      wanderTarget:{x:0,y:0} };
    mm.wanderTarget = {x:mm.x, y:mm.y};
    Game.monsters.push(mm);
  }
  const first = rooms[0];
  player.x = first.x*TILE+8;
  player.y = (first.y+1)*TILE+16;
  m.depth = depth;
  toast('Mine — Floor '+depth);
}

function checkMapTransition(){
  const pdX = player.x+16, pdY = player.y+24;
  const tx = Math.floor(pdX/TILE), ty = Math.floor(pdY/TILE);
  if(Game.map==='farm'){
    if(ty<1 && tx>=22 && tx<=28) switchMap('town', 24*TILE+8, 37*TILE);
    else if(ty>38 && tx>=22 && tx<=28) switchMap('beach', 24*TILE+8, 1*TILE+16);
    else if(tx<1 && ty>=18 && ty<=24) switchMap('forest', 37*TILE+8, 20*TILE+16);
    else if(tx>48 && ty>=18 && ty<=24) fadeTo(()=>{ generateMine(1); Game.map='mine'; player.targetX=null; });
  } else if(Game.map==='town'){
    if(ty>38 && tx>=22 && tx<=28) switchMap('farm', 24*TILE+8, 1*TILE+16);
    else if(ty<1 && tx>=22 && tx<=28) switchMap('mountain', 20*TILE+8, 37*TILE+16);
  } else if(Game.map==='beach'){
    if(ty<1 && tx>=22 && tx<=28) switchMap('farm', 24*TILE+8, 37*TILE+16);
  } else if(Game.map==='forest'){
    if(tx>38 && ty>=18 && ty<=24) switchMap('farm', 1*TILE+16, 21*TILE+16);
  } else if(Game.map==='mountain'){
    if(ty>38 && tx>=18 && tx<=22) switchMap('town', 25*TILE+8, 1*TILE+16);
  } else if(Game.map==='mine'){
    const m = currentMap();
    if(m.ladder && tx===m.ladder.x && ty===m.ladder.y){
      fadeTo(()=>{ generateMine(m.depth+1); player.targetX=null; });
    }
    if(ty===1 && tx<3) fadeTo(()=>{ Game.map='farm'; player.x=48*TILE; player.y=20*TILE+16; });
  }
}
function switchMap(name,px,py){
  fadeTo(()=>{
    Game.map = name; player.x = px; player.y = py;
    player.targetX = null; player.targetY = null; player.actionTarget = null;
    toast(t(name));
  });
}

function startSleep(){
  if(Game.sleeping) return;
  Game.sleeping = true;
  player.action = 'sleep';
  player.targetX = null; player.targetY = null;
  Snd.play('sleep'); Snd.stopMusic();
  $('fade').classList.add('active');
  const el = $('centerText');
  el.innerHTML = '<div class="big">'+t('sleep')+'</div>';
  el.classList.add('show');
  setTimeout(()=>{
    advanceDay(true);
    saveGame();
    el.innerHTML = '<div class="big">'+t('day')+' '+Game.day+'</div><div class="small">'+t(SEASONS[Game.season])+' • '+Game.seasonDay+'/7 • 6:00</div>';
    setTimeout(()=>{ el.classList.remove('show'); $('fade').classList.remove('active'); Snd.startMusic(); }, 1200);
  }, 1200);
}
function forceSleep(){
  if(Game.sleeping) return;
  Game.sleeping = true;
  player.action = 'sleep';
  Snd.stopMusic();
  $('fade').classList.add('active');
  const el = $('centerText');
  el.innerHTML = '<div class="big">...</div>';
  el.classList.add('show');
  setTimeout(()=>{
    advanceDay(false);
    el.innerHTML = '<div class="big">'+t('day')+' '+Game.day+'</div>';
    setTimeout(()=>{ el.classList.remove('show'); $('fade').classList.remove('active'); Snd.startMusic(); }, 1200);
  }, 1200);
}
function advanceDay(slept){
  Game.day++; Game.seasonDay++;
  if(Game.seasonDay>7){ Game.seasonDay = 1; Game.season = (Game.season+1)%4; toast(t('season')+': '+t(SEASONS[Game.season])); }
  Game.time = 6*60;
  Game.energy = slept ? Game.maxEnergy : Math.floor(Game.maxEnergy*0.6);
  Game.hp = Game.maxHp;
  const w = Math.random();
  if(Game.season===3 && w<0.35) Game.weather = 'snow';
  else if(w<0.25) Game.weather = 'rain';
  else if(w<0.32) Game.weather = 'storm';
  else if(w<0.42) Game.weather = 'fog';
  else Game.weather = 'sunny';
  for(const o of World.farm.objects){
    if(o.type==='crop'){
      if(o.watered && o.stage<4) o.stage++;
      o.watered = false;
      if(Game.weather==='rain') o.watered = true;
    }
  }
  const tiles = World.farm.tiles;
  for(let y=0;y<tiles.length;y++) for(let x=0;x<tiles[0].length;x++){
    if(tiles[y][x]===T_TILL_WET) tiles[y][x] = T_TILL;
    if(Game.weather==='rain' && tiles[y][x]===T_TILL) tiles[y][x] = T_TILL_WET;
  }
  for(const a of World.farm.animals){
    if(Math.random()<0.75) a.produceReady = true;
    if(a.growthStage<1){
      a.growTimer = (a.growTimer||0)+1;
      if(a.growTimer>=3){ a.growthStage = 1; }
    }
  }
  for(const n of NPC_DATA){ if(!n.giftedToday) n.hearts = Math.max(0, n.hearts-0.3); n.giftedToday = false; }
  Game.fishing = null; player.action = null;
  Game.map = 'farm'; player.x = 24*TILE; player.y = 19*TILE;
  player.targetX = null; player.targetY = null; player.actionTarget = null;
  Game.sleeping = false;
}

function saveGame(){
  try{
    const data = {
      time:Game.time, day:Game.day, season:Game.season, seasonDay:Game.seasonDay, weather:Game.weather,
      energy:Game.energy, hp:Game.hp, gold:Game.gold, inv:Game.inv,
      weaponLevel:Game.weaponLevel, armorLevel:Game.armorLevel, maxHp:Game.maxHp,
      map:Game.map, selected:Game.selected,
      player:{x:player.x, y:player.y, dir:player.dir},
      farm:{ tiles:World.farm.tiles, objects:World.farm.objects, animals:World.farm.animals },
      npcs:NPC_DATA.map(n=>({id:n.id, hearts:n.hearts, questDone:n.questDone, questGiven:n.questGiven})),
      activeQuests:Game.activeQuests, completedQuests:Game.completedQuests,
      kills:Game.kills, bundles:Game.bundles, fishCaught:Game.fishCaught,
      custom:{skin:Custom.skin, hair:Custom.hair, shirt:Custom.shirt, pants:Custom.pants, shoes:Custom.shoes, hat:Custom.hat},
      lang:LANG,
    };
    localStorage.setItem('pixelfarm_save', JSON.stringify(data));
    toast(t('saved'));
  }catch(e){ console.error('Save error:', e); }
}
function loadGame(){
  try{
    const raw = localStorage.getItem('pixelfarm_save');
    if(!raw) return false;
    const d = JSON.parse(raw);
    Game.time = d.time; Game.day = d.day; Game.season = d.season; Game.seasonDay = d.seasonDay;
    Game.weather = d.weather||'sunny';
    Game.energy = d.energy; Game.hp = d.hp||100; Game.gold = d.gold;
    if(d.inv) Game.inv = Object.assign(Game.inv, d.inv);
    Game.weaponLevel = d.weaponLevel||0;
    Game.armorLevel = d.armorLevel||0;
    Game.maxHp = d.maxHp || (100+(ARMORS[Game.armorLevel]?ARMORS[Game.armorLevel].hp:0));
    Game.map = d.map||'farm';
    Game.selected = d.selected||0;
    player.x = d.player.x; player.y = d.player.y; player.dir = d.player.dir||'d';
    if(d.farm && d.farm.tiles && d.farm.objects){
      World.farm.tiles = d.farm.tiles;
      World.farm.objects = d.farm.objects;
      World.farm.animals = d.farm.animals||[];
    }
    if(d.npcs) for(const sd of d.npcs){
      const n = NPC_DATA.find(x=>x.id===sd.id);
      if(n){ n.hearts = sd.hearts||0; n.questDone = !!sd.questDone; n.questGiven = !!sd.questGiven; }
    }
    Game.activeQuests = d.activeQuests||[];
    Game.completedQuests = d.completedQuests||0;
    Game.kills = d.kills||{};
    Game.fishCaught = d.fishCaught||{};
    if(d.bundles) for(const b of d.bundles){
      const target = Game.bundles.find(x=>x.id===b.id);
      if(target) target.done = !!b.done;
    }
    if(d.custom){
      Object.assign(Custom, d.custom);
      Custom.save();
      regenerateChar();
    }
    if(d.lang){
      LANG = d.lang;
      localStorage.setItem('pixelfarm_lang', LANG);
    }
    return true;
  }catch(e){ console.error('Load error:', e); return false; }
}
function hasSave(){ try{ return !!localStorage.getItem('pixelfarm_save'); }catch(e){ return false; } }

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(Game.paused) return;
  if(Game.panelOpen){ if(k==='escape') closeAllPanels(); return; }
  if(k==='escape'){ pauseGame(); return; }
  if(k==='e'){ tryInteract(); return; }
  if(k==='i'){ openInventory(); return; }
  if(k==='m'){ openMapPanel(); return; }
  if(k==='q'){ openQuests(); return; }
  if(k==='h'){ toggleHorse(); return; }
  if(k>='1'&&k<='7'){ Game.selected = parseInt(k)-1; Snd.play('click'); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

function closeAllPanels(){
  for(const id of ['panelShop','panelInv','panelMap','panelQuest','panelSettings','panelCustom']){
    $(id).classList.remove('show');
  }
  Game.panelOpen = null;
  Game.shopOpen = false;
}

function screenToWorld(cx,cy){
  const rect = cv.getBoundingClientRect();
  const sx = (cx-rect.left) * (cv.width/rect.width) / SCALE;
  const sy = (cy-rect.top) * (cv.height/rect.height) / SCALE;
  return {x:sx+camera.x, y:sy+camera.y};
}
function isOverHUD(cx,cy){
  const rect = cv.getBoundingClientRect();
  const sx = (cx-rect.left) * (cv.width/rect.width) / SCALE;
  const sy = (cy-rect.top) * (cv.height/rect.height) / SCALE;
  const hbW = 7*24+4, hbX = (LW-hbW)/2;
  if(sy>LH-32 && sx>hbX && sx<hbX+hbW) return 'hotbar';
  if(sx<125 && sy<100) return 'info';
  if(sx>LW-125 && sy<90){
    if(sy>64 && sy<80){
      if(sx>LW-124 && sx<LW-86) return 'inv';
      if(sx>LW-84 && sx<LW-46) return 'map';
      if(sx>LW-44 && sx<LW-6) return 'quest';
    }
    return 'info';
  }
  return false;
}
let pointerDown = false, pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
cv.addEventListener('pointerdown', e=>{
  if(Game.paused || Game.panelOpen || Game.shopOpen) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const lx = (e.clientX-rect.left) * (cv.width/rect.width) / SCALE;
  const ly = (e.clientY-rect.top) * (cv.height/rect.height) / SCALE;
  const over = isOverHUD(e.clientX, e.clientY);
  if(over==='hotbar'){
    const hbW = 7*24+4, hbX = (LW-hbW)/2, hbY = LH-32;
    if(ly>hbY && ly<hbY+28 && lx>hbX && lx<hbX+hbW){
      const idx = Math.floor((lx-hbX-2)/24);
      if(idx>=0 && idx<Game.hotbar.length){ Game.selected = idx; Snd.play('click'); }
    }
    return;
  }
  if(over==='inv'){ openInventory(); return; }
  if(over==='map'){ openMapPanel(); return; }
  if(over==='quest'){ openQuests(); return; }
  if(over) return;
  pointerDown = true; pointerMoved = false;
  pointerStartX = e.clientX; pointerStartY = e.clientY;
  const p = screenToWorld(e.clientX, e.clientY);
  const tx = Math.floor(p.x/TILE), ty = Math.floor(p.y/TILE);
  player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  player.targetX = p.x; player.targetY = p.y;
});
cv.addEventListener('pointermove', e=>{
  if(!pointerDown || Game.paused || Game.panelOpen || Game.shopOpen) return;
  if(Math.hypot(e.clientX-pointerStartX, e.clientY-pointerStartY)>12) pointerMoved = true;
  if(pointerMoved){
    const p = screenToWorld(e.clientX, e.clientY);
    player.targetX = p.x; player.targetY = p.y;
    const tx = Math.floor(p.x/TILE), ty = Math.floor(p.y/TILE);
    player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  }
});
window.addEventListener('pointerup', ()=>{ pointerDown = false; });
window.addEventListener('pointercancel', ()=>{ pointerDown = false; });

function tryInteract(){
  const pdX = player.x+16, pdY = player.y+24;
  if(Game.map==='farm'){
    const hd = World.farm.houseDoor;
    if(Math.hypot(pdX-(hd.x*TILE+TILE/2), pdY-(hd.y*TILE+TILE))<40){ startSleep(); return; }
    const sd = World.farm.shopDoor;
    if(Math.hypot(pdX-(sd.x*TILE+TILE/2), pdY-(sd.y*TILE+TILE))<40){ openShop({name:'Farm Shop',role:'Goods',shop:'seeds'}); return; }
    const cD = World.farm.carpenterDoor;
    if(Math.hypot(pdX-(cD.x*TILE+TILE/2), pdY-(cD.y*TILE+TILE))<40){ openShop({name:'Carpenter',role:'Build',shop:'build'}); return; }
    const comD = World.farm.communityDoor;
    if(Math.hypot(pdX-(comD.x*TILE+TILE/2), pdY-(comD.y*TILE+TILE))<40){ openCommunityPanel(); return; }
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(Math.hypot(n.x-pdX, n.y-pdY)<40){ talkToNPC(n); return; }
  }
  toast(t('invalidAction'));
}

// ============================================================
// UPDATE
// ============================================================
let lastTime = performance.now();
function update(dt){
  if(Game.paused || Game.panelOpen || Game.sleeping) return;
  Game.time += dt*0.001*(1200/(20*60));
  if(Game.time>=26*60){ Game.time = 26*60; forceSleep(); }
  if(Game.toastTimer>0) Game.toastTimer -= dt;
  if(player.action){ player.actionTimer -= dt; if(player.actionTimer<=0) player.action = null; }
  if(player.invuln>0) player.invuln -= dt;

  if(Game.fishing){
    Game.fishing.timer += dt;
    if(Game.fishing.timer>Game.fishing.duration && !Game.fishing.caught){
      Game.fishing.caught = true;
      const f = getFishingResult();
      if(Math.random() < f.chance+0.2){
        Game.fishCaught[f.name] = (Game.fishCaught[f.name]||0)+1;
        Game.inv.fish = (Game.inv.fish||0)+1;
        Snd.play('fish');
        toast('🐟 '+f.name+' ('+f.price+'🪙)');
      } else { Snd.play('error'); toast('Nothing...'); }
    }
    if(Game.fishing.timer>Game.fishing.duration+800) Game.fishing = null;
    return;
  }

  // Movement
  let dx = 0, dy = 0;
  if(keys['w']||keys['arrowup']){ dy = -1; player.dir = 'u'; }
  if(keys['s']||keys['arrowdown']){ dy = 1; player.dir = 'd'; }
  if(keys['a']||keys['arrowleft']){ dx = -1; player.dir = 'l'; }
  if(keys['d']||keys['arrowright']){ dx = 1; player.dir = 'r'; }
  if(dx!==0||dy!==0){ player.targetX = null; player.targetY = null; player.actionTarget = null; }

  if(dx===0 && dy===0 && player.targetX!==null){
    const fx = player.x+16, fy = player.y+24;
    const tdx = player.targetX-fx, tdy = player.targetY-fy;
    const dist = Math.sqrt(tdx*tdx+tdy*tdy);
    if(dist<6){
      player.targetX = null; player.targetY = null;
      if(player.actionTarget){
        const atx = player.actionTarget.tx, aty = player.actionTarget.ty;
        const ddx = atx*TILE+TILE/2-fx, ddy = aty*TILE+TILE/2-fy;
        if(Math.abs(ddx)>Math.abs(ddy)) player.dir = ddx>0?'r':'l';
        else player.dir = ddy>0?'d':'u';
        if(Math.abs(ddx)<TILE*1.6 && Math.abs(ddy)<TILE*1.7){
          doActionAt(atx, aty);
        }
        player.actionTarget = null;
      }
    } else {
      dx = tdx/dist; dy = tdy/dist;
      if(Math.abs(tdx)>Math.abs(tdy)) player.dir = tdx>0?'r':'l';
      else player.dir = tdy>0?'d':'u';
    }
  }
  if(dx!==0 && dy!==0){ dx *= 0.7071; dy *= 0.7071; }

  const moving = (dx!==0 || dy!==0);
  const speed = Game.onHorse ? player.speed*2.5 : player.speed;
  const nx = player.x + dx*speed;
  const ny = player.y + dy*speed;
  let blockedX = false, blockedY = false;
  if(!collides(nx, player.y)) player.x = nx; else blockedX = true;
  if(!collides(player.x, ny)) player.y = ny; else blockedY = true;
  if(moving && blockedX && blockedY){
    player.stuckTimer = (player.stuckTimer||0) + dt;
    if(player.stuckTimer>1500){
      player.targetX = null; player.targetY = null; player.actionTarget = null;
      player.stuckTimer = 0;
    }
  } else player.stuckTimer = 0;

  if(Game.onHorse){
    const horse = World.farm.animals.find(a=>a.type==='horse'&&a.mounted);
    if(horse){ horse.x = player.x+8; horse.y = player.y+24; }
  }

  if(moving){
    player.walkTimer += dt;
    const ft = Game.onHorse ? 90 : 140;
    while(player.walkTimer>ft){
      player.walkTimer -= ft;
      const old = player.walkPhase;
      player.walkPhase = (player.walkPhase+1) % 4;
      if((old===0||old===2) && (player.walkPhase===1||player.walkPhase===3)) Snd.play('step');
    }
  } else { player.walkPhase = 0; player.walkTimer = 0; }

  const targetCamX = player.x+16-LW/2;
  const targetCamY = player.y+24-LH/2;
  camera.x += (targetCamX-camera.x) * Math.min(1, dt*0.02);
  camera.y += (targetCamY-camera.y) * Math.min(1, dt*0.02);
  const m = currentMap();
  camera.x = Math.max(0, Math.min(camera.x, Math.max(0, m.w*TILE-LW)));
  camera.y = Math.max(0, Math.min(camera.y, Math.max(0, m.h*TILE-LH)));

  for(let i=Game.particles.length-1;i>=0;i--){
    const p = Game.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt;
    if(p.life<=0) Game.particles.splice(i,1);
  }

  // Animals
  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(a.mounted) continue;
      if(a.produceTimer>0){ a.produceTimer -= dt; if(a.produceTimer<=0){ a.produceReady = true; a.produceTimer = 0; } }
      a.moveTimer -= dt;
      if(a.moveTimer<=0){
        a.moveTimer = 2000+Math.random()*2500;
        const pa = World.farm.penArea;
        a.tx = (pa.x+1+Math.random()*(pa.w-2))*TILE;
        a.ty = (pa.y+1+Math.random()*(pa.h-2))*TILE+16;
      }
      const adx = a.tx-a.x, ady = a.ty-a.y;
      const ad = Math.sqrt(adx*adx+ady*ady);
      if(ad>2){ a.x += adx/ad*0.35; a.y += ady/ad*0.35; a.dir = adx>0?1:-1;
        a.frameTimer += dt; if(a.frameTimer>260){ a.frameTimer=0; a.frame = (a.frame+1)%2; } }
    }
  }

  // NPCs
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    n.moveTimer -= dt;
    if(n.moveTimer<=0){
      n.moveTimer = 2500+Math.random()*3000;
      n.wanderTarget = {x:n.hx*TILE+8+(Math.random()-0.5)*40, y:n.hy*TILE+16+(Math.random()-0.5)*40};
    }
    const ndx = n.wanderTarget.x-n.x, ndy = n.wanderTarget.y-n.y;
    const nd = Math.sqrt(ndx*ndx+ndy*ndy);
    if(nd>2){
      const sp = 0.3;
      const nxn = n.x+ndx/nd*sp, nyn = n.y+ndy/nd*sp;
      let moved = false;
      if(!collidesTilesOnly(nxn,n.y)){ n.x = nxn; moved = true; }
      if(!collidesTilesOnly(n.x,nyn)){ n.y = nyn; moved = true; }
      if(moved){
        if(ndx>1) n.dir = 'r'; else if(ndx<-1) n.dir = 'l';
        n.walkTimer += dt;
        if(n.walkTimer>180){ n.walkTimer = 0; n.walkPhase = (n.walkPhase+1)%4; }
      } else n.moveTimer = 0;
    }
  }

  // Monsters
  if(Game.map==='mine'){
    for(const mon of Game.monsters){
      if(mon.hitTimer>0){ mon.hitTimer -= dt; continue; }
      const ddx = player.x+16-mon.x, ddy = player.y+24-mon.y;
      const dist = Math.sqrt(ddx*ddx+ddy*ddy);
      if(dist<80){
        const sp = 0.5;
        const nxn = mon.x+ddx/dist*sp, nyn = mon.y+ddy/dist*sp;
        if(!collidesTilesOnly(nxn, mon.y)) mon.x = nxn;
        if(!collidesTilesOnly(mon.x, nyn)) mon.y = nyn;
        mon.dir = ddx>0?1:-1;
        if(dist<20 && player.invuln<=0){
          Game.hp -= mon.dmg;
          player.invuln = 800;
          Snd.play('hurt');
          spawnParticle(player.x+16, player.y+16, '#ff2020');
          if(Game.hp<=0){ Game.hp = Game.maxHp; Game.map='farm'; player.x=24*TILE; player.y=19*TILE; toast('Passed out...'); }
        }
      } else {
        mon.moveTimer -= dt;
        if(mon.moveTimer<=0){ mon.moveTimer = 2000+Math.random()*2000;
          mon.wanderTarget = {x:mon.x+(Math.random()-0.5)*80, y:mon.y+(Math.random()-0.5)*80}; }
        const mdx = mon.wanderTarget.x-mon.x, mdy = mon.wanderTarget.y-mon.y;
        const md = Math.sqrt(mdx*mdx+mdy*mdy);
        if(md>2){ mon.x += mdx/md*0.25; mon.y += mdy/md*0.25; mon.dir = mdx>0?1:-1; }
      }
      mon.frameTimer += dt;
      if(mon.frameTimer>300){ mon.frameTimer = 0; mon.frame = (mon.frame+1)%2; }
    }
  }

  // Day/night
  const t2 = Game.time;
  let dn = 0;
  if(t2>=6*60 && t2<8*60) dn = 0.5 - ((t2-6*60)/120)*0.5;
  else if(t2>=8*60 && t2<18*60) dn = 0;
  else if(t2>=18*60 && t2<21*60) dn = ((t2-18*60)/180)*0.6;
  else if(t2>=21*60 || t2<6*60) dn = 0.6;
  if(Game.map==='mine') dn = 0.75;
  Game.dayNight = dn;

  checkMapTransition();
}

function collidesTilesOnly(x,y){
  const hbX = x+8, hbY = y+18, hbW = 16, hbH = 14;
  const corners = [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]];
  for(const [cx,cy] of corners){
    const t = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t)) return true;
  }
  return false;
}
function collides(x,y){
  const hbX = x+8, hbY = y+18, hbW = 16, hbH = 14;
  const corners = [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]];
  for(const [cx,cy] of corners){
    const t = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t)) return true;
  }
  const m = currentMap();
  if(m.objects) for(const o of m.objects){
    if(!o.solid) continue;
    let ox, oy, ow, oh;
    if(o.type==='tree' || o.type==='pine'){ ox = o.tx*TILE+1; oy = (o.ty+1)*TILE-12; ow = TILE-2; oh = 12; }
    else if(o.type==='rock_s'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='rock_m'){ ox = o.tx*TILE-2; oy = (o.ty+1)*TILE-11; ow = TILE+4; oh = 11; }
    else if(o.type==='rock_l'){ ox = o.tx*TILE-4; oy = (o.ty+1)*TILE-12; ow = TILE+8; oh = 12; }
    else if(o.type==='barrel' || o.type==='signpost' || o.type==='lamp'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='crop') continue;
    else { ox = o.tx*TILE; oy = o.ty*TILE; ow = TILE; oh = TILE; }
    if(hbX<ox+ow && hbX+hbW>ox && hbY<oy+oh && hbY+hbH>oy) return true;
  }
  // NPCs
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(hbX<n.x-8+16 && hbX+hbW>n.x-8 && hbY<n.y-16+16 && hbY+hbH>n.y-16) return true;
  }
  // Animals
  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(Game.onHorse && a.mounted) continue;
      if(hbX<a.x-8+16 && hbX+hbW>a.x-8 && hbY<a.y-14+14 && hbY+hbH>a.y-14) return true;
    }
  }
  // Buildings
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const bx = b.x*TILE+4, by = b.y*TILE+20, bw = b.w*TILE-8, bh = b.h*TILE-20;
      if(hbX<bx+bw && hbX+hbW>bx && hbY<by+bh && hbY+hbH>by){
        if(b.door){
          const dx = b.door.x*TILE+2, dw = TILE-4;
          if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>by+bh-TILE*1.5) return false;
        }
        return true;
      }
    }
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    const hL = ha.x*TILE+4, hT = ha.y*TILE+22, hW = ha.w*TILE-8, hH = ha.h*TILE-22;
    const dX = World.farm.houseDoor.x*TILE+2, dW = TILE-4;
    if(hbX<hL+hW && hbX+hbW>hL && hbY<hT+hH && hbY+hbH>hT){
      if(hbX+hbW>dX && hbX<dX+dW && hbY+hbH>hT+hH-TILE*1.5) return false;
      return true;
    }
    const sp = World.farm.shopPos;
    const sL = sp.x*TILE, sT = sp.y*TILE+22, sW = 4*TILE, sH = 4*TILE-22;
    const sd = World.farm.shopDoor;
    if(hbX<sL+sW && hbX+hbW>sL && hbY<sT+sH && hbY+hbH>sT){
      const dx = sd.x*TILE+2, dw = TILE-4;
      if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>sT+sH-TILE*1.5) return false;
      return true;
    }
    const st = World.farm.stablePos;
    if(hbX<st.x*TILE+72 && hbX+hbW>st.x*TILE && hbY<st.y*TILE+56 && hbY+hbH>st.y*TILE+22) return true;
    const cp = World.farm.carpenterPos;
    if(hbX<cp.x*TILE+80 && hbX+hbW>cp.x*TILE && hbY<cp.y*TILE+64 && hbY+hbH>cp.y*TILE+22) return true;
    const cm = World.farm.communityPos;
    if(hbX<cm.x*TILE+112 && hbX+hbW>cm.x*TILE && hbY<cm.y*TILE+80 && hbY+hbH>cm.y*TILE+30) return true;
  }
  return false;
}
