// MINE
// ============================================================
function generateMine(depth){
  const m = World.mine;
  m.w = 40; m.h = 30;
  m.depth = depth; Game.mineDepth = depth;
  m.tiles = makeMap(40,30,T_ROCK); m.objects = [];
  const entranceRoom = {x:1, y:1, w:7, h:5};
  const exitRoom = {x:33, y:24, w:6, h:5};
  const rooms = [entranceRoom, exitRoom];
  const numRooms = 3 + Math.min(5, Math.floor(depth/4));
  for(let i=0;i<numRooms;i++){
    const rw = 4+Math.floor(Math.random()*5); const rh = 4+Math.floor(Math.random()*5);
    const rx = 4+Math.floor(Math.random()*(m.w-rw-6));
    const ry = 4+Math.floor(Math.random()*(m.h-rh-6));
    if(rx < entranceRoom.x+entranceRoom.w+2 && ry < entranceRoom.y+entranceRoom.h+2) continue;
    if(rx + rw > exitRoom.x-2 && ry + rh > exitRoom.y-2) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh});
  }
  for(const r of rooms){
    for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++){
      if(x>0 && y>0 && x<m.w-1 && y<m.h-1) m.tiles[y][x] = T_CAVE;
    }
  }
  for(let i=1;i<rooms.length;i++){
    const a = rooms[i-1], b = rooms[i];
    const ax = Math.floor(a.x+a.w/2), ay = Math.floor(a.y+a.h/2);
    const bx = Math.floor(b.x+b.w/2), by = Math.floor(b.y+b.h/2);
    for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) if(m.tiles[ay][x]===T_ROCK) m.tiles[ay][x] = T_CAVE;
    for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) if(m.tiles[y][bx]===T_ROCK) m.tiles[y][bx] = T_CAVE;
  }
  m.stairsUp = {x:entranceRoom.x+1, y:entranceRoom.y+1};
  m.ladder = {x:exitRoom.x+Math.floor(exitRoom.w/2), y:exitRoom.y+Math.floor(exitRoom.h/2)};
  m.elevator = (depth % 5 === 0) ? {x:entranceRoom.x+entranceRoom.w-2, y:entranceRoom.y+1} : null;
  m.altar = (depth % 20 === 0) ? {x:entranceRoom.x+entranceRoom.w-2, y:entranceRoom.y+entranceRoom.h-2} : null;
  for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){
    if(m.tiles[y][x] !== T_ROCK) continue;
    let adj = false;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const ny = y+dy, nx = x+dx;
      if(ny>=0 && ny<m.h && nx>=0 && nx<m.w && m.tiles[ny][nx] === T_CAVE) adj = true;
    }
    if(!adj) continue;
    if(Math.random()<0.15){
      let ore = T_CU;
      const r0 = Math.random();
      if(depth>=60 && r0<0.15) ore = T_IRID;
      else if(depth>=40 && r0<0.35) ore = T_GO;
      else if(depth>=20 && r0<0.5) ore = T_IR;
      m.tiles[y][x] = ore;
    }
  }
  Game.monsters = [];
  const avail = MONSTER_TYPES.filter((t2,i)=>{
    if(i===0) return true; if(i===1&&depth>5) return true;
    if(i===2&&depth>15) return true; if(i===3&&depth>25) return true; if(i===4&&depth>40) return true;
    return false;
  });
  const safeRooms = rooms.filter(r=>r !== entranceRoom);
  const count = Math.min(15, 3 + Math.floor(depth/2));
  for(let i=0;i<count;i++){
    if(!safeRooms.length) break;
    const r = safeRooms[Math.floor(Math.random()*safeRooms.length)];
    const ty = avail[Math.floor(Math.random()*avail.length)];
    const mm = { typeId:ty.id, name:ty.name, sprite:ty.sprite,
      x:(r.x+1+Math.random()*(r.w-2))*TILE+8, y:(r.y+1+Math.random()*(r.h-2))*TILE+16,
      hp:ty.hp, maxHp:ty.hp, dmg:ty.dmg,
      dir:1, frame:0, frameTimer:0, hitTimer:0, moveTimer:1500, wanderTarget:{x:0,y:0} };
    mm.wanderTarget = {x:mm.x, y:mm.y};
    Game.monsters.push(mm);
  }
  player.x = (entranceRoom.x+2)*TILE+8; player.y = (entranceRoom.y+2)*TILE+16;
  if(depth % 5 === 0 && depth > Game.mineMaxFloor) Game.mineMaxFloor = depth;
  toast('⛏ Mine — Floor ' + depth);
}

function checkMapTransition(){
  if(transitionLock) return;
  const pdX = player.x+12, pdY = player.y+24;
  const tx = Math.floor(pdX/TILE), ty = Math.floor(pdY/TILE);
  if(Game.map==='farm'){
    if(ty<1 && tx>=26 && tx<=34) switchMap('town', 30*TILE+8, 45*TILE);
    else if(ty>46 && tx>=26 && tx<=34) switchMap('beach', 30*TILE+8, 1*TILE+16);
    else if(tx<1 && ty>=24 && ty<=27) switchMap('forest', 45*TILE+8, 24*TILE+16);
  } else if(Game.map==='town'){
    if(ty>46 && tx>=26 && tx<=34) switchMap('farm', 30*TILE+8, 1*TILE+16);
    else if(ty<1 && tx>=26 && tx<=34) switchMap('mountain', 24*TILE+8, 45*TILE+16);
  } else if(Game.map==='beach'){ if(ty<1 && tx>=26 && tx<=34) switchMap('farm', 30*TILE+8, 45*TILE+16); }
  else if(Game.map==='forest'){ if(tx>46 && ty>=22 && ty<=28) switchMap('farm', 1*TILE+16, 25*TILE+16); }
  else if(Game.map==='mountain'){ if(ty>46 && tx>=22 && tx<=26) switchMap('town', 30*TILE+8, 1*TILE+16); }
}
function switchMap(name,px,py){
  if(transitionLock) return;
  transitionLock = true;
  dismountHorse();
  fadeTo(()=>{
    Game.map = name; player.x = px; player.y = py;
    player.targetX = null; player.targetY = null; player.actionTarget = null;
    toast(t(name));
    setTimeout(()=>{ transitionLock = false; }, 500);
  });
}

function startSleep(){
  if(Game.sleeping) return;
  Game.sleeping = true; player.action = 'sleep';
  player.targetX = null; player.targetY = null;
  Snd.play('sleep'); Snd.stopMusic();
  $('fade').classList.add('active');
  const el = $('centerText');
  el.innerHTML = '<div class="big">Sleeping...</div>'; el.classList.add('show');
  setTimeout(()=>{
    advanceDay(true); saveGame(true);
    el.innerHTML = '<div class="big">'+t('day')+' '+Game.day+' — '+t(SEASONS[Game.season])+' '+Game.seasonDay+'/'+SEASON_DAYS+'</div>';
    setTimeout(()=>{ el.classList.remove('show'); $('fade').classList.remove('active'); if(Snd.enabled) Snd.startMusic(); }, 1200);
  }, 1200);
}
function forceSleep(){
  if(Game.sleeping) return;
  Game.sleeping = true; player.action = 'sleep';
  Snd.stopMusic(); $('fade').classList.add('active');
  const el = $('centerText');
  el.innerHTML = '<div class="big">...</div>'; el.classList.add('show');
  setTimeout(()=>{
    advanceDay(false); saveGame(true);
    el.innerHTML = '<div class="big">'+t('day')+' '+Game.day+'</div>';
    setTimeout(()=>{ el.classList.remove('show'); $('fade').classList.remove('active'); if(Snd.enabled) Snd.startMusic(); }, 1200);
  }, 1200);
}
function advanceDay(slept){
  Game.day++; Game.seasonDay++;
  let seasonChanged = false;
  if(Game.seasonDay > SEASON_DAYS){
    Game.seasonDay = 1;
    Game.season = (Game.season+1)%4;
    seasonChanged = true;
    toast('🍃 '+t('seasonsChanged')+' — '+t(SEASONS[Game.season]));
  }
  Game.time = 6*60;
  Game.energy = slept ? Game.maxEnergy : Math.floor(Game.maxEnergy*0.6);
  Game.hp = Game.maxHp;
  Game.weather = Game.nextWeather || 'sunny';
  Game.nextWeather = pickWeather();

  // Kill out-of-season crops
  if(seasonChanged){
    let killed = 0;
    for(const o of World.farm.objects){
      if(o.type === 'crop' && !cropInSeason(o.cropType)){
        o.type = 'crop_withered'; killed++;
      }
    }
    if(killed > 0) toast('🍂 '+t('cropsDied')+' ('+killed+')');
  }

  // Crop growth with points
  for(const o of World.farm.objects){
    if(o.type==='crop'){
      if(o.watered){
        o.growthPoints = (o.growthPoints || 0) + 1;
        const days = CROP_DATA[o.cropType].days;
        o.stage = Math.min(4, Math.floor(o.growthPoints / (days/4)));
      }
      o.watered = false;
      if(Game.weather==='rain') o.watered = true;
    }
    if((o.type==='tree' || o.type==='pine') && (o.growth===undefined || o.growth < 2)){
      if(Math.random() < 0.1) o.growth = (o.growth||0)+1;
    }
  }
  const tiles = World.farm.tiles;
  for(let y=0;y<tiles.length;y++) for(let x=0;x<tiles[0].length;x++){
    if(tiles[y][x]===T_TILL_WET) tiles[y][x] = T_TILL;
    if(Game.weather==='rain' && tiles[y][x]===T_TILL) tiles[y][x] = T_TILL_WET;
  }
  // Sprinklers auto-water adjacent tilled tiles
  for(const o of World.farm.objects){
    if(o.type === 'sprinkler'){
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const ty = o.ty + dy, tx = o.tx + dx;
        if(ty>=0 && ty<tiles.length && tx>=0 && tx<tiles[0].length && tiles[ty][tx] === T_TILL) tiles[ty][tx] = T_TILL_WET;
      }
    }
  }
  for(const a of World.farm.animals){
    if(Math.random()<0.75) a.produceReady = true;
    if(a.growthStage<1){ a.growTimer = (a.growTimer||0)+1; if(a.growTimer>=3) a.growthStage = 1; }
  }
  // Shipping bin sale
  let shipTotal = 0;
  for(const k in Game.shipping){
    const n = Game.shipping[k]||0;
    if(n > 0) shipTotal += n * 8;
    Game.shipping[k] = 0;
  }
  if(shipTotal > 0){ Game.gold += shipTotal; toast('📤 Sold: +'+shipTotal+'🪙'); }
  decayFriendship();
  // Pet
  if(Game.hasPet && Game.pet){
    Game.petFed = (Game.petFedDay === Game.day); // will be reset for new day below
    Game.petFedDay = 0;
    Game.pet.x = player.x + 20; Game.pet.y = player.y + 20;
  }
  Game.week = currentWeek();
  Game.fishing = null; player.action = null;
  Game.map = 'farmhouse'; player.x = 3*TILE; player.y = 7*TILE;
  player.targetX = null; player.targetY = null; player.actionTarget = null;
  Game.sleeping = false;
  Game.footprints = [];
}

  try{
    const data = {
      time:Game.time, day:Game.day, season:Game.season, seasonDay:Game.seasonDay, weather:Game.weather, nextWeather:Game.nextWeather,
      energy:Game.energy, hp:Game.hp, gold:Game.gold, inv:Game.inv,
      weaponLevel:Game.weaponLevel, maxHp:Game.maxHp,
      toolLevels:Game.toolLevels, map:Game.map, selected:Game.selected,
      mineEntry:Game.mineEntry, mineDepth:Game.mineDepth, mineMaxFloor:Game.mineMaxFloor,
      player:{x:player.x, y:player.y, dir:player.dir},
      farm:{ tiles:World.farm.tiles, objects:World.farm.objects, animals:World.farm.animals },
      shipping: Game.shipping,
      hasGreenhouse: Game.hasGreenhouse,
      hasPet: Game.hasPet, petName: Game.petName, petFed: Game.petFed, petFedDay: Game.petFedDay,
      professions: Game.professions,
      npcs:NPC_DATA.map(n=>({id:n.id, hearts:n.hearts, questDone:n.questDone, questGiven:n.questGiven,
        greetedToday:n.greetedToday, lastTalkedDay:n.lastTalkedDay,
        giftToday:n.giftToday, giftWeek:n.giftWeek, giftCount:n.giftCount,
        metBefore:n.metBefore, storiesSeen:n.storiesSeen, questionsAsked:n.questionsAsked})),
      activeQuests:Game.activeQuests, completedQuests:Game.completedQuests,
      kills:Game.kills, fishCaught:Game.fishCaught, museumDonations:Game.museumDonations,
      achieved:Game.achieved, endingShown:Game.endingShown,

    };

function loadGame(){
  try{
    let raw = localStorage.getItem('pixelfarm_save');
    if(!raw){ raw = localStorage.getItem('pixelfarm_save_backup'); if(!raw) return false; }
    const d = JSON.parse(raw);
    Game.time = d.time; Game.day = d.day; Game.season = d.season; Game.seasonDay = d.seasonDay;
    Game.weather = d.weather||'sunny'; Game.nextWeather = d.nextWeather || pickWeather();
    Game.energy = d.energy; Game.hp = d.hp||100; Game.gold = d.gold;
    if(d.inv) Game.inv = Object.assign(Game.inv, d.inv);
    Game.weaponLevel = d.weaponLevel||0; Game.maxHp = d.maxHp || 100;
    if(d.toolLevels) Game.toolLevels = Object.assign(Game.toolLevels, d.toolLevels);
    Game.map = d.map||'farm'; Game.selected = d.selected||0;
    Game.mineEntry = d.mineEntry || 'farm';
    Game.mineDepth = d.mineDepth || 1;
    Game.mineMaxFloor = d.mineMaxFloor || 0;
    Game.shipping = d.shipping || {};
    Game.hasGreenhouse = !!d.hasGreenhouse;
    Game.hasPet = !!d.hasPet; Game.petName = d.petName || 'Rex';
    Game.petFed = !!d.petFed; Game.petFedDay = d.petFedDay || 0;
    Game.professions = d.professions || {};
    player.x = d.player.x; player.y = d.player.y; player.dir = d.player.dir||'d';
    if(d.farm && d.farm.tiles && d.farm.objects){
      World.farm.tiles = d.farm.tiles; World.farm.objects = d.farm.objects; World.farm.animals = d.farm.animals||[];
    }
    if(d.npcs) for(const sd of d.npcs){
      const n = NPC_DATA.find(x=>x.id===sd.id);
      if(n){
        n.hearts = sd.hearts||0; n.questDone = !!sd.questDone; n.questGiven = !!sd.questGiven;
        n.greetedToday = !!sd.greetedToday; n.lastTalkedDay = sd.lastTalkedDay||0;
        n.giftToday = !!sd.giftToday; n.giftWeek = sd.giftWeek||0; n.giftCount = sd.giftCount||0;
        n.metBefore = !!sd.metBefore;
        n.storiesSeen = sd.storiesSeen||[]; n.questionsAsked = sd.questionsAsked||[];
      }
    }
    Game.activeQuests = d.activeQuests||[]; Game.completedQuests = d.completedQuests||0;
    Game.kills = d.kills||{}; Game.fishCaught = d.fishCaught||{};
    Game.museumDonations = d.museumDonations||{}; Game.achieved = d.achieved||[];
    Game.endingShown = !!d.endingShown;
    if(d.skills) Game.skills = Object.assign(Game.skills, d.skills);
    if(d.skillXp) Game.skillXp = Object.assign(Game.skillXp, d.skillXp);
    if(d.custom){ Object.assign(Custom, d.custom); Custom.save(); regenerateChar(); }
    Game.week = currentWeek();
    if(Game.map === 'mine'){
      const depth = Game.mineDepth || 1;
      const sx = d.player.x, sy = d.player.y;
      const savedMap = Game.map;
      Game.map = 'farm';
      generateMine(depth);
      Game.map = savedMap;
      player.x = sx; player.y = sy;
    }
    return true;
  }catch(e){ return false; }
}

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if($('confirmModal').classList.contains('show')){
    if(k==='escape') closeConfirm();
    if(k===' '||k==='enter'){ const cb = confirmCallback; closeConfirm(); if(cb) cb(); }
    return;
  }
  if(FishMinigame.active){
    if(k==='escape'){ FishMinigame.cancel(); return; }
    if(k===' '||k==='enter'){ FishMinigame.click(); return; }
    return;
  }
  if(Game.fishing){
    if(k==='escape'){ Game.fishing = null; return; }
    if((k===' '||k==='enter') && Game.fishing.phase === 'bite'){
      const fish = getFishingResult();
      Game.fishing = null;
      FishMinigame.start(fish);
      return;
    }
    return;
  }
  if(Game.dialogue){ if(k==='escape'||k===' '||k==='enter') advanceDialogue(); return; }
  if($('elevatorMenu').classList.contains('show')){ if(k==='escape') closeElevator(); return; }
  if(CharEdit.mode){ if(k==='escape') CharEdit.cancel(); return; }
  if(Game.menuOpen){ if(k==='escape') closeMenu(); return; }
  if(Game.sleeping) return;
  if(k==='escape'){ openMenu(); return; }
  if(k==='i'){ openMenu('inventory'); return; }
  if(k==='c'){ openMenu('craft'); return; }
  if(k==='m'){ openMenu('map'); return; }
  if(k==='h'){ toggleHorse(); return; }
  if(k==='f'){ if(Game.map==='mine') attackNearest(); return; }
  if(k==='e'){ tryInteract(); return; }
  if(k>='1'&&k<='7'){ Game.selected = parseInt(k)-1; Snd.play('click'); }
});

cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if($('confirmModal').classList.contains('show')) return;
  if(FishMinigame.active){ FishMinigame.click(); return; }
  if(Game.dialogue || Game.menuOpen || Game.sleeping || CharEdit.mode) return;
  const p = screenToGame(e.clientX, e.clientY);
  const lx = p.x, ly = p.y;
  for(const b of getHUDButtons()){
    if(lx>=b.x && lx<=b.x+b.w && ly>=b.y && ly<=b.y+b.h){ Snd.play('click'); b.action(); return; }
  }
  const hbr = getHotbarRect();
  if(ly>hbr.y && ly<hbr.y+hbr.h && lx>hbr.x && lx<hbr.x+hbr.w){
    const idx = Math.floor((lx-hbr.x-2)/24);
    if(idx>=0 && idx<Game.hotbar.length){
      const now = performance.now();
      if(cv._lastHotbarTap && cv._lastHotbarTap.idx === idx && now - cv._lastHotbarTap.t < 350){
        openMenu('inventory'); cv._lastHotbarTap = null; return;
      }
      cv._lastHotbarTap = {idx, t: now};
      Game.selected = idx; Snd.play('click');
    }
    return;
  }
  if(lx < 130 && ly < 115) return;
  if(lx > LW-130 && ly < 64) return;
  if(lx > LW-130 && ly > LH-100) return;

  if(Game.fishing){
    if(Game.fishing.phase === 'bite'){
      const fish = getFishingResult();
      Game.fishing = null;
      FishMinigame.start(fish);
    }
    return;
  }

  pointerDown = true; pointerMoved = false;
  pointerStartX = e.clientX; pointerStartY = e.clientY;
  const wp = screenToWorld(e.clientX, e.clientY);
  const tx = Math.floor(wp.x/TILE), ty = Math.floor(wp.y/TILE);
  player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  player.targetX = wp.x; player.targetY = wp.y;
});
cv.addEventListener('pointermove', e=>{
  if(!pointerDown || Game.menuOpen || Game.sleeping || Game.dialogue || FishMinigame.active) return;
  if(Math.hypot(e.clientX-pointerStartX, e.clientY-pointerStartY)>12) pointerMoved = true;
  if(pointerMoved){
    const wp = screenToWorld(e.clientX, e.clientY);
    player.targetX = wp.x; player.targetY = wp.y;
    const tx = Math.floor(wp.x/TILE), ty = Math.floor(wp.y/TILE);
    player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  }
});
addEventListener('pointerup', ()=>{ pointerDown = false; if(FishMinigame.active) FishMinigame.release(); });

const TABS = [

  {id:'quests',    icon:'📜', label:'quests'},

function buildTabs(){
  const cont = $('menuTabs'); if(!cont) return;
  cont.innerHTML = '';
  for(const tab of TABS){
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.setAttribute('data-tab', tab.id);
    btn.innerHTML = '<span class="tab-icon">'+tab.icon+'</span><span class="tab-label">'+t(tab.label).toUpperCase()+'</span>';
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Game.menuTab = tab.id;
      renderMenuTab(Game.menuTab);
    });
    cont.appendChild(btn);
  }
  // Set active
  const active = cont.querySelector('[data-tab="'+Game.menuTab+'"]');
  if(active) active.classList.add('active');
}
function openMenu(tab){
  Game.menuOpen = true; Snd.stopAll();
  $('gameMenu').classList.add('show');

function craftItem(recipe){
  if(recipe.station && !hasStation(recipe.station)){ Snd.play('error'); toast('Need workstation'); return; }
  for(const k in recipe.need){ if((Game.inv[k]||0) < recipe.need[k]){ Snd.play('error'); toast('Not enough '+ITEM_NAMES[k]); return; } }
  for(const k in recipe.need) Game.inv[k] -= recipe.need[k];
  recipe.result();
  Snd.play('levelup');
  toast(t('crafted')+': '+recipe.name);
  renderMenuTab('craft');
}
function donateToMuseum(item){
  if(Game.museumDonations[item.id]) return;
  if((Game.inv[item.id]||0) <= 0){ Snd.play('error'); toast('You have 0'); return; }
  Game.inv[item.id]--;
  Game.museumDonations[item.id] = true;
  Snd.play('donate');
  toast('Donated: '+item.name);
  const id = 'museum_'+item.id;
  if(!Game.achieved.includes(id)){ Game.achieved.push(id); toast('🏆 Museum: '+item.name); }
  const count = Object.keys(Game.museumDonations).length;
  if(count === MUSEUM_ITEMS.length && !Game.endingShown){ setTimeout(showEnding, 800); }
}
function showEnding(){
  Game.endingShown = true;
  Snd.play('levelup'); Snd.stopMusic();
  $('endingStats').innerHTML = '🏆 Museum: '+Object.keys(Game.museumDonations).length+'/'+MUSEUM_ITEMS.length+'<br>📅 Days: '+Game.day+'<br>🪙 Gold: '+Game.gold+'<br>👥 Friends: '+NPC_DATA.filter(n=>n.hearts>=5).length+'/19';
  $('endingScreen').classList.remove('hidden');
}

function renderShopMenu(npc){
  const box = $('menuContent'); box.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = npc.name+' — '+npc.role; box.appendChild(h);
  const goldEl = document.createElement('div');
  goldEl.style.cssText = 'color:#e8c060;font-size:14px;text-align:center;margin-bottom:10px;padding:6px;background:rgba(0,0,0,.3);border-radius:4px';
  goldEl.textContent = '🪙 '+Game.gold;
  box.appendChild(goldEl);
  const grid = document.createElement('div'); grid.className = 'inv-grid-visual';
  function addRow(icon, name, price, action, sell){
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    slot.innerHTML = '<div class="icon">'+icon+'</div><div class="count">'+(sell?'+':'')+price+'</div>';
    slot.title = name;
    slot.onclick = ()=>{
      if(sell){ if(action()){ Snd.play('coin'); renderShopMenu(npc); } else Snd.play('error'); }
      else if(Game.gold>=price){ Game.gold -= price; try{ action(); }catch(e){ Game.gold += price; Snd.play('error'); return; } Snd.play('coin'); renderShopMenu(npc); }
      else { Snd.play('error'); toast('Not enough gold'); }
    };
    grid.appendChild(slot);
  }
  switch(npc.shop){
    case 'seeds':
      for(const c of CROPS){ if(!cropInSeason(c)) continue; const d = CROP_DATA[c]; addRow(d.icon, d.name+' seeds ×3', 20, ()=>Game.inv.seeds+=3); }
      break;
    case 'animals':
      for(const k of ['chicken','duck','rabbit','pig','cow','goat']){ const at = ANIMAL_TYPES[k]; addRow(at.icon, at.name, at.price, ()=>spawnAnimal(k)); }
      addRow('🐕', 'Pet Dog', 2000, ()=>{ if(!Game.hasPet){ Game.hasPet = true; Game.pet = {x:player.x+20, y:player.y+20}; toast(t('petAdopted')); } else toast('Already have pet'); });
      break;
    case 'horses': addRow('🐴','Horse',ANIMAL_TYPES.horse.price,()=>spawnAnimal('horse')); break;
    case 'weapons':
      for(let i=1;i<WEAPONS.length;i++){ const w = WEAPONS[i]; addRow('⚔', w.name, w.price, ()=>{ if(Game.weaponLevel<i) Game.weaponLevel=i; }); }
      for(const tool of ['axe','pick','hoe','can','rod']){
        const next = (Game.toolLevels[tool]||0)+1;
        if(next<TOOL_LEVELS.length){
          const tl = TOOL_LEVELS[next];
          addRow('🔨', toolName(tool)+' → '+tl.name, tl.price, ()=>{
            if((Game.inv[tl.resource]||0) >= tl.count){ Game.inv[tl.resource] -= tl.count; Game.toolLevels[tool] = next; toast(toolName(tool)+' upgraded!'); }
            else { toast('Need '+tl.count+' '+tl.resource); throw 0; }
          });
        }
      }
      break;
    case 'ores':
      addRow('🟠','Copper ×5',40,()=>Game.inv.copper+=5);
      addRow('⚪','Iron ×3',80,()=>Game.inv.iron+=3);
      addRow('🟡','Gold ×2',150,()=>Game.inv.gold_ore+=2);
      addRow('💜','Iridium ×1',300,()=>Game.inv.iri+=1);
      break;
    case 'build':
      addRow('🏠','Cabin (30🪵)',500,()=>{
        if(Game.inv.wood>=30){ Game.inv.wood -= 30;
          Game.builtBuildings.push({type:'cabin',x:Math.floor(player.x/TILE)+2,y:Math.floor(player.y/TILE)});
          toast('Built cabin!');
        } else { toast('Need 30 wood'); throw 0; }
      });
      addRow('🌿', t('greenhouse')+' (50🪵 20🪨)', 5000, ()=>{
        if(Game.hasGreenhouse){ toast('Already built'); throw 0; }
        if(Game.inv.wood>=50 && Game.inv.stone>=20){
          Game.inv.wood-=50; Game.inv.stone-=20;
          Game.hasGreenhouse = true;
          toast('🌿 '+t('greenhouseReady'));
        } else { toast('Need 50 wood + 20 stone'); throw 0; }
      });
      break;
    case 'food': addRow('🍞','Bread ×3',25,()=>Game.inv.food+=3); break;
    case 'heal':
      addRow('❤','Potion',60,()=>Game.inv.potion=(Game.inv.potion||0)+1);
      addRow('💊','Full heal',100,()=>{ Game.hp = Game.maxHp; });
      break;
    case 'drinks': addRow('🍺','Ale',20,()=>Game.inv.food+=1); break;
    case 'exotic': addRow('🌱','Rare seeds ×3',90,()=>Game.inv.seeds+=3); break;
    case 'fish': addRow('🐟','Sell all fish',15,()=>{ let n = Game.inv.fish||0; if(n>0){ Game.gold += n*15; Game.inv.fish = 0; return true; } return false; }, true); break;
  }
  box.appendChild(grid);
  // Sell picker
  const sellHeader = document.createElement('h3');
  sellHeader.textContent = '💰 Sell (8🪙 each)';
  sellHeader.style.marginTop = '14px';
  box.appendChild(sellHeader);
  const sellGrid = document.createElement('div'); sellGrid.className = 'inv-grid-visual';
  const SELLABLE = ['wood','stone','copper','iron','gold_ore','iri','fish','egg','milk','wool','slime','bone','feather','mushroom','wheat','carrot','tomato','potato','corn','pumpkin','truffle','goat_milk'];
  let anySell = false;
  for(const k of SELLABLE){
    const have = Game.inv[k]||0; if(have <= 0) continue;
    anySell = true;
    const slot = document.createElement('div'); slot.className = 'inv-slot';
    slot.innerHTML = '<div class="icon">'+(ITEM_ICONS[k]||'❓')+'</div><div class="count">'+have+'</div>';
    slot.onclick = ()=>{ Game.inv[k]--; Game.gold += 8; Snd.play('coin'); renderShopMenu(npc); };
    sellGrid.appendChild(slot);
  }
  if(!anySell){ const d = document.createElement('div'); d.style.cssText = 'color:#a08060;font-size:11px;padding:8px;text-align:center;grid-column:1/-1'; d.textContent='Nothing to sell'; sellGrid.appendChild(d); }
  box.appendChild(sellGrid);
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Close Shop';
  closeBtn.style.cssText = 'display:block;margin:14px auto 0;background:#6a2020;border:3px solid #a04040;padding:10px 24px;font-family:inherit;color:#ffe8b0;border-radius:4px;cursor:pointer;font-weight:bold';
  closeBtn.onclick = closeMenu;
  box.appendChild(closeBtn);
}

function populateWorld(){
  const w = World.farm; w.objects = [];
  const occ = new Set();
  for(let y=w.houseArea.y-2;y<w.houseArea.y+w.houseArea.h+1;y++)
    for(let x=w.houseArea.x-2;x<w.houseArea.x+w.houseArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.shopPos.y-1;y<w.shopPos.y+7;y++)
    for(let x=w.shopPos.x-1;x<w.shopPos.x+7;x++) occ.add(x+','+y);
  for(let y=w.penArea.y-1;y<w.penArea.y+w.penArea.h+1;y++)
    for(let x=w.penArea.x-1;x<w.penArea.x+w.penArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.stablePos.y-1;y<w.stablePos.y+6;y++)
    for(let x=w.stablePos.x-1;x<w.stablePos.x+8;x++) occ.add(x+','+y);
  for(let y=w.carpenterPos.y-1;y<w.carpenterPos.y+8;y++)
    for(let x=w.carpenterPos.x-1;x<w.carpenterPos.x+8;x++) occ.add(x+','+y);
  for(let y=w.cavePos.y-2;y<w.cavePos.y+3;y++)
    for(let x=w.cavePos.x-2;x<w.cavePos.x+3;x++) occ.add(x+','+y);
  occ.add('28,26'); occ.add('28,27'); occ.add('27,24');
  for(let y=0;y<48;y++) for(let x=0;x<60;x++) if(w.tiles[y][x]===T_PATH) occ.add(x+','+y);

  let id = 0;
  const treeTypeChoices = ['oak','birch','maple','willow'];
  for(let t2=0;t2<70;t2++){
    const tx = 2+Math.floor(Math.random()*56);
    const ty = 2+Math.floor(Math.random()*44);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    let nw = false;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(w.tiles[ty+dy] && w.tiles[ty+dy][tx+dx]===T_WATER){ nw = true; break; }
    }
    if(nw) continue;
    const isPine = Math.random()<0.25;
    const treeType = isPine ? 'pine' : treeTypeChoices[Math.floor(Math.random()*treeTypeChoices.length)];
    w.objects.push({ id:'t'+(id++), type:isPine?'pine':'tree', treeType, growth: 2,
      x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }
  for(let t2=0;t2<25;t2++){
    const tx = 2+Math.floor(Math.random()*56); const ty = 2+Math.floor(Math.random()*44);

function spawnAmbient(){
  const season = Game.season;
  const hour = Math.floor(Game.time/60)%24;
  const isNight = hour >= 20 || hour < 6;
  const camL = camera.x - 40, camR = camera.x + LW + 40;
  const camT = camera.y - 40, camB = camera.y + LH + 40;
  if(Game.map !== 'farm' && Game.map !== 'forest' && Game.map !== 'town') return;
  if(season === 0 && !isNight && Game.ambient.length < 8 && Math.random() < 0.02){
    Game.ambient.push({ type:'butterfly', x:camL+Math.random()*(camR-camL), y:camT+Math.random()*(camB-camT), vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.3, life:8000+Math.random()*4000, color:['#ffffff','#ffe060','#ff80a0'][Math.floor(Math.random()*3)], phase:Math.random()*Math.PI*2 });
  }
  if(season === 1 && isNight && Game.ambient.length < 10 && Math.random() < 0.03){
    Game.ambient.push({ type:'firefly', x:camL+Math.random()*(camR-camL), y:camT+Math.random()*(camB-camT), vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, life:5000+Math.random()*4000, phase:Math.random()*Math.PI*2 });
  }
  if(season === 2 && Game.ambient.length < 12 && Math.random() < 0.04){
    Game.ambient.push({ type:'leaf', x:camL+Math.random()*(camR-camL), y:camT-20, vx:-0.3+Math.random()*0.6, vy:0.4+Math.random()*0.3, life:6000, color:['#d88030','#a84a10','#c8a040'][Math.floor(Math.random()*3)], phase:Math.random()*Math.PI*2 });
  }
}
function updateAmbient(dt){
  spawnAmbient();
  Game.birdTimer -= dt;
  if(Game.birdTimer <= 0){
    Game.birdTimer = 12000 + Math.random()*15000;
    if(Game.map !== 'mine' && Game.map.indexOf('interior')<0){
      const dir = Math.random() < 0.5 ? 1 : -1;
      const count = 1 + Math.floor(Math.random()*3);
      for(let i=0;i<count;i++){
        Game.birds.push({ x: dir > 0 ? camera.x - 30 - i*14 : camera.x + LW + 30 + i*14, y: camera.y + 20 + Math.random()*80, vx: dir*0.8, vy: -0.05+Math.random()*0.1, life: 30000, phase: Math.random()*Math.PI*2 });
      }
    }
  }
  for(let i=Game.birds.length-1;i>=0;i--){
    const b = Game.birds[i]; b.x += b.vx; b.y += b.vy; b.life -= dt;
    if(b.x < camera.x - 100 || b.x > camera.x + LW + 100 || b.life <= 0) Game.birds.splice(i,1);
  }
  for(let i=Game.ambient.length-1;i>=0;i--){
    const p = Game.ambient[i]; p.x += p.vx; p.y += p.vy; p.phase += 0.05; p.life -= dt;
    if(p.type === 'butterfly'){ p.vx += (Math.random()-0.5)*0.05; p.vy += (Math.random()-0.5)*0.05; p.vx = Math.max(-0.5, Math.min(0.5, p.vx)); p.vy = Math.max(-0.5, Math.min(0.5, p.vy)); p.y += Math.sin(p.phase)*0.15; }
    else if(p.type === 'firefly'){ p.vx += (Math.random()-0.5)*0.03; p.vy += (Math.random()-0.5)*0.03; p.vx = Math.max(-0.3, Math.min(0.3, p.vx)); p.vy = Math.max(-0.3, Math.min(0.3, p.vy)); }
    else if(p.type === 'leaf'){ p.vx += Math.sin(p.phase)*0.02; p.x += Math.sin(p.phase)*0.3; }
    if(p.life <= 0) Game.ambient.splice(i,1);
  }
  if(Game.map === 'farm'){
    Game.smokePuffTimer -= dt;
    if(Game.smokePuffTimer <= 0){
      Game.smokePuffTimer = 700 + Math.random()*500;
      const ha = World.farm.houseArea;
      Game.ambient.push({ type:'smoke', x: (ha.x + 7.5)*TILE + (Math.random()-0.5)*2, y: (ha.y + 0.5)*TILE, vx: (Math.random()-0.5)*0.15, vy: -0.3 - Math.random()*0.2, life: 3000, max: 3000, size: 4 + Math.random()*2 });
    }
  }
  // Pet follow
  if(Game.hasPet && Game.pet){
    const dx = player.x - Game.pet.x, dy = player.y - Game.pet.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d > 30){
      Game.pet.x += dx/d * 1.2;
      Game.pet.y += dy/d * 1.2;
      Game.pet.frame = (Game.pet.frame||0);
      Game.pet.frameTimer = (Game.pet.frameTimer||0) + dt;
      if(Game.pet.frameTimer > 250){ Game.pet.frameTimer = 0; Game.pet.frame = (Game.pet.frame+1)%2; }
    }
  }
  // Footprints (snow)
  if(Game.weather === 'snow' && Game.map !== 'mine' && Game.map.indexOf('interior')<0 && (player.walkPhase === 1 || player.walkPhase === 3)){
    const last = Game.footprints[Game.footprints.length-1];
    const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
    if(!last || last.tx !== px || last.ty !== py){
      Game.footprints.push({tx:px, ty:py, t:performance.now()});
      if(Game.footprints.length > 30) Game.footprints.shift();
    }
  }
  // Decay footprints
  const now = performance.now();
  for(let i=Game.footprints.length-1;i>=0;i--){
    if(now - Game.footprints[i].t > 30000) Game.footprints.splice(i,1);
  }
}

// UPDATE

let lastTime = performance.now();
function update(dt){
  if(Game.paused || Game.menuOpen || Game.sleeping || Game.dialogue || $('elevatorMenu').classList.contains('show') || CharEdit.mode || $('confirmModal').classList.contains('show')) return;
  waterTimer += dt; if(waterTimer > 350){ waterTimer = 0; waterFrame = (waterFrame+1)%4; }
  animTimer += dt; if(animTimer > 700){ animTimer = 0; animFrameIdx = (animFrameIdx+1)%3; }
  ToastQueue.update(dt);
  updateAmbient(dt);
  Game.time += dt*0.001*(1200/(20*60));
  if(Game.time>=26*60){ Game.time = 26*60; forceSleep(); }
  if(player.action){ player.actionTimer -= dt; if(player.actionTimer<=0) player.action = null; }
  if(player.invuln>0) player.invuln -= dt;

  if(Game.weather === 'storm' && Game.map !== 'mine' && Game.map.indexOf('interior')<0){
    Game.thunderTimer -= dt;
    if(Game.thunderTimer <= 0){ Game.thunderTimer = 8000 + Math.random()*15000; Snd.play('thunder'); flashTimer = 180; }
  }

  if(Game.fishing){
    Game.fishing.timer += dt;
    if(Game.fishing.phase === 'casting'){ if(Game.fishing.timer > 800){ Game.fishing.phase = 'waiting'; Game.fishing.timer = 0; Game.fishing.waitTime = 1000 + Math.random()*3000; } }
    else if(Game.fishing.phase === 'waiting'){ if(Game.fishing.timer > Game.fishing.waitTime){ Game.fishing.phase = 'bite'; Game.fishing.timer = 0; Snd.play('bite'); } }
    else if(Game.fishing.phase === 'bite'){ if(Game.fishing.timer > 2000){ Game.fishing = null; toast('Got away...'); Snd.play('escape'); } }
    return;
  }
  if(FishMinigame.active){ FishMinigame.update(dt); return; }

  let dx = 0, dy = 0;
  if(keys['w']||keys['arrowup']){ dy = -1; player.dir = 'u'; }
  if(keys['s']||keys['arrowdown']){ dy = 1; player.dir = 'd'; }
  if(keys['a']||keys['arrowleft']){ dx = -1; player.dir = 'l'; }
  if(keys['d']||keys['arrowright']){ dx = 1; player.dir = 'r'; }
  if(dx!==0||dy!==0){ player.targetX = null; player.targetY = null; player.actionTarget = null; }

  if(dx===0 && dy===0 && player.targetX!==null){
    const fx = player.x+12, fy = player.y+24;
    const tdx = player.targetX-fx, tdy = player.targetY-fy;
    const dist = Math.sqrt(tdx*tdx+tdy*tdy);
    if(dist<6){
      player.targetX = null; player.targetY = null;
      if(player.actionTarget){
        const atx = player.actionTarget.tx, aty = player.actionTarget.ty;
        const ddx = atx*TILE+TILE/2-fx, ddy = aty*TILE+TILE/2-fy;
        if(Math.abs(ddx)>Math.abs(ddy)) player.dir = ddx>0?'r':'l'; else player.dir = ddy>0?'d':'u';
        if(Math.abs(ddx)<TILE*2 && Math.abs(ddy)<TILE*2){ doActionAt(atx, aty); }
        player.actionTarget = null;
      }
    } else { dx = tdx/dist; dy = tdy/dist; if(Math.abs(tdx)>Math.abs(tdy)) player.dir = tdx>0?'r':'l'; else player.dir = tdy>0?'d':'u'; }
  }
  if(dx!==0 && dy!==0){ dx *= 0.7071; dy *= 0.7071; }

  const moving = (dx!==0 || dy!==0);
  let speedMult = 1;
  if(Game.weather === 'snow' && Game.map !== 'mine' && Game.map.indexOf('interior')<0) speedMult = 0.75;
  if(Game.weather === 'fog' && Game.map !== 'mine' && Game.map.indexOf('interior')<0) speedMult = 0.9;
  const speed = (Game.onHorse ? player.speed*2.5 : player.speed) * speedMult;
  const nx = player.x + dx*speed;
  const ny = player.y + dy*speed;
  let blockedX = false, blockedY = false;
  if(!collides(nx, player.y)) player.x = nx; else blockedX = true;
  if(!collides(player.x, ny)) player.y = ny; else blockedY = true;
  if(moving && blockedX && blockedY){ player.stuckTimer = (player.stuckTimer||0) + dt; if(player.stuckTimer>1500){ player.targetX = null; player.targetY = null; player.actionTarget = null; player.stuckTimer = 0; } } else player.stuckTimer = 0;

  if(Game.onHorse){ const horse = World.farm.animals.find(a=>a.type==='horse'&&a.mounted); if(horse){ horse.x = player.x+8; horse.y = player.y+24; } }
  if(moving){
    player.walkTimer += dt;
    const ft = Game.onHorse ? 90 : 140;
    while(player.walkTimer>ft){ player.walkTimer -= ft; const old = player.walkPhase; player.walkPhase = (player.walkPhase+1) % 4; if((old===0||old===2) && (player.walkPhase===1||player.walkPhase===3)) Snd.play('step'); }
  } else { player.walkPhase = 0; player.walkTimer = 0; }

  const targetCamX = player.x+12-LW/2;
  const targetCamY = player.y+24-LH/2;
  camera.x += (targetCamX-camera.x) * Math.min(1, dt*0.02);
  camera.y += (targetCamY-camera.y) * Math.min(1, dt*0.02);
  const m = currentMap();
  camera.x = Math.max(0, Math.min(camera.x, Math.max(0, m.w*TILE-LW)));
  camera.y = Math.max(0, Math.min(camera.y, Math.max(0, m.h*TILE-LH)));

  // Update particles
  if(Game.particles){
    if(Game.particles.length > 80) Game.particles.length = 80;
    for(let i=Game.particles.length-1;i>=0;i--){ const p = Game.particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt; if(p.life<=0) Game.particles.splice(i,1); }
  }

  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(a.mounted) continue;
      if(a.produceTimer>0){ a.produceTimer -= dt; if(a.produceTimer<=0){ a.produceReady = true; a.produceTimer = 0; } }
      a.moveTimer -= dt;
      if(a.moveTimer<=0){ a.moveTimer = 2000+Math.random()*2500; const pa = World.farm.penArea; a.tx = (pa.x+1+Math.random()*(pa.w-2))*TILE; a.ty = (pa.y+1+Math.random()*(pa.h-2))*TILE+16; }
      const adx = a.tx-a.x, ady = a.ty-a.y;
      const ad = Math.sqrt(adx*adx+ady*ady);
      if(ad>2){ a.x += adx/ad*0.35; a.y += ady/ad*0.35; a.dir = adx>0?1:-1; a.frameTimer += dt; if(a.frameTimer>260){ a.frameTimer=0; a.frame = (a.frame+1)%2; } }
    }
  }

  const nowH = Game.time/60;
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    let targetX = n.hx, targetY = n.hy;
    if(n.work && n.home && nowH >= n.work.start && nowH < n.work.end){ targetX = n.work.x; targetY = n.work.y; }
    else if(n.home){ targetX = n.home.x; targetY = n.home.y; }
    n.moveTimer -= dt;
    if(n.moveTimer<=0){ n.moveTimer = 2500+Math.random()*3000; n.wanderTarget = {x:targetX*TILE+8 + (Math.random()-0.5)*40, y:targetY*TILE+16 + (Math.random()-0.5)*40}; }
    const ndx = n.wanderTarget.x-n.x, ndy = n.wanderTarget.y-n.y;
    const nd = Math.sqrt(ndx*ndx+ndy*ndy);
    if(nd>2){
      const sp = 0.3;
      const nxn = n.x+ndx/nd*sp, nyn = n.y+ndy/nd*sp;
      let moved = false;
      if(!collidesTilesOnly(nxn,n.y) && !collidesNPCAt(nxn,n.y,n)){ n.x = nxn; moved = true; }
      if(!collidesTilesOnly(n.x,nyn) && !collidesNPCAt(n.x,nyn,n)){ n.y = nyn; moved = true; }
      if(moved){ if(ndx>1) n.dir = 'r'; else if(ndx<-1) n.dir = 'l'; n.walkTimer += dt; if(n.walkTimer>180){ n.walkTimer = 0; n.walkPhase = (n.walkPhase+1)%4; } }
      else n.moveTimer = 0;
    }
  }

  if(Game.map==='mine'){
    for(const mon of Game.monsters){
      if(mon.hitTimer>0){ mon.hitTimer -= dt; continue; }
      const ddx = player.x+12-mon.x, ddy = player.y+24-mon.y;
      const dist = Math.sqrt(ddx*ddx+ddy*ddy);
      if(dist<80){
        const sp = 0.5;
        const nxn = mon.x+ddx/dist*sp, nyn = mon.y+ddy/dist*sp;
        if(!collidesTilesOnly(nxn, mon.y)) mon.x = nxn;
        if(!collidesTilesOnly(mon.x, nyn)) mon.y = nyn;
        mon.dir = ddx>0?1:-1;
        if(dist<22 && player.invuln<=0){
          Game.hp -= mon.dmg; player.invuln = 800; Snd.play('hurt');
          spawnParticle(player.x+12, player.y+16, '#ff2020');
          if(Game.hp<=0){ const lost = Math.floor(Game.gold*0.1); Game.gold = Math.max(0, Game.gold - lost); Game.hp = Game.maxHp; Game.map='farmhouse'; player.x = 3*TILE; player.y = 7*TILE; player.targetX = null; player.targetY = null; player.actionTarget = null; toast('You fainted! Lost '+lost+'🪙'); }
        }
      } else {
        mon.moveTimer -= dt;
        if(mon.moveTimer<=0){ mon.moveTimer = 2000+Math.random()*2000; mon.wanderTarget = {x:mon.x+(Math.random()-0.5)*80, y:mon.y+(Math.random()-0.5)*80}; }
        const mdx = mon.wanderTarget.x-mon.x, mdy = mon.wanderTarget.y-mon.y;
        const md = Math.sqrt(mdx*mdx+mdy*mdy);
        if(md>2){ mon.x += mdx/md*0.25; mon.y += mdy/md*0.25; mon.dir = mdx>0?1:-1; }
      }
      mon.frameTimer += dt;
      if(mon.frameTimer>300){ mon.frameTimer = 0; mon.frame = (mon.frame+1)%2; }
    }
  }

  const t2 = Game.time;
  let dn = 0;
  if(t2 < 6*60) dn = 0.65;
  else if(t2 < 8*60) dn = 0.65 * (1 - (t2-6*60)/120);
  else if(t2 < 18*60) dn = 0;
  else if(t2 < 21*60) dn = 0.65 * ((t2-18*60)/180);
  else dn = 0.65;
  if(Game.map==='mine') dn = 0.75;
  if(Game.map==='farmhouse' || Game.map.indexOf('interior')>=0) dn = 0;
  Game.dayNight = dn;

  checkMapTransition();
}
function collidesNPCAt(x, y, self){
  for(const n of NPC_DATA){
    if(n === self || n.loc !== Game.map) continue;
    if(Math.abs(n.x - x) < 14 && Math.abs(n.y - y) < 14) return true;
  }
  return false;
}

// ============================================================
// COLLISION
// ============================================================
function collidesTilesOnly(x,y){
  const hbX = x+4, hbY = y+16, hbW = 16, hbH = 14;
  for(const [cx,cy] of [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]]){
    const t2 = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t2)) return true;
  }
  return false;
}
function collides(x,y){
  const hbX = x+4, hbY = y+16, hbW = 16, hbH = 14;
  for(const [cx,cy] of [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]]){
    const t2 = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t2)) return true;
  }
  const m = currentMap();
  if(m.objects) for(const o of m.objects){
    if(!o.solid) continue;
    let ox, oy, ow, oh;
    if(o.type==='tree' || o.type==='pine'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-18; ow = TILE-4; oh = 18; }
    else if(o.type==='rock_s'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='rock_m'){ ox = o.tx*TILE-2; oy = (o.ty+1)*TILE-11; ow = TILE+4; oh = 11; }
    else if(o.type==='rock_l'){ ox = o.tx*TILE-4; oy = (o.ty+1)*TILE-12; ow = TILE+8; oh = 12; }
    else if(o.type==='barrel' || o.type==='signpost'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='bed' || o.type==='bed_canopy'){ ox = o.tx*TILE; oy = o.ty*TILE+TILE; ow = TILE*2; oh = TILE*2; }
    else if(o.type==='table' || o.type==='desk_fancy' || o.type==='workbench'){ ox = o.tx*TILE; oy = o.ty*TILE+TILE/2; ow = TILE*2; oh = TILE*1.5; }
    else if(o.type==='chest' || o.type==='bookshelf' || o.type==='furnace' || o.type==='medicine_cabinet' || o.type==='fridge' || o.type==='kitchen_stove' || o.type==='armor_stand' || o.type==='easel' || o.type==='mine_cart' || o.type==='hay_bale'){ ox = o.tx*TILE; oy = o.ty*TILE; ow = TILE*2; oh = TILE*2; }
    else if(o.type==='crop' || o.type==='crop_withered' || o.type==='flower_r' || o.type==='flower_y' || o.type==='flower_b' || o.type==='flower_w'
         || o.type==='mushroom' || o.type==='bush' || o.type==='rock_small' || o.type==='wood_stump'
         || o.type==='bench' || o.type==='lamp_post' || o.type==='plant' || o.type==='portrait'
         || o.type==='books_pile' || o.type==='radio' || o.type==='television' || o.type==='picture_frame'
         || o.type==='flower_vase' || o.type==='potted_herbs' || o.type==='rug_oval' || o.type==='wood_stool'
         || o.type==='shelf_wall' || o.type==='wall_clock' || o.type==='plant_fern' || o.type==='lantern_hang'
         || o.type==='sculpture' || o.type==='trophy' || o.type==='specimen_jar' || o.type==='mirror'
         || o.type==='market_crate' || o.type==='milk_can' || o.type==='neon_sign' || o.type==='camera_tripod'
         || o.type==='chair' || o.type==='cauldron' || o.type==='telescope' || o.type==='cave_entrance' || o.type==='altar'
         || o.type==='sprinkler' || o.type==='pet_bowl') continue;
    else { ox = o.tx*TILE; oy = o.ty*TILE; ow = TILE*2; oh = TILE*2; }
    if(hbX<ox+ow && hbX+hbW>ox && hbY<oy+oh && hbY+hbH>oy) return true;
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(hbX<n.x-8+16 && hbX+hbW>n.x-8 && hbY<n.y-16+16 && hbY+hbH>n.y-16) return true;
  }
  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(Game.onHorse && a.mounted) continue;
      if(hbX<a.x-8+16 && hbX+hbW>a.x-8 && hbY<a.y-14+14 && hbY+hbH>a.y-14) return true;
    }
    if(Game.hasGreenhouse){
      const gx = World.farm.greenhousePos.x*TILE, gy = World.farm.greenhousePos.y*TILE;
      if(hbX<gx+144 && hbX+hbW>gx && hbY<gy+112 && hbY+hbH>gy+40) return true;
    }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const bx = b.x*TILE+4, by = b.y*TILE+40, bw = b.w*TILE-8, bh = b.h*TILE-40;
      if(hbX<bx+bw && hbX+hbW>bx && hbY<by+bh && hbY+hbH>by){
        if(b.door){ const dx = b.door.x*TILE+2, dw = TILE-4; if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>by+bh-TILE*1.5) return false; }
        return true;
      }
    }
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    const hL = ha.x*TILE+4, hT = ha.y*TILE+50, hW = ha.w*TILE-8, hH = ha.h*TILE-50;
    const dX = World.farm.houseDoor.x*TILE+2, dW = TILE-4;
    if(hbX<hL+hW && hbX+hbW>hL && hbY<hT+hH && hbY+hbH>hT){
      if(hbX+hbW>dX && hbX<dX+dW && hbY+hbH>hT+hH-TILE*1.5) return false;
      return true;
    }
    const sp = World.farm.shopPos;
    const sL = sp.x*TILE, sT = sp.y*TILE+40, sW = 6*TILE, sH = 6*TILE-40;
    const sd = World.farm.shopDoor;
    if(hbX<sL+sW && hbX+hbW>sL && hbY<sT+sH && hbY+hbH>sT){
      const dx = sd.x*TILE+2, dw = TILE-4;
      if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>sT+sH-TILE*1.5) return false;
      return true;
    }
    const st = World.farm.stablePos;
    if(hbX<st.x*TILE+112 && hbX+hbW>st.x*TILE && hbY<st.y*TILE+80 && hbY+hbH>st.y*TILE+30) return true;
    const cp = World.farm.carpenterPos;
    if(hbX<cp.x*TILE+128 && hbX+hbW>cp.x*TILE && hbY<cp.y*TILE+112 && hbY+hbH>cp.y*TILE+50) return true;
  }
  return false;
}

function buildStaticLayer(){
  const m = currentMap();
  if(!m || !m.tiles || !m.w) return;
  const key = Game.map + '_' + Game.season + '_' + m.w + 'x' + m.h;
  if(staticLayerKey === key && staticLayer) return;
  staticLayerKey = key;
  try{
    const c = document.createElement('canvas');
    c.width = m.w*TILE;
    c.height = m.h*TILE;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){
      const t2 = m.tiles[y][x];
      const dx = x*TILE, dy = y*TILE;
      const s = Game.season;
      if(t2===0){ const v = (x ^ y) & 3; g.drawImage(S['t_grass_'+s+'_'+v], dx, dy); continue; }
      const mapKey = t2===1?'t_dirt':t2===2?null:t2===3?'t_till':t2===4?'t_till_wet':t2===5?'t_floor':t2===6?'t_wall':t2===7?'t_sand':t2===9?'t_rock':t2===10?'t_cave':t2===11?'t_copper':t2===12?'t_iron':t2===13?'t_gold':t2===14?'t_iri':t2===20?'t_indoor_floor':t2===21?'t_indoor_wall':t2===22?'t_rug':t2===23?'t_snow_ground':null;
      if(t2===2){ g.drawImage(S['t_water_'+waterFrame], dx, dy); }
      else if(t2===8){ g.drawImage(S['t_deep_'+waterFrame], dx, dy); }
      else if(mapKey && S[mapKey]){ g.drawImage(S[mapKey], dx, dy); }
    }
    staticLayer = c;
  }catch(e){ staticLayer = null; }
}

  else if(o.type==='table'){ key='table'; w=40; h=28; }
  else if(o.type==='desk_fancy'){ key='desk_fancy'; w=40; h=26; }
  else if(o.type==='chest'){ key='chest'; w=24; h=20; }
  else if(o.type==='bookshelf'){ key='bookshelf'; w=28; h=44; }
  else if(o.type==='plant'){ key='plant'; w=20; h=28; }
  else if(o.type==='lamp_post'){ key='lamp_post'; w=10; h=24; }
  else if(o.type==='workbench'){ key='workbench'; w=40; h=24; }
  else if(o.type==='furnace'){ key='furnace'; w=32; h=32; }
  else if(o.type==='sprinkler'){ key='i_sprinkler'; w=16; h=16; }
  else if(o.type==='flower_r'||o.type==='flower_y'||o.type==='flower_b'||o.type==='flower_w'||o.type==='mushroom'){ key=o.type; w=8; h=10; }
  else if(S[o.type]){ key=o.type; w=S[o.type].width; h=S[o.type].height; }
  if(!key || !S[key]) return;
  const dx = Math.round(o.x - w/2);
  const dy = Math.round(o.y - h);
  ctx.drawImage(S[key], dx, dy);
  if(o.hp!==undefined && o.maxHp!==undefined && o.hp<o.maxHp){
    const bw = 20, bx = Math.round(o.x-bw/2), by = dy-6;
    ctx.fillStyle = '#000'; ctx.fillRect(bx,by,bw,3);

  }
}

function drawWorld(){

  let skyTop = '#7ec4e8', skyBot = '#c8e0f0';

    const tp = dn / 0.65;
    skyTop = 'rgb('+Math.round(126*(1-tp)+20*tp)+','+Math.round(196*(1-tp)+20*tp)+','+Math.round(232*(1-tp)+50*tp)+')';
    skyBot = 'rgb('+Math.round(200*(1-tp)+15*tp)+','+Math.round(220*(1-tp)+15*tp)+','+Math.round(240*(1-tp)+30*tp)+')';
  }
  const grad = ctx.createLinearGradient(0,0,0,LH);
  grad.addColorStop(0, skyTop); grad.addColorStop(0.7, skyBot); grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad; ctx.fillRect(0,0,LW,LH);

  // Sky
  if(Game.map!=='mine' && Game.map!=='farmhouse' && Game.map.indexOf('interior')<0){
    const dayT = (Game.time - 6*60) / (20*60);
    const sunAngle = Math.PI * Math.max(0, Math.min(1, dayT));
    const sunX = LW * (0.1 + 0.8 * (1 - Math.cos(sunAngle))/2);
    const sunY = LH * 0.55 - Math.sin(sunAngle) * LH * 0.4;
    const isNight = Game.time >= 20*60 || Game.time < 6*60;
    if(dn > 0.4){
      for(let i=0;i<60;i++){
        const sx = ((i*137+12345) % 997) / 997 * LW;
        const sy = ((i*73+12345) % 397) / 397 * LH * 0.6;
        const twinkle = 0.5 + 0.5*Math.sin(performance.now()/800 + i);
        ctx.fillStyle = 'rgba(255,255,255,' + (dn * 0.7 * twinkle) + ')';
        ctx.fillRect(sx, sy, 1, 1);
      }
      if(isNight){
        ctx.fillStyle = '#e8e8f0'; ctx.beginPath(); ctx.arc(sunX, sunY, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#c8c8d0'; ctx.beginPath(); ctx.arc(sunX-2, sunY-2, 2, 0, Math.PI*2); ctx.fill();
      }
    }
    if(!isNight){ ctx.fillStyle = '#fff0a0'; ctx.beginPath(); ctx.arc(sunX, sunY, 12, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = 'rgba(255,240,160,0.3)'; ctx.beginPath(); ctx.arc(sunX, sunY, 18, 0, Math.PI*2); ctx.fill(); }
    const cloudTime = performance.now()/30000;
    for(let i=0;i<5;i++){
      const cx = ((i*250 + cloudTime*30) % (LW+200)) - 100;
      const cy = 30 + (i%3)*20;
      const alpha = 0.5 + (1-dn)*0.3;
      ctx.fillStyle = 'rgba(255,255,255,'+alpha+')';
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.arc(cx+12, cy+2, 12, 0, Math.PI*2); ctx.arc(cx-12, cy+2, 10, 0, Math.PI*2); ctx.fill();
    }
    for(const b of Game.birds){
      const bx = b.x - camera.x, by = b.y - camera.y;
      if(bx < -30 || bx > LW+30) continue;
      const wingUp = Math.sin(performance.now()/150 + b.phase) > 0;
      ctx.fillStyle = '#3a3a4a';
      if(wingUp){ ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx-4, by-2); ctx.lineTo(bx+2, by+1); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx+4, by-2); ctx.lineTo(bx-2, by+1); ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx-4, by+2); ctx.lineTo(bx+2, by-1); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx+4, by+2); ctx.lineTo(bx-2, by-1); ctx.closePath(); ctx.fill(); }
    }
  }
  if(Game.map==='mine'){
    // Underground bg
    ctx.fillStyle = '#2a2028';
    ctx.fillRect(0, 0, LW, LH);
  }

  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  const m = currentMap();
  if(!m.tiles || !m.tiles.length){ ctx.restore(); return; }
  const startX = Math.max(0, Math.floor(camera.x/TILE));
  const endX = Math.min(m.w-1, Math.ceil((camera.x+LW)/TILE));
  const startY = Math.max(0, Math.floor(camera.y/TILE));
  const endY = Math.min(m.h-1, Math.ceil((camera.y+LH)/TILE));

  // Draw from static layer if available
  buildStaticLayer();
  if(staticLayer){
    ctx.drawImage(staticLayer, 0, 0);
  } else {
    for(let y=startY;y<=endY;y++) for(let x=startX;x<=endX;x++){
      const t2 = m.tiles[y][x];
      const s = Game.season;
      if(t2===0){ const v = (x ^ y) & 3; ctx.drawImage(S['t_grass_'+s+'_'+v], x*TILE, y*TILE); continue; }
      const key = t2===1?'t_dirt':t2===2?'t_water_'+waterFrame:t2===3?'t_till':t2===4?'t_till_wet':t2===5?'t_floor':t2===6?'t_wall':t2===7?'t_sand':t2===8?'t_deep_'+waterFrame:t2===9?'t_rock':t2===10?'t_cave':t2===11?'t_copper':t2===12?'t_iron':t2===13?'t_gold':t2===14?'t_iri':t2===20?'t_indoor_floor':t2===21?'t_indoor_wall':t2===22?'t_rug':t2===23?'t_snow_ground':null;
      if(key && S[key]) ctx.drawImage(S[key], x*TILE, y*TILE);
    }
  }

  // Snow overlay
  if(Game.weather==='snow' && Game.map!=='mine' && Game.map.indexOf('interior')<0 && Game.map!=='farmhouse'){
    ctx.fillStyle = 'rgba(240,245,250,0.35)';
    for(let y=startY;y<=endY;y++) for(let x=startX;x<=endX;x++){
      const t2 = m.tiles[y][x];
      if(t2 !== T_WATER && t2 !== T_DEEP && t2 !== T_SAND && t2 !== T_IND_FLOOR && t2 !== T_IND_WALL){ ctx.fillRect(x*TILE, y*TILE, TILE, TILE); }
    }
  }
  // Footprints
  if(Game.weather === 'snow'){
    for(const fp of Game.footprints){ ctx.drawImage(S['footprint'], fp.tx*TILE+5, fp.ty*TILE+5); }
  }

  if(Game.map==='mine'){
    if(m.stairsUp) ctx.drawImage(S['stairs_up'], m.stairsUp.x*TILE, m.stairsUp.y*TILE);
    if(m.ladder) ctx.drawImage(S['ladder_down'], m.ladder.x*TILE, m.ladder.y*TILE);
    if(m.elevator) ctx.drawImage(S['elevator'], m.elevator.x*TILE-2, m.elevator.y*TILE-8);
    if(m.altar) ctx.drawImage(S['altar'], m.altar.x*TILE-8, m.altar.y*TILE-24);
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    ctx.drawImage(S['house'], ha.x*TILE, ha.y*TILE);
    const sp = World.farm.shopPos;
    ctx.drawImage(S['shop'], sp.x*TILE, sp.y*TILE);
    const st = World.farm.stablePos;
    ctx.drawImage(S['stable'], st.x*TILE, st.y*TILE);
    const cp = World.farm.carpenterPos;
    ctx.drawImage(S['carpenter'], cp.x*TILE, cp.y*TILE);
    if(Game.hasGreenhouse){
      ctx.drawImage(S['greenhouse'], World.farm.greenhousePos.x*TILE, World.farm.greenhousePos.y*TILE);
    }
    for(const bb of Game.builtBuildings){ const s = S[bb.type] || S['cabin']; if(s) ctx.drawImage(s, bb.x*TILE, bb.y*TILE); }
    const hd = World.farm.houseDoor;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(hd.x*TILE+3, hd.y*TILE-6, TILE-6, 8);
    ctx.fillStyle = '#e8c060'; ctx.fillRect(hd.x*TILE+6, hd.y*TILE-4, 4, 6);
    const sd = World.farm.shopDoor;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sd.x*TILE+3, sd.y*TILE-6, TILE-6, 8);
    ctx.fillStyle = '#e8c060'; ctx.fillRect(sd.x*TILE+6, sd.y*TILE-4, 4, 6);
    // Shipping bin
    ctx.fillStyle = '#7a4a2a'; ctx.fillRect(28*TILE+2, 26*TILE+4, 12, 12);
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(28*TILE+2, 26*TILE+4, 12, 2);
    ctx.fillStyle = '#c8a040'; ctx.fillRect(28*TILE+5, 26*TILE+8, 6, 2);
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const sp = S[b.type]; if(sp) ctx.drawImage(sp, b.x*TILE, b.y*TILE);
      if(b.door){ ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(b.door.x*TILE+3, b.door.y*TILE-6, TILE-6, 8); ctx.fillStyle = '#e8c060'; ctx.fillRect(b.door.x*TILE+6, b.door.y*TILE-4, 4, 6); }
    }
  }
  if(Game.map==='museum_interior'){
    let idx = 0;
    for(const item of MUSEUM_ITEMS){
      const col = idx % 10, row = Math.floor(idx / 10);
      const px = (2+col)*TILE, py = (2+row*3)*TILE;
      ctx.drawImage(S['museum_pedestal'], px, py);
      if(Game.museumDonations[item.id]){ ctx.fillStyle = '#e8c060'; ctx.beginPath(); ctx.arc(px+12, py+8, 5, 0, Math.PI*2); ctx.fill(); }
      idx++;
    }
  }
  if(Game.map==='house_interior' && Game.houseOwner){
    const b = World.town.buildings.find(x=>x.name === Game.houseOwner);
    if(b && b.residents){
      const isEvening = Game.time >= 18*60 || Game.time < 8*60;
      if(isEvening){
        const positions = [[3,5],[6,5],[9,5],[3,3],[6,3],[9,3]];
        let i = 0;
        for(const id of b.residents){ const npc = NPC_DATA.find(n=>n.id===id); if(!npc) continue; const idx = NPC_DATA.indexOf(npc); const sp = S['npc'+idx+'_d']; const pos = positions[i] || [3,5]; if(sp) ctx.drawImage(sp, pos[0]*TILE, pos[1]*TILE); i++; }
      }
    }
  }

  if(player.targetX!==null && !Game.dialogue){
    const tp = performance.now()/400;
    const pulse = 0.6+0.4*Math.sin(tp*Math.PI*2);
    ctx.strokeStyle = 'rgba(255,220,80,'+(0.5+pulse*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.targetX, player.targetY, 4+pulse*2, 0, Math.PI*2); ctx.stroke();
  }

  const items = [];
  const camL = camera.x - 64, camR = camera.x + LW + 64;
  const camT = camera.y - 100, camB = camera.y + LH + 64;
  if(m.objects) for(const o of m.objects){
    if(o.x < camL || o.x > camR || o.y < camT || o.y > camB) continue;
    items.push({y:o.sortY||o.y, draw:()=>drawObject(o)});
  }
  if(Game.map==='farm') for(const a of World.farm.animals){
    if(a.mounted) continue;
    if(a.x < camL || a.x > camR || a.y < camT || a.y > camB) continue;
    items.push({y:a.y, draw:()=>drawAnimal(a)});
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(n.x < camL || n.x > camR || n.y < camT || n.y > camB) continue;
    items.push({y:n.y, draw:()=>drawNPC(n)});
  }
  if(Game.map==='mine') for(const mon of Game.monsters){
    if(mon.x < camL || mon.x > camR || mon.y < camT || mon.y > camB) continue;
    items.push({y:mon.y, draw:()=>drawMonster(mon)});
  }
  // Ambient smoke (behind)
  for(const p of Game.ambient){
    if(p.type === 'smoke'){
      const a = p.life / p.max;
      ctx.globalAlpha = a * 0.4;
      ctx.fillStyle = '#a8a8a8';
      const size = p.size + (1-a)*4;
      ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if(Game.hasPet && Game.pet) items.push({y:Game.pet.y, draw:drawPet});
  items.push({y:player.y+32, draw:drawPlayer});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items) it.draw();

  // Foreground ambient
  for(const p of Game.ambient){
    if(p.type === 'butterfly'){
      const bob = Math.sin(p.phase)*1.5;
      const wPh = Math.sin(performance.now()/100 + p.phase);
      ctx.fillStyle = p.color;
      const wx = Math.abs(wPh)*2.5;
      ctx.beginPath(); ctx.ellipse(p.x-2, p.y+bob, wx, 2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.x+2, p.y+bob, wx, 2, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(p.x-0.5, p.y+bob-1.5, 1, 3);
    } else if(p.type === 'firefly'){
      const pulse = 0.5 + 0.5*Math.sin(performance.now()/300 + p.phase);
      ctx.fillStyle = 'rgba(255,240,100,'+(0.3*pulse)+')'; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,100,'+pulse+')'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
    } else if(p.type === 'leaf'){
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.phase*0.5);
      ctx.fillRect(-2, -1, 4, 2); ctx.restore();
    }
  }

  if(Game.fishing){
    const px = player.x+12, py = player.y+16;
    let fx = px, fy = py;
    if(player.dir==='d') fy += TILE*2; else if(player.dir==='u') fy -= TILE*2;
    else if(player.dir==='l') fx -= TILE*2; else fx += TILE*2;
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px+6, py-6); ctx.lineTo(fx, fy); ctx.stroke();
    const bob = Math.sin(performance.now()/200)*1.5;
    ctx.drawImage(S['bobber'], fx-3, fy-3+bob);
    if(Game.fishing.phase === 'bite'){
      const pulse = 0.7+0.3*Math.sin(performance.now()/100);
      ctx.fillStyle = 'rgba(255,60,60,'+pulse+')';
      ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
      ctx.fillText('!', fx, fy-12); ctx.textAlign = 'left';
    }
  }
  if(Game.particles) for(const p of Game.particles){
    ctx.globalAlpha = p.life/p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-1, p.y-1, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if(dn>0 && Game.map!=='farmhouse' && Game.map.indexOf('interior')<0){ ctx.fillStyle = 'rgba(10,10,30,'+(dn*0.5)+')'; ctx.fillRect(0,0,LW,LH); }

  // Lamp glow
  if(dn > 0.35 && Game.map.indexOf('interior')<0 && Game.map !== 'mine'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
    if(m.objects) for(const o of m.objects){
      if(o.type !== 'lamp_post') continue;
      if(o.x < camera.x-100 || o.x > camera.x+LW+100) continue;
      const cx = o.x, cy = o.y - 8;
      const r = 70;
      const lg = ctx.createRadialGradient(cx, cy, 4, cx, cy, r);
      lg.addColorStop(0, 'rgba(255,240,150,' + (dn * 0.55) + ')');
      lg.addColorStop(0.5, 'rgba(255,220,100,' + (dn * 0.2) + ')');
      lg.addColorStop(1, 'rgba(255,220,100,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(cx-r, cy-r, r*2, r*2);
    }
    if(Game.map === 'farm'){
      const ha = World.farm.houseArea;
      const cx = (ha.x + ha.w/2)*TILE, cy = (ha.y + ha.h/2)*TILE - 20;
      const r = 90;
      const lg = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
      lg.addColorStop(0, 'rgba(255,180,80,' + (dn * 0.35) + ')');
      lg.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(cx-r, cy-r, r*2, r*2);
    }
    ctx.restore();
  }

  if(flashTimer > 0){ const a = flashTimer / 180; ctx.fillStyle = 'rgba(255,255,255,'+(a*0.55)+')'; ctx.fillRect(0,0,LW,LH); }

  // Weather
  if(Game.weather==='rain' || Game.weather==='storm'){
    if(Game.map.indexOf('interior')<0 && Game.map!=='mine'){
      ctx.fillStyle = Game.weather==='storm' ? 'rgba(40,40,60,0.25)' : 'rgba(80,80,120,0.15)';
      ctx.fillRect(0,0,LW,LH);
      for(let i=0;i<50;i++){
        const rx = (i*53+performance.now()*0.3)%LW;
        const ry = (i*37+performance.now()*0.6)%LH;
        ctx.fillStyle = 'rgba(180,200,255,0.5)';
        ctx.fillRect(rx, ry, 1, 4);
      }
    }
  }
  if(Game.weather==='snow'){
    ctx.fillStyle = 'rgba(220,230,240,0.15)'; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<40;i++){
      const rx = (i*53+performance.now()*0.05)%LW;
      const ry = (i*37+performance.now()*0.15)%LH;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(rx, ry, 2, 2);
    }
  }
  if(Game.weather==='fog'){ ctx.fillStyle = 'rgba(220,220,230,0.25)'; ctx.fillRect(0,0,LW,LH); }
  // Weather tint
  if(Game.map.indexOf('interior')<0 && Game.map !== 'mine'){
    if(Game.weather === 'rain'){ ctx.fillStyle = 'rgba(100,140,180,0.08)'; ctx.fillRect(0,0,LW,LH); }
    else if(Game.weather === 'storm'){ ctx.fillStyle = 'rgba(60,70,100,0.15)'; ctx.fillRect(0,0,LW,LH); }
    else if(Game.weather === 'snow'){ ctx.fillStyle = 'rgba(180,200,220,0.08)'; ctx.fillRect(0,0,LW,LH); }
  }
  const vg = ctx.createRadialGradient(LW/2,LH/2,LH*0.4,LW/2,LH/2,LH*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,LW,LH);
}

  ctx.fillStyle = '#e8c060'; ctx.fillText(locNames[Game.map]||Game.map, 10, 65);
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,74,80,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,74.5,79,15);
  const wi = {sunny:'☀️', rain:'🌧', storm:'⛈', snow:'❄️', fog:'🌫'}[Game.weather];
  const nwi = {sunny:'☀️', rain:'🌧', storm:'⛈', snow:'❄️', fog:'🌫'}[Game.nextWeather||'sunny'];
  ctx.fillStyle = '#e8c060'; ctx.fillText(wi+' → '+nwi, 10, 85);

  // Shipping badge
  let shipCount = 0, shipValue = 0;
  for(const k in Game.shipping){ shipCount += Game.shipping[k]||0; shipValue += (Game.shipping[k]||0)*8; }
  if(shipCount > 0){
    ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,94,120,16);
    ctx.strokeStyle = '#8ac04a'; ctx.strokeRect(6.5,94.5,119,15);
    ctx.fillStyle = '#8ac04a'; ctx.fillText('📤 '+shipCount+' ('+shipValue+'🪙)', 10, 105);
  }

  // Skills mini
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,LH-46,110,18);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,LH-45.5,109,17);
  ctx.fillStyle = '#e8c060'; ctx.fillText('🌾'+Game.skills.farming+' ⛏'+Game.skills.mining+' 🎣'+Game.skills.fishing+' ⚔'+Game.skills.combat, 10, LH-33);

  // Right side stats
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,6,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,6.5,117,15);
  const hP = Game.hp/Game.maxHp;
  ctx.fillStyle = '#3a1010'; ctx.fillRect(LW-121,9,112,10);
  ctx.fillStyle = '#d04040'; ctx.fillRect(LW-121,9,112*hP,10);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
  ctx.fillText('❤ '+Math.round(Game.hp), LW-117, 18);
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,26,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,26.5,117,15);
  const eP = Game.energy/Game.maxEnergy;
  ctx.fillStyle = '#3a2a10'; ctx.fillRect(LW-121,29,112,10);
  ctx.fillStyle = eP>0.5 ? '#6ac04a' : eP>0.25 ? '#e0c040' : '#c04040';
  ctx.fillRect(LW-121,29,112*eP,10);
  ctx.fillStyle = '#fff'; ctx.fillText('⚡ '+Math.round(Game.energy), LW-117, 38);
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,46,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,46.5,117,15);
  ctx.fillStyle = '#e8c060'; ctx.fillText('⚔ '+WEAPONS[Game.weaponLevel].name, LW-121, 57);

  // HUD buttons
  const btns = getHUDButtons();
  for(const b of btns){
    ctx.fillStyle = 'rgba(60,40,20,0.9)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#c8a060'; ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
    ctx.fillStyle = '#ffe8b0'; ctx.font = 'bold 11px monospace';
    const label = {inv:'📦',craft:'⚒',map:'🗺',menu:'☰',atk:'⚔'}[b.id];
    ctx.fillText(label, b.x+13, b.y+13);
  }

  // Hotbar
  const hbW = 7*24+4;
  const hbX = (LW-hbW)/2;
  const hbY = LH-32;
  ctx.fillStyle = 'rgba(20,15,10,0.9)'; ctx.fillRect(hbX, hbY, hbW, 28);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2;
  ctx.strokeRect(hbX+1, hbY+1, hbW-2, 26); ctx.lineWidth = 1;
  for(let i=0;i<7;i++){
    const x = hbX+2+i*24, y = hbY+2;
    ctx.fillStyle = i===Game.selected ? 'rgba(232,192,96,0.35)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(x, y, 20, 20);
    if(i===Game.selected){ ctx.strokeStyle = '#e8c060'; ctx.lineWidth = 2; ctx.strokeRect(x,y,20,20); ctx.lineWidth = 1; }
    if(S['i_'+Game.hotbar[i]]) ctx.drawImage(S['i_'+Game.hotbar[i]], x+2, y+2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 7px monospace';
    ctx.fillText(String(i+1), x+1, y+8);
  }
  ctx.font = 'bold 9px monospace';
  const tn = toolName(Game.hotbar[Game.selected])+' ('+TOOL_LEVELS[Game.toolLevels[Game.hotbar[Game.selected]]||0].name+')';
  const tw = measureCached(tn, 'bold 9px monospace')+12;
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(hbX, hbY-14, tw, 12);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(hbX+0.5, hbY-13.5, tw-1, 11);
  ctx.fillStyle = '#e8c060'; ctx.fillText(tn, hbX+6, hbY-5);

  // Radar
  if(!isPortrait){
    const rx = LW-70, ry = LH-96, rs = 64;
    ctx.fillStyle = 'rgba(20,15,10,0.85)';
    ctx.fillRect(rx, ry, rs, rs);
    ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(rx+0.5, ry+0.5, rs-1, rs-1);
    drawRadar(rx+2, ry+2, rs-4);
  }
}

function drawRadar(x, y, size){
  const m = currentMap();
  if(!m.tiles) return;
  const mapW = m.w, mapH = m.h;
  const px = player.x/TILE, py = player.y/TILE;
  const viewTiles = 40;
  const ox = px - viewTiles/2, oy = py - viewTiles/2;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, size, size); ctx.clip();
  for(let ty=0;ty<viewTiles;ty++){
    for(let tx=0;tx<viewTiles;tx++){
      const mx = Math.floor(ox+tx), my = Math.floor(oy+ty);
      if(mx<0||my<0||mx>=mapW||my>=mapH) continue;
      const t2 = m.tiles[my][mx];
      let color = '#3a5a2a';
      if(t2===T_PATH||t2===T_FLOOR) color = '#8a6a3a';
      else if(t2===T_WATER||t2===T_DEEP) color = '#3a6ac0';
      else if(t2===T_SAND) color = '#e8d0a0';
      else if(t2===T_ROCK||t2===T_CU||t2===T_IR||t2===T_GO||t2===T_IRID) color = '#4a4a50';
      else if(t2===T_CAVE) color = '#5a5550';
      else if(t2===T_IND_FLOOR) color = '#b88858';
      else if(t2===T_IND_WALL) color = '#5a3a20';
      else if(t2===T_SNOW) color = '#eef4fa';
      ctx.fillStyle = color;
      ctx.fillRect(x + tx*(size/viewTiles), y + ty*(size/viewTiles), size/viewTiles+1, size/viewTiles+1);
    }
  }
  for(const n of NPC_DATA){
    if(n.loc !== Game.map) continue;
    const nx = (n.x/TILE - ox) * (size/viewTiles);
    const ny = (n.y/TILE - oy) * (size/viewTiles);
    if(nx<0||ny<0||nx>size||ny>size) continue;
    ctx.fillStyle = '#ff6080'; ctx.fillRect(x+nx-1, y+ny-1, 2, 2);
  }
  ctx.fillStyle = '#ffe8b0'; ctx.fillRect(x+size/2-1, y+size/2-1, 2, 2);
  ctx.restore();
}

// ============================================================
// LIVE MAP
// ============================================================
function drawLiveMap(canvas){
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  const m = currentMap(); if(!m.tiles || !m.tiles.length) return;
  const mapW = m.w, mapH = m.h;
  const cell = Math.floor(Math.min(canvas.width/mapW, canvas.height/mapH));
  const offsetX = (canvas.width - mapW*cell) / 2;
  const offsetY = (canvas.height - mapH*cell) / 2;
  g.fillStyle = '#0a1a0a'; g.fillRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<mapH;y++) for(let x=0;x<mapW;x++){
    const t2 = m.tiles[y][x];
    let color = '#3a5a2a';
    if(t2===T_PATH||t2===T_FLOOR) color = '#8a6a3a';
    else if(t2===T_WATER||t2===T_DEEP) color = '#3a6ac0';
    else if(t2===T_SAND) color = '#e8d0a0';
    else if(t2===T_ROCK||t2===T_CU||t2===T_IR||t2===T_GO||t2===T_IRID) color = '#4a4a50';
    else if(t2===T_CAVE) color = '#5a5550';
    else if(t2===T_TILL||t2===T_TILL_WET) color = '#6a4a2a';
    else if(t2===T_IND_FLOOR) color = '#b88858';
    else if(t2===T_IND_WALL) color = '#5a3a20';
    else if(t2===T_SNOW) color = '#eef4fa';
    g.fillStyle = color;
    g.fillRect(offsetX+x*cell, offsetY+y*cell, cell, cell);
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      g.fillStyle = 'rgba(200,80,60,0.85)';
      g.fillRect(offsetX+b.x*cell, offsetY+b.y*cell, b.w*cell, b.h*cell);
    }
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    g.fillStyle = 'rgba(200,80,60,0.85)'; g.fillRect(offsetX+ha.x*cell, offsetY+ha.y*cell, ha.w*cell, ha.h*cell);
    const sp = World.farm.shopPos;
    g.fillStyle = 'rgba(80,160,80,0.85)'; g.fillRect(offsetX+sp.x*cell, offsetY+sp.y*cell, 6*cell, 6*cell);
    const st = World.farm.stablePos;
    g.fillStyle = 'rgba(160,100,60,0.85)'; g.fillRect(offsetX+st.x*cell, offsetY+st.y*cell, 6*cell, 5*cell);
    const cp = World.farm.carpenterPos;
    g.fillStyle = 'rgba(120,80,40,0.85)'; g.fillRect(offsetX+cp.x*cell, offsetY+cp.y*cell, 8*cell, 7*cell);
    const cc = World.farm.cavePos;
    g.fillStyle = '#1a0a0a'; g.fillRect(offsetX+(cc.x-1)*cell, offsetY+(cc.y-1)*cell, 3*cell, 3*cell);
    if(Game.hasGreenhouse){
      const gp = World.farm.greenhousePos;
      g.fillStyle = 'rgba(100,180,200,0.85)'; g.fillRect(offsetX+gp.x*cell, offsetY+gp.y*cell, 9*cell, 7*cell);
    }
  }
  for(const n of NPC_DATA){
    if(n.loc !== Game.map) continue;
    const nx = offsetX + (n.x/TILE)*cell, ny = offsetY + (n.y/TILE)*cell;
    g.fillStyle = '#ff6080'; g.beginPath(); g.arc(nx, ny, Math.max(4, cell*0.5), 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 9px monospace'; g.fillText(n.name, nx+8, ny+3);
  }
  const px = offsetX + (player.x/TILE)*cell, py = offsetY + (player.y/TILE)*cell;
  const pulse = 0.6 + 0.4*Math.sin(performance.now()/300);
  g.fillStyle = 'rgba(255,255,255,'+pulse+')'; g.beginPath(); g.arc(px, py, Math.max(6, cell*0.7), 0, Math.PI*2); g.fill();
  g.fillStyle = '#ffe8b0'; g.beginPath(); g.arc(px, py, Math.max(3, cell*0.35), 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect(4, 4, 220, 22);
  g.fillStyle = '#e8c060'; g.font = 'bold 13px monospace';
  g.fillText(t(Game.map)+' — you are here', 10, 19);
}

// ============================================================
// MAIN LOOP
// ============================================================
function loop(now){
  let dt = now-lastTime; lastTime = now;
  if(dt>100) dt = 100; if(dt<0) dt = 0;
  if(flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
  try{
    update(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    drawWorld();
    if(!Game.paused && !Game.menuOpen && !Game.dialogue && !$('elevatorMenu').classList.contains('show') && !CharEdit.mode && !$('confirmModal').classList.contains('show')) drawHUD();
    if(FishMinigame.active) FishMinigame.draw();
  }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

// ============================================================
// INIT
// ============================================================
function renderLangSelect(){
  const g = $('langGrid'); if(!g) return;
  g.innerHTML = '';
  for(const l of LANGS){
    const btn = document.createElement('button');
    btn.className = 'lang-btn';
    btn.innerHTML = '<span style="font-size:24px">'+l.flag+'</span><span>'+l.name+'</span>';
    btn.onclick = ()=>{
      localStorage.setItem('pixelfarm_lang', l.code);
      LANG = l.code;
      Snd.init(); Snd.resume(); Snd.play('click');
      applyLanguage(); showMainMenu();
    };
    g.appendChild(btn);
  }
}
function applyLanguage(){
  if($('btnNew')) $('btnNew').textContent = t('newGame');
  if($('btnContinue')) $('btnContinue').textContent = t('cont');
  if($('btnHelp')) $('btnHelp').textContent = t('controls');
  if($('helpBody')) $('helpBody').innerHTML = t('helpText');
  if($('btnHelpBack')) $('btnHelpBack').textContent = t('back');
  if($('btnMenuResume')) $('btnMenuResume').textContent = t('resume');
  if($('btnMenuSave')) $('btnMenuSave').textContent = t('save');
  if($('btnMenuMain')) $('btnMenuMain').textContent = t('mainMenu');
  buildTabs();
}
function showScreen(id){
  ['langSelect','menuMain','menuHelp','endingScreen','loadingScreen'].forEach(sid=>{
    const el = $(sid); if(!el) return;
    if(sid === id) el.classList.remove('hidden'); else el.classList.add('hidden');
  });
}
function showMainMenu(){
  $('btnContinue').style.display = hasSave() ? 'block' : 'none';
  showScreen('menuMain');
  applyLanguage();
  Game.paused = true;
  Game.menuOpen = false;
  $('gameMenu').classList.remove('show');
  Snd.stopAll();
}

$('btnNew').addEventListener('click', ()=>{ Snd.init(); Snd.resume(); Snd.play('click'); CharEdit.init('new'); });
$('btnContinue').addEventListener('click', ()=>{
  Snd.init(); Snd.resume();
  if(loadGame()){ Snd.play('click'); showScreen(null); Game.paused = false; if(Snd.enabled) Snd.startMusic(); buildTabs(); }
  else toast('No save');
});
$('btnHelp').addEventListener('click', ()=>{ Snd.play('click'); showScreen('menuHelp'); });
$('btnHelpBack').addEventListener('click', ()=>{ Snd.play('click'); showScreen('menuMain'); });
$('btnMenuResume').addEventListener('click', closeMenu);
$('btnMenuSave').addEventListener('click', ()=>{ saveGame(); updateMenuHeader(); });
$('btnMenuMain').addEventListener('click', ()=>{
  Snd.stopAll();
  Game.menuOpen = false;
  $('gameMenu').classList.remove('show');
  $('menuMain').classList.remove('hidden');
  Game.paused = true;
  $('btnContinue').style.display = hasSave() ? 'block' : 'none';
});

function startInit(){
  try{
    fitCanvas();
    regenerateChar();
    populateWorld();
    buildTabs();
    Snd.init();
  }catch(e){
    const el = $('loadText'); if(el) el.textContent = 'Error: '+e.message;
    console.error(e); return;
  }
  const bar = $('loadBar'), pct = $('loadPct'), txt = $('loadText');
  let p = 0;
  const tick = ()=>{
    p += 20 + Math.random()*30;
    if(p > 100) p = 100;
    bar.style.width = p+'%'; pct.textContent = Math.round(p)+'%';
    if(p < 100) setTimeout(tick, 60);
    else {
      txt.textContent = 'Ready!';
      setTimeout(()=>{
        const ls = $('loadingScreen'); if(ls) ls.classList.add('hidden');
        if(!localStorage.getItem('pixelfarm_lang')){ showScreen('langSelect'); Game.paused = true; }
        else { showMainMenu(); }
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }, 300);
    }
  };
  tick();
}
renderLangSelect();
setTimeout(startInit, 50);
</script>
