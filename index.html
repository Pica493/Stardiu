<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Pixel Farm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;font-family:'Courier New',monospace;color:#fff;user-select:none;touch-action:none;position:fixed;top:0;left:0}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer;position:absolute;will-change:transform}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#3a4a3a,#1a1a2a 60%,#0d0d0d);z-index:100;padding:16px;gap:10px;overflow-y:auto;animation:fadeIn .3s}
.screen.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.screen h1{font-size:clamp(28px,8vw,64px);letter-spacing:6px;color:#e8c060;text-shadow:0 4px 0 #5a3a1a;margin-bottom:8px;text-align:center}
.screen h2{font-size:clamp(16px,4vw,22px);color:#e8c060;margin-bottom:8px;letter-spacing:3px}
.screen button{background:#3a2a1a;color:#ffe8b0;border:3px solid #8a5a2a;padding:12px 26px;font-size:clamp(12px,3vw,15px);cursor:pointer;border-radius:4px;font-family:inherit;letter-spacing:2px;min-width:200px;max-width:92vw;font-weight:bold}
.screen button:hover{background:#5a3a1a;border-color:#e8c060}
.screen button.primary{background:#4a7a2a;border-color:#8ac04a;color:#f0ffe0}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:500px;width:100%;padding:8px}
.lang-btn{background:#3a2a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:14px;font-size:15px;cursor:pointer;border-radius:6px;font-family:inherit;display:flex;align-items:center;gap:10px;font-weight:bold}
#notify{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#ffe8b0;padding:8px 16px;border-radius:4px;font-size:12px;z-index:150;opacity:0;transition:opacity .25s;pointer-events:none;border:2px solid #8a5a2a;font-weight:bold;max-width:80vw;text-align:center}
#notify.show{opacity:1}
#fade{position:fixed;inset:0;background:#0a0a1a;opacity:0;pointer-events:none;z-index:60;transition:opacity .4s}
#fade.active{opacity:1}
#centerText{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:61;pointer-events:none;color:#ffe8b0;gap:8px;text-align:center;text-shadow:0 2px 12px #000}
#centerText.show{display:flex}
#centerText .big{font-size:clamp(20px,5vw,34px);letter-spacing:3px;color:#e8c060}
#centerText .small{font-size:clamp(11px,3vw,14px);color:#8ac04a}
#gameMenu{position:fixed;inset:0;background:linear-gradient(135deg,rgba(58,42,20,.97),rgba(30,20,10,.98));z-index:120;display:none;padding:8px}
#gameMenu.show{display:block}
.menu-wrap{display:flex;flex-direction:column;height:100%;gap:6px;max-width:1100px;margin:0 auto;width:100%}
.menu-top{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#2a1a0a;border:3px solid #8a5a2a;border-radius:4px;flex-wrap:wrap}
.menu-top .name{color:#e8c060;font-weight:bold;font-size:14px;letter-spacing:2px}
.menu-top .info{color:#ffe8b0;font-size:11px;margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.menu-body{display:flex;flex:1;gap:6px;min-height:0}
.menu-tabs{display:flex;flex-direction:column;gap:4px;width:110px;flex-shrink:0}
.tab-btn{background:#3a2a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:9px 6px;font-size:10px;cursor:pointer;border-radius:3px;font-family:inherit;font-weight:bold;text-align:left}
.tab-btn.active{background:#4a7a2a;border-color:#e8c060;color:#fff}
.menu-content{flex:1;background:#1a1208;border:3px solid #8a5a2a;border-radius:4px;padding:10px;overflow-y:auto;min-width:0}
.menu-content h3{color:#e8c060;font-size:13px;letter-spacing:2px;margin-bottom:6px;border-bottom:1px solid #5a3a1a;padding-bottom:4px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.inv-item{background:#2a1a0a;border:2px solid #5a3a1a;padding:6px 8px;border-radius:3px;display:flex;justify-content:space-between;font-size:11px;color:#ffe8b0;align-items:center}
.inv-item .count{color:#e8c060;font-weight:bold}
.inv-item button{background:#4a7a2a;border:1px solid #8ac04a;color:#ffe8b0;padding:2px 6px;font-size:10px;cursor:pointer;font-family:inherit;margin-left:6px}
.stat-row{display:flex;justify-content:space-between;padding:5px 8px;background:#2a1a0a;margin-bottom:3px;border-radius:3px;font-size:11px;align-items:center}
.social-card{background:#2a1a0a;border:2px solid #5a3a1a;border-radius:4px;padding:8px;margin-bottom:6px}
.social-card.friend{border-color:#8ac04a}
.social-card.best{border-color:#ff6080;background:#3a1a1a}
.social-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.social-head .nm{color:#ffe8b0;font-weight:bold;font-size:12px}
.social-head .role{color:#8ac04a;font-size:10px}
.social-persona{color:#a08060;font-size:10px;font-style:italic;margin-bottom:4px}
.social-hearts{color:#ff6080;font-size:10px;letter-spacing:-1px;margin-bottom:4px}
.social-status{font-size:10px;color:#8ac04a;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.social-status .warn{color:#e0a040}
.social-actions{display:flex;gap:4px;flex-wrap:wrap}
.social-actions button{min-width:auto;padding:3px 8px;font-size:10px;background:#4a7a2a;border:1px solid #8ac04a;color:#ffe8b0;cursor:pointer;font-family:inherit;border-radius:3px}
.social-actions button:disabled{opacity:0.4;cursor:not-allowed}
.social-actions button.gift{background:#5a4a2a;border-color:#c8a040}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.map-cell{background:#2a1a0a;border:2px solid #5a3a1a;padding:8px;border-radius:3px;text-align:center;font-size:11px;color:#ffe8b0}
.map-cell b{color:#e8c060;display:block;margin-bottom:3px}
.map-cell.here{background:#4a7a2a;border-color:#8ac04a}
.options-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#2a1a0a;margin-bottom:3px;border-radius:3px;font-size:11px;color:#ffe8b0;gap:8px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border:2px solid #8a5a2a;border-radius:3px;cursor:pointer;display:inline-block}
.swatch.active{border-color:#e8c060;box-shadow:0 0 8px #e8c060}
.color-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.menu-bottom{display:flex;gap:6px;justify-content:flex-end;padding-top:4px}
.menu-bottom button{min-width:110px;padding:8px 16px;font-size:12px;font-weight:bold;background:#3a2a1a;color:#ffe8b0;border:3px solid #8a5a2a;font-family:inherit;cursor:pointer;border-radius:4px}
.menu-bottom button.primary{background:#4a7a2a;border-color:#8ac04a}
.menu-bottom button.danger{background:#6a2020;border-color:#a04040}
.museum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px}
.museum-slot{background:#1a1208;border:2px solid #4a3a1a;padding:6px;border-radius:3px;text-align:center;font-size:10px;color:#666;min-height:50px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.museum-slot.filled{border-color:#e8c060;color:#ffe8b0;background:#2a1a0a}
.museum-slot .nm{color:#e8c060;font-weight:bold;font-size:10px;margin-bottom:2px}
#loadingScreen .bar{width:300px;max-width:80vw;height:14px;background:#1a1a0a;border:2px solid #8a5a2a;border-radius:4px;overflow:hidden}
#loadBar{width:0%;height:100%;background:linear-gradient(90deg,#8ac04a,#e8c060);transition:width .15s}
</style>
</head>
<body>
<canvas id="cv" width="960" height="720"></canvas>
<div id="notify"></div><div id="fade"></div><div id="centerText"></div>

<div id="loadingScreen" class="screen">
  <h1>PIXEL FARM</h1>
  <div style="color:#8ac04a;font-size:13px;letter-spacing:2px;margin-bottom:12px" id="loadText">Loading...</div>
  <div class="bar"><div id="loadBar"></div></div>
  <div style="color:#a08060;font-size:10px;margin-top:8px" id="loadPct">0%</div>
</div>

<div id="langSelect" class="screen hidden">
  <h1>PIXEL FARM</h1>
  <h2>Choose your language / Выберите язык</h2>
  <div class="lang-grid" id="langGrid"></div>
</div>

<div id="menuMain" class="screen hidden">
  <h1>PIXEL FARM</h1>
  <button id="btnNew" class="primary">New Game</button>
  <button id="btnContinue">Continue</button>
  <button id="btnHelp">Help</button>
</div>

<div id="menuHelp" class="screen hidden">
  <h2>How to Play</h2>
  <div id="helpBody" style="max-width:560px;text-align:left;font-size:12px;line-height:1.9;color:#ffe8b0"></div>
  <button id="btnHelpBack">Back</button>
</div>

<div id="endingScreen" class="screen hidden">
  <h1 style="font-size:clamp(32px,10vw,72px);color:#e8c060;text-shadow:0 4px 0 #5a3a1a,0 8px 30px rgba(232,192,96,.6)">THE END</h1>
  <div style="max-width:600px;text-align:center;font-size:14px;line-height:2;color:#ffe8b0;margin:20px 0">
    <p>You completed the Museum collection!</p>
    <p style="color:#8ac04a;margin-top:20px" id="endingStats"></p>
  </div>
  <button onclick="location.reload()" class="primary">Play Again</button>
</div>

<div id="gameMenu">
  <div class="menu-wrap">
    <div class="menu-top">
      <span class="name" id="playerName">Farmer</span>
      <span class="info">
        <span id="menuDay">Day 1 • Spring</span>
        <span id="menuTime">06:00</span>
        <span id="menuGold">🪙 80</span>
        <span id="menuWeather">☀️ Sunny</span>
      </span>
    </div>
    <div class="menu-body">
      <div class="menu-tabs">
        <button class="tab-btn active" data-tab="inventory">INVENTORY</button>
        <button class="tab-btn" data-tab="craft">CRAFT</button>
        <button class="tab-btn" data-tab="museum">MUSEUM</button>
        <button class="tab-btn" data-tab="skills">SKILLS</button>
        <button class="tab-btn" data-tab="social">SOCIAL</button>
        <button class="tab-btn" data-tab="map">MAP</button>
        <button class="tab-btn" data-tab="custom">CHARACTER</button>
        <button class="tab-btn" data-tab="options">OPTIONS</button>
      </div>
      <div class="menu-content" id="menuContent"></div>
    </div>
    <div class="menu-bottom">
      <button id="btnMenuResume" class="primary">Resume</button>
      <button id="btnMenuSave">Save</button>
      <button id="btnMenuMain" class="danger">Main Menu</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ============================================================
// i18n
// ============================================================
const LANGS = [
  {code:'en',name:'English',flag:'🇬🇧'},{code:'ru',name:'Русский',flag:'🇷🇺'},
  {code:'es',name:'Español',flag:'🇪🇸'},{code:'fr',name:'Français',flag:'🇫🇷'},
  {code:'de',name:'Deutsch',flag:'🇩🇪'},{code:'pt',name:'Português',flag:'🇵🇹'},
  {code:'zh',name:'中文',flag:'🇨🇳'},{code:'ja',name:'日本語',flag:'🇯🇵'},
];
const I18N = {
  en:{newGame:'New Game',cont:'Continue',controls:'Help',back:'Back',resume:'Resume',save:'Save',mainMenu:'Main Menu',
    inventory:'Inventory',craft:'Craft',museum:'Museum',skills:'Skills',social:'Social',map:'Map',character:'Character',options:'Options',
    day:'Day',gold:'Gold',farm:'Farm',town:'Town',beach:'Beach',forest:'Forest',mountain:'Mountain',mine:'Mine',house:'Farmhouse',
    spring:'Spring',summer:'Summer',fall:'Fall',winter:'Winter',sunny:'Sunny',rain:'Rain',storm:'Storm',snow:'Snow',fog:'Fog',
    helpText:'Tap ground to walk. Tap objects to interact. WASD/arrows move. 1-7 tool. E door. I menu. C craft. M map. Esc menu. H horse. Social tab: greet daily, gift 2/week max.',
    farming:'Farming',mining:'Mining',fishing:'Fishing',combat:'Combat',foraging:'Foraging',
    donate:'Donate',donated:'Donated',crafted:'Crafted',greet:'Greet',gift:'Gift',
    giftedToday:'Gifted today',giftedThisWeek:'Limit reached',greetedToday:'Greeted',notGreeted:'Not greeted',daysSilent:'days silent',
    bestFriends:'♥♥ Best friend!'},
  ru:{newGame:'Новая игра',cont:'Продолжить',controls:'Управление',back:'Назад',resume:'Продолжить',save:'Сохранить',mainMenu:'В главное меню',
    inventory:'Инвентарь',craft:'Крафт',museum:'Музей',skills:'Навыки',social:'Знакомые',map:'Карта',character:'Персонаж',options:'Настройки',
    day:'День',gold:'Золото',farm:'Ферма',town:'Город',beach:'Пляж',forest:'Лес',mountain:'Горы',mine:'Шахта',house:'Дом',
    spring:'Весна',summer:'Лето',fall:'Осень',winter:'Зима',sunny:'Ясно',rain:'Дождь',storm:'Гроза',snow:'Снег',fog:'Туман',
    helpText:'Тап по земле — идти. WASD — движение. 1-7 инструмент. E дверь. I меню. C крафт. M карта. Esc меню. H лошадь.',
    farming:'Фермерство',mining:'Горное дело',fishing:'Рыбалка',combat:'Бой',foraging:'Собирательство',
    donate:'Сдать',donated:'Сдано',crafted:'Создано',greet:'Поздороваться',gift:'Подарить',
    giftedToday:'Уже дарил',giftedThisWeek:'Лимит',greetedToday:'Поздоровался',notGreeted:'Не здоровался',daysSilent:'дн. молчания',
    bestFriends:'♥♥ Лучший друг!'},
};
let LANG = localStorage.getItem('pixelfarm_lang') || 'en';
function t(k){ return (I18N[LANG]&&I18N[LANG][k]) || I18N.en[k] || k; }

const $ = id => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d',{alpha:false});
const TILE = 16;
let CW = 960, CH = 720, LW = 480, LH = 360, SCALE = 2;

function fitCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const ratio = 4/3;
  let w, h;
  if(vw/vh > ratio){ h = vh; w = vh*ratio; }
  else { w = vw; h = vw/ratio; }
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.style.left = ((vw-w)/2)+'px'; cv.style.top = ((vh-h)/2)+'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,80));
fitCanvas();

// ============================================================
// AUDIO
// ============================================================
const Snd = {
  ctx:null, master:null, musicGain:null, sfxGain:null, activeNodes:[], mt:null, playing:false, maxConcurrent:4,
  init(){ if(this.ctx) return; try{ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.22; this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.06; this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.85; this.sfxGain.connect(this.master);
  }catch(e){} },
  resume(){ if(this.ctx && this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}} },
  _beep(f1,f2,dur,type,vol){
    if(!this.ctx) return;
    if(this.activeNodes.length >= this.maxConcurrent) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(f1,now);
    if(f2) osc.frequency.exponentialRampToValueAtTime(f2,now+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.15,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+dur);
    osc.connect(g).connect(this.sfxGain);
    osc.start(now); osc.stop(now+dur+0.02);
    this.activeNodes.push({node:osc, t:performance.now()+dur*1000+100});
    const nowT = performance.now();
    this.activeNodes = this.activeNodes.filter(a=>a.t>nowT-100);
    if(this.activeNodes.length>this.maxConcurrent){ const old = this.activeNodes.shift(); try{old.node.stop&&old.node.stop();}catch(e){} }
  },
  play(type){
    if(!this.ctx) return;
    try{
      switch(type){
        case 'step': this._beep(400,400,0.04,'sine',0.04); break;
        case 'chop': this._beep(200,70,0.12,'square',0.15); break;
        case 'pick': this._beep(1400,500,0.06,'square',0.1); break;
        case 'plant': this._beep(500,800,0.1,'sine',0.08); break;
        case 'water': this._beep(2000,1500,0.08,'sine',0.08); break;
        case 'harvest': this._beep(523,784,0.15,'sine',0.1); break;
        case 'fish': this._beep(440,1046,0.2,'triangle',0.12); break;
        case 'coin': this._beep(880,1320,0.1,'square',0.08); break;
        case 'click': this._beep(900,900,0.03,'square',0.04); break;
        case 'error': this._beep(200,100,0.14,'sawtooth',0.06); break;
        case 'hurt': this._beep(300,100,0.18,'sawtooth',0.13); break;
        case 'hit': this._beep(400,120,0.09,'square',0.13); break;
        case 'levelup': this._beep(523,1318,0.35,'triangle',0.11); break;
        case 'sleep': this._beep(100,60,0.9,'sine',0.09); break;
        case 'door': this._beep(300,500,0.12,'square',0.08); break;
        case 'moo': this._beep(180,120,0.4,'sawtooth',0.1); break;
        case 'cluck': this._beep(800,500,0.09,'square',0.05); break;
        case 'neigh': this._beep(600,300,0.3,'sawtooth',0.1); break;
        case 'donate': this._beep(392,784,0.5,'sine',0.1); break;
        case 'greet': this._beep(600,900,0.1,'sine',0.08); break;
        case 'giftGood': this._beep(523,1046,0.3,'triangle',0.13); break;
        case 'giftBad': this._beep(300,150,0.3,'sawtooth',0.1); break;
        case 'wedding': [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this._beep(f,f,0.3,'triangle',0.12),i*150)); break;
        case 'victory': [523,659,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>this._beep(f,f,0.5,'triangle',0.15),i*200)); break;
      }
    }catch(e){}
  },
  startMusic(){ if(!this.ctx || this.playing) return; this.playing = true;
    const mel = [392,440,494,587,523,494,440,392,349,392,440,494,440,392,349,330,294,330,349,392];
    const dur = [.4,.4,.4,.8,.4,.4,.4,.8,.4,.4,.4,1.2,.4,.4,.4,.8,.4,.4,.4,1.2];
    let i = 0;
    const step = ()=>{
      if(!this.playing || !this.ctx) return;
      const n = this.ctx.currentTime;
      try{
        const o1 = this.ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = mel[i];
        const g1 = this.ctx.createGain();
        g1.gain.setValueAtTime(0,n); g1.gain.linearRampToValueAtTime(0.3,n+0.03);
        g1.gain.linearRampToValueAtTime(0.07,n+dur[i]*0.5); g1.gain.linearRampToValueAtTime(0,n+dur[i]);
        o1.connect(g1).connect(this.musicGain); o1.start(n); o1.stop(n+dur[i]);
      }catch(e){}
      i = (i+1)%mel.length;
    };
    step();
    this.mt = setInterval(step, 480);
  },
  stopMusic(){ this.playing = false; if(this.mt){ clearInterval(this.mt); this.mt = null; } },
  stopAll(){ for(const a of this.activeNodes){ try{a.node.stop&&a.node.stop();}catch(e){} } this.activeNodes = []; this.stopMusic(); },
};

// ============================================================
// SPRITES
// ============================================================
const S = {};
function spr(n,w,h,fn){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(g,w,h); S[n] = c; return c; }
function rr(g,x,y,w,h,c){ g.fillStyle = c; g.fillRect(x|0,y|0,w|0,h|0); }
function mirror(a,b){ const s = S[a]; if(!s) return; const c = document.createElement('canvas'); c.width = s.width; c.height = s.height;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.translate(s.width,0); g.scale(-1,1); g.drawImage(s,0,0); S[b] = c; }

const SKIN = ['#f5cb9b','#e8b888','#d0a070','#a87858','#705030'];
const HAIR = ['#5a3a1a','#3a2510','#8a5a2a','#c8a060','#1a1a1a','#d06050','#a8a8a8','#e8d040'];
const SHIRT = ['#4a80c8','#c84040','#40a848','#d09030','#8040c0','#c0c0c0','#1a1a1a','#e8a040'];

const SHOES = ['#2a1a0a','#1a1a1a','#4a2a1a','#3a3a3a'];

function drawChar(g,dir,frame,state,cust){
  const skin = SKIN[cust.skin]||SKIN[0], hair = HAIR[cust.hair]||HAIR[0];
  const shirt = SHIRT[cust.shirt]||SHIRT[0], pants = PANTS[cust.pants]||PANTS[0], shoes = SHOES[cust.shoes]||SHOES[0];
  const eye = '#1a1a2a', mouth = '#a05040', blush = '#d06050';
  if(state==='sleep'){
    rr(g,4,20,20,7,shirt); rr(g,2,22,5,5,skin); rr(g,22,24,4,3,shoes); rr(g,18,20,4,7,pants);
    g.fillStyle='#fff'; g.font='bold 7px monospace'; g.fillText('z',20,16); g.fillText('Z',23,11);
    return;
  }
  const cx = 12;
  let legL=0, legR=0, bob=0, armL=0, armR=0;
  if(state==='walk'){ const o = [0,1,0,-1]; legL = o[frame]; legR = -o[frame]; bob = (frame===1||frame===3) ? -1 : 0; armL = o[frame]; armR = -o[frame]; }
  const fY = 31;
  if(dir==='l'||dir==='r'){
    rr(g,cx-2+legL,fY-8,3,8,pants); rr(g,cx+1+legR,fY-8,3,8,pants);
    rr(g,cx-3+legL,fY-2,4,2,shoes); rr(g,cx+1+legR,fY-2,4,2,shoes);
  } else {
    rr(g,cx-3,fY-8+legL,3,8,pants); rr(g,cx+1,fY-8+legR,3,8,pants);
    rr(g,cx-4,fY-2+legL,4,2,shoes); rr(g,cx+1,fY-2+legR,4,2,shoes);
  }
  const bT = fY-19+bob;
  rr(g,cx-5,bT,10,11,shirt); rr(g,cx-5,bT+9,10,2,'rgba(0,0,0,0.2)');
  const aY = bT+2;
  if(dir==='d' || dir==='u'){
    rr(g,cx-7,aY+armL,2,7,shirt); rr(g,cx+5,aY+armR,2,7,shirt);
    if(dir==='d'){ rr(g,cx-7,aY+armL+6,2,2,skin); rr(g,cx+5,aY+armR+6,2,2,skin); }
  } else if(dir==='l'){
    rr(g,cx-6,aY+armL,3,7,shirt); rr(g,cx+2,aY+armR,2,7,shirt); rr(g,cx-6,aY+armL+6,3,2,skin);
  } else {
    rr(g,cx+4,aY+armL,3,7,shirt); rr(g,cx-4,aY+armR,2,7,shirt); rr(g,cx+4,aY+armL+6,3,2,skin);
  }
  const hT = bT-14;
  if(dir==='l'){
    rr(g,cx-5,hT,9,12,skin); rr(g,cx+2,hT,2,12,'rgba(0,0,0,0.15)'); rr(g,cx-6,hT+2,2,8,hair);
    rr(g,cx-3,hT+6,2,2,eye); rr(g,cx-6,hT+9,2,1,blush);
  } else if(dir==='r'){
    rr(g,cx-4,hT,9,12,skin); rr(g,cx-5,hT,2,12,'rgba(0,0,0,0.15)'); rr(g,cx+4,hT+2,2,8,hair);
    rr(g,cx+1,hT+6,2,2,eye); rr(g,cx+4,hT+9,2,1,blush);
  } else if(dir==='d'){
    rr(g,cx-4,hT,8,12,skin); rr(g,cx-5,hT+1,2,9,hair); rr(g,cx+3,hT+1,2,9,hair); rr(g,cx-4,hT+1,8,2,hair);
    rr(g,cx-3,hT+6,2,2,eye); rr(g,cx+1,hT+6,2,2,eye); rr(g,cx-1,hT+9,2,1,mouth);
    rr(g,cx-4,hT+9,2,1,blush); rr(g,cx+2,hT+9,2,1,blush);
  } else {
    rr(g,cx-4,hT,8,12,skin); rr(g,cx-5,hT+1,10,9,hair); rr(g,cx-5,hT+6,10,4,'rgba(0,0,0,0.3)');
  }
  if(cust.hat===1){ rr(g,cx-7,hT-3,14,2,'#a88030'); rr(g,cx-6,hT-6,12,4,'#e8c060'); }
  else if(cust.hat===2){ rr(g,cx-6,hT-3,12,2,'#a03030'); rr(g,cx-5,hT-6,10,4,'#c84040'); }
  else if(cust.hat===3){ rr(g,cx-5,hT-5,10,6,'#4080c0'); }
  else if(cust.hat===4){ rr(g,cx-7,hT-2,14,3,'#3a2050'); rr(g,cx-5,hT-10,10,9,'#5a3a8a'); }
  else if(cust.hat===5){ rr(g,cx-8,hT-2,16,2,'#6a4a20'); rr(g,cx-6,hT-6,12,4,'#8a5a30'); }
  if(state==='use'){
    if(dir==='l'){ rr(g,cx-10,aY,3,3,'#8a5a30'); rr(g,cx-12,aY-3,5,4,'#a0a8b0'); }
    else if(dir==='r'){ rr(g,cx+7,aY,3,3,'#8a5a30'); rr(g,cx+8,aY-3,5,4,'#a0a8b0'); }
    else if(dir==='d'){ rr(g,cx+3,aY+4,3,3,'#8a5a30'); rr(g,cx+1,aY+7,8,4,'#a0a8b0'); }
    else { rr(g,cx-8,aY-6,3,3,'#8a5a30'); rr(g,cx-10,aY-9,5,4,'#a0a8b0'); }
  }
}
function regenerateChar(){
  const DIRS = ['d','u','l','r'];
  for(const d of DIRS){
    for(let f=0;f<4;f++) spr('c_'+d+'_'+f,24,32,g=>drawChar(g,d,f,'walk',Custom));
    spr('c_'+d+'_idle',24,32,g=>drawChar(g,d,0,'idle',Custom));
    spr('c_'+d+'_use',24,32,g=>drawChar(g,d,0,'use',Custom));
    spr('c_'+d+'_sleep',24,32,g=>drawChar(g,d,0,'sleep',Custom));
  }
  for(let f=0;f<4;f++) mirror('c_r_'+f,'c_l_'+f);
  mirror('c_r_idle','c_l_idle'); mirror('c_r_use','c_l_use'); mirror('c_r_sleep','c_l_sleep');
}

function tileGrass(g,v,s){
  let base,dark,light;
  if(s===0){ base='#5a9a3a'; dark='#3a7028'; light='#78b84a'; }
  else if(s===1){ base='#4a8a2a'; dark='#2a6018'; light='#68a83a'; }
  else if(s===2){ base='#9a8a3a'; dark='#6a5a2a'; light='#b8a84a'; }
  else { base='#d8dce0'; dark='#b8bcc0'; light='#eef0f4'; }
  rr(g,0,0,16,16,base);
  if(v===0){ rr(g,3,4,2,1,dark); rr(g,9,6,2,1,dark); rr(g,5,11,3,1,light); }
  else if(v===1){ for(let i=0;i<7;i++){ const x=(i*5)%14+1,y=(i*7)%14+1; rr(g,x,y,1,2,i%2?dark:light); } }
  else if(v===2){ rr(g,4,3,1,1,'#ffd54a'); rr(g,11,7,1,1,'#ff8aa8'); }
  else { rr(g,2,3,3,1,light); rr(g,10,5,2,1,dark); }
}

function drawBigTree(g,s){
  let dark,mid,light;
  if(s===0||s===1){ dark='#2a5a1a'; mid='#3a7a2a'; light='#5aa83a'; }
  else if(s===2){ dark='#7a3a10'; mid='#a85a20'; light='#d89030'; }
  else { dark='#a0a8b0'; mid='#c0c8d0'; light='#e0e8f0'; }
  rr(g,20,48,8,24,'#5a3a1a'); rr(g,20,48,3,24,'#3a2a10');
  rr(g,10,20,28,8,dark); rr(g,6,24,36,20,mid); rr(g,8,16,32,16,mid); rr(g,12,10,24,12,mid);
  rr(g,16,6,16,10,light); rr(g,10,28,10,6,light); rr(g,28,26,10,6,light);
  rr(g,8,36,8,6,dark); rr(g,32,36,8,6,dark); rr(g,14,40,20,6,dark);
}

const CROPS = ['wheat','carrot','tomato','potato','corn','pumpkin'];
function drawCrop(g,type,stage){
  const cx=8;
  if(stage===0){ rr(g,cx-1,14,2,2,'#5a3a1a'); rr(g,cx,13,1,1,'#4a8a2a'); return; }
  if(stage===1){ rr(g,cx-1,12,2,4,'#4a8a2a'); rr(g,cx-3,10,2,2,'#5aa04a'); return; }
  if(stage===2){ rr(g,cx-1,10,2,6,'#4a8a2a'); rr(g,cx-3,7,2,3,'#5aa04a'); return; }
  if(stage===3){ rr(g,cx-1,6,2,10,'#4a8a2a'); rr(g,cx-4,4,3,3,'#5aa04a'); return; }
  if(type==='wheat'){ rr(g,cx-1,2,2,14,'#c8a840'); rr(g,cx-3,4,2,3,'#e0c050'); rr(g,cx+1,4,2,3,'#e0c050'); }
  else if(type==='carrot'){ rr(g,cx-3,10,3,6,'#e07020'); rr(g,cx,10,3,6,'#e07020'); }
  else if(type==='tomato'){ rr(g,cx-4,9,4,5,'#d03030'); rr(g,cx,9,4,5,'#d03030'); }
  else if(type==='potato'){ rr(g,cx-4,10,4,5,'#a87848'); rr(g,cx,10,4,5,'#a87848'); }
  else if(type==='corn'){ rr(g,cx-1,2,2,14,'#4a8a2a'); rr(g,cx-4,4,3,6,'#c8a840'); rr(g,cx+1,4,3,6,'#c8a840'); }
  else { rr(g,cx-5,9,10,7,'#e08020'); rr(g,cx-2,9,1,7,'#c06818'); }
}
for(const t2 of CROPS) for(let s=0;s<5;s++) spr('crop_'+t2+'_'+s,16,16,g=>drawCrop(g,t2,s));

function drawNPC(g,hair,shirt,pants,hat,dir){
  const cx=12, skin='#f5cb9b';
  rr(g,cx-3,23,3,8,pants); rr(g,cx+1,23,3,8,pants);
  rr(g,cx-4,29,4,2,'#3a2510'); rr(g,cx+1,29,4,2,'#3a2510');
  rr(g,cx-5,12,10,11,shirt); rr(g,cx-5,21,10,2,'rgba(0,0,0,0.15)');
  rr(g,cx-7,14,2,8,shirt); rr(g,cx+5,14,2,8,shirt);
  rr(g,cx-7,21,2,2,skin); rr(g,cx+5,21,2,2,skin);
  const hT=2;
  rr(g,cx-4,hT,8,11,skin);
  if(dir!=='u'){ rr(g,cx-3,hT+5,2,2,'#1a1a2a'); rr(g,cx+1,hT+5,2,2,'#1a1a2a'); rr(g,cx-1,hT+8,2,1,'#a05040'); }
  rr(g,cx-5,hT+1,2,6,hair); rr(g,cx+3,hT+1,2,6,hair); rr(g,cx-4,hT-1,8,3,hair);
  if(hat){ rr(g,cx-6,hT-2,12,3,hat); rr(g,cx-4,hT-5,8,3,hat); }
}

const T_GRASS=0,T_PATH=1,T_WATER=2,T_TILL=3,T_TILL_WET=4,T_FLOOR=5,T_WALL=6,T_SAND=7,T_DEEP=8,
      T_ROCK=9,T_CAVE=10,T_CU=11,T_IR=12,T_GO=13,T_IRID=14,T_IND_FLOOR=20,T_IND_WALL=21,T_RUG=22;
const BLOCKING = new Set([T_WATER,T_WALL,T_DEEP,T_ROCK,T_CU,T_IR,T_GO,T_IRID,T_IND_WALL]);

function makeMap(w,h,fill){ const m=[]; for(let y=0;y<h;y++){ const r=[]; for(let x=0;x<w;x++) r.push(fill); m.push(r); } return m; }
function makeFarm(){
  const m = makeMap(60,48,T_GRASS);
  for(let y=32;y<42;y++) for(let x=40;x<54;x++){ const dx=x-47,dy=y-37; if(dx*dx/1.3+dy*dy<24) m[y][x]=T_WATER; }
  for(let x=24;x<38;x++) m[22][x]=T_PATH;
  for(let y=12;y<22;y++) m[y][32]=T_PATH;
  for(let x=18;x<33;x++) m[12][x]=T_PATH;
  for(let x=26;x<34;x++) m[0][x]=T_PATH;
  for(let x=26;x<34;x++) m[47][x]=T_PATH;
  for(let y=22;y<28;y++) m[y][0]=T_PATH;
  for(let y=22;y<28;y++) m[y][59]=T_PATH;
  return m;
}
function makeTown(){
  const m = makeMap(60,48,T_GRASS);
  for(let x=0;x<60;x++) m[24][x]=T_PATH;
  for(let y=0;y<48;y++) m[y][30]=T_PATH;
  for(let y=22;y<28;y++) for(let x=26;x<36;x++) m[y][x]=T_FLOOR;
  for(let x=26;x<34;x++) m[47][x]=T_PATH;
  for(let x=26;x<34;x++) m[0][x]=T_PATH;
  for(let x=4;x<26;x++) m[14][x]=T_PATH;
  for(let x=34;x<56;x++) m[14][x]=T_PATH;
  for(let x=4;x<26;x++) m[35][x]=T_PATH;
  for(let x=34;x<56;x++) m[35][x]=T_PATH;
  for(let y=14;y<24;y++){ m[y][4]=T_PATH; m[y][20]=T_PATH; m[y][40]=T_PATH; m[y][56]=T_PATH; }
  for(let y=24;y<36;y++){ m[y][4]=T_PATH; m[y][20]=T_PATH; m[y][40]=T_PATH; m[y][56]=T_PATH; }
  return m;
}
function makeBeach(){
  const m = makeMap(60,48,T_SAND);
  for(let x=0;x<60;x++) m[0][x]=T_PATH;
  for(let y=24;y<48;y++) for(let x=0;x<60;x++) m[y][x]=T_WATER;
  for(let y=36;y<48;y++) for(let x=0;x<60;x++) m[y][x]=T_DEEP;
  return m;
}
function makeForest(){
  const m = makeMap(48,48,T_GRASS);
  for(let y=22;y<28;y++) m[y][0]=T_PATH;
  for(let y=22;y<28;y++) m[y][47]=T_PATH;
  for(let x=22;x<28;x++) m[0][x]=T_PATH;
  return m;
}
function makeMountain(){
  const m = makeMap(48,48,T_GRASS);
  for(let y=0;y<48;y++) for(let x=0;x<48;x++) if(Math.random()<0.15) m[y][x]=T_ROCK;
  for(let y=42;y<48;y++) for(let x=22;x<28;x++) m[y][x]=T_GRASS;
  for(let y=12;y<18;y++) for(let x=18;x<30;x++) m[y][x]=T_WATER;
  return m;
}
function makeIndoor(w,h){
  const m = makeMap(w,h,T_IND_FLOOR);
  for(let x=0;x<w;x++){ m[0][x]=T_IND_WALL; m[h-1][x]=T_IND_WALL; }
  for(let y=0;y<h;y++){ m[y][0]=T_IND_WALL; m[y][w-1]=T_IND_WALL; }
  m[h-1][Math.floor(w/2)]=T_IND_FLOOR; m[h-1][Math.floor(w/2)+1]=T_IND_FLOOR;
  return m;
}

function currentMap(){ return World[Game.map]; }
function toolName(tt){ return {axe:'Axe',pick:'Pickaxe',hoe:'Hoe',can:'Can',seed:'Seeds',rod:'Rod',sword:'Sword'}[tt]; }
function tileAt(tx,ty){
  const m = currentMap();
  if(!m.tiles || !m.tiles[ty]) return T_ROCK;
  if(ty<0||ty>=m.tiles.length||tx<0||tx>=m.tiles[0].length) return T_ROCK;
  return m.tiles[ty][tx];
}
function findObjectAt(tx,ty){
  const m = currentMap();
  if(!m.objects) return null;
  for(const o of m.objects) if(tx===o.tx && ty===o.ty) return o;
  return null;
}
function findNPCAt(tx,ty){
  const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(Math.abs(n.x-wp.x)<22 && Math.abs(n.y-wp.y)<24) return n;
  }
  return null;
}
function findMonsterAt(tx,ty){
  const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2};
  for(const m of Game.monsters) if(Math.abs(m.x-wp.x)<16 && Math.abs(m.y-wp.y)<16) return m;
  return null;
}
function toast(txt){
  Game.toast = txt; Game.toastTimer = 1500;
  const e = $('notify'); e.textContent = txt; e.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>e.classList.remove('show'), 1500);
}
function fadeTo(cb){ $('fade').classList.add('active'); setTimeout(()=>{ cb(); setTimeout(()=>$('fade').classList.remove('active'),80); }, 300); }
function checkSkillUp(s){
  const xp = Game.skillXp[s];
  const lvl = Math.floor(Math.sqrt(xp/10));
  if(lvl > Game.skills[s]) { Game.skills[s] = Math.min(10, lvl); toast(s+' Lv '+Game.skills[s]); }
}
function addSkill(s, n){ Game.skillXp[s] = (Game.skillXp[s]||0)+n; checkSkillUp(s); }
function addAchieve(id, name){ if(Game.achieved.includes(id)) return; Game.achieved.push(id); toast('🏆 '+name); Snd.play('levelup'); }

// FRIENDSHIP
function currentWeek(){ return Math.floor((Game.day-1)/7)+1; }
function greetNPC(npc){
  if(npc.greetedToday) return false;
  npc.greetedToday = true;
  npc.lastTalkedDay = Game.day;
  if(npc.hearts < 10) npc.hearts = Math.min(10, npc.hearts + 0.15);
  Snd.play('greet');
  return true;
}
function giveGift(npc, itemId){
  const w = currentWeek();
  if(npc.giftWeek !== w){ npc.giftWeek = w; npc.giftCount = 0; npc.giftToday = false; }
  if(npc.giftToday){ toast(t('giftedToday')); Snd.play('error'); return false; }
  if(npc.giftCount >= 2){ toast(t('giftedThisWeek')); Snd.play('error'); return false; }
  if((Game.inv[itemId]||0) <= 0){ toast('No '+itemId); Snd.play('error'); return false; }
  Game.inv[itemId]--;
  let delta = 0.5;
  if(itemId === npc.fav) delta = 2;
  else if(itemId === npc.disliked) delta = -1;
  npc.hearts = Math.max(0, Math.min(10, npc.hearts + delta));
  npc.giftCount++;
  npc.giftToday = true;
  npc.lastTalkedDay = Game.day;
  if(delta > 0){ Snd.play('giftGood'); toast(npc.name+' liked '+itemId+'! +'+delta+'♥'); }
  else if(delta < 0){ Snd.play('giftBad'); toast(npc.name+' disliked '+itemId+'! -1♥'); }
  else { Snd.play('giftGood'); toast(npc.name+' accepted '+itemId+' +0.5♥'); }
  return true;
}
function decayFriendship(){
  for(const npc of NPC_DATA){
    npc.greetedToday = false;
    npc.giftToday = false;
    if(npc.giftWeek !== currentWeek()){ npc.giftWeek = currentWeek(); npc.giftCount = 0; }
    if(npc.hearts >= 10) continue;
    const daysSilent = Game.day - (npc.lastTalkedDay || 0);
    if(daysSilent >= 3 && npc.hearts > 0) npc.hearts = Math.max(0, npc.hearts - 0.5);
  }
}

// ACTIONS
function startAction(ac){ player.action = ac; player.actionTimer = 400; }
function removeObject(o){ const m = currentMap(); if(!m.objects) return; const i = m.objects.indexOf(o); if(i>=0) m.objects.splice(i,1); }
function spawnParticle(x,y,c){ if(Game.particles.length > 60) return; for(let i=0;i<5;i++) Game.particles.push({x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*4, vx:(Math.random()-.5)*2, vy:-Math.random()*1.5, life:600, max:600, color:c}); }
function consumeEnergy(n){ Game.energy = Math.max(0, Game.energy-n); }
function toolPower(t2){ return TOOL_LEVELS[Game.toolLevels[t2]||0].mult; }

function attack(tx,ty){
  const weapon = WEAPONS[Game.weaponLevel];
  const mon = findMonsterAt(tx,ty);
  if(!mon) return false;
  startAction('use'); Snd.play('hit');
  const isCrit = Math.random() < weapon.crit;
  const dmg = Math.floor(weapon.dmg * (isCrit?2:1));
  mon.hp -= dmg; mon.hitTimer = 200;
  spawnParticle(mon.x, mon.y-8, isCrit?'#ffff40':'#ff4040');
  if(mon.hp<=0){
    const t2 = MONSTER_TYPES.find(x=>x.id===mon.typeId);
    if(t2){ if(Math.random()<t2.drop[1]) Game.inv[t2.drop[0]] = (Game.inv[t2.drop[0]]||0)+t2.yield; }
    Game.kills[mon.typeId] = (Game.kills[mon.typeId]||0)+1;
    Game.gold += 2+Math.floor(Math.random()*5);
    addSkill('combat', 5);
    const idx = Game.monsters.indexOf(mon);
    if(idx>=0) Game.monsters.splice(idx,1);
    toast('Killed '+mon.name);
  }
  consumeEnergy(1);
  return true;
}

function doActionAt(tx,ty){
  if(player.action || Game.sleeping) return;

  if(Game.map==='farm'){
    const hd = World.farm.houseDoor;
    if(tx===hd.x && ty===hd.y){ enterBuilding('farmhouse','farm'); return; }
    const sd = World.farm.shopDoor;
    if(tx===sd.x && ty===sd.y){ enterBuilding('shop_interior','farm'); return; }
    const stD = World.farm.stableDoor;
    if(tx===stD.x && ty===stD.y){ if(!Game.onHorse) openShop({name:'Stable',role:'Horses',shop:'horses'}); return; }
    const cD = World.farm.carpenterDoor;
    if(tx===cD.x && ty===cD.y){ enterBuilding('blacksmith_interior','farm',()=>openShop({name:'Carpenter',role:'Build',shop:'build'})); return; }
  }
  if(Game.map==='farmhouse' || Game.map==='house_interior' || Game.map==='shop_interior' || Game.map==='blacksmith_interior' || Game.map==='museum_interior'){
    const m = currentMap();
    const exitX = Math.floor(m.w/2);
    if(ty >= m.h-1 && (tx===exitX || tx===exitX+1)){ exitBuilding(Game.prevMap || 'farm', Game.map); return; }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      if(b.door && tx===b.door.x && ty===b.door.y){
        if(b.type==='museum'){ enterBuilding('museum_interior','town'); return; }
        if(b.type==='shop'){ openShop({name:'General Store',role:'Goods',shop:'seeds'}); return; }
        if(b.type==='blacksmith'){ openShop({name:'Blacksmith',role:'Weapons',shop:'weapons'}); return; }
        if(b.type==='tavern'){ openShop({name:'Tavern',role:'Drinks',shop:'drinks'}); return; }
        if(b.type==='carpenter'){ openShop({name:'Carpenter',role:'Build',shop:'build'}); return; }
        if(b.residents && b.residents.length){ enterBuilding('house_interior','town',null, b.name); return; }
        if(b.type==='townhall'){ toast('Town Hall'); Snd.play('door'); return; }
      }
    }
  }

  const mon = findMonsterAt(tx,ty);
  if(mon){ attack(tx,ty); return; }
  if(Game.map==='farm'){
    const an = World.farm.animals.find(a=>Math.abs(a.x-(tx*TILE+8))<14 && Math.abs(a.y-(ty*TILE+16))<14);
    if(an){ collectAnimal(an); return; }
  }
  const npc = findNPCAt(tx,ty);
  if(npc){ talkToNPC(npc); return; }

  const tool = Game.hotbar[Game.selected];
  const t2 = tileAt(tx,ty);
  const obj = findObjectAt(tx,ty);

  if(obj && obj.type==='crop' && obj.stage===4){
    Game.inv[obj.cropType] = (Game.inv[obj.cropType]||0)+1;
    toast('+1 '+obj.cropType); Snd.play('harvest'); removeObject(obj);
    addSkill('farming', 5); startAction('use'); consumeEnergy(1); return;
  }
  if(tool==='axe'){
    if(obj && (obj.type==='tree'||obj.type==='pine')){
      startAction('use'); obj.hp -= Math.floor(toolPower('axe')); Snd.play('chop');
      spawnParticle(obj.x,obj.y-20,'#8a5a30'); consumeEnergy(2);
      if(obj.hp<=0){ const n = 3+Math.floor(Math.random()*3); Game.inv.wood += n; toast('+'+n+' 🪵'); removeObject(obj); addSkill('foraging', 5); }
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='pick'){
    if(obj && (obj.type==='rock_s'||obj.type==='rock_m'||obj.type==='rock_l'||obj.type==='rock_small')){
      startAction('use'); obj.hp = (obj.hp||2)-Math.floor(toolPower('pick')); Snd.play('pick');
      spawnParticle(obj.x,obj.y-8,'#a0a0a8'); consumeEnergy(2);
      if(obj.hp<=0){ const n = 2+Math.floor(Math.random()*3); Game.inv.stone += n; toast('+'+n+' 🪨'); removeObject(obj); addSkill('mining', 5); }
      return;
    }
    if(t2===T_CU||t2===T_IR||t2===T_GO||t2===T_IRID){
      startAction('use'); Snd.play('pick'); consumeEnergy(2);
      let ore = 'copper', cnt = 1+Math.floor(Math.random()*2);
      if(t2===T_IR) ore='iron'; else if(t2===T_GO) ore='gold_ore'; else if(t2===T_IRID) ore='iri';
      Game.inv[ore] = (Game.inv[ore]||0)+cnt;
      currentMap().tiles[ty][tx] = T_CAVE;
      addSkill('mining', 5); toast('+'+cnt+' '+ore);
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='hoe'){
    if(t2===T_GRASS){ currentMap().tiles[ty][tx] = T_TILL; startAction('use'); consumeEnergy(2); return; }
    return;
  }
  if(tool==='can'){
    if(t2===T_TILL){ currentMap().tiles[ty][tx] = T_TILL_WET; startAction('use'); Snd.play('water'); consumeEnergy(1); return; }
    return;
  }
  if(tool==='seed'){
    if(Game.inv.seeds<=0){ Snd.play('error'); toast('No seeds'); return; }
    if(t2===T_TILL||t2===T_TILL_WET){
      Game.inv.seeds--; consumeEnergy(1);
      const type = CROPS[Math.floor(Math.random()*CROPS.length)];
      currentMap().objects.push({type:'crop',cropType:type,x:tx*TILE+8,y:(ty+1)*TILE,tx,ty,stage:0,watered:false,solid:false,sortY:(ty+1)*TILE});
      startAction('use'); Snd.play('plant'); return;
    }
    return;
  }
  if(tool==='rod'){
    if(t2===T_WATER||t2===T_DEEP){ startFishing(); return; }
    Snd.play('error'); toast('Stand by water'); return;
  }
}

function startFishing(){ Game.fishing = {timer:0, duration:2500, caught:false}; startAction('use'); }
function getFishingResult(){
  const hour = Math.floor(Game.time/60)%24;
  const time = (hour<20&&hour>=6)?'day':'night';
  const loc = Game.map==='beach' ? ((player.y>24*TILE)?'deep':'beach') : (Game.map==='mountain'?'mountain':'farm');
  let pool = FISH_LIST.filter(f=>(f.loc===loc||(f.loc==='beach'&&loc==='deep')) && (f.time===time||f.time==='any') && (f.weather===Game.weather||f.weather==='any'));
  if(!pool.length) pool = FISH_LIST.filter(f=>f.loc==='beach');
  let total = 0; for(const f of pool) total += f.chance;
  let r = Math.random()*total;
  for(const f of pool){ r -= f.chance; if(r<=0) return f; }
  return pool[0];
}
function collectAnimal(a){
  startAction('use');
  if(a.growthStage<1){ toast('Still young'); return; }
  if(a.type==='horse'){ toggleHorse(a); return; }
  if(a.produceReady){
    const type = ANIMAL_TYPES[a.type];
    Game.inv[type.product] = (Game.inv[type.product]||0)+1;
    a.produceReady = false; a.produceTimer = type.time;
    toast(type.icon+' +1 '+type.product);
    Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
    addSkill('farming', 3);
  } else Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
}
function toggleHorse(horse){
  if(Game.onHorse){
    Game.onHorse = false;
    if(horse){ horse.mounted = false; player.x = horse.x-8; player.y = horse.y; }
    toast('Dismounted'); Snd.play('neigh');
  } else {
    if(!horse) horse = World.farm.animals.find(a=>a.type==='horse'&&a.growthStage>=1);
    if(!horse){ toast('No horse'); return; }
    const d = Math.hypot(player.x-horse.x, player.y-horse.y);
    if(d<60){ Game.onHorse = true; horse.mounted = true; toast('Mounted!'); Snd.play('neigh'); }
    else toast('Get closer');
  }
}
function talkToNPC(npc){
  const wasGreeting = greetNPC(npc);
  if(!npc.questGiven){
    const item = Game.inv[npc.quest.item]||0;
    if(item>=npc.quest.count && !npc.questDone){
      Game.inv[npc.quest.item] -= npc.quest.count;
      Game.gold += npc.quest.reward;
      npc.hearts = Math.min(10, npc.hearts+2);
      npc.questDone = true; npc.questGiven = true;
      toast('Quest done! +'+npc.quest.reward+' gold'); Snd.play('levelup');
      Game.completedQuests++; return;
    }
    npc.questGiven = true;
    Game.activeQuests.push({npcId:npc.id, item:npc.quest.item, count:npc.quest.count, reward:npc.quest.reward});
    toast(npc.name+': bring me '+npc.quest.count+' '+npc.quest.item);
    Snd.play('click'); return;
  }
  if(npc.shop){ openShop(npc); return; }
  if(npc.hearts >= 10 && !Game.married){
    if(Game.inv.gold_ore || Game.inv.iri){
      if(confirm('Propose to '+npc.name+'?')){
        if(Game.inv.iri) Game.inv.iri--; else Game.inv.gold_ore--;
        Game.married = npc.name;
        toast('💍 Married to '+npc.name+'!');
        Snd.play('wedding');

function exitBuilding(targetMap, fromMap){

      else if(fromMap==='blacksmith_interior'){ player.x = World.farm.carpenterDoor.x*TILE+8; player.y = (World.farm.carpenterDoor.y+1)*TILE; }

// MINE
function generateMine(depth){
  const m = World.mine;
  m.w = 30; m.h = 30;
  m.tiles = makeMap(30,30,T_ROCK);
  const rooms = [];
  const numRooms = 3+Math.min(8,Math.floor(depth/10));
  for(let i=0;i<numRooms;i++){
    const rw = 4+Math.floor(Math.random()*5);
    const rh = 4+Math.floor(Math.random()*5);
    const rx = 2+Math.floor(Math.random()*(26-rw));
    const ry = 2+Math.floor(Math.random()*(26-rh));
    rooms.push({x:rx,y:ry,w:rw,h:rh});
    for(let y=ry;y<ry+rh;y++) for(let x=rx;x<rx+rw;x++) m.tiles[y][x] = T_CAVE;
  }
  for(let i=1;i<rooms.length;i++){
    const a = rooms[i-1], b = rooms[i];
    const ax = Math.floor(a.x+a.w/2), ay = Math.floor(a.y+a.h/2);
    const bx = Math.floor(b.x+b.w/2), by = Math.floor(b.y+b.h/2);
    for(let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) m.tiles[ay][x] = T_CAVE;
    for(let y=Math.min(ay,by);y<=Math.max(ay,by);y++) m.tiles[y][bx] = T_CAVE;
  }
  m.objects = [];
  for(const r of rooms){
    for(let y=r.y;y<r.y+r.h;y++) for(let x=r.x;x<r.x+r.w;x++){
      if(m.tiles[y][x]!==T_CAVE) continue;
      if(Math.random()<0.08){
        let ore = T_CU;
        const r0 = Math.random();
        if(depth>60 && r0<0.15) ore = T_IRID;
        else if(depth>40 && r0<0.35) ore = T_GO;
        else if(depth>20 && r0<0.5) ore = T_IR;
        m.tiles[y][x] = ore;
      }
    }
  }
  const last = rooms[rooms.length-1];
  m.ladder = {x:last.x+Math.floor(last.w/2), y:last.y+Math.floor(last.h/2)};
  Game.monsters = [];
  const avail = MONSTER_TYPES.filter((t2,i)=>{
    if(i===0) return true;
    if(i===1&&depth>5) return true;
    if(i===2&&depth>15) return true;
    if(i===3&&depth>25) return true;
    if(i===4&&depth>40) return true;
    return false;
  });
  const count = 2+Math.min(8, Math.floor(depth/5));
  for(let i=0;i<count;i++){
    const r = rooms[Math.floor(Math.random()*rooms.length)];
    const ty = avail[Math.floor(Math.random()*avail.length)];
    const mm = { typeId:ty.id, name:ty.name, sprite:ty.sprite,
      x:(r.x+1+Math.random()*(r.w-2))*TILE+8,
      y:(r.y+1+Math.random()*(r.h-2))*TILE+16,
      hp:ty.hp, maxHp:ty.hp, dmg:ty.dmg,
      dir:1, frame:0, frameTimer:0, hitTimer:0, moveTimer:1500,
      wanderTarget:{x:0,y:0} };
    mm.wanderTarget = {x:mm.x, y:mm.y};
    Game.monsters.push(mm);
  }
  const first = rooms[0];
  player.x = first.x*TILE+8; player.y = (first.y+1)*TILE+16;
  m.depth = depth;
  toast('Mine — Floor '+depth);
}

// TRANSITIONS
function checkMapTransition(){
  const pdX = player.x+12, pdY = player.y+24;
  const tx = Math.floor(pdX/TILE), ty = Math.floor(pdY/TILE);
  if(Game.map==='farm'){
    if(ty<1 && tx>=26 && tx<=34) switchMap('town', 30*TILE+8, 45*TILE);
    else if(ty>46 && tx>=26 && tx<=34) switchMap('beach', 30*TILE+8, 1*TILE+16);
    else if(tx<1 && ty>=22 && ty<=28) switchMap('forest', 45*TILE+8, 24*TILE+16);
    else if(tx>58 && ty>=22 && ty<=28) fadeTo(()=>{ generateMine(1); Game.map='mine'; player.targetX=null; });
  } else if(Game.map==='town'){
    if(ty>46 && tx>=26 && tx<=34) switchMap('farm', 30*TILE+8, 1*TILE+16);
    else if(ty<1 && tx>=26 && tx<=34) switchMap('mountain', 24*TILE+8, 45*TILE+16);
  } else if(Game.map==='beach'){
    if(ty<1 && tx>=26 && tx<=34) switchMap('farm', 30*TILE+8, 45*TILE+16);
  } else if(Game.map==='forest'){
    if(tx>46 && ty>=22 && ty<=28) switchMap('farm', 1*TILE+16, 25*TILE+16);
  } else if(Game.map==='mountain'){
    if(ty>46 && tx>=22 && tx<=26) switchMap('town', 30*TILE+8, 1*TILE+16);
  } else if(Game.map==='mine'){
    const m = currentMap();
    if(m.ladder && tx===m.ladder.x && ty===m.ladder.y){ fadeTo(()=>{ generateMine(m.depth+1); player.targetX=null; }); }
    if(ty===1 && tx<3) fadeTo(()=>{ Game.map='farm'; player.x=58*TILE; player.y=25*TILE+16; });
  }
}
function switchMap(name,px,py){

    player.targetX = null; player.targetY = null; player.actionTarget = null;

}

function startSleep(){
  if(Game.sleeping) return;
  Game.sleeping = true; player.action = 'sleep';

function forceSleep(){
  if(Game.sleeping) return;

  Snd.stopMusic();
  $('fade').classList.add('active');

function advanceDay(slept){
  Game.day++; Game.seasonDay++;
  if(Game.seasonDay>7){ Game.seasonDay = 1; Game.season = (Game.season+1)%4; toast(t(SEASONS[Game.season])); }
  Game.time = 6*60;
  Game.energy = slept ? Game.maxEnergy : Math.floor(Game.maxEnergy*0.6);
  Game.hp = Game.maxHp;
  const w = Math.random();
  if(Game.season===3 && w<0.35) Game.weather = 'snow';
  else if(w<0.25) Game.weather = 'rain';
  else if(w<0.32) Game.weather = 'storm';
  else if(w<0.42) Game.weather = 'fog';
  else Game.weather = 'sunny';
  for(const o of World.farm.objects){
    if(o.type==='crop'){
      if(o.watered && o.stage<4) o.stage++;
      o.watered = false;
      if(Game.weather==='rain') o.watered = true;
    }
  }
  const tiles = World.farm.tiles;
  for(let y=0;y<tiles.length;y++) for(let x=0;x<tiles[0].length;x++){
    if(tiles[y][x]===T_TILL_WET) tiles[y][x] = T_TILL;
    if(Game.weather==='rain' && tiles[y][x]===T_TILL) tiles[y][x] = T_TILL_WET;
  }
  for(const a of World.farm.animals){
    if(Math.random()<0.75) a.produceReady = true;
    if(a.growthStage<1){ a.growTimer = (a.growTimer||0)+1; if(a.growTimer>=3) a.growthStage = 1; }
  }
  decayFriendship();
  Game.week = currentWeek();
  Game.fishing = null; player.action = null;
  Game.map = 'farmhouse';
  player.x = 3*TILE; player.y = 7*TILE;
  player.targetX = null; player.targetY = null; player.actionTarget = null;
  Game.sleeping = false;
}

      energy:Game.energy, hp:Game.hp, gold:Game.gold, inv:Game.inv,

      npcs:NPC_DATA.map(n=>({id:n.id, hearts:n.hearts, questDone:n.questDone, questGiven:n.questGiven,
        greetedToday:n.greetedToday, lastTalkedDay:n.lastTalkedDay,
        giftToday:n.giftToday, giftWeek:n.giftWeek, giftCount:n.giftCount})),
      activeQuests:Game.activeQuests, completedQuests:Game.completedQuests,

    };
    localStorage.setItem('pixelfarm_save', JSON.stringify(data));
    toast(t('saved'));
  }catch(e){ console.error(e); }
}
function loadGame(){
  try{
    const raw = localStorage.getItem('pixelfarm_save');
    if(!raw) return false;
    const d = JSON.parse(raw);
    Game.time = d.time; Game.day = d.day; Game.season = d.season; Game.seasonDay = d.seasonDay;
    Game.weather = d.weather||'sunny';
    Game.energy = d.energy; Game.hp = d.hp||100; Game.gold = d.gold;
    if(d.inv) Game.inv = Object.assign(Game.inv, d.inv);
    Game.weaponLevel = d.weaponLevel||0;
    Game.armorLevel = d.armorLevel||0;
    Game.maxHp = d.maxHp || (100+(ARMORS[Game.armorLevel]?ARMORS[Game.armorLevel].hp:0));
    if(d.toolLevels) Game.toolLevels = Object.assign(Game.toolLevels, d.toolLevels);
    Game.map = d.map||'farm';
    Game.selected = d.selected||0;
    player.x = d.player.x; player.y = d.player.y; player.dir = d.player.dir||'d';
    if(d.farm && d.farm.tiles && d.farm.objects){
      World.farm.tiles = d.farm.tiles;
      World.farm.objects = d.farm.objects;
      World.farm.animals = d.farm.animals||[];
    }
    if(d.npcs) for(const sd of d.npcs){
      const n = NPC_DATA.find(x=>x.id===sd.id);
      if(n){
        n.hearts = sd.hearts||0;
        n.questDone = !!sd.questDone; n.questGiven = !!sd.questGiven;
        n.greetedToday = !!sd.greetedToday;
        n.lastTalkedDay = sd.lastTalkedDay||0;
        n.giftToday = !!sd.giftToday;
        n.giftWeek = sd.giftWeek||0;
        n.giftCount = sd.giftCount||0;
      }
    }
    Game.activeQuests = d.activeQuests||[];
    Game.completedQuests = d.completedQuests||0;
    Game.kills = d.kills||{};
    Game.fishCaught = d.fishCaught||{};
    Game.museumDonations = d.museumDonations||{};
    Game.achieved = d.achieved||[];
    Game.endingShown = !!d.endingShown;
    Game.married = d.married||null;
    if(d.skills) Game.skills = Object.assign(Game.skills, d.skills);
    if(d.skillXp) Game.skillXp = Object.assign(Game.skillXp, d.skillXp);
    if(d.bundles) for(const b of d.bundles){
      const target = Game.bundles.find(x=>x.id===b.id);
      if(target) target.done = !!b.done;
    }
    if(d.custom){ Object.assign(Custom, d.custom); Custom.save(); regenerateChar(); }
    if(d.lang){ LANG = d.lang; localStorage.setItem('pixelfarm_lang', LANG); }
    Game.week = currentWeek();
    return true;
  }catch(e){ console.error(e); return false; }
}

function screenToWorld(cx,cy){
  const rect = cv.getBoundingClientRect();
  const sx = (cx-rect.left) * (cv.width/rect.width) / SCALE;
  const sy = (cy-rect.top) * (cv.height/rect.height) / SCALE;
  return {x:sx+camera.x, y:sy+camera.y};
}
let pointerDown = false, pointerStartX = 0, pointerStartY = 0, pointerMoved = false;
cv.addEventListener('pointerdown', e=>{
  if(Game.menuOpen || Game.sleeping) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const lx = (e.clientX-rect.left) * (cv.width/rect.width) / SCALE;
  const ly = (e.clientY-rect.top) * (cv.height/rect.height) / SCALE;
  const hbW = 7*24+4, hbX = (LW-hbW)/2, hbY = LH-32;
  if(ly>hbY && ly<hbY+28 && lx>hbX && lx<hbX+hbW){
    const idx = Math.floor((lx-hbX-2)/24);
    if(idx>=0 && idx<Game.hotbar.length){ Game.selected = idx; Snd.play('click'); }
    return;
  }
  pointerDown = true; pointerMoved = false;
  pointerStartX = e.clientX; pointerStartY = e.clientY;
  const p = screenToWorld(e.clientX, e.clientY);
  const tx = Math.floor(p.x/TILE), ty = Math.floor(p.y/TILE);
  player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  player.targetX = p.x; player.targetY = p.y;
});
cv.addEventListener('pointermove', e=>{
  if(!pointerDown || Game.menuOpen || Game.sleeping) return;
  if(Math.hypot(e.clientX-pointerStartX, e.clientY-pointerStartY)>12) pointerMoved = true;
  if(pointerMoved){
    const p = screenToWorld(e.clientX, e.clientY);
    player.targetX = p.x; player.targetY = p.y;
    const tx = Math.floor(p.x/TILE), ty = Math.floor(p.y/TILE);
    player.actionTarget = {tx, ty, obj:findObjectAt(tx,ty), npc:findNPCAt(tx,ty), monster:findMonsterAt(tx,ty)};
  }
});
window.addEventListener('pointerup', ()=>{ pointerDown = false; });
window.addEventListener('pointercancel', ()=>{ pointerDown = false; });

function tryInteract(){
  const pdX = player.x+12, pdY = player.y+24;
  const tx = Math.floor(pdX/TILE), ty = Math.floor(pdY/TILE);
  if(Game.map==='farm'){
    const hd = World.farm.houseDoor;
    if(Math.hypot(pdX-(hd.x*TILE+TILE/2), pdY-(hd.y*TILE+TILE))<40){ enterBuilding('farmhouse','farm'); return; }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      if(b.door && tx===b.door.x && ty===b.door.y){
        if(b.type==='museum'){ enterBuilding('museum_interior','town'); return; }
        if(b.type==='shop'){ openShop({name:'General Store',role:'Goods',shop:'seeds'}); return; }
        if(b.type==='blacksmith'){ openShop({name:'Blacksmith',role:'Weapons',shop:'weapons'}); return; }
        if(b.type==='tavern'){ openShop({name:'Tavern',role:'Drinks',shop:'drinks'}); return; }
        if(b.type==='carpenter'){ openShop({name:'Carpenter',role:'Build',shop:'build'}); return; }
        if(b.residents && b.residents.length){ enterBuilding('house_interior','town',null, b.name); return; }
      }
    }
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(Math.hypot(n.x-pdX, n.y-pdY)<40){ talkToNPC(n); return; }
  }
  toast('Nothing here');
}

function renderShopMenu(npc){
  const box = $('menuContent'); box.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = npc.name+' — '+npc.role; box.appendChild(h);
  const goldEl = document.createElement('div');
  goldEl.style.cssText = 'color:#e8c060;font-size:13px;text-align:center;margin-bottom:6px';
  goldEl.textContent = '🪙 '+Game.gold;
  box.appendChild(goldEl);
  const grid = document.createElement('div'); grid.className = 'inv-grid';
  function addRow(name, price, action, sell){
    const it = document.createElement('div'); it.className = 'inv-item';
    it.innerHTML = '<span>'+name+'</span><span class="count">'+(sell?'+':'')+price+'</span>';
    const btn = document.createElement('button');
    btn.textContent = sell?'Sell':'Buy';
    btn.onclick = ()=>{
      if(sell){ if(action()){ Snd.play('coin'); renderShopMenu(npc); } else Snd.play('error'); }
      else if(Game.gold>=price){ Game.gold -= price; action(); Snd.play('coin'); renderShopMenu(npc); }
      else { Snd.play('error'); toast('Not enough gold'); }
    };
    it.appendChild(btn); grid.appendChild(it);
  }
  switch(npc.shop){
    case 'seeds': addRow('🌱 Seeds ×5', 20, ()=>Game.inv.seeds+=5); break;
    case 'animals':
      for(const k of ['chicken','duck','rabbit','pig','cow','goat']){
        const at = ANIMAL_TYPES[k];
        addRow(at.name+' ('+at.product+')', at.price, ()=>spawnAnimal(k));
      }
      break;
    case 'horses': addRow('🐴 Horse', ANIMAL_TYPES.horse.price, ()=>spawnAnimal('horse')); break;
    case 'weapons':
      for(let i=1;i<WEAPONS.length;i++){
        const w = WEAPONS[i];
        addRow('⚔ '+w.name+' (dmg '+w.dmg+')', w.price, ()=>{ if(Game.weaponLevel<i) Game.weaponLevel=i; });
      }
      for(let i=1;i<ARMORS.length;i++){
        const a = ARMORS[i];
        addRow('🛡 '+a.name+' (+'+a.hp+'HP)', a.price, ()=>{ if(Game.armorLevel<i){ Game.armorLevel=i; Game.maxHp = 100+a.hp; } });
      }
      for(const tool of ['axe','pick','hoe','can','rod']){
        const cur = Game.toolLevels[tool]||0;
        const next = cur+1;
        if(next<TOOL_LEVELS.length){
          const tl = TOOL_LEVELS[next];
          addRow('🔨 Upgrade '+toolName(tool)+' → '+tl.name, tl.price, ()=>{
            if((Game.inv[tl.resource]||0) >= tl.count){
              Game.inv[tl.resource] -= tl.count;
              Game.toolLevels[tool] = next;
              toast(toolName(tool)+' upgraded!');
            } else { toast('Need '+tl.count+' '+tl.resource); throw 0; }
          });
        }
      }
      break;
    case 'ores':
      addRow('Copper ×5', 40, ()=>Game.inv.copper+=5);
      addRow('Iron ×3', 80, ()=>Game.inv.iron+=3);
      addRow('Gold ×2', 150, ()=>Game.inv.gold_ore+=2);
      addRow('Iridium ×1', 300, ()=>Game.inv.iri+=1);
      break;
    case 'build':
      addRow('🏠 Cabin (30🪵)', 500, ()=>{
        if(Game.inv.wood>=30){
          Game.inv.wood -= 30;
          const px = Math.floor(player.x/TILE)+2, py = Math.floor(player.y/TILE);
          Game.builtBuildings.push({type:'cabin',x:px,y:py,w:8,h:7});
          World.farm.objects.push({id:'bb'+Date.now(), type:'cabin_obj', x:px*TILE, y:py*TILE, tx:px, ty:py, solid:true, sortY:py*TILE, building:true});
          toast('Built cabin!');
        } else { toast('Need 30 wood'); throw 0; }
      });
      break;
    case 'food': addRow('🍞 Bread ×3', 25, ()=>Game.inv.food+=3); break;
    case 'heal':
      addRow('❤ Potion', 60, ()=>Game.inv.potion=(Game.inv.potion||0)+1);
      addRow('💊 Full heal', 100, ()=>{ Game.hp = Game.maxHp; });
      break;
    case 'drinks': addRow('🍺 Ale', 20, ()=>Game.inv.food+=1); break;
    case 'exotic': addRow('🌱 Rare seeds ×3', 90, ()=>Game.inv.seeds+=3); break;
    case 'fish': addRow('Sell all fish', 15, ()=>{ let n = Game.inv.fish||0; if(n>0){ Game.gold += n*15; Game.inv.fish = 0; return true; } return false; }, true); break;
  }
  addRow('Sell raw goods', 8, ()=>{
    let sum = 0;
    for(const k of ['wood','stone','copper','iron','gold_ore','iri','fish','egg','milk','wool','slime','bone','feather']){
      if(Game.inv[k]){ sum += Game.inv[k]*8; Game.inv[k] = 0; }
    }
    if(sum>0){ Game.gold += sum; toast('+'+sum+'🪙'); return true; }
    return false;
  }, true);
  box.appendChild(grid);
}

// WORLD POPULATION
function populateWorld(){
  const w = World.farm;
  w.objects = [];
  const occ = new Set();
  for(let y=w.houseArea.y-1;y<w.houseArea.y+w.houseArea.h+1;y++)
    for(let x=w.houseArea.x-1;x<w.houseArea.x+w.houseArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.shopPos.y-1;y<w.shopPos.y+7;y++)
    for(let x=w.shopPos.x-1;x<w.shopPos.x+7;x++) occ.add(x+','+y);
  for(let y=w.penArea.y-1;y<w.penArea.y+w.penArea.h+1;y++)
    for(let x=w.penArea.x-1;x<w.penArea.x+w.penArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.stablePos.y-1;y<w.stablePos.y+6;y++)
    for(let x=w.stablePos.x-1;x<w.stablePos.x+8;x++) occ.add(x+','+y);
  for(let y=w.carpenterPos.y-1;y<w.carpenterPos.y+8;y++)
    for(let x=w.carpenterPos.x-1;x<w.carpenterPos.x+8;x++) occ.add(x+','+y);

  let id = 0;
  for(let t2=0;t2<70;t2++){
    const tx = 2+Math.floor(Math.random()*56);
    const ty = 2+Math.floor(Math.random()*44);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    let nw = false;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(w.tiles[ty+dy] && w.tiles[ty+dy][tx+dx]===T_WATER){ nw = true; break; }
    }
    if(nw) continue;
    const isPine = Math.random()<0.25;
    w.objects.push({ id:'t'+(id++), type:isPine?'pine':'tree',
      x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }
  for(let t2=0;t2<25;t2++){
    const tx = 2+Math.floor(Math.random()*56);
    const ty = 2+Math.floor(Math.random()*44);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    const kind = Math.random()<0.5 ? 'rock_s' : (Math.random()<0.6 ? 'rock_m' : 'rock_l');
    const hp = kind==='rock_s' ? 2 : kind==='rock_m' ? 3 : 4;
    w.objects.push({ id:'r'+(id++), type:kind, x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty,
      hp, maxHp:hp, solid:true, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }

  for(let t2=0;t2<70;t2++){

  for(let t2=0;t2<180;t2++){

      x:tx*TILE+8, y:(ty+1)*TILE, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true, sortY:(ty+1)*TILE });
    occ3.add(tx+','+ty);
  }
  for(let t2=0;t2<60;t2++){
    const tx = 2+Math.floor(Math.random()*44);
    const ty = 2+Math.floor(Math.random()*44);
    if(occ3.has(tx+','+ty)) continue;
    if(f.tiles[ty][tx]!==T_GRASS) continue;

  }
