// UPDATE
let lastTime = performance.now();
function update(dt){
  if(Game.paused || Game.menuOpen || Game.sleeping) return;
  Game.time += dt*0.001*(1200/(20*60));
  if(Game.time>=26*60){ Game.time = 26*60; forceSleep(); }
  if(Game.toastTimer>0) Game.toastTimer -= dt;
  if(player.action){ player.actionTimer -= dt; if(player.actionTimer<=0) player.action = null; }
  if(player.invuln>0) player.invuln -= dt;

  if(Game.fishing){
    Game.fishing.timer += dt;
    if(Game.fishing.timer>Game.fishing.duration && !Game.fishing.caught){
      Game.fishing.caught = true;
      const f = getFishingResult();
      if(Math.random() < f.chance+0.2){
        Game.fishCaught[f.name] = (Game.fishCaught[f.name]||0)+1;
        Game.inv.fish = (Game.inv.fish||0)+1;
        Snd.play('fish'); toast('🐟 '+f.name+' ('+f.price+'🪙)');
        addSkill('fishing', 5);
      } else { Snd.play('error'); toast('Nothing...'); }
    }
    if(Game.fishing.timer>Game.fishing.duration+800) Game.fishing = null;
    return;
  }

  let dx = 0, dy = 0;
  if(keys['w']||keys['arrowup']){ dy = -1; player.dir = 'u'; }
  if(keys['s']||keys['arrowdown']){ dy = 1; player.dir = 'd'; }
  if(keys['a']||keys['arrowleft']){ dx = -1; player.dir = 'l'; }
  if(keys['d']||keys['arrowright']){ dx = 1; player.dir = 'r'; }
  if(dx!==0||dy!==0){ player.targetX = null; player.targetY = null; player.actionTarget = null; }

  if(dx===0 && dy===0 && player.targetX!==null){
    const fx = player.x+12, fy = player.y+24;
    const tdx = player.targetX-fx, tdy = player.targetY-fy;
    const dist = Math.sqrt(tdx*tdx+tdy*tdy);
    if(dist<6){
      player.targetX = null; player.targetY = null;
      if(player.actionTarget){
        const atx = player.actionTarget.tx, aty = player.actionTarget.ty;
        const ddx = atx*TILE+TILE/2-fx, ddy = aty*TILE+TILE/2-fy;
        if(Math.abs(ddx)>Math.abs(ddy)) player.dir = ddx>0?'r':'l';
        else player.dir = ddy>0?'d':'u';
        if(Math.abs(ddx)<TILE*1.7 && Math.abs(ddy)<TILE*1.8){ doActionAt(atx, aty); }
        player.actionTarget = null;
      }
    } else {
      dx = tdx/dist; dy = tdy/dist;
      if(Math.abs(tdx)>Math.abs(tdy)) player.dir = tdx>0?'r':'l';
      else player.dir = tdy>0?'d':'u';
    }
  }
  if(dx!==0 && dy!==0){ dx *= 0.7071; dy *= 0.7071; }

  const moving = (dx!==0 || dy!==0);
  const speed = Game.onHorse ? player.speed*2.5 : player.speed;
  const nx = player.x + dx*speed;
  const ny = player.y + dy*speed;
  let blockedX = false, blockedY = false;
  if(!collides(nx, player.y)) player.x = nx; else blockedX = true;
  if(!collides(player.x, ny)) player.y = ny; else blockedY = true;
  if(moving && blockedX && blockedY){
    player.stuckTimer = (player.stuckTimer||0) + dt;
    if(player.stuckTimer>1500){ player.targetX = null; player.targetY = null; player.actionTarget = null; player.stuckTimer = 0; }
  } else player.stuckTimer = 0;

  if(Game.onHorse){
    const horse = World.farm.animals.find(a=>a.type==='horse'&&a.mounted);
    if(horse){ horse.x = player.x+8; horse.y = player.y+24; }
  }

  if(moving){
    player.walkTimer += dt;
    const ft = Game.onHorse ? 90 : 140;
    while(player.walkTimer>ft){
      player.walkTimer -= ft;
      const old = player.walkPhase;
      player.walkPhase = (player.walkPhase+1) % 4;
      if((old===0||old===2) && (player.walkPhase===1||player.walkPhase===3)) Snd.play('step');
    }
  } else { player.walkPhase = 0; player.walkTimer = 0; }

  const targetCamX = player.x+12-LW/2;
  const targetCamY = player.y+24-LH/2;
  camera.x += (targetCamX-camera.x) * Math.min(1, dt*0.02);
  camera.y += (targetCamY-camera.y) * Math.min(1, dt*0.02);
  const m = currentMap();
  camera.x = Math.max(0, Math.min(camera.x, Math.max(0, m.w*TILE-LW)));
  camera.y = Math.max(0, Math.min(camera.y, Math.max(0, m.h*TILE-LH)));

  if(Game.particles.length > 60) Game.particles.length = 60;
  for(let i=Game.particles.length-1;i>=0;i--){
    const p = Game.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt;
    if(p.life<=0) Game.particles.splice(i,1);
  }

  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(a.mounted) continue;
      if(a.produceTimer>0){ a.produceTimer -= dt; if(a.produceTimer<=0){ a.produceReady = true; a.produceTimer = 0; } }
      a.moveTimer -= dt;
      if(a.moveTimer<=0){
        a.moveTimer = 2000+Math.random()*2500;
        const pa = World.farm.penArea;
        a.tx = (pa.x+1+Math.random()*(pa.w-2))*TILE;
        a.ty = (pa.y+1+Math.random()*(pa.h-2))*TILE+16;
      }
      const adx = a.tx-a.x, ady = a.ty-a.y;
      const ad = Math.sqrt(adx*adx+ady*ady);
      if(ad>2){ a.x += adx/ad*0.35; a.y += ady/ad*0.35; a.dir = adx>0?1:-1;
        a.frameTimer += dt; if(a.frameTimer>260){ a.frameTimer=0; a.frame = (a.frame+1)%2; } }
    }
  }

  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    n.moveTimer -= dt;
    if(n.moveTimer<=0){
      n.moveTimer = 2500+Math.random()*3000;
      n.wanderTarget = {x:n.hx*TILE+8+(Math.random()-0.5)*40, y:n.hy*TILE+16+(Math.random()-0.5)*40};
    }
    const ndx = n.wanderTarget.x-n.x, ndy = n.wanderTarget.y-n.y;
    const nd = Math.sqrt(ndx*ndx+ndy*ndy);
    if(nd>2){
      const sp = 0.3;
      const nxn = n.x+ndx/nd*sp, nyn = n.y+ndy/nd*sp;
      let moved = false;
      if(!collidesTilesOnly(nxn,n.y)){ n.x = nxn; moved = true; }
      if(!collidesTilesOnly(n.x,nyn)){ n.y = nyn; moved = true; }
      if(moved){
        if(ndx>1) n.dir = 'r'; else if(ndx<-1) n.dir = 'l';
        n.walkTimer += dt;
        if(n.walkTimer>180){ n.walkTimer = 0; n.walkPhase = (n.walkPhase+1)%4; }
      } else n.moveTimer = 0;
    }
  }

  if(Game.map==='mine'){
    for(const mon of Game.monsters){
      if(mon.hitTimer>0){ mon.hitTimer -= dt; continue; }
      const ddx = player.x+12-mon.x, ddy = player.y+24-mon.y;
      const dist = Math.sqrt(ddx*ddx+ddy*ddy);
      if(dist<80){
        const sp = 0.5;
        const nxn = mon.x+ddx/dist*sp, nyn = mon.y+ddy/dist*sp;
        if(!collidesTilesOnly(nxn, mon.y)) mon.x = nxn;
        if(!collidesTilesOnly(mon.x, nyn)) mon.y = nyn;
        mon.dir = ddx>0?1:-1;
        if(dist<22 && player.invuln<=0){
          Game.hp -= mon.dmg; player.invuln = 800; Snd.play('hurt');
          spawnParticle(player.x+12, player.y+16, '#ff2020');
          if(Game.hp<=0){
            Game.hp = Game.maxHp;
            Game.map='farmhouse'; player.x = 3*TILE; player.y = 7*TILE;
            player.targetX = null; player.targetY = null; player.actionTarget = null;
            toast('You blacked out...');
          }
        }
      } else {
        mon.moveTimer -= dt;
        if(mon.moveTimer<=0){ mon.moveTimer = 2000+Math.random()*2000;
          mon.wanderTarget = {x:mon.x+(Math.random()-0.5)*80, y:mon.y+(Math.random()-0.5)*80}; }
        const mdx = mon.wanderTarget.x-mon.x, mdy = mon.wanderTarget.y-mon.y;
        const md = Math.sqrt(mdx*mdx+mdy*mdy);
        if(md>2){ mon.x += mdx/md*0.25; mon.y += mdy/md*0.25; mon.dir = mdx>0?1:-1; }
      }
      mon.frameTimer += dt;
      if(mon.frameTimer>300){ mon.frameTimer = 0; mon.frame = (mon.frame+1)%2; }
    }
  }

  const t2 = Game.time;
  let dn = 0;
  if(t2>=6*60 && t2<8*60) dn = 0.5 - ((t2-6*60)/120)*0.5;
  else if(t2>=8*60 && t2<18*60) dn = 0;
  else if(t2>=18*60 && t2<21*60) dn = ((t2-18*60)/180)*0.6;
  else if(t2>=21*60 || t2<6*60) dn = 0.6;
  if(Game.map==='mine') dn = 0.75;
  if(Game.map==='farmhouse' || Game.map.indexOf('interior')>=0) dn = 0;
  Game.dayNight = dn;

  checkMapTransition();
}

function collidesTilesOnly(x,y){
  const hbX = x+4, hbY = y+16, hbW = 16, hbH = 14;
  const corners = [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]];
  for(const [cx,cy] of corners){
    const t2 = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t2)) return true;
  }
  return false;
}
function collides(x,y){
  const hbX = x+4, hbY = y+16, hbW = 16, hbH = 14;
  const corners = [[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]];
  for(const [cx,cy] of corners){
    const t2 = tileAt(Math.floor(cx/TILE), Math.floor(cy/TILE));
    if(BLOCKING.has(t2)) return true;
  }
  const m = currentMap();
  if(m.objects) for(const o of m.objects){
    if(!o.solid) continue;
    if(o.building) continue;
    let ox, oy, ow, oh;
    if(o.type==='tree' || o.type==='pine'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-18; ow = TILE-4; oh = 18; }
    else if(o.type==='rock_s'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='rock_m'){ ox = o.tx*TILE-2; oy = (o.ty+1)*TILE-11; ow = TILE+4; oh = 11; }
    else if(o.type==='rock_l'){ ox = o.tx*TILE-4; oy = (o.ty+1)*TILE-12; ow = TILE+8; oh = 12; }
    else if(o.type==='barrel' || o.type==='signpost'){ ox = o.tx*TILE+2; oy = (o.ty+1)*TILE-10; ow = TILE-4; oh = 10; }
    else if(o.type==='bed' || o.type==='bed_canopy'){ ox = o.tx*TILE; oy = o.ty*TILE+TILE; ow = TILE*2; oh = TILE*2; }
    else if(o.type==='table' || o.type==='desk_fancy' || o.type==='workbench'){ ox = o.tx*TILE; oy = o.ty*TILE+TILE/2; ow = TILE*2; oh = TILE*1.5; }
    else if(o.type==='chest' || o.type==='bookshelf' || o.type==='furnace' || o.type==='medicine_cabinet' || o.type==='fridge' || o.type==='kitchen_stove' || o.type==='armor_stand' || o.type==='easel' || o.type==='mine_cart' || o.type==='hay_bale'){ ox = o.tx*TILE; oy = o.ty*TILE; ow = TILE*2; oh = TILE*2; }
    else if(o.type==='crop' || o.type==='flower_r' || o.type==='flower_y' || o.type==='flower_b' || o.type==='flower_w'
         || o.type==='mushroom' || o.type==='bush' || o.type==='rock_small' || o.type==='wood_stump'
         || o.type==='bench' || o.type==='lamp_post' || o.type==='plant'
         || o.type==='portrait' || o.type==='books_pile' || o.type==='radio' || o.type==='television'
         || o.type==='picture_frame' || o.type==='flower_vase' || o.type==='potted_herbs'
         || o.type==='rug_oval' || o.type==='wood_stool' || o.type==='shelf_wall'
         || o.type==='wall_clock' || o.type==='plant_fern' || o.type==='lantern_hang'
         || o.type==='sculpture' || o.type==='trophy' || o.type==='specimen_jar'
         || o.type==='mirror' || o.type==='market_crate' || o.type==='milk_can' || o.type==='neon_sign'
         || o.type==='camera_tripod' || o.type==='chair' || o.type==='cauldron' || o.type==='telescope') continue;
    else { ox = o.tx*TILE; oy = o.ty*TILE; ow = TILE*2; oh = TILE*2; }
    if(hbX<ox+ow && hbX+hbW>ox && hbY<oy+oh && hbY+hbH>oy) return true;
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(hbX<n.x-8+16 && hbX+hbW>n.x-8 && hbY<n.y-16+16 && hbY+hbH>n.y-16) return true;
  }
  if(Game.map==='farm'){
    for(const a of World.farm.animals){
      if(Game.onHorse && a.mounted) continue;
      if(hbX<a.x-8+16 && hbX+hbW>a.x-8 && hbY<a.y-14+14 && hbY+hbH>a.y-14) return true;
    }
    for(const bb of Game.builtBuildings){
      if(bb.type==='cabin'){
        const bx = bb.x*TILE, by = bb.y*TILE+50, bw = 8*TILE-8, bh = 7*TILE-50;
        if(hbX<bx+bw && hbX+hbW>bx && hbY<by+bh && hbY+hbH>by) return true;
      }
    }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const bx = b.x*TILE+4, by = b.y*TILE+40, bw = b.w*TILE-8, bh = b.h*TILE-40;
      if(hbX<bx+bw && hbX+hbW>bx && hbY<by+bh && hbY+hbH>by){
        if(b.door){
          const dx = b.door.x*TILE+2, dw = TILE-4;
          if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>by+bh-TILE*1.5) return false;
        }
        return true;
      }
    }
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    const hL = ha.x*TILE+4, hT = ha.y*TILE+50, hW = ha.w*TILE-8, hH = ha.h*TILE-50;
    const dX = World.farm.houseDoor.x*TILE+2, dW = TILE-4;
    if(hbX<hL+hW && hbX+hbW>hL && hbY<hT+hH && hbY+hbH>hT){
      if(hbX+hbW>dX && hbX<dX+dW && hbY+hbH>hT+hH-TILE*1.5) return false;
      return true;
    }
    const sp = World.farm.shopPos;
    const sL = sp.x*TILE, sT = sp.y*TILE+40, sW = 6*TILE, sH = 6*TILE-40;
    const sd = World.farm.shopDoor;
    if(hbX<sL+sW && hbX+hbW>sL && hbY<sT+sH && hbY+hbH>sT){
      const dx = sd.x*TILE+2, dw = TILE-4;
      if(hbX+hbW>dx && hbX<dx+dw && hbY+hbH>sT+sH-TILE*1.5) return false;
      return true;
    }
    const st = World.farm.stablePos;
    if(hbX<st.x*TILE+112 && hbX+hbW>st.x*TILE && hbY<st.y*TILE+80 && hbY+hbH>st.y*TILE+30) return true;
    const cp = World.farm.carpenterPos;
    if(hbX<cp.x*TILE+128 && hbX+hbW>cp.x*TILE && hbY<cp.y*TILE+112 && hbY+hbH>cp.y*TILE+50) return true;
  }
  return false;
}

// DRAW
function drawTile(t2,x,y){
  const s = Game.season;
  if(t2===0){ const v = (x ^ y) & 3; ctx.drawImage(S['t_grass_'+s+'_'+v], x, y); return; }
  switch(t2){
    case T_PATH: ctx.drawImage(S['t_dirt'], x, y); break;
    case T_WATER: ctx.drawImage(S['t_water'], x, y); break;
    case T_DEEP: ctx.drawImage(S['t_deep'], x, y); break;
    case T_TILL: ctx.drawImage(S['t_till'], x, y); break;
    case T_TILL_WET: ctx.drawImage(S['t_till_wet'], x, y); break;
    case T_FLOOR: ctx.drawImage(S['t_floor'], x, y); break;
    case T_WALL: ctx.drawImage(S['t_wall'], x, y); break;
    case T_SAND: ctx.drawImage(S['t_sand'], x, y); break;
    case T_ROCK: ctx.drawImage(S['t_rock'], x, y); break;
    case T_CAVE: ctx.drawImage(S['t_cave'], x, y); break;
    case T_CU: ctx.drawImage(S['t_copper'], x, y); break;
    case T_IR: ctx.drawImage(S['t_iron'], x, y); break;
    case T_GO: ctx.drawImage(S['t_gold'], x, y); break;
    case T_IRID: ctx.drawImage(S['t_iri'], x, y); break;
    case T_IND_FLOOR: ctx.drawImage(S['t_indoor_floor'], x, y); break;
    case T_IND_WALL: ctx.drawImage(S['t_indoor_wall'], x, y); break;
    case T_RUG: ctx.drawImage(S['t_rug'], x, y); break;
  }
}
function drawObject(o){
  let key = null, w = 16, h = 16;
  if(o.type==='tree'){ key='tree_'+Game.season; w=48; h=72; }
  else if(o.type==='pine'){ key='pine_'+Game.season; w=48; h=72; }
  else if(o.type==='rock_s'){ key='rock_s'; w=16; h=14; }
  else if(o.type==='rock_m'){ key='rock_m'; w=24; h=20; }
  else if(o.type==='rock_l'){ key='rock_l'; w=32; h=26; }
  else if(o.type==='crop'){ key='crop_'+o.cropType+'_'+o.stage; w=16; h=16; }
  else if(o.type==='bed'){ key='bed'; w=32; h=48; }
  else if(o.type==='bed_canopy'){ key='bed_canopy'; w=34; h=52; }
  else if(o.type==='table'){ key='table'; w=40; h=28; }
  else if(o.type==='desk_fancy'){ key='desk_fancy'; w=40; h=26; }
  else if(o.type==='chest'){ key='chest'; w=24; h=20; }
  else if(o.type==='bookshelf'){ key='bookshelf'; w=28; h=44; }
  else if(o.type==='plant'){ key='plant'; w=20; h=28; }
  else if(o.type==='lamp_post'){ key='lamp_post'; w=10; h=24; }
  else if(o.type==='workbench'){ key='workbench'; w=40; h=24; }
  else if(o.type==='furnace' || o.type==='furnace_obj'){ key='furnace'; w=32; h=32; }
  else if(o.type==='flower_r'||o.type==='flower_y'||o.type==='flower_b'||o.type==='flower_w'||o.type==='mushroom'){ key=o.type; w=8; h=10; }
  else if(o.building){ return; }
  else if(S[o.type]){ key=o.type; w=S[o.type].width; h=S[o.type].height; }
  if(!key || !S[key]) return;
  const dx = Math.round(o.x - w/2);
  const dy = Math.round(o.y - h);
  ctx.drawImage(S[key], dx, dy);
  if(o.hp!==undefined && o.maxHp!==undefined && o.hp<o.maxHp){
    const bw = 20, bx = Math.round(o.x-bw/2), by = dy-6;
    ctx.fillStyle = '#000'; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle = '#c04030'; ctx.fillRect(bx+1,by+1,(bw-2)*(o.hp/o.maxHp),1);
  }
}
function drawPlayer(){
  if(Game.onHorse){
    const hk = player.dir==='l' ? 'h_l_' : 'h_r_';
    const hf = player.walkPhase % 2;
    const hsp = S[hk+hf];
    if(hsp) ctx.drawImage(hsp, Math.round(player.x-12), Math.round(player.y+2));
  }
  ctx.drawImage(S['shadow'], Math.round(player.x), Math.round(player.y+22));
  let key;
  if(player.action==='sleep') key = 'c_'+player.dir+'_sleep';
  else if(player.action==='use') key = 'c_'+player.dir+'_use';
  else if(player.walkPhase>0) key = 'c_'+player.dir+'_'+player.walkPhase;
  else key = 'c_'+player.dir+'_idle';
  const sp = S[key] || S['c_d_idle'];
  if(player.invuln>0 && Math.floor(performance.now()/80)%2===0) ctx.globalAlpha = 0.5;
  const yOff = Game.onHorse ? -8 : 0;
  ctx.drawImage(sp, Math.round(player.x), Math.round(player.y+yOff));
  ctx.globalAlpha = 1;
}
function drawAnimal(a){
  let key;
  if(a.growthStage<1) key = ANIMAL_TYPES[a.type].baby;
  else if(a.type==='chicken') key = 'a_chicken'+(a.frame?'_1':'');
  else if(a.type==='duck') key = 'a_duck'+(a.frame?'_1':'');
  else if(a.type==='rabbit') key = 'a_rabbit'+(a.frame?'_1':'');
  else if(a.type==='pig') key = 'a_pig'+(a.frame?'_1':'');
  else if(a.type==='cow') key = 'a_cow'+(a.frame?'_1':'');
  else if(a.type==='goat') key = 'a_goat'+(a.frame?'_1':'');
  else if(a.type==='horse'){ if(a.mounted) return; key = 'h_r_'+(a.frame?1:0); }
  const sp = S[key]; if(!sp) return;
  const w = sp.width, h = sp.height;
  ctx.drawImage(S['shadow'], Math.round(a.x-w/2), Math.round(a.y-4));
  if(a.dir<0){
    ctx.save(); ctx.translate(Math.round(a.x)+w/2, 0); ctx.scale(-1,1); ctx.translate(-(Math.round(a.x)+w/2), 0);
    ctx.drawImage(sp, Math.round(a.x-w/2), Math.round(a.y-h)); ctx.restore();
  } else ctx.drawImage(sp, Math.round(a.x-w/2), Math.round(a.y-h));
  if(a.produceReady && a.growthStage>=1 && a.type!=='horse'){
    const bob = Math.sin(performance.now()/300)*1.5;
    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(ANIMAL_TYPES[a.type].icon, Math.round(a.x-5), Math.round(a.y-h-4+bob));
  }
}
function drawNPC(n){
  const idx = NPC_DATA.indexOf(n);
  const sp = S['npc'+idx+'_'+n.dir] || S['npc'+idx+'_d'];
  if(!sp) return;
  ctx.drawImage(S['shadow'], Math.round(n.x-14), Math.round(n.y-4));
  ctx.drawImage(sp, Math.round(n.x-12), Math.round(n.y-32));
  if(n.hearts>0){
    ctx.font = 'bold 8px sans-serif'; ctx.fillStyle = '#ff6080';
    ctx.fillText('♥'+Math.floor(n.hearts), Math.round(n.x-4), Math.round(n.y-36));
  }
  if(n.questGiven && !n.questDone){
    const bob = Math.sin(performance.now()/300)*2;
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ffd54a';
    ctx.fillText('!', Math.round(n.x-2), Math.round(n.y-42+bob));
  }
  if(!n.greetedToday){
    const bob = Math.sin(performance.now()/400)*1.5;
    ctx.font = 'bold 8px sans-serif'; ctx.fillStyle = '#a8d8ff';
    ctx.fillText('☺', Math.round(n.x+8), Math.round(n.y-42+bob));
  }
}
function drawMonster(m){
  const sp = S[m.sprite] || S['m_slime'];
  const w = sp.width, h = sp.height;
  ctx.drawImage(S['shadow'], Math.round(m.x-w/2-2), Math.round(m.y-4));
  if(m.hitTimer>0 && Math.floor(performance.now()/60)%2) ctx.globalAlpha = 0.5;
  if(m.dir<0){
    ctx.save(); ctx.translate(Math.round(m.x)+w/2, 0); ctx.scale(-1,1); ctx.translate(-(Math.round(m.x)+w/2), 0);
    ctx.drawImage(sp, Math.round(m.x-w/2), Math.round(m.y-h)); ctx.restore();
  } else ctx.drawImage(sp, Math.round(m.x-w/2), Math.round(m.y-h));
  ctx.globalAlpha = 1;
  if(m.hp<m.maxHp){
    const bw = 20, bx = Math.round(m.x-bw/2), by = Math.round(m.y-h)-6;
    ctx.fillStyle = '#000'; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle = '#c04030'; ctx.fillRect(bx+1,by+1,(bw-2)*(m.hp/m.maxHp),1);
  }
}

function drawWorld(){
  const dn = Game.dayNight;
  let skyTop = '#7ec4e8', skyBot = '#c8e0f0';
  if(Game.map==='mine'){ skyTop = '#1a1520'; skyBot = '#2a2028'; }
  else if(Game.map==='farmhouse' || Game.map.indexOf('interior')>=0){ skyTop = '#3a2a1a'; skyBot = '#4a3a2a'; }
  else if(Game.season===2){ skyTop = '#c89a60'; skyBot = '#e8c890'; }
  else if(Game.season===3){ skyTop = '#a8b8c8'; skyBot = '#d8e0e8'; }
  if(dn>0 && Game.map!=='mine' && Game.map!=='farmhouse'){
    skyTop = 'rgb('+Math.round(126*(1-dn)+20*dn)+','+Math.round(196*(1-dn)+20*dn)+','+Math.round(232*(1-dn)+50*dn)+')';
    skyBot = 'rgb('+Math.round(200*(1-dn)+15*dn)+','+Math.round(220*(1-dn)+15*dn)+','+Math.round(240*(1-dn)+30*dn)+')';
  }
  const grad = ctx.createLinearGradient(0,0,0,LH);
  grad.addColorStop(0, skyTop); grad.addColorStop(0.7, skyBot); grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad; ctx.fillRect(0,0,LW,LH);

  if(Game.map!=='mine' && Game.map!=='farmhouse' && Game.map.indexOf('interior')<0){
    const dayT = (Game.time - 6*60) / (20*60);
    const sunAngle = Math.PI * Math.max(0, Math.min(1, dayT));
    const sunX = LW * (0.1 + 0.8 * (1 - Math.cos(sunAngle))/2);
    const sunY = LH * 0.55 - Math.sin(sunAngle) * LH * 0.4;
    const isNight = Game.time >= 20*60 || Game.time < 6*60;
    if(dn > 0.4){
      for(let i=0;i<60;i++){
        const sx = ((i*137+12345) % 997) / 997 * LW;
        const sy = ((i*73+12345) % 397) / 397 * LH * 0.6;
        const twinkle = 0.5 + 0.5*Math.sin(performance.now()/800 + i);
        ctx.fillStyle = 'rgba(255,255,255,' + (dn * 0.7 * twinkle) + ')';
        ctx.fillRect(sx, sy, 1, 1);
      }
    }
    if(!isNight){
      ctx.fillStyle = '#fff0a0';
      ctx.beginPath(); ctx.arc(sunX, sunY, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,160,0.3)';
      ctx.beginPath(); ctx.arc(sunX, sunY, 20, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = '#e8e8f0';
      ctx.beginPath(); ctx.arc(sunX, sunY, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(232,232,240,0.2)';
      ctx.beginPath(); ctx.arc(sunX, sunY, 16, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  const m = currentMap();
  if(!m.tiles || !m.tiles.length){ ctx.restore(); return; }
  const startX = Math.max(0, Math.floor(camera.x/TILE));
  const endX = Math.min(m.w-1, Math.ceil((camera.x+LW)/TILE));
  const startY = Math.max(0, Math.floor(camera.y/TILE));
  const endY = Math.min(m.h-1, Math.ceil((camera.y+LH)/TILE));
  for(let y=startY;y<=endY;y++) for(let x=startX;x<=endX;x++) drawTile(m.tiles[y][x], x*TILE, y*TILE);

  if(Game.map==='mine' && m.ladder){ ctx.drawImage(S['ladder'], m.ladder.x*TILE, m.ladder.y*TILE); }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    ctx.drawImage(S['house'], ha.x*TILE, ha.y*TILE);
    const sp = World.farm.shopPos;
    ctx.drawImage(S['shop'], sp.x*TILE, sp.y*TILE);
    const st = World.farm.stablePos;
    ctx.drawImage(S['stable'], st.x*TILE, st.y*TILE);
    const cp = World.farm.carpenterPos;
    ctx.drawImage(S['carpenter'], cp.x*TILE, cp.y*TILE);
    for(const bb of Game.builtBuildings){
      const s = S[bb.type] || S['cabin'];
      if(s) ctx.drawImage(s, bb.x*TILE, bb.y*TILE);
    }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const sp = S[b.type];
      if(sp) ctx.drawImage(sp, b.x*TILE, b.y*TILE);
    }
  }
  if(Game.map==='museum_interior'){
    let idx = 0;
    for(const item of MUSEUM_ITEMS){
      const col = idx % 10, row = Math.floor(idx / 10);
      const px = (2+col)*TILE, py = (2+row*3)*TILE;
      ctx.drawImage(S['museum_pedestal'], px, py);
      if(Game.museumDonations[item.id]){
        ctx.fillStyle = '#e8c060';
        ctx.beginPath(); ctx.arc(px+12, py+8, 5, 0, Math.PI*2); ctx.fill();
      }
      idx++;
    }
  }
  if(Game.map==='house_interior' && Game.houseOwner){
    const b = World.town.buildings.find(x=>x.name === Game.houseOwner);
    if(b && b.residents){
      const isEvening = Game.time >= 18*60 || Game.time < 8*60;
      if(isEvening){
        const positions = [[3,5],[6,5],[9,5],[3,3],[6,3],[9,3]];
        let i = 0;
        for(const id of b.residents){
          const npc = NPC_DATA.find(n=>n.id===id);
          if(!npc) continue;
          const idx = NPC_DATA.indexOf(npc);
          const sp = S['npc'+idx+'_d'];
          const pos = positions[i] || [3,5];
          if(sp) ctx.drawImage(sp, pos[0]*TILE, pos[1]*TILE);
          ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#ffe8b0';
          ctx.fillText(npc.name, pos[0]*TILE, pos[1]*TILE-4);
          i++;
        }
      }
    }
  }

  if(player.targetX!==null){
    const tp = performance.now()/400;
    const pulse = 0.6+0.4*Math.sin(tp*Math.PI*2);
    ctx.strokeStyle = 'rgba(255,220,80,'+(0.5+pulse*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.targetX, player.targetY, 4+pulse*2, 0, Math.PI*2); ctx.stroke();
  }

  const items = [];
  const camL = camera.x - 64, camR = camera.x + LW + 64;
  const camT = camera.y - 100, camB = camera.y + LH + 64;
  if(m.objects) for(const o of m.objects){
    if(o.x < camL || o.x > camR || o.y < camT || o.y > camB) continue;
    items.push({y:o.sortY||o.y, draw:()=>drawObject(o)});
  }
  if(Game.map==='farm') for(const a of World.farm.animals){
    if(a.mounted) continue;
    if(a.x < camL || a.x > camR || a.y < camT || a.y > camB) continue;
    items.push({y:a.y, draw:()=>drawAnimal(a)});
  }
  for(const n of NPC_DATA){
    if(n.loc!==Game.map) continue;
    if(n.x < camL || n.x > camR || n.y < camT || n.y > camB) continue;
    items.push({y:n.y, draw:()=>drawNPC(n)});
  }
  if(Game.map==='mine') for(const mon of Game.monsters){
    if(mon.x < camL || mon.x > camR || mon.y < camT || mon.y > camB) continue;
    items.push({y:mon.y, draw:()=>drawMonster(mon)});
  }
  items.push({y:player.y+32, draw:drawPlayer});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items) it.draw();

  if(Game.fishing){
    const px = player.x+12, py = player.y+16;
    let fx = px, fy = py;
    if(player.dir==='d') fy += TILE*2; else if(player.dir==='u') fy -= TILE*2;
    else if(player.dir==='l') fx -= TILE*2; else fx += TILE*2;
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px+6, py-6); ctx.lineTo(fx, fy); ctx.stroke();
    const bob = Math.sin(performance.now()/200)*1.5;
    ctx.drawImage(S['bobber'], fx-3, fy-3+bob);
  }
  for(const p of Game.particles){
    ctx.globalAlpha = p.life/p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-1, p.y-1, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if(dn>0 && Game.map!=='farmhouse' && Game.map.indexOf('interior')<0){ ctx.fillStyle = 'rgba(10,10,30,'+(dn*0.5)+')'; ctx.fillRect(0,0,LW,LH); }
  if(Game.weather==='rain' && Game.map.indexOf('interior')<0 && Game.map!=='mine'){
    ctx.fillStyle = 'rgba(80,80,120,0.15)'; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<50;i++){
      const rx = (i*53+performance.now()*0.3)%LW;
      const ry = (i*37+performance.now()*0.6)%LH;
      ctx.fillStyle = 'rgba(180,200,255,0.5)';
      ctx.fillRect(rx, ry, 1, 4);
    }
  }
  if(Game.weather==='snow'){
    ctx.fillStyle = 'rgba(220,230,240,0.1)'; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<40;i++){
      const rx = (i*53+performance.now()*0.05)%LW;
      const ry = (i*37+performance.now()*0.15)%LH;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(rx, ry, 2, 2);
    }
  }
  if(Game.weather==='fog'){ ctx.fillStyle = 'rgba(220,220,230,0.25)'; ctx.fillRect(0,0,LW,LH); }
  const vg = ctx.createRadialGradient(LW/2,LH/2,LH*0.4,LW/2,LH/2,LH*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.28)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,LW,LH);
}

function drawHUD(){
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,6,116,44);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1; ctx.strokeRect(6.5,6.5,115,43);
  ctx.fillStyle = '#e8c060'; ctx.font = 'bold 9px monospace';
  const h = Math.floor(Game.time/60)%24, mn = Math.floor(Game.time%60);
  ctx.fillText(t('day')+' '+Game.day+' • '+t(SEASONS[Game.season]), 10, 18);
  ctx.fillText((h<10?'0':'')+h+':'+(mn<10?'0':'')+mn+'  '+Game.seasonDay+'/7', 10, 30);
  ctx.fillStyle = '#fff'; ctx.fillText('🪙 '+Game.gold, 10, 44);

  const locNames = {farm:'🌾 '+t('farm'), town:'🏘 '+t('town'), beach:'🏖 '+t('beach'),
    forest:'🌲 '+t('forest'), mountain:'🏔 '+t('mountain'), mine:'⛏ '+t('mine')+' '+World.mine.depth,
    farmhouse:'🏠 '+t('house'), museum_interior:'🏛 Museum', house_interior:'🏠 Home',
    shop_interior:'🏪 Shop', blacksmith_interior:'⚒ Forge'};
  ctx.fillStyle = 'rgba(20,15,10,0.85)';
  const lw = ctx.measureText(locNames[Game.map]||Game.map).width+16;
  ctx.fillRect(6,54,lw,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,54.5,lw-1,15);
  ctx.fillStyle = '#e8c060'; ctx.fillText(locNames[Game.map]||Game.map, 10, 65);

  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,74,80,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,74.5,79,15);
  const wi = {sunny:'☀️ '+t('sunny'), rain:'🌧 '+t('rain'), storm:'⛈ '+t('storm'), snow:'❄️ '+t('snow'), fog:'🌫 '+t('fog')}[Game.weather];
  ctx.fillStyle = '#e8c060'; ctx.fillText(wi, 10, 85);

  const mCount = Object.keys(Game.museumDonations).length;
  if(mCount > 0){
    ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,94,116,16);
    ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,94.5,115,15);
    ctx.fillStyle = '#e8c060'; ctx.fillText('🏛 '+mCount+'/'+MUSEUM_ITEMS.length, 10, 105);
  }

  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,6,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,6.5,117,15);
  const hP = Game.hp/Game.maxHp;
  ctx.fillStyle = '#3a1010'; ctx.fillRect(LW-121,9,112,10);
  ctx.fillStyle = '#d04040'; ctx.fillRect(LW-121,9,112*hP,10);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
  ctx.fillText('❤ '+Math.round(Game.hp), LW-117, 18);

  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,26,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,26.5,117,15);
  const eP = Game.energy/Game.maxEnergy;
  ctx.fillStyle = '#3a2a10'; ctx.fillRect(LW-121,29,112,10);
  ctx.fillStyle = eP>0.5 ? '#6ac04a' : eP>0.25 ? '#e0c040' : '#c04040';
  ctx.fillRect(LW-121,29,112*eP,10);
  ctx.fillStyle = '#fff'; ctx.fillText('⚡ '+Math.round(Game.energy), LW-117, 38);

  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,46,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,46.5,117,15);
  ctx.fillStyle = '#e8c060'; ctx.fillText('⚔ '+WEAPONS[Game.weaponLevel].name, LW-121, 57);

  const btns = [['I','inv',LW-124],['C','craft',LW-84],['M','map',LW-44]];
  for(const [label,action,x] of btns){
    ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(x,64,38,16);
    ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(x+0.5,64.5,37,15);
    ctx.fillStyle = '#e8c060'; ctx.font = 'bold 10px monospace';
    ctx.fillText(label, x+14, 75);
  }

  const hbW = 7*24+4;
  const hbX = (LW-hbW)/2;
  const hbY = LH-32;
  ctx.fillStyle = 'rgba(20,15,10,0.9)'; ctx.fillRect(hbX, hbY, hbW, 28);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2;
  ctx.strokeRect(hbX+1, hbY+1, hbW-2, 26); ctx.lineWidth = 1;
  for(let i=0;i<7;i++){
    const x = hbX+2+i*24, y = hbY+2;
    ctx.fillStyle = i===Game.selected ? 'rgba(232,192,96,0.35)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(x, y, 20, 20);
    if(i===Game.selected){ ctx.strokeStyle = '#e8c060'; ctx.lineWidth = 2; ctx.strokeRect(x,y,20,20); ctx.lineWidth = 1; }
    if(S['i_'+Game.hotbar[i]]) ctx.drawImage(S['i_'+Game.hotbar[i]], x+2, y+2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 7px monospace';
    ctx.fillText(String(i+1), x+1, y+8);
  }
  ctx.font = 'bold 9px monospace';
  const tn = toolName(Game.hotbar[Game.selected])+' ('+TOOL_LEVELS[Game.toolLevels[Game.hotbar[Game.selected]]||0].name+')';
  const tw = ctx.measureText(tn).width+12;
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(hbX, hbY-14, tw, 12);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(hbX+0.5, hbY-13.5, tw-1, 11);
  ctx.fillStyle = '#e8c060'; ctx.fillText(tn, hbX+6, hbY-5);

  if(Game.toastTimer>0){
    const alpha = Math.min(1, Game.toastTimer/300);
    ctx.font = 'bold 11px monospace';
    const tw2 = ctx.measureText(Game.toast).width+22;
    ctx.fillStyle = 'rgba(20,15,10,'+(0.9*alpha)+')';
    ctx.fillRect((LW-tw2)/2, 60, tw2, 18);
    ctx.strokeStyle = 'rgba(138,90,42,'+alpha+')';
    ctx.strokeRect((LW-tw2)/2+0.5, 60.5, tw2-1, 17);
    ctx.fillStyle = 'rgba(232,192,96,'+alpha+')';
    ctx.textAlign = 'center';
    ctx.fillText(Game.toast, LW/2, 73);
    ctx.textAlign = 'left';
  }
}

function loop(now){
  let dt = now-lastTime;
  lastTime = now;
  if(dt>100) dt = 100;
  if(dt<0) dt = 0;
  try{
    update(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,CW,CH);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    drawWorld();
    if(!Game.paused && !Game.menuOpen) drawHUD();
  }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

// INIT
function renderLangSelect(){
  const g = $('langGrid'); g.innerHTML = '';
  for(const l of LANGS){
    const btn = document.createElement('button');
    btn.className = 'lang-btn';
    btn.innerHTML = '<span style="font-size:24px">'+l.flag+'</span><span>'+l.name+'</span>';
    btn.onclick = ()=>{
      LANG = l.code;
      localStorage.setItem('pixelfarm_lang', LANG);
      Snd.init(); Snd.resume(); Snd.play('click');
      showMainMenu();
    };
    g.appendChild(btn);
  }
}
renderLangSelect();

function applyLanguage(){
  $('btnNew').textContent = t('newGame');
  $('btnContinue').textContent = t('cont');
  $('btnHelp').textContent = t('controls');
  $('helpBody').innerHTML = t('helpText');
  $('btnHelpBack').textContent = t('back');
  document.querySelectorAll('.tab-btn')[0].textContent = t('inventory').toUpperCase();
  document.querySelectorAll('.tab-btn')[1].textContent = t('craft').toUpperCase();
  document.querySelectorAll('.tab-btn')[2].textContent = t('museum').toUpperCase();
  document.querySelectorAll('.tab-btn')[3].textContent = t('skills').toUpperCase();
  document.querySelectorAll('.tab-btn')[4].textContent = t('social').toUpperCase();
  document.querySelectorAll('.tab-btn')[5].textContent = t('map').toUpperCase();
  document.querySelectorAll('.tab-btn')[6].textContent = t('character').toUpperCase();
  document.querySelectorAll('.tab-btn')[7].textContent = t('options').toUpperCase();
  $('btnMenuResume').textContent = t('resume');
  $('btnMenuSave').textContent = t('save');
  $('btnMenuMain').textContent = t('mainMenu');
}

function showScreen(id){
  ['langSelect','menuMain','menuHelp','endingScreen','loadingScreen'].forEach(sid=>{
    const el = $(sid);
    if(el) el.classList.toggle('hidden', sid!==id);
  });
}
function showMainMenu(){
  if(hasSave()) $('btnContinue').style.display = 'block';
  else $('btnContinue').style.display = 'none';
  showScreen('menuMain');
  applyLanguage();
  Game.paused = true;
  Game.menuOpen = false;
  $('gameMenu').classList.remove('show');
  Snd.stopAll();
}

$('btnNew').onclick = ()=>{ Snd.init(); Snd.resume(); Snd.play('click'); newGame(); };
$('btnContinue').onclick = ()=>{
  Snd.init(); Snd.resume();
  if(loadGame()){
    Snd.play('click');
    showScreen(null);
    Game.paused = false;
    Snd.startMusic();
  } else toast('No save');
};
$('btnHelp').onclick = ()=>{ Snd.play('click'); showScreen('menuHelp'); };
$('btnHelpBack').onclick = ()=>{ Snd.play('click'); showScreen('menuMain'); };

// Load sequence
function loadStep(step, total, text){
  const pct = Math.round((step/total)*100);
  $('loadBar').style.width = pct + '%';
  $('loadPct').textContent = pct + '%';
  if(text) $('loadText').textContent = text;
}

async function doLoadSequence(){
  loadStep(1, 6, 'Initializing canvas...');
  await new Promise(r=>setTimeout(r, 30));
  loadStep(2, 6, 'Generating character...');
  regenerateChar();
  await new Promise(r=>setTimeout(r, 30));
  loadStep(3, 6, 'Preparing world...');
  await new Promise(r=>setTimeout(r, 30));
  loadStep(4, 6, 'Populating farm...');
  populateWorld();
  await new Promise(r=>setTimeout(r, 30));
  loadStep(5, 6, 'Loading audio...');
  await new Promise(r=>setTimeout(r, 30));
  loadStep(6, 6, 'Ready!');
  await new Promise(r=>setTimeout(r, 300));
  $('loadingScreen').classList.add('hidden');
  if(!LANG){
    showScreen('langSelect');
    Game.paused = true;
  } else {
    showMainMenu();
  }
  lastTime = performance.now();
  requestAnimationFrame(loop);
}
doLoadSequence();
</script>
