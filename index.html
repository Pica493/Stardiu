<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Pixel Farm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1a0a;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;position:fixed}
#canvasWrapper{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#0a1a0a;overflow:hidden}
#gameCanvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;box-shadow:0 0 40px rgba(0,0,0,.9);cursor:pointer}
#touchControls{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
#touchControls.active{display:block}
.tc-btn{position:absolute;pointer-events:auto;background:rgba(142,201,111,.35);border:2px solid rgba(142,201,111,.75);border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-weight:bold;user-select:none;transition:all .06s;touch-action:none;font-size:11px;text-align:center;padding:4px}
.tc-btn:active,.tc-btn.pressed{background:rgba(142,201,111,.9);transform:scale(.94)}
.tc-dpad-up{bottom:200px;left:60px;width:56px;height:56px;font-size:20px}
.tc-dpad-down{bottom:80px;left:60px;width:56px;height:56px;font-size:20px}
.tc-dpad-left{bottom:140px;left:0px;width:56px;height:56px;font-size:20px}
.tc-dpad-right{bottom:140px;left:120px;width:56px;height:56px;font-size:20px}
.tc-action{bottom:100px;right:30px;width:80px;height:80px;font-size:13px}
.tc-inv{bottom:190px;right:40px;width:56px;height:56px;font-size:11px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#1a2a1a 0%,#0d0d0d 100%);z-index:100;padding:16px;gap:8px;overflow-y:auto}
.screen.hidden{display:none}
.screen h1{font-size:clamp(28px,8vw,56px);letter-spacing:4px;color:#8ec96f;text-shadow:0 4px 0 #1a2a1a,0 8px 20px rgba(142,201,111,.4);margin-bottom:16px;font-family:'Courier New',monospace;text-align:center}
.screen h2{font-size:clamp(20px,5vw,32px);color:#8ec96f;margin-bottom:16px;text-align:center}
.screen button{background:#2a4a2a;color:#d8ffd0;border:2px solid #4a7a4a;padding:12px 28px;font-size:clamp(14px,3.8vw,17px);cursor:pointer;border-radius:6px;font-family:inherit;letter-spacing:1px;transition:all .15s;min-width:200px;max-width:92vw;touch-action:manipulation}
.screen button:hover{background:#3a6a3a;border-color:#8ec96f}
.screen button:active{transform:scale(.97)}
.screen button.primary{background:#4a7a2a;border-color:#8ec96f}
.screen button.small{min-width:100px;padding:8px 16px;font-size:13px}
#sleepFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .8s}
#sleepFade.active{opacity:1}
#sleepText{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:61;pointer-events:none;color:#fff;font-family:'Courier New',monospace;font-size:clamp(18px,4vw,28px);text-shadow:0 2px 8px #000;gap:8px}
#sleepText.show{display:flex}
#notify{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd54a;padding:8px 16px;border-radius:6px;font-size:13px;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid #8ec96f;max-width:80vw;text-align:center}
#notify.show{opacity:1}
#shopPanel{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:12px}
#shopPanel.show{display:flex}
#shopPanel h2{color:#ffd54a;font-size:24px;font-family:'Courier New',monospace;margin-bottom:8px}
.shop-row{display:flex;align-items:center;gap:12px;background:#1a2a1a;border:2px solid #4a7a4a;padding:10px 16px;border-radius:8px;min-width:280px;justify-content:space-between}
.shop-row .info{display:flex;align-items:center;gap:12px}
.shop-row .price{color:#ffd54a;font-weight:bold}
.shop-row button{min-width:80px;padding:8px 16px;font-size:13px;background:#4a7a2a;border-color:#8ec96f}
#shopPanel button.close{background:#4a2020;border-color:#7a3a3a;color:#ffb0b0;padding:10px 30px}
</style>
</head>
<body>
<div id="canvasWrapper"><canvas id="gameCanvas" width="800" height="600"></canvas></div>
<div id="touchControls"></div>
<div id="sleepFade"></div>
<div id="sleepText"></div>
<div id="notify"></div>

<div id="shopPanel">
  <h2>🏪 Лавка</h2>
  <div id="shopItems"></div>
  <button class="close" id="shopClose">Закрыть</button>
</div>

<div id="menuMain" class="screen">
  <h1>PIXEL FARM</h1>
  <button id="btnNew" class="primary">Новая игра</button>
  <button id="btnHelp" class="small">Управление</button>
</div>
<div id="menuHelp" class="screen hidden">
  <h2>Управление</h2>
  <div style="max-width:440px;text-align:left;font-size:14px;line-height:1.8;color:#d8ffd0">
    <p><b style="color:#ffd54a">Клик / тап по земле</b> — идти / действовать</p>
    <p><b style="color:#ffd54a">WASD / стрелки</b> — движение</p>
    <p><b style="color:#ffd54a">Пробел</b> — использовать инструмент</p>
    <p><b style="color:#ffd54a">E</b> — дверь / кровать / лавка</p>
    <p><b style="color:#ffd54a">1-7</b> — выбрать инструмент</p>
    <p><b style="color:#ffd54a">Esc</b> — пауза</p>
    <hr style="margin:10px 0;border-color:#3a5a3a">
    <p>🔨 Топор, ⛏ Кирка, 🌾 Мотыга, 💧 Лейка, 🌱 Семена, 🎣 Удочка, 🍞 Еда</p>
  </div>
  <button id="btnHelpBack" class="small">Назад</button>
</div>
<div id="menuPause" class="screen hidden">
  <h2>Пауза</h2>
  <button id="btnResume" class="primary">Продолжить</button>
  <button id="btnHelpPause" class="small">Управление</button>
  <button id="btnToMain" class="small">В главное меню</button>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('gameCanvas');
const ctx=canvas.getContext('2d',{alpha:false});
const SCALE=2;
const CW=canvas.width, CH=canvas.height;
const LW=CW/SCALE, LH=CH/SCALE;
const TILE=32;
const MAP_W=42, MAP_H=32;

// ============================================================
// AUDIO
// ============================================================
const Sound={
  ctx:null, masterGain:null, musicGain:null,
  musicTimer:null, playingMusic:false, enabled:true,
  init(){
    if(this.ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC){this.enabled=false;return;}
      this.ctx=new AC();
      this.masterGain=this.ctx.createGain();this.masterGain.gain.value=0.5;
      this.masterGain.connect(this.ctx.destination);
      this.musicGain=this.ctx.createGain();this.musicGain.gain.value=0.15;
      this.musicGain.connect(this.masterGain);
    }catch(e){this.enabled=false;}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},
  play(type){
    if(!this.ctx||!this.enabled) return;
    const now=this.ctx.currentTime, out=this.masterGain;
    try{
      if(type==='step'){
        const buf=this.ctx.createBuffer(1,800,this.ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/120);
        const src=this.ctx.createBufferSource();src.buffer=buf;
        const flt=this.ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=800;
        const g=this.ctx.createGain();g.gain.value=0.15;
        src.connect(flt).connect(g).connect(out);src.start(now);
      } else if(type==='chop'){
        const o=this.ctx.createOscillator();o.type='square';
        o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(80,now+0.12);
        const g=this.ctx.createGain();g.gain.setValueAtTime(0.35,now);
        g.gain.exponentialRampToValueAtTime(0.01,now+0.15);
        o.connect(g).connect(out);o.start(now);o.stop(now+0.16);
      } else if(type==='pick'){
        const o=this.ctx.createOscillator();o.type='square';
        o.frequency.setValueAtTime(1200,now);o.frequency.exponentialRampToValueAtTime(400,now+0.08);
        const g=this.ctx.createGain();g.gain.setValueAtTime(0.2,now);
        g.gain.exponentialRampToValueAtTime(0.01,now+0.1);
        o.connect(g).connect(out);o.start(now);o.stop(now+0.11);
      } else if(type==='plant'){
        const o=this.ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(400,now);o.frequency.linearRampToValueAtTime(700,now+0.15);
        const g=this.ctx.createGain();g.gain.setValueAtTime(0.15,now);
        g.gain.exponentialRampToValueAtTime(0.01,now+0.2);
        o.connect(g).connect(out);o.start(now);o.stop(now+0.21);
      } else if(type==='water'){
        const buf=this.ctx.createBuffer(1,3000,this.ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/500);
        const src=this.ctx.createBufferSource();src.buffer=buf;
        const flt=this.ctx.createBiquadFilter();flt.type='highpass';flt.frequency.value=2000;
        const g=this.ctx.createGain();g.gain.value=0.2;
        src.connect(flt).connect(g).connect(out);src.start(now);
      } else if(type==='harvest'){
        [523.25,659.25,783.99].forEach((f,i)=>{
          const t=now+i*0.06;const o=this.ctx.createOscillator();
          o.type='sine';o.frequency.value=f;
          const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);
          g.gain.linearRampToValueAtTime(0.18,t+0.02);
          g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
          o.connect(g).connect(out);o.start(t);o.stop(t+0.35);
        });
      } else if(type==='fish'){
        [440,554,659,880].forEach((f,i)=>{
          const t=now+i*0.08;const o=this.ctx.createOscillator();
          o.type='triangle';o.frequency.value=f;
          const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);
          g.gain.linearRampToValueAtTime(0.2,t+0.03);
          g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
          o.connect(g).connect(out);o.start(t);o.stop(t+0.45);
        });
      } else if(type==='coin'){
        [880,1320].forEach((f,i)=>{
          const t=now+i*0.05;const o=this.ctx.createOscillator();
          o.type='square';o.frequency.value=f;
          const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);
          g.gain.linearRampToValueAtTime(0.15,t+0.01);
          g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
          o.connect(g).connect(out);o.start(t);o.stop(t+0.22);
        });
      } else if(type==='click'){
        const o=this.ctx.createOscillator();o.type='square';o.frequency.value=880;
        const g=this.ctx.createGain();g.gain.setValueAtTime(0.1,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+0.05);
        o.connect(g).connect(out);o.start(now);o.stop(now+0.06);
      } else if(type==='sleep'){
        const o=this.ctx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(90,now);o.frequency.linearRampToValueAtTime(60,now+0.8);
        const g=this.ctx.createGain();g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(0.2,now+0.3);
        g.gain.linearRampToValueAtTime(0,now+1.0);
        o.connect(g).connect(out);o.start(now);o.stop(now+1.05);
      } else if(type==='error'){
        const o=this.ctx.createOscillator();o.type='sawtooth';o.frequency.value=120;
        const g=this.ctx.createGain();g.gain.setValueAtTime(0.15,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
        o.connect(g).connect(out);o.start(now);o.stop(now+0.16);
      }
    }catch(e){}
  },
  startMusic(){
    if(!this.ctx||this.playingMusic) return;
    this.playingMusic=true;
    const melody=[
      {n:392,d:.4},{n:440,d:.4},{n:493.88,d:.4},{n:587.33,d:.8},
      {n:523.25,d:.4},{n:493.88,d:.4},{n:440,d:.4},{n:392,d:.8},
      {n:349.23,d:.4},{n:392,d:.4},{n:440,d:.4},{n:493.88,d:1.2},
      {n:440,d:.4},{n:392,d:.4},{n:349.23,d:.4},{n:329.63,d:.8},
      {n:293.66,d:.4},{n:329.63,d:.4},{n:349.23,d:.4},{n:392,d:1.2},
    ];
    let idx=0;
    const step=()=>{
      if(!this.playingMusic||!this.ctx) return;
      const note=melody[idx];const t=this.ctx.currentTime;
      try{
        const o=this.ctx.createOscillator();o.type='triangle';o.frequency.value=note.n;
        const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.4,t+0.03);
        g.gain.linearRampToValueAtTime(0.15,t+note.d*0.5);
        g.gain.linearRampToValueAtTime(0,t+note.d);
        o.connect(g).connect(this.musicGain);o.start(t);o.stop(t+note.d);
      }catch(e){}
      idx=(idx+1)%melody.length;
    };
    step();
    this.musicTimer=setInterval(step,480);
  },
  stopMusic(){this.playingMusic=false;if(this.musicTimer){clearInterval(this.musicTimer);this.musicTimer=null;}}
};

// ============================================================
// SPRITE GENERATION
// ============================================================
const S={};
function spr(name,w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g,w,h);S[name]=c;return c;}
function r(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h);}
function mirror(src,dst){const s=S[src];if(!s)return;const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.translate(s.width,0);g.scale(-1,1);g.drawImage(s,0,0);S[dst]=c;}

// --- CHARACTER ---
const P={skin:'#f4c99a',skinD:'#b08060',hair:'#5a3a1a',hairD:'#3a2510',
  hatT:'#e8c060',hatB:'#b08838',hatBand:'#6a3a1a',
  shirt:'#4a80c0',shirtD:'#2a4a80',shirtL:'#6aa0e0',
  pants:'#3a3a4a',pantsD:'#252535',boot:'#1a0a05',eye:'#1a0d05',mouth:'#8a4a3a'};

function drawChar(g,dir,phase,action){
  const bx=8,by=4;
  let legL=0,legR=0,bob=0,armL=0,armR=0;
  if(phase===1){legL=-1;legR=1;bob=-1;armL=1;armR=-1;}
  else if(phase===3){legL=1;legR=-1;bob=-1;armL=-1;armR=1;}
  if(action==='sleep'){
    r(g,4,18,24,8,P.shirt);r(g,4,18,24,2,P.shirtD);
    r(g,2,20,5,5,P.skin);r(g,1,19,6,3,P.hatB);r(g,2,18,4,2,P.hatT);
    r(g,26,22,5,3,P.boot);r(g,24,19,4,4,P.pants);
    g.fillStyle='#fff';g.font='8px monospace';g.fillText('z',22,14);g.fillText('Z',26,10);
    return;
  }
  const y=by+bob;
  if(dir==='u'){
    r(g,bx+3,y+0,10,2,P.hatT);r(g,bx+2,y+2,12,2,P.hatB);r(g,bx+3,y+2,10,1,P.hatBand);
    r(g,bx+4,y+4,8,7,P.hair);r(g,bx+4,y+9,8,2,P.hairD);
    r(g,bx+1,y+13+armL,2,7,P.shirtD);r(g,bx+13,y+13+armR,2,7,P.shirtD);
    r(g,bx+4,y+9,8,10,P.shirt);r(g,bx+4,y+17,8,2,P.shirtD);
    r(g,bx+4,y+19+legL,3,6,P.pants);r(g,bx+9,y+19+legR,3,6,P.pants);
    r(g,bx+3,y+24+legL,4,2,P.boot);r(g,bx+9,y+24+legR,4,2,P.boot);
  } else if(dir==='d'){
    r(g,bx+3,y+0,10,2,P.hatT);r(g,bx+2,y+2,12,2,P.hatB);r(g,bx+3,y+2,10,1,P.hatBand);
    r(g,bx+4,y+4,8,6,P.skin);r(g,bx+3,y+4,1,6,P.hair);r(g,bx+12,y+4,1,6,P.hair);
    r(g,bx+5,y+5,1,1,P.hair);r(g,bx+10,y+5,1,1,P.hair);
    r(g,bx+5,y+7,1,2,P.eye);r(g,bx+10,y+7,1,2,P.eye);
    r(g,bx+7,y+9,2,1,P.mouth);
    r(g,bx+1,y+12+armL,2,7,P.shirt);r(g,bx+13,y+12+armR,2,7,P.shirt);
    r(g,bx+1,y+18+armL,2,2,P.skin);r(g,bx+13,y+18+armR,2,2,P.skin);
    r(g,bx+4,y+9,8,10,P.shirt);r(g,bx+4,y+17,8,2,P.shirtD);
    r(g,bx+4,y+19+legL,3,6,P.pants);r(g,bx+9,y+19+legR,3,6,P.pants);
    r(g,bx+3,y+24+legL,4,2,P.boot);r(g,bx+9,y+24+legR,4,2,P.boot);
    if(action==='use'){
      r(g,bx+13,y+11,3,6,P.shirt);r(g,bx+14,y+9,2,2,P.skin);
      r(g,bx+15,y+3,2,8,'#8a5a30');
      r(g,bx+12,y+1,6,3,'#a0a8b0');r(g,bx+12,y+1,6,1,'#c0c8d0');
    }
  } else {
    if(dir==='l') return; // generate as 'r' then mirror
    r(g,bx+4,y+0,8,2,P.hatT);r(g,bx+4,y+2,10,2,P.hatB);r(g,bx+4,y+2,8,1,P.hatBand);
    r(g,bx+7,y+4,7,6,P.skin);r(g,bx+6,y+4,2,4,P.hair);
    r(g,bx+9,y+8,2,2,P.skinD);
    r(g,bx+11,y+6,1,2,P.eye);
    r(g,bx+8,y+9,3,1,P.mouth);
    r(g,bx+7,y+9,7,10,P.shirt);r(g,bx+7,y+17,7,2,P.shirtD);
    r(g,bx+5,y+12+armR,2,7,P.shirtD);
    r(g,bx+11,y+12+armL,2,7,P.shirt);
    r(g,bx+11,y+18+armL,2,2,P.skin);
    r(g,bx+7,y+19+legL,3,6,P.pants);r(g,bx+10,y+19+legR,3,6,P.pants);
    r(g,bx+7,y+24+legL,4,2,P.boot);r(g,bx+10,y+24+legR,4,2,P.boot);
    if(action==='use'){
      r(g,bx+11,y+11,3,6,P.shirt);r(g,bx+12,y+9,2,2,P.skin);
      r(g,bx+13,y+3,2,8,'#8a5a30');
      r(g,bx+11,y+1,6,3,'#a0a8b0');r(g,bx+11,y+1,6,1,'#c0c8d0');
    }
  }
}

const DIRS=['d','u','l','r'];
for(const d of DIRS){
  for(let f=0;f<4;f++) spr('char_'+d+'_'+f,32,32,g=>drawChar(g,d,f,null));
  spr('char_'+d+'_idle',32,32,g=>drawChar(g,d,-1,null));
  spr('char_'+d+'_use',32,32,g=>drawChar(g,d,-1,'use'));
  spr('char_'+d+'_sleep',32,32,g=>drawChar(g,d,-1,'sleep'));
}
for(let f=0;f<4;f++) mirror('char_r_'+f,'char_l_'+f);
mirror('char_r_idle','char_l_idle');
mirror('char_r_use','char_l_use');
mirror('char_r_sleep','char_l_sleep');

// --- TOOL ICONS ---

function drawGrassTile(g,season,v){
  const c=SEASON_COLORS[season];
  if(season===3){
    r(g,0,0,TILE,TILE,'#d8e0e8');

  if(v===0){r(g,6,8,3,2,c.g2);r(g,18,12,4,2,c.g2);r(g,10,22,5,2,c.g3);r(g,22,25,3,2,c.g2);r(g,14,18,2,2,c.g4);}

}

// --- CROPS: 5 stages × 5 types ---
const CROP_TYPES=['wheat','carrot','tomato','potato','corn','pumpkin'];
function drawCrop(g,type,stage){
  const cx=16;
  if(stage===0){r(g,cx-2,28,4,3,'#5a3a1a');r(g,cx-1,26,2,2,'#4a8a2a');return;}
  if(stage===1){r(g,cx-1,26,2,5,'#4a8a2a');r(g,cx-4,24,4,2,'#5aa04a');r(g,cx+1,24,4,2,'#5aa04a');return;}
  if(stage===2){r(g,cx-1,22,2,9,'#4a8a2a');r(g,cx-5,18,5,3,'#5aa04a');r(g,cx+1,18,5,3,'#5aa04a');r(g,cx-4,21,3,2,'#5aa04a');r(g,cx+2,21,3,2,'#5aa04a');return;}
  if(stage===3){r(g,cx-1,18,2,13,'#4a8a2a');r(g,cx-6,14,6,4,'#5aa04a');r(g,cx+1,14,6,4,'#5aa04a');r(g,cx-6,18,6,3,'#5aa04a');r(g,cx+1,18,6,3,'#5aa04a');r(g,cx-4,10,3,4,'#5aa04a');r(g,cx+2,10,3,4,'#5aa04a');return;}
  // stage 4 - harvest ready
  if(type==='wheat'){
    r(g,cx-1,10,2,19,'#c8a840');
    for(let i=0;i<4;i++){
      r(g,cx-4,10+i*5,3,4,'#e0c050');
      r(g,cx+2,10+i*5,3,4,'#e0c050');
    }
    r(g,cx-3,8,2,3,'#f0d060');r(g,cx+2,8,2,3,'#f0d060');
  } else if(type==='carrot'){
    r(g,cx-6,20,4,8,'#e07020');r(g,cx+2,20,4,8,'#e07020');
    r(g,cx-6,20,4,1,'#f09040');r(g,cx+2,20,4,1,'#f09040');
    r(g,cx-1,12,2,10,'#4a8a2a');r(g,cx-5,10,4,3,'#5aa04a');r(g,cx+2,10,4,3,'#5aa04a');
  } else if(type==='tomato'){
    r(g,cx-7,18,6,6,'#d03030');r(g,cx+1,18,6,6,'#d03030');
    r(g,cx-6,19,3,3,'#f05050');r(g,cx+3,19,3,3,'#f05050');
    r(g,cx-1,16,2,3,'#4a8a2a');r(g,cx-5,12,4,3,'#5aa04a');r(g,cx+1,12,4,3,'#5aa04a');
  } else if(type==='potato'){
    r(g,cx-6,22,5,6,'#a87848');r(g,cx+1,22,5,6,'#a87848');
    r(g,cx-5,23,3,2,'#c89868');r(g,cx+2,23,3,2,'#c89868');
    r(g,cx-1,14,2,10,'#4a8a2a');r(g,cx-4,12,3,3,'#5aa04a');r(g,cx+1,12,3,3,'#5aa04a');
  } else if(type==='corn'){
    r(g,cx-1,8,2,21,'#4a8a2a');
    r(g,cx-5,10,4,8,'#c8a840');r(g,cx+2,10,4,8,'#c8a840');
    r(g,cx-5,10,4,2,'#e0c050');r(g,cx+2,10,4,2,'#e0c050');
    r(g,cx-4,6,3,4,'#5aa04a');r(g,cx+2,6,3,4,'#5aa04a');
  } else if(type==='pumpkin'){
    r(g,cx-7,20,14,10,'#e08020');
    r(g,cx-7,20,14,2,'#f0a040');
    r(g,cx-3,20,2,10,'#c06818');
    r(g,cx+2,20,2,10,'#c06818');
    r(g,cx-1,16,2,4,'#4a8a2a');
    r(g,cx-6,14,4,3,'#5aa04a');
    r(g,cx+2,14,4,3,'#5aa04a');
  }
}

const T_GRASS=0,T_PATH=1,T_WATER=2,T_TILL=3,T_TILL_WET=4,T_FLOOR=5,T_WALL=6;

function makeOutdoorMap(){
  const map=[];
  for(let y=0;y<MAP_H;y++){
    const row=[];for(let x=0;x<MAP_W;x++) row.push(T_GRASS);

  }
  // Lake
  for(let y=20;y<27;y++)for(let x=28;x<38;x++){
    const dx=(x-32.5),dy=(y-23);
    if(dx*dx/1.2+dy*dy < 15) map[y][x]=T_WATER;
  }
  // Path from house
  for(let x=17;x<27;x++) map[15][x]=T_PATH;
  for(let y=15;y<20;y++) map[y]=map[y]||[];
  // Shop path
  for(let y=10;y<15;y++) map[y][10]=T_PATH;
  for(let x=10;x<18;x++) map[10][x]=T_PATH;
  return map;
}
function makeIndoorMap(){
  const W=14,H=10;
  const map=[];
  for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++){let t=T_FLOOR;if(x===0||x===W-1||y===0||y===H-1) t=T_WALL;row.push(t);}map.push(row);}
  map[H-1][6]=T_FLOOR;map[H-1][7]=T_FLOOR;
  return map;
}

function placeWorldObjects(){
  const w=world.outdoor;
  w.objects=[];
  const occ=new Set();
  for(let y=w.houseArea.y;y<w.houseArea.y+w.houseArea.h;y++)
    for(let x=w.houseArea.x;x<w.houseArea.x+w.houseArea.w;x++) occ.add(x+','+y);
  for(let x=15;x<30;x++) occ.add(x+',15');
  for(let y=10;y<15;y++) occ.add('10,'+y);
  for(let x=10;x<18;x++) occ.add(x+',10');
  for(let y=15;y<20;y++)for(let x=16;x<24;x++) occ.add(x+','+y);
  // Reserve shop area
  for(let y=6;y<10;y++)for(let x=7;x<11;x++) occ.add(x+','+y);

  let id=0;
  // Trees
  for(let t=0;t<90;t++){
    const tx=2+Math.floor(Math.random()*(MAP_W-4));
    const ty=2+Math.floor(Math.random()*(MAP_H-4));
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    let nearW=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(w.tiles[ty+dy]&&w.tiles[ty+dy][tx+dx]===T_WATER) nearW=true;
    }
    if(nearW) continue;
    const isPine=Math.random()<0.25;
    w.objects.push({
      id:'t'+(id++), type:isPine?'pine':(Math.random()<0.5?'tree':'tree2'),
      x:tx*TILE+TILE/2, y:ty*TILE+TILE/2, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true,
    });
    occ.add(tx+','+ty);
  }
  // Rocks
  for(let t=0;t<50;t++){
    const tx=2+Math.floor(Math.random()*(MAP_W-4));
    const ty=2+Math.floor(Math.random()*(MAP_H-4));
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    const kind=Math.random()<0.5?'rock0':(Math.random()<0.5?'rock1':'rock2');
    const hp=kind==='rock0'?2:(kind==='rock1'?3:4);
    w.objects.push({
      id:'r'+(id++), type:kind,
      x:tx*TILE+TILE/2, y:ty*TILE+TILE/2, tx, ty,
      hp, maxHp:hp, solid:true,
    });
    occ.add(tx+','+ty);
  }
}

function toolName(t){return {axe:'Топор',pick:'Кирка',hoe:'Мотыга',can:'Лейка',seed:'Семена',rod:'Удочка',food:'Еда'}[t];}
function currentMap(){return Game.map==='outdoor'?world.outdoor:world.indoor;}
function tileAt(tx,ty){
  const m=currentMap();
  if(ty<0||ty>=m.tiles.length||tx<0||tx>=m.tiles[0].length) return T_WALL;
  return m.tiles[ty][tx];
}
function findObjectAt(tx,ty){
  const m=currentMap();
  for(const o of m.objects){
    const otx=Math.floor(o.x/TILE),oty=Math.floor(o.y/TILE);
    if(o.type==='bed'){if(tx>=otx&&tx<=otx+1&&ty>=oty&&ty<=oty+2) return o;}
    else if(o.type==='table'){if(tx>=otx&&tx<=otx+1&&ty>=oty&&ty<=oty+1) return o;}
    else if(tx===otx&&ty===oty) return o;
  }
  return null;
}
function showToast(txt){Game.toast=txt;Game.toastTimer=1500;const el=$('notify');el.textContent=txt;el.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>el.classList.remove('show'),1500);}

function startAction(type){player.action=type;player.actionTimer=450;}

function doAction(){
  if(player.action||Game.sleeping) return;
  const tool=Game.hotbar[Game.selected];
  const px=player.x+TILE/2,py=player.y+TILE/2;
  let dx=0,dy=0;
  if(player.dir==='d') dy=1; else if(player.dir==='u') dy=-1;
  else if(player.dir==='l') dx=-1; else dx=1;
  const tx=Math.floor(px/TILE)+dx, ty=Math.floor(py/TILE)+dy;
  const t=tileAt(tx,ty);
  const obj=findObjectAt(tx,ty);
  
  // Harvest mature crop first
  if(obj&&obj.type==='crop'&&obj.stage===4){
    Game.inv[obj.cropType]=(Game.inv[obj.cropType]||0)+1;
    showToast('+1 '+obj.cropType);
    Sound.play('harvest');
    removeObject(obj);
    startAction('use');
    return;
  }
  
  if(tool==='axe'){
    if(obj&&(obj.type==='tree'||obj.type==='tree2'||obj.type==='pine')){
      startAction('use');obj.hp--;Sound.play('chop');
      spawnParticle(obj.x,obj.y-20,'wood');
      if(obj.hp<=0){const n=3+Math.floor(Math.random()*3);Game.inv.wood+=n;showToast('+'+n+' 🪵');removeObject(obj);}
      else showToast('Тук! ('+obj.hp+')');
      return;
    }
    Sound.play('error');showToast('Нечего рубить');return;
  }
  if(tool==='pick'){
    if(obj&&(obj.type==='rock0'||obj.type==='rock1'||obj.type==='rock2')){
      startAction('use');obj.hp--;Sound.play('pick');
      spawnParticle(obj.x,obj.y-10,'stone');
      if(obj.hp<=0){const n=2+Math.floor(Math.random()*3);Game.inv.stone+=n;showToast('+'+n+' 🪨');removeObject(obj);}
      else showToast('Клац! ('+obj.hp+')');
      return;
    }
    Sound.play('error');showToast('Нечего добывать');return;
  }
  if(tool==='hoe'){
    if(t===T_GRASS){currentMap().tiles[ty][tx]=T_TILL;startAction('use');Sound.play('chop');showToast('Земля вскопана');return;}
    if(t===T_TILL||t===T_TILL_WET){Sound.play('error');showToast('Уже вскопано');return;}
    Sound.play('error');showToast('Нельзя вскопать');return;
  }
  if(tool==='can'){
    if(t===T_TILL){currentMap().tiles[ty][tx]=T_TILL_WET;startAction('use');Sound.play('water');showToast('💧 Полито');return;}
    if(t===T_WATER){showToast('Лейка полная');return;}
    Sound.play('error');showToast('Нечего поливать');return;
  }
  if(tool==='seed'){
    if(Game.inv.seeds<=0){Sound.play('error');showToast('Нет семян');return;}
    if(t===T_TILL||t===T_TILL_WET){
      Game.inv.seeds--;
      const type=CROP_TYPES[Math.floor(Math.random()*CROP_TYPES.length)];
      currentMap().objects.push({type:'crop',cropType:type,x:tx*TILE,y:ty*TILE,tx,ty,stage:0,watered:false,solid:false});
      startAction('use');Sound.play('plant');showToast('Посажено '+type);return;
    }
    Sound.play('error');showToast('Нужна грядка');return;
  }
  if(tool==='rod'){
    if(t===T_WATER){startFishing();return;}
    Sound.play('error');showToast('Встань у воды');return;
  }
  if(tool==='food'){
    if(Game.energy>=Game.maxEnergy){Sound.play('error');showToast('Энергия полная');return;}
    if(Game.inv.food<=0){Sound.play('error');showToast('Нет еды');return;}
    Game.inv.food--;Game.energy=Math.min(Game.maxEnergy,Game.energy+30);
    Sound.play('harvest');showToast('+30 ⚡');return;
  }
}

function tryInteract(){
  if(Game.map==='outdoor'){
    // Door
    const dx=player.x+TILE/2-(world.outdoor.houseDoor.x*TILE+TILE/2);
    const dy=player.y+TILE/2-(world.outdoor.houseDoor.y*TILE+TILE/2);
    if(dx*dx+dy*dy<50*50){
      Game.map='indoor';player.x=6.5*TILE;player.y=8*TILE;player.targetX=null;player.targetY=null;
      Sound.play('click');showToast('Дом');return;
    }
    // Shop
    const sx=player.x+TILE/2-(world.outdoor.shopDoor.x*TILE+TILE/2);
    const sy=player.y+TILE/2-(world.outdoor.shopDoor.y*TILE+TILE/2);
    if(sx*sx+sy*sy<50*50){
      Sound.play('click');openShop();return;
    }
    showToast('Подойди к двери');
  } else {
    // Exit
    const ex=6.5*TILE,ey=9*TILE;
    if(Math.abs(player.x+16-ex)<TILE*1.5&&Math.abs(player.y+16-ey)<TILE*1.5){
      Game.map='outdoor';player.x=world.outdoor.houseDoor.x*TILE;player.y=(world.outdoor.houseDoor.y+1)*TILE;
      player.targetX=null;player.targetY=null;Sound.play('click');showToast('Улица');return;
    }
    // Bed
    const bed=world.indoor.objects.find(o=>o.type==='bed');
    if(bed){
      const bdx=player.x+16-(bed.x+32);const bdy=player.y+16-(bed.y+50);
      if(bdx*bdx+bdy*bdy<55*55){
        startSleepFromBed();return;
      }
    }
    showToast('E — выход / сон');
  }
}

function forceSleep(){

  Game.sleeping=true;player.action='sleep';
  Sound.stopMusic();
  $('sleepFade').classList.add('active');
  const t=$('sleepText');t.innerHTML='<div>Потеря сознания...</div>';t.classList.add('show');

function advanceDay(slept){
  Game.day++;Game.seasonDay++;
  if(Game.seasonDay>7){Game.seasonDay=1;Game.season=(Game.season+1)%4;showToast('Сезон: '+SEASON_NAMES[Game.season]);}
  Game.time=6*60;
  Game.energy=slept?Game.maxEnergy:Math.floor(Game.maxEnergy*0.6);
  for(const m of ['outdoor','indoor']){
    for(const o of world[m].objects){
      if(o.type==='crop'){
        if(o.watered&&o.stage<4) o.stage++;
        o.watered=false;
      }
    }
    const tiles=world[m].tiles;
    for(let y=0;y<tiles.length;y++)for(let x=0;x<tiles[0].length;x++){
      if(tiles[y][x]===T_TILL_WET) tiles[y][x]=T_TILL;
    }
  }
  // Chicken
  Game.fishing=null;player.action=null;
  Game.map='indoor';player.x=2*TILE;player.y=5*TILE;
  Game.sleeping=false;
}

function screenToWorld(cx,cy){
  const rect=canvas.getBoundingClientRect();
  const sx=(cx-rect.left)*(canvas.width/rect.width);
  const sy=(cy-rect.top)*(canvas.height/rect.height);
  return {x:sx/SCALE+camera.x,y:sy/SCALE+camera.y};
}
// Check if point is over HUD elements (to not move character)
function isOverHUD(cx,cy){
  const rect=canvas.getBoundingClientRect();
  const sx=(cx-rect.left)*(canvas.width/rect.width)/SCALE;
  const sy=(cy-rect.top)*(canvas.height/rect.height)/SCALE;
  // Hotbar bottom center: LW-w/2 to LW+w/2, LH-48 to LH
  const hbW=7*40+8;
  const hbX=(LW-hbW)/2;
  if(sy>LH-52&&sx>hbX&&sx<hbX+hbW) return true;
  // Top-left panel
  if(sx<130&&sy<50) return true;
  // Top-right panels
  if(sx>LW-115&&sy<80) return true;
  return false;
}
let pointerDown=false;
canvas.addEventListener('pointerdown',e=>{
  if(Game.paused||Game.shopOpen) return;
  e.preventDefault();
  const p=screenToWorld(e.clientX,e.clientY);
  // Skip if clicked on HUD
  const rect=canvas.getBoundingClientRect();
  const lx=(e.clientX-rect.left)*(canvas.width/rect.width)/SCALE;
  const ly=(e.clientY-rect.top)*(canvas.height/rect.height)/SCALE;
  if(isOverHUD(e.clientX,e.clientY)){
    // Handle hotbar click
    const hbW=7*40+8, hbX=(LW-hbW)/2, hbY=LH-48;
    if(ly>hbY&&ly<hbY+44&&lx>hbX&&lx<hbX+hbW){
      const idx=Math.floor((lx-hbX-4)/40);
      if(idx>=0&&idx<Game.hotbar.length){Game.selected=idx;Sound.play('click');}
    }
    return;
  }
  pointerDown=true;
  const tx=Math.floor(p.x/TILE),ty=Math.floor(p.y/TILE);
  const clickedObj=findObjectAt(tx,ty);
  player.actionTarget={x:p.x,y:p.y,tx,ty,obj:clickedObj};
  player.targetX=p.x;player.targetY=p.y;
});
canvas.addEventListener('pointermove',e=>{
  if(!pointerDown||Game.paused||Game.shopOpen) return;
  const p=screenToWorld(e.clientX,e.clientY);
  player.targetX=p.x;player.targetY=p.y;
});
window.addEventListener('pointerup',()=>{pointerDown=false;});
window.addEventListener('pointercancel',()=>{pointerDown=false;});

// UPDATE
// ============================================================
let lastTime=performance.now();
function update(dt){
  if(Game.paused||Game.shopOpen) return;
  
  // Time
  if(!Game.sleeping){
    Game.time+=dt*0.001*(1200/(15*60));
    if(Game.time>=26*60){Game.time=26*60;forceSleep();}
  }
  // Toast
  if(Game.toastTimer>0) Game.toastTimer-=dt;
  
  // Action timer
  if(player.action){
    player.actionTimer-=dt;
    if(player.actionTimer<=0) player.action=null;
  }
  
  // Fishing
  if(Game.fishing){
    Game.fishing.timer+=dt;
    if(Game.fishing.timer>Game.fishing.duration&&!Game.fishing.caught){
      Game.fishing.caught=true;
      const r=Math.random();
      if(r<0.65){const n=1+Math.floor(Math.random()*2);Game.inv.fish+=n;Sound.play('fish');showToast('🐟 Улов: '+n);}
      else if(r<0.8){Game.inv.seeds+=2;Sound.play('harvest');showToast('🌱 +2 семечка');}
      else {Sound.play('error');showToast('Ничего...');}
    }
    if(Game.fishing.timer>Game.fishing.duration+800) Game.fishing=null;
    return;
  }
  
  // Movement
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']){dy=-1;player.dir='u';}
  if(keys['s']||keys['arrowdown']){dy=1;player.dir='d';}
  if(keys['a']||keys['arrowleft']){dx=-1;player.dir='l';}
  if(keys['d']||keys['arrowright']){dx=1;player.dir='r';}
  if(dx!==0||dy!==0){player.targetX=null;player.targetY=null;player.actionTarget=null;}
  
  if(dx===0&&dy===0&&player.targetX!==null){
    const cx=player.x+TILE/2, cy=player.y+TILE/2;
    const tdx=player.targetX-cx, tdy=player.targetY-cy;
    const dist=Math.sqrt(tdx*tdx+tdy*tdy);
    if(dist<8){
      player.targetX=null;player.targetY=null;
      if(player.actionTarget){
        const atx=player.actionTarget.tx,aty=player.actionTarget.ty;
        const ddx=atx*TILE+TILE/2-cx, ddy=aty*TILE+TILE/2-cy;
        if(Math.abs(ddx)>Math.abs(ddy)) player.dir=ddx>0?'r':'l';
        else player.dir=ddy>0?'d':'u';
        if(Math.abs(ddx)<TILE*1.3&&Math.abs(ddy)<TILE*1.3) doAction();
        player.actionTarget=null;
      }
    } else {
      dx=tdx/dist;dy=tdy/dist;
      if(Math.abs(tdx)>Math.abs(tdy)) player.dir=tdx>0?'r':'l';
      else player.dir=tdy>0?'d':'u';
    }
  }
  if(dx!==0&&dy!==0){dx*=0.7071;dy*=0.7071;}
  
  const moving=(dx!==0||dy!==0);
  const nextX=player.x+dx*player.speed;
  const nextY=player.y+dy*player.speed;
  let blockedX=false,blockedY=false;
  if(!collides(nextX,player.y)) player.x=nextX; else blockedX=true;
  if(!collides(player.x,nextY)) player.y=nextY; else blockedY=true;
  if(player.targetX!==null&&blockedX&&blockedY){player.targetX=null;player.targetY=null;player.actionTarget=null;}
  
  // Animation
  if(moving){
    player.walkTimer+=dt;
    const ft=140;
    while(player.walkTimer>ft){
      player.walkTimer-=ft;
      const old=player.walkPhase;
      player.walkPhase=(player.walkPhase+1)%4;
      if((old===0||old===2)&&(player.walkPhase===1||player.walkPhase===3)) Sound.play('step');
    }
  } else {
    player.walkPhase=0;player.walkTimer=0;
  }
  
  // Camera
  camera.x=player.x-LW/2+TILE/2;
  camera.y=player.y-LH/2+TILE/2;
  const m=currentMap();
  const mapW=m.tiles[0].length*TILE,mapH=m.tiles.length*TILE;
  camera.x=Math.max(0,Math.min(camera.x,Math.max(0,mapW-LW)));
  camera.y=Math.max(0,Math.min(camera.y,Math.max(0,mapH-LH)));
  
  // Particles
  for(let i=Game.particles.length-1;i>=0;i--){
    const p=Game.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=dt;
    if(p.life<=0) Game.particles.splice(i,1);
  }
  
  // Chicken wander
  chicken.moveTimer-=dt;
  if(chicken.moveTimer<=0){
    chicken.moveTimer=1500+Math.random()*2500;
    chicken.tx=chicken.x+(Math.random()-0.5)*80;
    chicken.ty=chicken.y+(Math.random()-0.5)*80;
  }
  const cdx=chicken.tx-chicken.x,cdy=chicken.ty-chicken.y;
  const cdist=Math.sqrt(cdx*cdx+cdy*cdy);
  if(cdist>3){
    chicken.x+=cdx/cdist*0.5;
    chicken.y+=cdy/cdist*0.5;
    chicken.dir=cdx>0?1:-1;
    chicken.frameTimer+=dt;
    if(chicken.frameTimer>250){chicken.frameTimer=0;chicken.frame=(chicken.frame+1)%2;}
  } else {
    chicken.frame=0;
  }
  
  // Day-night
  const t=Game.time;
  let dn=0;
  if(t>=6*60&&t<8*60) dn=0.5-((t-6*60)/120)*0.5;
  else if(t>=8*60&&t<18*60) dn=0;
  else if(t>=18*60&&t<21*60) dn=((t-18*60)/180)*0.6;
  else if(t>=21*60||t<6*60) dn=0.65;
  Game.dayNight=dn;
}

function collides(x,y){
  const hbX=x+8,hbY=y+18,hbW=16,hbH=12;
  const corners=[[hbX,hbY],[hbX+hbW-1,hbY],[hbX,hbY+hbH-1],[hbX+hbW-1,hbY+hbH-1]];
  for(const [cx,cy] of corners){
    const tx=Math.floor(cx/TILE),ty=Math.floor(cy/TILE);
    const t=tileAt(tx,ty);
    if(t===T_WALL||t===T_WATER) return true;
  }
  const m=currentMap();
  for(const o of m.objects){
    if(!o.solid) continue;
    let ow=32,oh=32,oLeft,oTop;
    if(o.type==='tree'||o.type==='tree2'||o.type==='pine'){
      oLeft=o.x-8;oTop=o.y-20;ow=16;oh=20;
    } else if(o.type==='rock0'){oLeft=o.x-10;oTop=o.y-8;ow=20;oh=16;}
    else if(o.type==='rock1'){oLeft=o.x-16;oTop=o.y-12;ow=32;oh=24;}
    else if(o.type==='rock2'){oLeft=o.x-20;oTop=o.y-12;ow=40;oh=24;}
    else if(o.type==='bed'){oLeft=o.x;oTop=o.y+16;ow=64;oh=56;}
    else if(o.type==='table'){oLeft=o.x;oTop=o.y+8;ow=64;oh=40;}
    else if(o.type==='chest'){oLeft=o.x;oTop=o.y+8;ow=40;oh=24;}
    else {oLeft=o.x;oTop=o.y;ow=o.w||32;oh=o.h||32;}
    if(hbX<oLeft+ow&&hbX+hbW>oLeft&&hbY<oTop+oh&&hbY+hbH>oTop) return true;
  }
  // House in outdoor
  if(Game.map==='outdoor'){
    const ha=world.outdoor.houseArea;
    const hLeft=ha.x*TILE+8, hTop=ha.y*TILE+50, hW=ha.w*TILE-16, hH=ha.h*TILE-50;
    // Door cut-out
    const doorX=world.outdoor.houseDoor.x*TILE+8;
    const doorW=TILE-16;
    if(hbX<hLeft+hW&&hbX+hbW>hLeft&&hbY<hTop+hH&&hbY+hbH>hTop){
      // If in door zone, allow
      if(hbX+hbW>doorX&&hbX<doorX+doorW) return false;
      return true;
    }
    // Shop
    const sp=world.outdoor.shopPos;
    if(hbX<sp.x*TILE+96&&hbX+hbW>sp.x*TILE&&hbY<sp.y*TILE+96&&hbY+hbH>sp.y*TILE) return true;
  }
  return false;
}

function drawTile(t,x,y){
  const s=Game.season;
  switch(t){
    case T_GRASS:{const v=(x*7+y*13)%4;ctx.drawImage(S['grass_'+s+'_'+v],x,y);break;}
    case T_PATH:ctx.drawImage(S['tile_dirt'],x,y);break;
    case T_WATER:ctx.drawImage(S['tile_water'],x,y);break;
    case T_TILL:ctx.drawImage(S['tile_till'],x,y);break;
    case T_TILL_WET:ctx.drawImage(S['tile_till_wet'],x,y);break;
    case T_FLOOR:ctx.drawImage(S['tile_floor'],x,y);break;
    case T_WALL:ctx.drawImage(S['tile_wall'],x,y);break;
  }
}

function drawObject(o){
  let key=null,w=32,h=32;
  if(o.type==='tree'){key='tree_'+Game.season;w=64;h=64;}
  else if(o.type==='tree2'){key='tree_'+Game.season;w=64;h=64;}
  else if(o.type==='pine'){key='treePine';w=64;h=72;}
  else if(o.type==='rock0'){key='rock0';w=48;h=48;}
  else if(o.type==='rock1'){key='rock1';w=64;h=64;}
  else if(o.type==='rock2'){key='rock2';w=80;h=56;}
  else if(o.type==='bed'){key='bed';w=64;h=80;}
  else if(o.type==='table'){key='table';w=64;h=48;}
  else if(o.type==='chest'){key='chest';w=40;h=32;}
  else if(o.type==='crop'){key='crop_'+o.cropType+'_'+o.stage;w=32;h=32;}
  if(!key||!S[key]) return;
  let dx,dy;
  if(o.type==='tree'||o.type==='tree2'||o.type==='pine'){
    dx=o.x-w/2;dy=o.y-h+8;
  } else if(o.type==='rock0'||o.type==='rock1'||o.type==='rock2'){
    dx=o.x-w/2;dy=o.y-h/2;
  } else {
    dx=o.x;dy=o.y;
  }
  ctx.drawImage(S[key],Math.round(dx),Math.round(dy));
  if(o.hp!==undefined&&o.hp<o.maxHp){
    const bw=32,bx=o.x-bw/2,by=dy-8;
    ctx.fillStyle='#000';ctx.fillRect(bx,by,bw,4);
    ctx.fillStyle='#c04030';ctx.fillRect(bx+1,by+1,(bw-2)*(o.hp/o.maxHp),2);
  }
}

function drawPlayer(){
  let key;
  if(player.action==='sleep') key='char_'+player.dir+'_sleep';
  else if(player.action==='use') key='char_'+player.dir+'_use';
  else if(player.walkPhase>0) key='char_'+player.dir+'_'+player.walkPhase;
  else key='char_'+player.dir+'_idle';
  const sp=S[key]||S['char_d_idle'];
  ctx.drawImage(S['shadow'],player.x-16,player.y+20);
  ctx.drawImage(sp,Math.round(player.x-16),Math.round(player.y-16));
}

function drawWorld(){
  const dn=Game.dayNight;
  // Sky
  let skyTop='#87ceeb', skyBot='#c8e0f0';
  if(Game.season===2){skyTop='#c89a60';skyBot='#e8c890';}
  else if(Game.season===3){skyTop='#a8b8c8';skyBot='#d8e0e8';}
  if(dn>0){
    const c1=[Math.round(135*(1-dn)+15*dn),Math.round(206*(1-dn)+15*dn),Math.round(235*(1-dn)+40*dn)];
    const c2=[Math.round(200*(1-dn)+10*dn),Math.round(220*(1-dn)+10*dn),Math.round(240*(1-dn)+25*dn)];
    skyTop='rgb('+c1.join(',')+')';skyBot='rgb('+c2.join(',')+')';
  }
  const grad=ctx.createLinearGradient(0,0,0,LH);
  grad.addColorStop(0,skyTop);grad.addColorStop(1,skyBot);
  ctx.fillStyle=grad;ctx.fillRect(0,0,LW,LH);
  if(dn>0.5){
    ctx.fillStyle='rgba(255,255,255,'+(dn-0.5)*2+')';
    for(let i=0;i<50;i++){const x=(i*83)%LW;const y=(i*47)%(LH/2);ctx.fillRect(x,y,1,1);}
  }
  // Sun/moon
  const t=Game.time;
  const angle=((t-6*60)/(24*60))*Math.PI*2;
  const sx=LW/2+Math.sin(angle)*LW*0.4;
  const sy=LH*0.55-Math.cos(angle)*LH*0.45;
  if(t>=6*60&&t<20*60){
    ctx.fillStyle='rgba(255,224,96,.35)';
    ctx.beginPath();ctx.arc(sx,sy,24,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe060';
    ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff8c0';
    ctx.beginPath();ctx.arc(sx-4,sy-4,5,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='rgba(232,232,240,.3)';
    ctx.beginPath();ctx.arc(sx,sy,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8e8f0';
    ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c0c0d0';
    ctx.beginPath();ctx.arc(sx+3,sy-3,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx-4,sy+2,3,0,Math.PI*2);ctx.fill();
  }
  // Clouds
  for(let i=0;i<5;i++){
    const cx=((performance.now()*0.008+i*250)%(LW+200))-100;
    const cy=30+i*22+Math.sin(i*2)*10;
    ctx.globalAlpha=0.7-dn*0.5;
    ctx.drawImage(S['cloud'],cx,cy);
    ctx.globalAlpha=1;
  }
  
  ctx.save();
  ctx.translate(-Math.round(camera.x),-Math.round(camera.y));
  const m=currentMap();
  const startX=Math.max(0,Math.floor(camera.x/TILE));
  const endX=Math.min(m.tiles[0].length-1,Math.ceil((camera.x+LW)/TILE));
  const startY=Math.max(0,Math.floor(camera.y/TILE));
  const endY=Math.min(m.tiles.length-1,Math.ceil((camera.y+LH)/TILE));
  for(let y=startY;y<=endY;y++)for(let x=startX;x<=endX;x++) drawTile(m.tiles[y][x],x*TILE,y*TILE);
  
  // House & shop on outdoor
  if(Game.map==='outdoor'){
    const ha=world.outdoor.houseArea;
    ctx.drawImage(S['house'],ha.x*TILE,ha.y*TILE);
    const sp=world.outdoor.shopPos;
    ctx.drawImage(S['shop'],sp.x*TILE,sp.y*TILE);
  }
  
  // Target marker
  if(player.targetX!==null){
    const tp=performance.now()/400;
    const pulse=0.6+0.4*Math.sin(tp*Math.PI*2);
    ctx.strokeStyle='rgba(255,220,80,'+(0.4+pulse*0.4)+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(player.targetX,player.targetY,6+pulse*3,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,220,80,'+(0.6+pulse*0.3)+')';
    ctx.beginPath();ctx.arc(player.targetX,player.targetY,3,0,Math.PI*2);ctx.fill();
  }
  
  // Sort objects + player + chicken
  const allObjs=[];
  for(const o of m.objects){
    allObjs.push({y:o.y,draw:()=>drawObject(o)});
  }
  if(Game.map==='outdoor'){
    allObjs.push({y:chicken.y+16,draw:()=>{
      const sp=S['chicken_'+chicken.frame];
      ctx.save();
      if(chicken.dir<0){ctx.translate(chicken.x+16,0);ctx.scale(-1,1);ctx.translate(-(chicken.x+16),0);}
      ctx.drawImage(S['shadow'],chicken.x-16,chicken.y+20);
      ctx.drawImage(sp,Math.round(chicken.x-16),Math.round(chicken.y-16));
      ctx.restore();
    }});
  }
  allObjs.push({y:player.y+16,draw:drawPlayer});
  allObjs.sort((a,b)=>a.y-b.y);
  for(const o of allObjs) o.draw();
  
  // Fishing
  if(Game.fishing){
    const px=player.x+TILE/2,py=player.y+TILE/2;
    let fx=px,fy=py;
    if(player.dir==='d') fy+=TILE*1.5;
    else if(player.dir==='u') fy-=TILE*1.5;
    else if(player.dir==='l') fx-=TILE*1.5;
    else fx+=TILE*1.5;
    ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px+8,py-10);ctx.lineTo(fx,fy);ctx.stroke();
    const bob=Math.sin(performance.now()/200)*2;
    ctx.drawImage(S['bobber'],fx-6,fy-6+bob);
  }
  
  // Particles
  for(const p of Game.particles){
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/600;
    ctx.fillRect(p.x-2,p.y-2,4,4);
    ctx.globalAlpha=1;
  }
  
  ctx.restore();
  
  if(Game.dayNight>0){
    ctx.fillStyle='rgba(10,10,30,'+(Game.dayNight*0.55)+')';
    ctx.fillRect(0,0,LW,LH);
  }
  if(Game.time<8*60&&Game.time>=6*60){
    ctx.fillStyle='rgba(255,180,80,'+(0.12*(1-(Game.time-6*60)/120))+')';
    ctx.fillRect(0,0,LW,LH);
  }
  if(Game.time>=18*60&&Game.time<21*60){
    ctx.fillStyle='rgba(255,120,60,'+(0.18*((Game.time-18*60)/180))+')';
    ctx.fillRect(0,0,LW,LH);
  }
  if(Game.season===3&&Game.dayNight<0.5){
    // Snow tint
    ctx.fillStyle='rgba(200,220,255,0.08)';
    ctx.fillRect(0,0,LW,LH);
  }
}

function drawHUD(){
  // Time panel
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(8,8,140,52);
  ctx.strokeStyle='#8ec96f';ctx.lineWidth=1;
  ctx.strokeRect(8.5,8.5,139,51);
  ctx.fillStyle='#ffd54a';
  ctx.font='bold 11px "Courier New",monospace';
  const h=Math.floor(Game.time/60)%24;
  const mn=Math.floor(Game.time%60);
  ctx.fillText('День '+Game.day+' • '+SEASON_NAMES[Game.season],14,24);
  ctx.fillText((h<10?'0':'')+h+':'+(mn<10?'0':'')+mn+'  (день '+Game.seasonDay+'/7)',14,42);
  ctx.fillStyle='#fff';
  ctx.fillText('🪙 '+Game.gold,14,56);
  
  // Energy
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(LW-115,8,107,22);
  ctx.strokeStyle='#8ec96f';
  ctx.strokeRect(LW-114.5,8.5,106,21);
  ctx.fillStyle='#3a5a3a';
  ctx.fillRect(LW-112,11,102,16);
  const eP=Game.energy/Game.maxEnergy;
  ctx.fillStyle=eP>0.5?'#6ac04a':eP>0.25?'#e0c040':'#c04040';
  ctx.fillRect(LW-112,11,102*eP,16);
  ctx.fillStyle='#fff';ctx.font='bold 11px monospace';
  ctx.fillText('⚡ '+Math.round(Game.energy),LW-108,24);
  
  // Inventory
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(LW-115,36,107,50);
  ctx.strokeStyle='#8ec96f';
  ctx.strokeRect(LW-114.5,36.5,106,49);
  ctx.font='11px monospace';
  const inv=[
    ['🪵',Game.inv.wood],['🪨',Game.inv.stone],['🌱',Game.inv.seeds],
    ['🐟',Game.inv.fish],['🍞',Game.inv.food],
    ['🌾',Game.inv.wheat+Game.inv.carrot+Game.inv.tomato+Game.inv.potato+Game.inv.corn+Game.inv.pumpkin]
  ];
  for(let i=0;i<inv.length;i++){
    const col=i%3,row=Math.floor(i/3);
    const x=LW-110+col*35,y=52+row*18;
    ctx.fillStyle='#ffd54a';
    ctx.fillText(inv[i][0],x,y);
    ctx.fillStyle='#fff';
    ctx.fillText(inv[i][1],x+14,y);
  }
  
  // Hotbar
  const hbW=7*40+8;
  const hbX=(LW-hbW)/2;
  const hbY=LH-48;
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(hbX,hbY,hbW,44);
  ctx.strokeStyle='#8ec96f';ctx.lineWidth=2;
  ctx.strokeRect(hbX+1,hbY+1,hbW-2,42);
  ctx.lineWidth=1;
  for(let i=0;i<7;i++){
    const x=hbX+4+i*40,y=hbY+4;
    ctx.fillStyle=i===Game.selected?'rgba(142,201,111,0.35)':'rgba(0,0,0,0.4)';
    ctx.fillRect(x,y,36,36);
    if(i===Game.selected){
      ctx.strokeStyle='#ffd54a';ctx.lineWidth=2;
      ctx.strokeRect(x,y,36,36);
      ctx.lineWidth=1;
    }
    if(S['icon_'+Game.hotbar[i]]) ctx.drawImage(S['icon_'+Game.hotbar[i]],x+10,y+10);
    ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.font='bold 9px monospace';
    ctx.fillText(String(i+1),x+2,y+10);
  }
  // Tool name
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(hbX,hbY-16,110,14);
  ctx.fillStyle='#ffd54a';
  ctx.font='10px monospace';
  ctx.fillText(toolName(Game.hotbar[Game.selected]),hbX+4,hbY-6);
  
  // Hints
  let hint='';
  if(Game.map==='outdoor'){
    const dx=player.x+TILE/2-(world.outdoor.houseDoor.x*TILE+TILE/2);
    const dy=player.y+TILE/2-(world.outdoor.houseDoor.y*TILE+TILE/2);
    if(dx*dx+dy*dy<50*50) hint='🏠 E — войти в дом';
    const sx=player.x+TILE/2-(world.outdoor.shopDoor.x*TILE+TILE/2);
    const sy=player.y+TILE/2-(world.outdoor.shopDoor.y*TILE+TILE/2);
    if(sx*sx+sy*sy<50*50) hint='🏪 E — открыть лавку';
  } else {
    const bed=world.indoor.objects.find(o=>o.type==='bed');
    if(bed){
      const bdx=player.x+16-(bed.x+32),bdy=player.y+16-(bed.y+50);
      if(bdx*bdx+bdy*bdy<55*55) hint='🛏 E — лечь спать';
    }
    const ex=6.5*TILE,ey=9*TILE;
    if(Math.abs(player.x+16-ex)<TILE*1.5&&Math.abs(player.y+16-ey)<TILE*1.5) hint='🚪 E — выйти на улицу';
  }
  if(hint){
    ctx.fillStyle='rgba(0,0,0,0.8)';
    const tw=ctx.measureText(hint).width+40;
    ctx.fillRect((LW-tw)/2,LH-80,tw,24);
    ctx.fillStyle='#8ec96f';
    ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(hint,LW/2,LH-64);
    ctx.textAlign='left';
  }
  
  // Toast
  if(Game.toastTimer>0){
    const alpha=Math.min(1,Game.toastTimer/300);
    ctx.font='bold 13px monospace';
    const tw=ctx.measureText(Game.toast).width+40;
    ctx.fillStyle='rgba(0,0,0,'+(0.8*alpha)+')';
    ctx.fillRect((LW-tw)/2,72,tw,26);
    ctx.fillStyle='rgba(142,201,111,'+alpha+')';
    ctx.textAlign='center';
    ctx.fillText(Game.toast,LW/2,89);
    ctx.textAlign='left';
  }
}

// ============================================================
function gameLoop(now){
  let dt=now-lastTime;lastTime=now;
  if(dt>100)dt=100;if(dt<0)dt=0;
  try{
    update(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    drawWorld();
    if(!Game.paused) drawHUD();
  }catch(e){console.error('Loop error:',e);}
  requestAnimationFrame(gameLoop);
}

function newGame(){

  Game.energy=100;Game.gold=100;
  Game.inv={wood:0,stone:0,seeds:8,fish:0,wheat:0,carrot:0,tomato:0,potato:0,corn:0,pumpkin:0,food:3};

  Game.fishing=null;Game.particles=[];Game.shopOpen=false;
  player.x=22*TILE;player.y=17*TILE;
  player.targetX=null;player.targetY=null;player.actionTarget=null;player.action=null;
  player.dir='d';player.walkPhase=0;
  chicken.x=24*TILE;chicken.y=17*TILE;chicken.tx=chicken.x;chicken.ty=chicken.y;
  world.outdoor.tiles=makeOutdoorMap();
  world.indoor.tiles=makeIndoorMap();
  world.indoor.objects=[
    {type:'bed',x:2*TILE,y:2*TILE,w:64,h:80,solid:true},
    {type:'table',x:10*TILE,y:1*TILE,w:64,h:48,solid:true},
    {type:'chest',x:11*TILE,y:5*TILE,w:40,h:32,solid:true},
  ];
  placeWorldObjects();
  Sound.init();Sound.resume();Sound.startMusic();
  $('menuMain').classList.add('hidden');
  $('menuPause').classList.add('hidden');
  $('menuHelp').classList.add('hidden');
  closeShop();
}
function pauseGame(){
  if(Game.paused||Game.sleeping) return;
  Game.paused=true;
  $('menuPause').classList.remove('hidden');
  Sound.play('click');
}
function resumeGame(){
  Game.paused=false;
  $('menuPause').classList.add('hidden');
  $('menuHelp').classList.add('hidden');
  Sound.resume();
}
$('btnNew').onclick=()=>{Sound.init();Sound.resume();Sound.play('click');newGame();};
$('btnHelp').onclick=()=>{Sound.play('click');$('menuMain').classList.add('hidden');$('menuHelp').classList.remove('hidden');};
$('btnHelpBack').onclick=()=>{Sound.play('click');$('menuHelp').classList.add('hidden');$('menuMain').classList.remove('hidden');};
$('btnResume').onclick=()=>{resumeGame();};
$('btnHelpPause').onclick=()=>{Sound.play('click');$('menuPause').classList.add('hidden');$('menuHelp').classList.remove('hidden');};
$('btnToMain').onclick=()=>{
  Sound.play('click');
  Game.paused=false;
  $('menuPause').classList.add('hidden');
  $('menuMain').classList.remove('hidden');
  Sound.stopMusic();
};

// ============================================================
// TOUCH CONTROLS
// ============================================================
(function setupTouch(){
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(!isTouch) return;
  const c=$('touchControls');c.classList.add('active');
  const defs=[
    {key:'arrowup',label:'▲',cls:'tc-dpad-up'},
    {key:'arrowdown',label:'▼',cls:'tc-dpad-down'},
    {key:'arrowleft',label:'◀',cls:'tc-dpad-left'},
    {key:'arrowright',label:'▶',cls:'tc-dpad-right'},
    {action:'use',label:'Исп.',cls:'tc-action'},
    {action:'sel',label:'Инстр.',cls:'tc-inv'},
    {action:'door',label:'E',cls:'tc-inv',extra:true},
  ];
  let invBtn=null;
  defs.forEach(d=>{
    const el=document.createElement('div');
    el.className='tc-btn '+d.cls;el.textContent=d.label;
    if(d.extra){el.style.bottom='250px';el.style.right='40px';}
    const onStart=(e)=>{
      e.preventDefault();e.stopPropagation();el.classList.add('pressed');
      if(d.key){keys[d.key]=true;player.targetX=null;player.targetY=null;}
      if(d.action==='use') doAction();
      if(d.action==='door') tryInteract();
      if(d.action==='sel'){Game.selected=(Game.selected+1)%Game.hotbar.length;Sound.play('click');showToast(toolName(Game.hotbar[Game.selected]));}
    };
    const onEnd=(e)=>{e.preventDefault();e.stopPropagation();el.classList.remove('pressed');if(d.key)keys[d.key]=false;};
    el.addEventListener('touchstart',onStart,{passive:false});
    el.addEventListener('touchend',onEnd,{passive:false});
    el.addEventListener('touchcancel',onEnd,{passive:false});
    c.appendChild(el);
  });
})();

// ============================================================
// START
// ============================================================
lastTime=performance.now();
requestAnimationFrame(gameLoop);

})();
</script>
