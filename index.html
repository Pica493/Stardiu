<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Pixel Farm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;font-family:'Courier New',monospace;color:#fff;user-select:none;touch-action:none;position:fixed;top:0;left:0}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer;position:absolute}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#3a4a3a,#1a1a2a 60%,#0d0d0d);z-index:100;padding:16px;gap:10px;overflow-y:auto;touch-action:manipulation}
.screen.hidden{display:none}
.screen h1{font-size:clamp(28px,8vw,64px);letter-spacing:6px;color:#e8c060;text-shadow:0 4px 0 #5a3a1a;margin-bottom:8px;text-align:center}
.screen h2{font-size:clamp(16px,4vw,22px);color:#e8c060;margin-bottom:8px;letter-spacing:3px}
.screen button{background:#3a2a1a;color:#ffe8b0;border:3px solid #8a5a2a;padding:12px 26px;font-size:clamp(12px,3vw,15px);cursor:pointer;border-radius:4px;font-family:inherit;letter-spacing:2px;min-width:200px;max-width:92vw;font-weight:bold;touch-action:manipulation}
.screen button:hover,.screen button:active{background:#5a3a1a;border-color:#e8c060}
.screen button.primary{background:#4a7a2a;border-color:#8ac04a;color:#f0ffe0}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:500px;width:100%;padding:8px}
.lang-btn{background:#3a2a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:14px;font-size:15px;cursor:pointer;border-radius:6px;font-family:inherit;display:flex;align-items:center;gap:10px;font-weight:bold;touch-action:manipulation}
#notify{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:150;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center;max-width:80vw}
#notify .n-item{opacity:0;transition:opacity .25s;background:rgba(0,0,0,.9);color:#ffe8b0;padding:6px 14px;border-radius:4px;border:2px solid #8a5a2a;font-size:12px;font-weight:bold;text-align:center}
#notify .n-item.show{opacity:1}
#fade{position:fixed;inset:0;background:#0a0a1a;opacity:0;pointer-events:none;z-index:60;transition:opacity .4s}
#fade.active{opacity:1}
#centerText{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:61;pointer-events:none;color:#ffe8b0;gap:8px;text-align:center;text-shadow:0 2px 12px #000}
#centerText.show{display:flex}
#centerText .big{font-size:clamp(20px,5vw,34px);letter-spacing:3px;color:#e8c060}
#centerText .small{font-size:clamp(11px,3vw,14px);color:#8ac04a}
#gameMenu{position:fixed;inset:0;background:linear-gradient(135deg,rgba(58,42,20,.97),rgba(30,20,10,.98));z-index:120;display:none;padding:6px;touch-action:manipulation}
#gameMenu.show{display:block}
.menu-wrap{display:flex;flex-direction:column;height:100%;gap:6px;max-width:1200px;margin:0 auto;width:100%}
.menu-top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(135deg,#2a1a0a,#1a1208);border:3px solid #8a5a2a;border-radius:6px;flex-wrap:wrap;font-size:11px}
.menu-top .name{color:#e8c060;font-weight:bold;font-size:15px;letter-spacing:2px}
.menu-top .info{color:#ffe8b0;margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu-top .info span{padding:3px 8px;background:rgba(0,0,0,.3);border-radius:4px;border:1px solid #5a3a1a;white-space:nowrap}
.menu-body{display:flex;flex:1;gap:6px;min-height:0;flex-direction:column}
.menu-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.menu-tabs::-webkit-scrollbar{height:5px}
.menu-tabs::-webkit-scrollbar-thumb{background:#5a3a1a;border-radius:3px}
.tab-btn{background:linear-gradient(135deg,#3a2a1a,#2a1a0a);color:#ffe8b0;border:2px solid #6a4a2a;padding:8px 12px;font-size:11px;cursor:pointer;border-radius:6px;font-family:inherit;font-weight:bold;white-space:nowrap;touch-action:manipulation;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;transition:all .15s}
.tab-btn .tab-icon{font-size:20px;line-height:1}
.tab-btn .tab-label{font-size:9px;opacity:.8}
.tab-btn.active{background:linear-gradient(135deg,#4a7a2a,#3a6a1a);border-color:#e8c060;color:#fff;box-shadow:0 0 12px rgba(232,192,96,.5)}
.menu-content{flex:1;background:linear-gradient(135deg,#1a1208,#0a0806);border:3px solid #8a5a2a;border-radius:6px;padding:14px;overflow-y:auto;min-width:0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.menu-content h3{color:#e8c060;font-size:13px;letter-spacing:2px;margin-bottom:10px;border-bottom:2px solid #5a3a1a;padding-bottom:6px;display:flex;align-items:center;gap:6px}
.inv-grid-visual{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.inv-slot{position:relative;background:linear-gradient(135deg,#3a2a1a,#2a1a0a);border:2px solid #5a3a1a;border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;overflow:hidden;transition:all .15s}
.inv-slot:hover,.inv-slot:active{border-color:#e8c060;box-shadow:0 0 10px rgba(232,192,96,.5)}
.inv-slot .icon{font-size:32px}
.inv-slot .count{position:absolute;bottom:2px;right:4px;color:#ffe8b0;font-weight:bold;font-size:12px;text-shadow:0 0 4px #000;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:4px}
.inv-slot.empty{opacity:.2}
.inv-slot.selected{border-color:#e8c060;box-shadow:0 0 15px rgba(232,192,96,.7)}
.inv-slot.season-active{border-color:#8ac04a}
.inv-slot.quality-silver{border-color:#c0c0c0}
.inv-slot.quality-gold{border-color:#e8c040}
.inv-slot.quality-iri{border-color:#a070d0}
#invDetail{background:linear-gradient(135deg,#2a1a0a,#1a1208);border:2px solid #8a5a2a;border-radius:6px;padding:12px;margin-top:10px;display:none}
#invDetail.show{display:block}
#invDetail .dname{color:#e8c060;font-weight:bold;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
#invDetail .drow{color:#ffe8b0;font-size:12px;line-height:1.8}
#invDetail .drow span{color:#8ac04a;font-weight:bold}
#invDetail button{margin-top:8px;background:#4a7a2a;color:#ffe8b0;border:2px solid #8ac04a;padding:8px 18px;font-family:inherit;cursor:pointer;border-radius:4px;font-weight:bold;font-size:12px}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.filter-btn{background:#2a1a0a;color:#a08060;border:2px solid #5a3a1a;padding:4px 10px;font-size:10px;cursor:pointer;border-radius:4px;font-family:inherit;font-weight:bold;touch-action:manipulation}
.filter-btn.active{background:#4a7a2a;color:#fff;border-color:#8ac04a}
#mapCanvas{width:100%;max-width:520px;height:auto;background:#0a1a0a;border:3px solid #8a5a2a;border-radius:6px;display:block;margin:0 auto;image-rendering:pixelated;aspect-ratio:1}
#charCreate{position:fixed;inset:0;background:linear-gradient(135deg,rgba(20,15,10,.97),rgba(10,10,20,.98));z-index:135;display:none;flex-direction:row;gap:12px;padding:14px;overflow-y:auto;touch-action:manipulation}
#charCreate.show{display:flex}
#charCreate.portrait-mode{flex-direction:column;align-items:center}
#charPreview{background:#1a1208;border:3px solid #8a5a2a;border-radius:6px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;min-width:220px}
#charPreview canvas{image-rendering:pixelated;background:#3a4a3a;border:2px solid #5a3a1a;border-radius:4px;width:160px;height:200px}
#charPreview .pname{color:#e8c060;font-weight:bold;font-size:16px;margin-top:10px;letter-spacing:2px}
#charOptions{flex:1;background:#1a1208;border:3px solid #8a5a2a;border-radius:6px;padding:12px;overflow-y:auto;min-width:0;max-width:560px}
#charOptions h3{color:#e8c060;font-size:13px;letter-spacing:2px;margin-bottom:10px;border-bottom:1px solid #5a3a1a;padding-bottom:4px}
.opt-row{background:#2a1a0a;border-radius:4px;padding:8px;margin-bottom:6px}
.opt-row label{color:#ffe8b0;font-size:11px;display:block;margin-bottom:6px;letter-spacing:1px}
.opt-row input[type=text]{background:#1a1208;color:#ffe8b0;border:1px solid #8a5a2a;padding:6px;font-family:inherit;width:100%;font-size:12px;border-radius:3px}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border:2px solid #5a3a1a;border-radius:5px;cursor:pointer;touch-action:manipulation}
.swatch.active{border-color:#e8c060;box-shadow:0 0 10px #e8c060}
#charButtons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#charButtons button{flex:1;min-width:100px;padding:10px;font-family:inherit;font-weight:bold;font-size:12px;cursor:pointer;border-radius:4px;border:3px solid #8a5a2a;background:#3a2a1a;color:#ffe8b0}
#charButtons button.primary{background:#4a7a2a;border-color:#8ac04a}
#dialogueBox{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(700px,94vw);background:linear-gradient(135deg,#2a1a0a,#1a1208);border:3px solid #8a5a2a;border-radius:6px;padding:14px 18px;z-index:130;display:none;box-shadow:0 8px 30px rgba(0,0,0,.8)}
#dialogueBox.show{display:block;animation:slideUp .2s ease-out}
@keyframes slideUp{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#dialogueBox .dheader{display:flex;gap:12px;margin-bottom:8px;align-items:flex-start}
#dialogueBox .dportrait{width:72px;height:96px;flex-shrink:0;background:#1a1208;border:2px solid #5a3a1a;border-radius:4px;image-rendering:pixelated}
#dialogueBox .dname{color:#e8c060;font-weight:bold;font-size:14px;letter-spacing:1px;margin-bottom:6px}
#dialogueBox .dtext{color:#ffe8b0;font-size:13px;line-height:1.6;min-height:42px}
#dialogueBox .dopts{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:180px;overflow-y:auto}
#dialogueBox .dopts button{background:#3a2a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:10px 14px;font-size:12px;cursor:pointer;border-radius:4px;font-family:inherit;text-align:left;width:100%}
#dialogueBox .dhint{color:#8ac04a;font-size:10px;text-align:right;margin-top:8px;opacity:.8}
#loadingScreen .bar{width:300px;max-width:80vw;height:14px;background:#1a1a0a;border:2px solid #8a5a2a;border-radius:4px;overflow:hidden}
#loadBar{width:0%;height:100%;background:linear-gradient(90deg,#8ac04a,#e8c060);transition:width .15s}
#elevatorMenu{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:140;display:none;justify-content:center;align-items:center;padding:20px}
#elevatorMenu.show{display:flex}
#elevatorMenu .panel{background:linear-gradient(135deg,#2a1a0a,#1a1208);border:3px solid #8a5a2a;border-radius:8px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
#elevatorMenu h3{color:#e8c060;text-align:center;margin-bottom:14px;letter-spacing:2px}
.floor-btn{display:block;width:100%;background:#3a2a1a;color:#ffe8b0;border:2px solid #8a5a2a;padding:12px;margin-bottom:6px;font-family:inherit;font-size:13px;cursor:pointer;border-radius:4px;font-weight:bold}
.floor-btn.surface{background:#4a7a2a;border-color:#8ac04a}
#confirmModal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:145;display:none;justify-content:center;align-items:center;padding:20px}
#confirmModal.show{display:flex}
#confirmModal .panel{background:linear-gradient(135deg,#2a1a0a,#1a1208);border:3px solid #8a5a2a;border-radius:8px;padding:20px;max-width:420px;width:100%;text-align:center}
#confirmModal .cmsg{color:#ffe8b0;font-size:14px;margin-bottom:16px;line-height:1.6}
#confirmModal .cbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#confirmModal button{padding:10px 20px;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;border-radius:4px;border:2px solid #8a5a2a;background:#3a2a1a;color:#ffe8b0;min-width:110px}
#confirmModal button.primary{background:#4a7a2a;border-color:#8ac04a}
.social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.social-card{background:#2a1a0a;border:2px solid #5a3a1a;border-radius:6px;padding:10px}
.social-card.friend{border-color:#8ac04a}
.social-card.best{border-color:#ff6080;background:#3a1a1a}
.social-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.social-head .nm{color:#ffe8b0;font-weight:bold;font-size:12px}
.social-head .role{color:#8ac04a;font-size:10px}
.social-hearts{color:#ff6080;font-size:11px;margin-bottom:4px}
.social-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.social-actions button{padding:4px 10px;font-size:10px;background:#4a7a2a;border:1px solid #8ac04a;color:#ffe8b0;cursor:pointer;font-family:inherit;border-radius:3px}
.social-actions button:disabled{opacity:.4;cursor:not-allowed}
.social-actions button.gift{background:#5a4a2a;border-color:#c8a040}
@media(max-width:600px){
  .menu-top .info{font-size:10px;gap:5px}
  .tab-btn{min-width:56px;padding:6px 8px}
  .tab-btn .tab-label{display:none}
  .social-grid{grid-template-columns:1fr}
  .inv-grid-visual{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
  .inv-slot .icon{font-size:26px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="notify"></div><div id="fade"></div><div id="centerText"></div>

<div id="dialogueBox">
  <div class="dheader">
    <canvas class="dportrait" id="dialoguePortrait" width="24" height="32"></canvas>
    <div style="flex:1">
      <div class="dname" id="dialogueName">NPC</div>
      <div class="dtext" id="dialogueText">...</div>
    </div>
  </div>
  <div class="dopts" id="dialogueOptions"></div>
  <div class="dhint" id="dialogueHint">Click to continue ▶</div>
</div>

<div id="elevatorMenu"><div class="panel"><h3>🛗 ELEVATOR</h3><div id="elevatorFloors"></div><button class="floor-btn" onclick="closeElevator()" style="background:#6a2020;border-color:#a04040;margin-top:12px">✕ Close</button></div></div>
<div id="confirmModal"><div class="panel"><div class="cmsg"></div><div class="cbtns"><button class="cno">Cancel</button><button class="cyes primary">OK</button></div></div></div>

<div id="charCreate">
  <div id="charPreview">
    <canvas id="charPreviewCanvas" width="160" height="200"></canvas>
    <div class="pname" id="charPreviewName">Farmer</div>
  </div>
  <div id="charOptions">
    <h3 id="charTitle">CREATE YOUR FARMER</h3>
    <div class="opt-row"><label id="labelName">NAME</label><input type="text" id="charNameInput" maxlength="14" value="Farmer"></div>
    <div class="opt-row"><label id="labelSkin">SKIN</label><div class="swatch-row" id="swSkin"></div></div>
    <div class="opt-row"><label id="labelHair">HAIR</label><div class="swatch-row" id="swHair"></div></div>
    <div class="opt-row"><label id="labelShirt">SHIRT</label><div class="swatch-row" id="swShirt"></div></div>
    <div class="opt-row"><label id="labelPants">PANTS</label><div class="swatch-row" id="swPants"></div></div>
    <div class="opt-row"><label id="labelShoes">SHOES</label><div class="swatch-row" id="swShoes"></div></div>
    <div class="opt-row"><label id="labelHat">HAT</label><div class="swatch-row" id="swHat"></div></div>
    <div id="charButtons">
      <button id="charBtnRandom">🎲 Random</button>
      <button id="charBtnCancel">Cancel</button>
      <button id="charBtnConfirm" class="primary">✓ Confirm</button>
    </div>
  </div>
</div>

<div id="loadingScreen" class="screen">
  <h1>PIXEL FARM</h1>
  <div style="color:#8ac04a;font-size:13px;letter-spacing:2px;margin-bottom:12px" id="loadText">Loading...</div>
  <div class="bar"><div id="loadBar"></div></div>
  <div style="color:#a08060;font-size:10px;margin-top:8px" id="loadPct">0%</div>
</div>

<div id="langSelect" class="screen hidden">
  <h1>PIXEL FARM</h1><h2>Choose your language / Выберите язык</h2>
  <div class="lang-grid" id="langGrid"></div>
</div>

<div id="menuMain" class="screen hidden">
  <h1>PIXEL FARM</h1>
  <button id="btnNew" class="primary">New Game</button>
  <button id="btnContinue">Continue</button>
  <button id="btnHelp">Help</button>
</div>

<div id="menuHelp" class="screen hidden">
  <h2>How to Play</h2>
  <div id="helpBody" style="max-width:560px;text-align:left;font-size:12px;line-height:1.9;color:#ffe8b0"></div>
  <button id="btnHelpBack">Back</button>
</div>

<div id="endingScreen" class="screen hidden">
  <h1 style="font-size:clamp(32px,10vw,72px);color:#e8c060">THE END</h1>
  <div style="max-width:600px;text-align:center;font-size:14px;line-height:2;color:#ffe8b0;margin:20px 0">
    <p>You completed the Museum collection!</p><p style="color:#8ac04a;margin-top:20px" id="endingStats"></p>
  </div>
  <button onclick="location.reload()" class="primary">Play Again</button>
</div>

<div id="gameMenu">
  <div class="menu-wrap">
    <div class="menu-top">
      <span class="name" id="playerName">Farmer</span>
      <span class="info">
        <span id="menuDay">Day 1</span>
        <span id="menuSeason">Spring</span>
        <span id="menuTime">06:00</span>
        <span id="menuGold">🪙 80</span>
        <span id="menuWeather">☀️</span>
      </span>
    </div>
    <div class="menu-body">
      <div class="menu-tabs" id="menuTabs"></div>
      <div class="menu-content" id="menuContent"></div>
    </div>
    <div class="menu-bottom">
      <button id="btnMenuResume" class="primary">Resume</button>
      <button id="btnMenuSave">Save</button>
      <button id="btnMenuMain" class="danger">Main Menu</button>
    </div>
  </div>
</div>

const cv = $('cv');
const ctx = cv.getContext('2d',{alpha:false});
const TILE = 16, SCALE = 2;
let LW = 480, LH = 360;
let isPortrait = false;
function fitCanvas(){
  const vw = innerWidth, vh = innerHeight;
  isPortrait = vh > vw * 1.15;
  if(isPortrait){ LW = 360; LH = 480; } else { LW = 480; LH = 360; }
  const ratio = LW / LH;
  let w, h;
  if(vw/vh > ratio){ h = vh; w = vh*ratio; } else { w = vw; h = vw/ratio; }
  cv.width = LW*SCALE; cv.height = LH*SCALE;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.style.left = ((vw-w)/2)+'px'; cv.style.top = ((vh-h)/2)+'px';
  $('charCreate').classList.toggle('portrait-mode', isPortrait);
}
addEventListener('resize', fitCanvas);

const Snd = {
  ctx:null, master:null, musicGain:null, sfxGain:null, activeNodes:[], playing:false, max:8,
  musicRAF:null, musicNextTime:0, musicIdx:0,
  enabled: localStorage.getItem('pixelfarm_sound') !== 'off',
  init(){ if(this.ctx) return;
    try{ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.enabled?0.22:0; this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.06; this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.85; this.sfxGain.connect(this.master);
    }catch(e){} },
  setEnabled(on){ this.enabled = on; localStorage.setItem('pixelfarm_sound', on?'on':'off');
    if(this.master) this.master.gain.value = on?0.22:0;
    if(!on) this.stopMusic(); else if(Game && !Game.paused && !Game.menuOpen && !document.hidden) this.startMusic(); },
  resume(){ try{ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  beep(f1,f2,dur,type,vol){
    if(!this.ctx || !this.enabled || this.activeNodes.length >= this.max) return;
    try{ const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      osc.type = type||'square'; osc.frequency.setValueAtTime(f1,now);
      if(f2) osc.frequency.exponentialRampToValueAtTime(f2,now+dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol||0.15,now); g.gain.exponentialRampToValueAtTime(0.001,now+dur);
      osc.connect(g).connect(this.sfxGain);
      osc.start(now); osc.stop(now+dur+0.02);
      this.activeNodes.push({node:osc, t:performance.now()+dur*1000+100});
      if(this.activeNodes.length>this.max){ const o = this.activeNodes.shift(); try{o.node.stop();}catch(e){} }
    }catch(e){} },
  play(type){
    const map = {step:[400,400,0.04,'sine',0.04], chop:[200,70,0.12,'square',0.15], pick:[1400,500,0.06,'square',0.1],
      plant:[500,800,0.1,'sine',0.08], water:[2000,1500,0.08,'sine',0.08], harvest:[523,784,0.15,'sine',0.1],
      fish:[440,1046,0.2,'triangle',0.12], coin:[880,1320,0.1,'square',0.08], click:[900,900,0.03,'square',0.04],
      error:[200,100,0.14,'sawtooth',0.06], hurt:[300,100,0.18,'sawtooth',0.13], hit:[400,120,0.09,'square',0.13],
      levelup:[523,1318,0.35,'triangle',0.11], sleep:[100,60,0.9,'sine',0.09], door:[300,500,0.12,'square',0.08],
      moo:[180,120,0.4,'sawtooth',0.1], cluck:[800,500,0.09,'square',0.05], neigh:[600,300,0.3,'sawtooth',0.1],
      donate:[392,784,0.5,'sine',0.1], greet:[600,900,0.1,'sine',0.08],
      giftGood:[523,1046,0.3,'triangle',0.13], giftBad:[300,150,0.3,'sawtooth',0.1],
      elevator:[300,600,0.15,'triangle',0.12], eat:[400,600,0.15,'sine',0.1],
      cast:[600,900,0.15,'sine',0.08], bite:[1200,800,0.15,'square',0.15], caught:[523,1046,0.4,'triangle',0.15],
      escape:[300,150,0.4,'sawtooth',0.12], thunder:[80,40,0.7,'sawtooth',0.2], bark:[400,200,0.2,'sawtooth',0.1] };
    if(map[type]) this.beep.apply(this, map[type]);
  },
  startMusic(){ if(!this.ctx || this.playing || !this.enabled) return;
    this.playing = true;
    this.musicNextTime = this.ctx.currentTime;
    this.musicIdx = 0;
    const step = ()=>{
      if(!this.playing || !this.ctx){ this.musicRAF = null; return; }
      const now = this.ctx.currentTime;
      const mel = [392,440,494,587,523,494,440,392,349,392,440,494,440,392,349,330,294,330,349,392];
      const dur = [.4,.4,.4,.8,.4,.4,.4,.8,.4,.4,.4,1.2,.4,.4,.4,.8,.4,.4,.4,1.2];
      while(this.musicNextTime < now + 0.5){
        const i = this.musicIdx % mel.length;
        try{
          const o = this.ctx.createOscillator(); o.type='triangle'; o.frequency.value = mel[i];
          const g = this.ctx.createGain();
          const s = this.musicNextTime;
          g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(0.3,s+0.03);
          g.gain.linearRampToValueAtTime(0.07,s+dur[i]*0.5); g.gain.linearRampToValueAtTime(0,s+dur[i]);
          o.connect(g).connect(this.musicGain); o.start(s); o.stop(s+dur[i]);
        }catch(e){}
        this.musicNextTime += dur[i];
        this.musicIdx++;
      }
      this.musicRAF = requestAnimationFrame(step);
    };
    step();
  },
  stopMusic(){ this.playing = false; if(this.musicRAF){ cancelAnimationFrame(this.musicRAF); this.musicRAF = null; } },
  stopAll(){ for(const a of this.activeNodes){ try{a.node.stop();}catch(e){} } this.activeNodes = []; this.stopMusic(); }
};
let audioUnlocked = false;
function unlockAudio(){
  Snd.init(); Snd.resume();
  if(!audioUnlocked) audioUnlocked = true;
  if(Game && !Game.paused && !Game.menuOpen && !Game.sleeping && !Game.dialogue && !Snd.playing && !document.hidden) Snd.startMusic();
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ Snd.stopMusic(); }
  else if(Game && !Game.paused && !Game.menuOpen && Snd.enabled) Snd.startMusic();
});

const S = {};
function spr(n,w,h,fn){ try{ const c = document.createElement('canvas'); c.width=w; c.height=h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(g,w,h); S[n]=c; }catch(e){} }
function rr(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,w|0,h|0); }
function mirror(a,b){ const s=S[a]; if(!s) return; const c = document.createElement('canvas'); c.width=s.width; c.height=s.height; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.translate(s.width,0); g.scale(-1,1); g.drawImage(s,0,0); S[b]=c; }

function drawChar(g,dir,frame,state,cust){
  const skin = SKIN[cust.skin]||SKIN[0], hair = HAIR[cust.hair]||HAIR[0];
  const shirt = SHIRT[cust.shirt]||SHIRT[0], pants = PANTS[cust.pants]||PANTS[0], shoes = SHOES[cust.shoes]||SHOES[0];
  const eye = '#1a1a2a', mouth = '#a05040', blush = '#d06050';
  if(state==='sleep'){ rr(g,4,20,20,7,shirt); rr(g,2,22,5,5,skin); rr(g,22,24,4,3,shoes); rr(g,18,20,4,7,pants); g.fillStyle='#fff'; g.font='bold 7px monospace'; g.fillText('z',20,16); g.fillText('Z',23,11); return; }
  const cx = 12;
  let legL=0,legR=0,bob=0,armL=0,armR=0;
  if(state==='walk'){ const o=[0,1,0,-1]; legL=o[frame]; legR=-o[frame]; bob=(frame===1||frame===3)?-1:0; armL=o[frame]; armR=-o[frame]; }
  const fY = 31;
  if(dir==='l'||dir==='r'){ rr(g,cx-2+legL,fY-8,3,8,pants); rr(g,cx+1+legR,fY-8,3,8,pants); rr(g,cx-3+legL,fY-2,4,2,shoes); rr(g,cx+1+legR,fY-2,4,2,shoes); }
  else { rr(g,cx-3,fY-8+legL,3,8,pants); rr(g,cx+1,fY-8+legR,3,8,pants); rr(g,cx-4,fY-2+legL,4,2,shoes); rr(g,cx+1,fY-2+legR,4,2,shoes); }
  const bT = fY-19+bob;
  rr(g,cx-5,bT,10,11,shirt); rr(g,cx-5,bT+9,10,2,'rgba(0,0,0,0.2)');
  const aY = bT+2;
  if(dir==='d'||dir==='u'){ rr(g,cx-7,aY+armL,2,7,shirt); rr(g,cx+5,aY+armR,2,7,shirt); if(dir==='d'){ rr(g,cx-7,aY+armL+6,2,2,skin); rr(g,cx+5,aY+armR+6,2,2,skin); } }
  else if(dir==='l'){ rr(g,cx-6,aY+armL,3,7,shirt); rr(g,cx+2,aY+armR,2,7,shirt); rr(g,cx-6,aY+armL+6,3,2,skin); }
  else { rr(g,cx+4,aY+armL,3,7,shirt); rr(g,cx-4,aY+armR,2,7,shirt); rr(g,cx+4,aY+armL+6,3,2,skin); }
  const hT = bT-14;
  if(dir==='l'){ rr(g,cx-5,hT,9,12,skin); rr(g,cx+2,hT,2,12,'rgba(0,0,0,0.15)'); rr(g,cx-6,hT+2,2,8,hair); rr(g,cx-3,hT+6,2,2,eye); rr(g,cx-6,hT+9,2,1,blush); }
  else if(dir==='r'){ rr(g,cx-4,hT,9,12,skin); rr(g,cx-5,hT,2,12,'rgba(0,0,0,0.15)'); rr(g,cx+4,hT+2,2,8,hair); rr(g,cx+1,hT+6,2,2,eye); rr(g,cx+4,hT+9,2,1,blush); }
  else if(dir==='d'){ rr(g,cx-4,hT,8,12,skin); rr(g,cx-5,hT+1,2,9,hair); rr(g,cx+3,hT+1,2,9,hair); rr(g,cx-3,hT+6,2,2,eye); rr(g,cx+1,hT+6,2,2,eye); rr(g,cx-1,hT+9,2,1,mouth); rr(g,cx-4,hT+9,2,1,blush); rr(g,cx+2,hT+9,2,1,blush); }
  else { rr(g,cx-4,hT,8,12,skin); rr(g,cx-5,hT+1,10,9,hair); rr(g,cx-5,hT+6,10,4,'rgba(0,0,0,0.3)'); }
  if(cust.hat===1){ rr(g,cx-7,hT-3,14,2,'#a88030'); rr(g,cx-6,hT-6,12,4,'#e8c060'); }
  else if(cust.hat===2){ rr(g,cx-6,hT-3,12,2,'#a03030'); rr(g,cx-5,hT-6,10,4,'#c84040'); }
  else if(cust.hat===3){ rr(g,cx-5,hT-5,10,6,'#4080c0'); }
  else if(cust.hat===4){ rr(g,cx-7,hT-2,14,3,'#3a2050'); rr(g,cx-5,hT-10,10,9,'#5a3a8a'); }
  else if(cust.hat===5){ rr(g,cx-8,hT-2,16,2,'#6a4a20'); rr(g,cx-6,hT-6,12,4,'#8a5a30'); }
  if(state==='use'){
    if(dir==='l'){ rr(g,cx-10,aY,3,3,'#8a5a30'); rr(g,cx-12,aY-3,5,4,'#a0a8b0'); }
    else if(dir==='r'){ rr(g,cx+7,aY,3,3,'#8a5a30'); rr(g,cx+8,aY-3,5,4,'#a0a8b0'); }
    else if(dir==='d'){ rr(g,cx+3,aY+4,3,3,'#8a5a30'); rr(g,cx+1,aY+7,8,4,'#a0a8b0'); }
    else { rr(g,cx-8,aY-6,3,3,'#8a5a30'); rr(g,cx-10,aY-9,5,4,'#a0a8b0'); }
  }
}
function regenerateChar(){
  for(const d of ['d','u','l','r']){
    for(let f=0;f<4;f++) spr('c_'+d+'_'+f,24,32,g=>drawChar(g,d,f,'walk',Custom));
    spr('c_'+d+'_idle',24,32,g=>drawChar(g,d,0,'idle',Custom));
    spr('c_'+d+'_use',24,32,g=>drawChar(g,d,0,'use',Custom));
    spr('c_'+d+'_sleep',24,32,g=>drawChar(g,d,0,'sleep',Custom));
  }
  for(let f=0;f<4;f++) mirror('c_r_'+f,'c_l_'+f);
  mirror('c_r_idle','c_l_idle'); mirror('c_r_use','c_l_use'); mirror('c_r_sleep','c_l_sleep');
}

function tileGrass(g,v,s){
  let base,dark,light;
  if(s===0){ base='#5a9a3a'; dark='#3a7028'; light='#78b84a'; }
  else if(s===1){ base='#4a8a2a'; dark='#2a6018'; light='#68a83a'; }
  else if(s===2){ base='#9a8a3a'; dark='#6a5a2a'; light='#b8a84a'; }
  else { base='#d8dce0'; dark='#b8bcc0'; light='#eef0f4'; }
  rr(g,0,0,16,16,base);
  if(v===0){ rr(g,3,4,2,1,dark); rr(g,9,6,2,1,dark); rr(g,5,11,3,1,light); }
  else if(v===1){ for(let i=0;i<7;i++){ const x=(i*5)%14+1,y=(i*7)%14+1; rr(g,x,y,1,2,i%2?dark:light); } }
  else if(v===2){ rr(g,4,3,1,1,'#ffd54a'); rr(g,11,7,1,1,'#ff8aa8'); }
  else { rr(g,2,3,3,1,light); rr(g,10,5,2,1,dark); }
}

// Trees (5 types × 3 stages × 3 frames × 4 seasons)
function treeColors(type, season){
  const c = {
    oak:{ spring:['#2a6a1a','#4a9a2a','#6ac04a','#8ad86a'], summer:['#1a5a0a','#3a8a1a','#5ab03a','#7ac85a'], fall:['#5a2a08','#a84a10','#d88030','#f0a850'], winter:['#5a6070','#7a8090','#a0a8b8','#c8d0d8'] },
    birch:{ spring:['#4a8a2a','#6ac04a','#8ad86a','#a8e888'], summer:['#3a7a1a','#5ab03a','#7ac85a','#9ad87a'], fall:['#7a5a10','#d8a030','#f0c050','#ffe070'], winter:['#6a7080','#8a90a0','#b0b8c8','#d0d8e8'] },
    maple:{ spring:['#3a6a2a','#5a9a3a','#7ac04a','#a0d86a'], summer:['#2a5a1a','#4a8a2a','#6ac04a','#8ad86a'], fall:['#7a2010','#c84020','#e87040','#f8a060'], winter:['#5a6070','#7a8090','#a0a8b8','#c8d0d8'] },
    willow:{ spring:['#4a7a3a','#6a9a4a','#8aba6a','#aada8a'], summer:['#3a6a2a','#5a8a3a','#7aaa5a','#9aca7a'], fall:['#7a5a20','#b89040','#d8b060','#f0c880'], winter:['#6a7080','#8a90a0','#b0b8c8','#d0d8e8'] },
    pine:{ spring:['#1a3a1a','#2a5a2a','#4a8a3a','#6aaa4a'], summer:['#1a3a1a','#2a5a2a','#4a8a3a','#6aaa4a'], fall:['#3a2a10','#5a4a20','#8a7030','#a89050'], winter:['#5a6070','#7a8090','#a0a8b8','#c8d0d8'] }
  };
  return c[type][SEASONS[season]];
}
function trunkColors(type){
  return {oak:{mid:'#5a3a1a',light:'#8a6a4a',dark:'#3a2510'},birch:{mid:'#d8d0c0',light:'#f0e8d8',dark:'#7a6a5a'},maple:{mid:'#6a4a2a',light:'#8a6a4a',dark:'#4a2a10'},willow:{mid:'#5a4a2a',light:'#7a6a4a',dark:'#3a2a1a'},pine:{mid:'#5a3a1a',light:'#7a5a30',dark:'#3a2510'}}[type];
}
function drawBroadleaf(g, type, season, growStage, animFrame){
  const cx = 24, baseY = 70;
  const shadowSize = 12 + growStage * 2;
  g.globalAlpha = 0.28; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(cx, baseY-2, shadowSize, shadowSize/4, 0, 0, Math.PI*2); g.fill();
  g.globalAlpha = 1;
  const tc = trunkColors(type);
  const colors = treeColors(type, season);
  const trunkTop = [58, 46, 34][growStage];
  const trunkW = [4, 6, 8][growStage];
  const trunkX = cx - trunkW/2;
  rr(g, trunkX, trunkTop, trunkW, baseY-trunkTop, tc.mid);
  rr(g, trunkX, trunkTop, Math.max(1,trunkW/3|0), baseY-trunkTop, tc.light);
  rr(g, trunkX+trunkW-Math.max(1,trunkW/3|0), trunkTop, Math.max(1,trunkW/3|0), baseY-trunkTop, tc.dark);
  for(let i=0;i<3;i++){ rr(g, trunkX + (i%2?2:1), trunkTop+6+i*8, 1, 4, tc.dark); }
  if(growStage === 2){ rr(g, trunkX-2, baseY-4, 3, 4, tc.mid); rr(g, trunkX+trunkW-1, baseY-4, 3, 4, tc.mid); }
  if(season === 3){
    if(growStage === 2){
      rr(g, cx-14, 24, 13, 3, tc.mid); rr(g, cx+1, 20, 13, 3, tc.mid);
      rr(g, cx-10, 30, 9, 2, tc.dark); rr(g, cx+2, 28, 9, 2, tc.dark);
      rr(g, cx-14, 22, 13, 3, '#e8eef8'); rr(g, cx+1, 18, 13, 3, '#e8eef8');
    } else if(growStage === 1){
      rr(g, cx-6, 44, 6, 2, tc.mid); rr(g, cx+1, 42, 6, 2, tc.mid);
    }
    rr(g, trunkX, trunkTop-2, trunkW, 2, '#f0f4f8');
    return;
  }
  const sway = [0, 1, -1][animFrame];
  const cDark = colors[0], cMid = colors[1], cLight = colors[2], cShine = colors[3];
  if(growStage === 0){
    g.fillStyle = cMid; g.beginPath(); g.arc(cx+sway, 52, 6, 0, Math.PI*2); g.fill();
    g.fillStyle = cLight; g.beginPath(); g.arc(cx+sway-2, 50, 4, 0, Math.PI*2); g.fill();
    return;
  }
  if(growStage === 1){
    g.fillStyle = cDark; g.beginPath(); g.arc(cx+sway, 34, 13, 0, Math.PI*2); g.fill();
    g.fillStyle = cMid; g.beginPath(); g.arc(cx+sway, 32, 10, 0, Math.PI*2); g.fill();
    g.fillStyle = cLight; g.beginPath(); g.arc(cx+sway-2, 28, 7, 0, Math.PI*2); g.fill();
    return;
  }
  const sA = sway, sB = sway*1.5;
  g.fillStyle = cDark;
  g.beginPath(); g.arc(cx+sA, 22, 19, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx-9+sA, 20, 11, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+9+sA, 20, 11, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+sA, 12, 13, 0, Math.PI*2); g.fill();
  g.fillStyle = cMid;
  g.beginPath(); g.arc(cx+sA, 20, 16, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx-9+sB, 22, 9, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+9+sB, 22, 9, 0, Math.PI*2); g.fill();
  g.fillStyle = cLight;
  g.beginPath(); g.arc(cx-3+sB, 15, 11, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+6+sB, 16, 9, 0, Math.PI*2); g.fill();
  g.fillStyle = cShine;
  g.beginPath(); g.arc(cx-5+sB, 10, 6, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+2+sB, 12, 4, 0, Math.PI*2); g.fill();
}
function drawPine(g, season, growStage, animFrame){
  const cx = 24, baseY = 70;
  const shadowSize = 10 + growStage * 2;
  g.globalAlpha = 0.28; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(cx, baseY-2, shadowSize, shadowSize/4, 0, 0, Math.PI*2); g.fill();
  g.globalAlpha = 1;
  const tc = trunkColors('pine');
  const colors = treeColors('pine', season);
  const cDark = colors[0], cMid = colors[1], cLight = colors[2];
  const trunkTop = [56, 44, 32][growStage];
  const trunkW = [3, 4, 5][growStage];
  rr(g, cx-trunkW/2, trunkTop, trunkW, baseY-trunkTop, tc.mid);
  rr(g, cx-trunkW/2, trunkTop, 1, baseY-trunkTop, tc.light);
  rr(g, cx+trunkW/2-1, trunkTop, 1, baseY-trunkTop, tc.dark);
  const layers = [3, 5, 7][growStage];
  const sway = [0, 1, -1][animFrame] * 0.5;
  const startY = [50, 40, 40][growStage];
  const wBase = [8, 16, 20][growStage];
  for(let i=0;i<layers;i++){
    const y = startY - i*6;
    const w = wBase - i*2;
    g.fillStyle = cDark;
    g.beginPath(); g.moveTo(cx+sway, y-10); g.lineTo(cx-w, y+2); g.lineTo(cx+w, y+2); g.closePath(); g.fill();
    g.fillStyle = cMid;
    g.beginPath(); g.moveTo(cx+sway, y-9); g.lineTo(cx-w+3, y+1); g.lineTo(cx+w-3, y+1); g.closePath(); g.fill();
    g.fillStyle = cLight;
    g.beginPath(); g.moveTo(cx-2+sway, y-6); g.lineTo(cx-w+5, y); g.lineTo(cx-2+sway, y); g.closePath(); g.fill();
  }
  if(season === 3){
    g.fillStyle = '#f0f4f8';
    for(let i=0;i<layers;i+=2){
      const y = startY - i*6;
      const w = wBase - i*2;
      g.beginPath(); g.moveTo(cx+sway, y-11); g.lineTo(cx-w+2, y-3); g.lineTo(cx+w-2, y-3); g.closePath(); g.fill();
    }
  }
}
for(let s=0;s<4;s++){
  for(const type of ['oak','birch','maple','willow']){
    for(let gs=0;gs<3;gs++){
      for(let af=0;af<3;af++){
        spr('tree_'+type+'_'+s+'_'+gs+'_'+af, 48, 72, g=>drawBroadleaf(g, type, s, gs, af));
      }
    }
  }
  for(let gs=0;gs<3;gs++){
    for(let af=0;af<3;af++){
      spr('pine_'+s+'_'+gs+'_'+af, 48, 72, g=>drawPine(g, s, gs, af));
    }
  }
  spr('tree_'+s, 48, 72, g=>drawBroadleaf(g, 'oak', s, 2, 0));
  spr('pine_'+s, 48, 72, g=>drawPine(g, s, 2, 0));
}

// Crops — 5 stages × 6 types
const CROPS = ['wheat','carrot','tomato','potato','corn','pumpkin'];
function drawCrop(g, type, stage){
  const cx = 8;
  if(stage === 0){ rr(g, cx-2, 12, 4, 3, '#3a2510'); rr(g, cx-1, 11, 2, 1, '#5a3a1a'); return; }
  if(stage === 1){ rr(g, cx-1, 12, 2, 3, '#3a7a2a'); rr(g, cx-3, 10, 2, 2, '#5aa04a'); rr(g, cx+1, 11, 2, 2, '#4a9a3a'); return; }
  if(stage === 2){ rr(g, cx-1, 8, 2, 7, '#3a8a2a'); rr(g, cx-4, 7, 3, 3, '#5ab04a'); rr(g, cx+1, 8, 3, 3, '#5ab04a'); rr(g, cx-3, 11, 2, 2, '#4aa03a'); return; }
  if(stage === 3){
    rr(g, cx-1, 4, 2, 11, '#4a8a2a'); rr(g, cx-5, 4, 3, 4, '#5ab04a'); rr(g, cx+2, 5, 3, 4, '#5ab04a');
    rr(g, cx-3, 8, 2, 3, '#4aa03a'); rr(g, cx+1, 9, 3, 3, '#4aa03a');
    if(type === 'tomato'){ rr(g, cx-4, 10, 2, 2, '#80a040'); }
    else if(type === 'pumpkin'){ rr(g, cx-3, 11, 4, 3, '#90a040'); }
    return;
  }
  if(type === 'wheat'){ rr(g, cx-1, 1, 2, 14, '#c8a840'); rr(g, cx-3, 3, 2, 4, '#e0c050'); rr(g, cx+1, 4, 2, 4, '#e0c050'); rr(g, cx-2, 0, 1, 3, '#f0d060'); rr(g, cx+1, 0, 1, 3, '#f0d060'); }
  else if(type === 'carrot'){ rr(g, cx-1, 3, 2, 10, '#4a8a2a'); rr(g, cx-4, 4, 3, 4, '#5ab04a'); rr(g, cx+2, 5, 3, 4, '#5ab04a'); rr(g, cx-2, 11, 3, 5, '#e07020'); rr(g, cx+1, 11, 3, 5, '#e07020'); }
  else if(type === 'tomato'){ rr(g, cx-1, 3, 2, 10, '#3a7a2a'); rr(g, cx-4, 4, 3, 3, '#5ab04a'); rr(g, cx+2, 5, 3, 3, '#5ab04a'); g.fillStyle = '#d03030'; g.beginPath(); g.arc(cx-3, 10, 2.5, 0, Math.PI*2); g.fill(); g.beginPath(); g.arc(cx+3, 11, 2.5, 0, Math.PI*2); g.fill(); }
  else if(type === 'potato'){ rr(g, cx-1, 5, 2, 9, '#4a8a2a'); rr(g, cx-3, 6, 2, 3, '#5ab04a'); rr(g, cx+1, 7, 2, 3, '#5ab04a'); rr(g, cx-4, 11, 4, 4, '#a87848'); rr(g, cx+1, 11, 4, 4, '#a87848'); }
  else if(type === 'corn'){ rr(g, cx-1, 1, 2, 14, '#4a8a2a'); rr(g, cx-4, 3, 3, 6, '#c8a840'); rr(g, cx+1, 4, 3, 6, '#c8a840'); }
  else if(type === 'pumpkin'){ rr(g, cx-1, 4, 2, 8, '#4a8a2a'); rr(g, cx-3, 5, 2, 3, '#5ab04a'); rr(g, cx+1, 6, 2, 3, '#5ab04a'); g.fillStyle = '#e08020'; g.beginPath(); g.ellipse(cx, 12, 5, 4, 0, 0, Math.PI*2); g.fill(); }
}

function drawBigHouse(g,wc,r1,r2){
  rr(g,4,50,120,58,wc); for(let i=0;i<7;i++) rr(g,8+i*16,54,1,52,'rgba(0,0,0,0.1)');
  for(let i=0;i<14;i++){ const y=20+i*2; rr(g,4-i,y,120+i*2,2,i%2?r1:r2); }
  rr(g,0,50,128,3,'#4a1a10'); rr(g,44,8,40,14,r1); rr(g,46,6,36,4,r2);
  rr(g,96,4,10,20,'#6a4830'); rr(g,98,0,6,4,'#8a5a3a');
  rr(g,54,72,20,36,'#5a3a1a'); rr(g,58,76,12,32,'#7a5a3a'); rr(g,68,88,3,3,'#e8c060');
  rr(g,18,62,20,18,'#8a5a3a'); rr(g,20,64,16,14,'#6a9ac8');
  rr(g,90,62,20,18,'#8a5a3a'); rr(g,92,64,16,14,'#6a9ac8');
}

function drawNPCspr(g,hair,shirt,pants,hat,dir){
  const cx=12, skin='#f5cb9b';
  rr(g,cx-3,23,3,8,pants); rr(g,cx+1,23,3,8,pants);
  rr(g,cx-4,29,4,2,'#3a2510'); rr(g,cx+1,29,4,2,'#3a2510');
  rr(g,cx-5,12,10,11,shirt); rr(g,cx-5,21,10,2,'rgba(0,0,0,0.15)');
  rr(g,cx-7,14,2,8,shirt); rr(g,cx+5,14,2,8,shirt);
  const hT=2;
  rr(g,cx-4,hT,8,11,skin);
  if(dir!=='u'){ rr(g,cx-3,hT+5,2,2,'#1a1a2a'); rr(g,cx+1,hT+5,2,2,'#1a1a2a'); rr(g,cx-1,hT+8,2,1,'#a05040'); }
  rr(g,cx-5,hT+1,2,6,hair); rr(g,cx+3,hT+1,2,6,hair); rr(g,cx-4,hT-1,8,3,hair);
  if(hat){ rr(g,cx-6,hT-2,12,3,hat); rr(g,cx-4,hT-5,8,3,hat); }
}
for(let i=0;i<20;i++){
  const tpl = NPC_TPL[i % NPC_TPL.length];
  const [hair,shirt,pants,hat] = tpl;
  for(const d of ['d','u','l','r']) spr('npc'+i+'_'+d,24,32,g=>drawNPCspr(g,hair,shirt,pants,hat,d));
}

  const table = WEATHER_CHANCE[SEASONS[Game.season]] || WEATHER_CHANCE.spring;
  let r = Math.random(), cum = 0;
  for(const k in table){
    cum += table[k];
    if(r <= cum) return k;
  }
  return 'sunny';
}

function makeTown(){

  for(let y=22;y<28;y++) for(let x=26;x<36;x++) m[y][x]=T_FLOOR;

function makeBeach(){

function makeForest(){
  const m = makeMap(48,48,T_GRASS);
  for(let y=22;y<28;y++) m[y][0]=T_PATH;

function makeMountain(){
  const m = makeMap(48,48,T_GRASS);
  for(let y=0;y<48;y++) for(let x=0;x<48;x++) if(Math.random()<0.15) m[y][x]=T_ROCK;
  for(let y=42;y<48;y++) for(let x=22;x<28;x++) m[y][x]=T_GRASS;
  for(let x=22;x<28;x++) m[0][x]=T_PATH;
  for(let y=0;y<47;y++) m[y][24]=T_PATH;
  for(let x=22;x<28;x++) m[46][x]=T_PATH;
  for(let y=12;y<18;y++) for(let x=18;x<30;x++) m[y][x]=T_WATER;
  for(let y=6;y<12;y++) for(let x=20;x<28;x++) if(m[y][x]===T_ROCK) m[y][x]=T_GRASS;
  return m;
}
function makeIndoor(w,h){
  const m = makeMap(w,h,T_IND_FLOOR);
  for(let x=0;x<w;x++){ m[0][x]=T_IND_WALL; m[h-1][x]=T_IND_WALL; }
  for(let y=0;y<h;y++){ m[y][0]=T_IND_WALL; m[y][w-1]=T_IND_WALL; }
  m[h-1][Math.floor(w/2)]=T_IND_FLOOR; m[h-1][Math.floor(w/2)+1]=T_IND_FLOOR;
  return m;
}

// Toast queue
const ToastQueue = { items: [], add(msg){
  this.items.push({msg, time: 2200});
  if(this.items.length > 3) this.items.shift();
  this.render();
},
render(){
  const e = $('notify'); if(!e) return;
  e.innerHTML = '';
  for(const it of this.items){
    const div = document.createElement('div');
    div.className = 'n-item show';
    div.textContent = it.msg;
    e.appendChild(div);
  }
},
update(dt){
  let changed = false;
  for(let i=this.items.length-1;i>=0;i--){
    this.items[i].time -= dt;
    if(this.items[i].time <= 0){ this.items.splice(i,1); changed = true; }
  }
  if(changed) this.render();
}};
function toast(txt){ ToastQueue.add(txt); }

// Text width cache
const textWidthCache = new Map();
function measureCached(txt, font){
  const key = font + '|' + txt;
  let w = textWidthCache.get(key);
  if(w === undefined){
    const old = ctx.font;
    ctx.font = font; w = ctx.measureText(txt).width; ctx.font = old;
    textWidthCache.set(key, w);
    if(textWidthCache.size > 300) textWidthCache.clear();
  }
  return w;
}

function currentMap(){ return World[Game.map]; }
function toolName(tt){ return {axe:'Axe',pick:'Pickaxe',hoe:'Hoe',can:'Can',seed:'Seeds',rod:'Rod',sword:'Sword'}[tt]; }
function tileAt(tx,ty){
  const m = currentMap();
  if(!m.tiles || !m.tiles[ty]) return T_ROCK;
  if(ty<0||ty>=m.tiles.length||tx<0||tx>=m.tiles[0].length) return T_ROCK;
  return m.tiles[ty][tx];
}
function findObjectAt(tx,ty){ const m = currentMap(); if(!m.objects) return null; for(const o of m.objects) if(tx===o.tx && ty===o.ty) return o; return null; }
function findNPCAt(tx,ty){ const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2}; for(const n of NPC_DATA){ if(n.loc!==Game.map) continue; if(Math.abs(n.x-wp.x)<22 && Math.abs(n.y-wp.y)<24) return n; } return null; }
function findMonsterAt(tx,ty){ const wp = {x:tx*TILE+TILE/2, y:ty*TILE+TILE/2}; for(const m of Game.monsters) if(Math.abs(m.x-wp.x)<16 && Math.abs(m.y-wp.y)<16) return m; return null; }
function fadeTo(cb){ const f = $('fade'); if(!f){ cb(); return; } f.classList.add('active'); setTimeout(()=>{ cb(); setTimeout(()=>f.classList.remove('active'),80); }, 300); }
function currentWeek(){ return Math.floor((Game.day-1)/7)+1; }
function dismountHorse(){ if(!Game.onHorse) return; Game.onHorse = false; const h = World.farm.animals.find(a => a.mounted); if(h) h.mounted = false; }
function isShopOpen(){ const h = Math.floor(Game.time/60)%24; return h >= 9 && h < 18; }
function cropInSeason(type){ const d = CROP_DATA[type]; if(!d) return false; return d.seasons.includes(SEASONS[Game.season]); }
function seasonWeek(){ return Math.floor((Game.seasonDay-1)/7)+1; }
function dayOfWeekIdx(){ return (Game.day-1) % 7; }
function isFestivalDay(){ return Game.seasonDay === Game.festivalDays[SEASONS[Game.season]]; }
function isNPCBirthday(npc){ return npc.birthday === Game.day; }

function checkSkillUp(s){
  const xp = Game.skillXp[s];
  const lvl = Math.floor(Math.sqrt(xp/10));
  if(lvl > Game.skills[s]){
    Game.skills[s] = Math.min(10, lvl);
    toast(t('levelUp')+' '+s+' Lv '+Game.skills[s]);
    // Profession choice at 5 and 10
    if((Game.skills[s] === 5 || Game.skills[s] === 10) && !Game.professions[s+'_'+Game.skills[s]]){
      setTimeout(()=>showProfessionChoice(s, Game.skills[s]), 800);
    }
  }
}
function addSkill(s, n){ Game.skillXp[s] = (Game.skillXp[s]||0)+n; checkSkillUp(s); }
function addAchieve(id, name){ if(Game.achieved.includes(id)) return; Game.achieved.push(id); toast('🏆 '+name); Snd.play('levelup'); }
function greetNPC(npc){
  if(npc.greetedToday) return false;
  npc.greetedToday = true; npc.lastTalkedDay = Game.day;
  if(npc.hearts < 10) npc.hearts = Math.min(10, npc.hearts + 0.15);
  Snd.play('greet'); return true;
}
function giveGift(npc, itemId){
  const w = currentWeek();
  if(npc.giftWeek !== w){ npc.giftWeek = w; npc.giftCount = 0; npc.giftToday = false; }
  if(npc.giftToday){ toast('Already gifted today'); Snd.play('error'); return false; }
  if(npc.giftCount >= 2){ toast('Weekly limit'); Snd.play('error'); return false; }
  if((Game.inv[itemId]||0) <= 0){ toast('No '+itemId); Snd.play('error'); return false; }
  Game.inv[itemId]--;
  let delta = 0.5;
  if(itemId === npc.fav) delta = 2;
  else if(itemId === npc.disliked) delta = -1;
  if(isNPCBirthday(npc) && delta > 0) delta *= 2;
  npc.hearts = Math.max(0, Math.min(10, npc.hearts + delta));
  npc.giftCount++; npc.giftToday = true; npc.lastTalkedDay = Game.day;
  if(delta > 0){ Snd.play('giftGood'); toast(npc.name+' liked '+itemId+'! +'+delta.toFixed(1)+'♥'); }
  else if(delta < 0){ Snd.play('giftBad'); toast(npc.name+' disliked '+itemId+'!'); }
  return true;
}
function decayFriendship(){
  for(const npc of NPC_DATA){
    npc.greetedToday = false; npc.giftToday = false;
    if(npc.giftWeek !== currentWeek()){ npc.giftWeek = currentWeek(); npc.giftCount = 0; }
    if(npc.hearts >= 10) continue;
    const daysSilent = Game.day - (npc.lastTalkedDay || 0);
    if(daysSilent >= 3 && npc.hearts > 0) npc.hearts = Math.max(0, npc.hearts - 0.5);
  }
}

    $('charTitle').textContent = this.mode==='new' ? t('createChar') : t('editChar');

    $('labelSkin').textContent = t('skin').toUpperCase();

    $('charBtnRandom').textContent = '🎲 '+t('random');
    $('charBtnCancel').textContent = t('cancel');
    $('charBtnConfirm').textContent = '✓ '+t('confirm');
  },
  buildSwatches(id, colors, key){
    const el = $(id); el.innerHTML = '';
    colors.forEach((c, i)=>{
      const sw = document.createElement('div');
      sw.className = 'swatch'+(this.temp[key]===i?' active':'');
      sw.style.background = c;
      sw.onclick = ()=>{ this.temp[key] = i; this.buildSwatches(id, colors, key); this.updatePreview(); };
      el.appendChild(sw);
    });
  },
  buildHatSwatches(){
    const el = $('swHat'); el.innerHTML = '';
    HATS.forEach((h, i)=>{
      const sw = document.createElement('div');
      sw.className = 'swatch'+(this.temp.hat===i?' active':'');
      sw.style.background = h.color;
      sw.onclick = ()=>{ this.temp.hat = i; this.buildHatSwatches(); this.updatePreview(); };
      el.appendChild(sw);
    });
  },
  updatePreview(){
    const c = $('charPreviewCanvas'); const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const grad = g.createLinearGradient(0,0,0,c.height);
    grad.addColorStop(0,'#6aa4c8'); grad.addColorStop(0.6,'#8ab8a0'); grad.addColorStop(1,'#5a8a4a');
    g.fillStyle = grad; g.fillRect(0,0,c.width,c.height);
    g.fillStyle = '#3a6a2a'; g.fillRect(0, c.height-40, c.width, 40);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(c.width/2, c.height-40, 28, 8, 0, 0, Math.PI*2); g.fill();
    const scale = 4;
    const tmp = document.createElement('canvas'); tmp.width = 24; tmp.height = 32;
    const tg = tmp.getContext('2d'); tg.imageSmoothingEnabled = false;
    drawChar(tg, 'd', 0, 'idle', this.temp);
    g.drawImage(tmp, Math.round(c.width/2 - 24*scale/2), Math.round(c.height - 40 - 32*scale), 24*scale, 32*scale);
    $('charPreviewName').textContent = this.temp.name || 'Farmer';
  },
  randomize(){
    this.temp.skin = Math.floor(Math.random()*SKIN.length);
    this.temp.hair = Math.floor(Math.random()*HAIR.length);
    this.temp.shirt = Math.floor(Math.random()*SHIRT.length);
    this.temp.pants = Math.floor(Math.random()*PANTS.length);
    this.temp.shoes = Math.floor(Math.random()*SHOES.length);
    this.temp.hat = Math.floor(Math.random()*HATS.length);
    this.buildSwatches('swSkin', SKIN, 'skin');
    this.buildSwatches('swHair', HAIR, 'hair');
    this.buildSwatches('swShirt', SHIRT, 'shirt');
    this.buildSwatches('swPants', PANTS, 'pants');
    this.buildSwatches('swShoes', SHOES, 'shoes');
    this.buildHatSwatches();
    this.updatePreview();
  },
  confirm(){
    Object.assign(Custom, this.temp);
    Custom.name = this.temp.name || 'Farmer';
    Custom.save(); regenerateChar();
    const wasNew = this.mode === 'new';
    this.mode = null;
    $('charCreate').classList.remove('show');
    if(wasNew) startNewGame();
  },
  cancel(){
    const wasNew = this.mode === 'new';
    this.mode = null;
    $('charCreate').classList.remove('show');
    if(wasNew) showMainMenu();
  }
};

    this.fishY = Math.random(); this.fishVel = 0; this.fishTarget = Math.random();
    this.greenY = 0.5; this.greenVel = 0;
    this.progress = 0.3; this.result = null; this.resultTimer = 0;
    this.holding = true;
  },
  cancel(){ this.active = false; this.fish = null; this.holding = false; Game.fishing = null; },
  update(dt){
    if(!this.active) return;
    const step = Math.min(32, dt)/1000;
    if(Math.random() < 0.02) this.fishTarget = Math.random();
    const diffF = this.fishTarget - this.fishY;
    this.fishVel += diffF * 8 * step; this.fishVel *= 0.92;
    this.fishY += this.fishVel * step;
    this.fishY = Math.max(0, Math.min(1, this.fishY));
    const accel = this.holding ? -1.2 : 0.9;
    this.greenVel += accel * step; this.greenVel *= 0.85;
    this.greenY += this.greenVel * step;
    const half = this.greenH / 2;
    if(this.greenY < half){ this.greenY = half; this.greenVel = 0; }
    if(this.greenY > 1-half){ this.greenY = 1-half; this.greenVel = 0; }
    const inZone = Math.abs(this.fishY - this.greenY) < half;
    this.progress += (inZone ? 0.35 : -0.25) * step;
    this.progress = Math.max(0, Math.min(1, this.progress));
    if(this.progress >= 1 && !this.result){ this.result = 'caught'; this.resultTimer = 1.5; Snd.play('caught'); }
    if(this.progress <= 0 && !this.result){ this.result = 'escaped'; this.resultTimer = 1.5; Snd.play('escape'); }
    if(this.result){ this.resultTimer -= step; if(this.resultTimer <= 0) this.end(); }
  },
  end(){
    if(this.result === 'caught'){
      Game.fishCaught[this.fish.name] = (Game.fishCaught[this.fish.name]||0)+1;
      Game.inv.fish = (Game.inv.fish||0)+1;
      toast('🐟 '+this.fish.name+' ('+this.fish.price+'🪙)');
      addSkill('fishing', 8);
    } else toast('Escaped...');
    this.active = false; this.fish = null; Game.fishing = null;
  },
  click(){ if(!this.active || this.result) return; this.holding = true; },
  release(){ this.holding = false; },
  draw(){
    if(!this.active) return;
    const w = isPortrait ? 34 : 40, h = Math.min(200, LH-80);
    const x = LW - w - 20;
    const y = (LH - h) / 2;
    ctx.fillStyle = 'rgba(20,15,10,0.92)'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2;
    ctx.strokeRect(x+1, y+1, w-2, h-2);
    const gz = this.greenH * h;
    const gy = y + this.greenY * h - gz/2;
    ctx.fillStyle = 'rgba(100,200,80,0.55)'; ctx.fillRect(x+3, gy, w-6, gz);
    ctx.strokeStyle = '#8ac04a'; ctx.strokeRect(x+3, gy, w-6, gz);
    const fy = y + this.fishY * h;
    ctx.fillStyle = this.fish.color || '#e08060';
    ctx.beginPath(); ctx.ellipse(x+w/2, fy, w/2-8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x+w/2+w/2-12, fy-2, 1.5, 0, Math.PI*2); ctx.fill();
    const px = x - 14, pw = 8;
    ctx.fillStyle = 'rgba(20,15,10,0.92)'; ctx.fillRect(px, y, pw, h);
    ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(px+0.5, y+0.5, pw-1, h-1);
    const ph = this.progress * (h-4);
    ctx.fillStyle = this.progress > 0.6 ? '#6ac04a' : this.progress > 0.3 ? '#e0c040' : '#c04040';
    ctx.fillRect(px+2, y + (h-2) - ph - 1, pw-4, ph);
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = '#ffe8b0';
    ctx.textAlign = 'center'; ctx.fillText(t('fishing'), x + w/2, y - 8);
    ctx.textAlign = 'left';
    if(this.result){
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = this.result === 'caught' ? '#8ac04a' : '#c04040';
      ctx.textAlign = 'center';
      ctx.fillText(this.result === 'caught' ? '✓ CAUGHT!' : '✗ ESCAPED', x + w/2, y + h/2);
      ctx.textAlign = 'left';
    }
  }
};

// ACTIONS
// ============================================================
function startAction(ac){ player.action = ac; player.actionTimer = 400; }
function removeObject(o){ const m = currentMap(); if(!m.objects) return; const i = m.objects.indexOf(o); if(i>=0) m.objects.splice(i,1); }
function spawnParticle(x,y,c){ if(Game.particles && Game.particles.length > 80) return; if(!Game.particles) Game.particles = []; for(let i=0;i<5;i++) Game.particles.push({x:x+(Math.random()-.5)*8, y:y+(Math.random()-.5)*4, vx:(Math.random()-.5)*2, vy:-Math.random()*1.5, life:600, max:600, color:c}); }
function consumeEnergy(n){ Game.energy = Math.max(0, Game.energy-n); }
function toolPower(t2){ return TOOL_LEVELS[Game.toolLevels[t2]||0].mult; }
function getCropQuality(){
  const lvl = Game.skills.farming || 0;
  const r = Math.random() * 100;
  if(lvl >= 9 && r < 3) return 'iridium';
  if(lvl >= 6 && r < 10) return 'gold';
  if(lvl >= 3 && r < 25) return 'silver';
  return 'normal';
}

function attack(tx,ty){
  const weapon = WEAPONS[Game.weaponLevel];
  const mon = findMonsterAt(tx,ty);
  if(!mon) return false;
  startAction('use'); Snd.play('hit');
  let isCrit = Math.random() < weapon.crit;
  if(Game.professions['combat_5'] === 'scout') isCrit = Math.random() < weapon.crit + 0.15;
  let dmg = Math.floor(weapon.dmg * (isCrit?2:1));
  if(Game.professions['combat_5'] === 'warrior') dmg = Math.floor(dmg * 1.1);
  mon.hp -= dmg; mon.hitTimer = 200;
  spawnParticle(mon.x, mon.y-8, isCrit?'#ffff40':'#ff4040');
  if(mon.hp<=0){
    const t2 = MONSTER_TYPES.find(x=>x.id===mon.typeId);
    if(t2){ if(Math.random()<t2.drop[1]) Game.inv[t2.drop[0]] = (Game.inv[t2.drop[0]]||0)+t2.yield; }
    Game.kills[mon.typeId] = (Game.kills[mon.typeId]||0)+1;
    const goldGain = 3 + Math.floor(Math.random()*8) + Math.floor(Game.mineDepth/2);
    Game.gold += goldGain;
    addSkill('combat', 5);
    const idx = Game.monsters.indexOf(mon);
    if(idx>=0) Game.monsters.splice(idx,1);
    toast('Killed '+mon.name+' +'+goldGain+'🪙');
  }
  consumeEnergy(1);
  return true;
}
function attackNearest(){
  const pcx = player.x + 12, pcy = player.y + 24;
  let best = null, bestD = 999;
  for(const m of Game.monsters){
    const d = Math.hypot(m.x - pcx, m.y - pcy);
    if(d < bestD && d < 60){ best = m; bestD = d; }
  }
  if(best){
    const tx = Math.floor(best.x/TILE), ty = Math.floor(best.y/TILE);
    attack(tx, ty);
  } else Snd.play('error');
}
function useItem(itemId){
  const c = CONSUMABLES[itemId];
  if(!c || (Game.inv[itemId]||0) <= 0) return false;
  if(Game.hp >= Game.maxHp && Game.energy >= Game.maxEnergy){ toast('Already full'); return false; }
  Game.inv[itemId]--;
  if(c.hp) Game.hp = Math.min(Game.maxHp, Game.hp + c.hp);
  if(c.en) Game.energy = Math.min(Game.maxEnergy, Game.energy + c.en);
  toast('Used '+itemId);
  Snd.play('eat');
  return true;
}

function doActionAt(tx,ty){
  if(player.action || Game.sleeping || Game.dialogue || Game.menuOpen || CharEdit.mode || FishMinigame.active) return;

  if(Game.map==='mine'){
    const m = currentMap();
    if(m.stairsUp && tx===m.stairsUp.x && ty===m.stairsUp.y){
      Snd.play('door');
      if(m.depth<=1){
        fadeTo(()=>{
          Game.map = Game.mineEntry || 'farm';
          if(Game.mineEntry==='mountain'){ player.x = 24*TILE+8; player.y = 8*TILE; }
          else { player.x = World.farm.cavePos.x*TILE+8; player.y = (World.farm.cavePos.y+2)*TILE; }
        });
      } else fadeTo(()=>{ generateMine(m.depth-1); });
      return;
    }
    if(m.ladder && tx===m.ladder.x && ty===m.ladder.y){ Snd.play('door'); fadeTo(()=>{ generateMine(m.depth+1); }); return; }
    if(m.elevator && tx===m.elevator.x && ty===m.elevator.y){ Snd.play('elevator'); openElevator(); return; }
    if(m.altar && tx===m.altar.x && ty===m.altar.y){
      if(Game.mineMaxFloor >= 20 || m.depth >= 20){ showConfirm(t('editCharConfirm'), ()=>{ Snd.play('levelup'); CharEdit.init('edit'); }); }
      else { toast(t('needAltar')); Snd.play('error'); }
      return;
    }
  }

  if(Game.map==='farm'){
    const hd = World.farm.houseDoor;
    if(tx===hd.x && ty===hd.y){ enterBuilding('farmhouse','farm'); return; }
    const sd = World.farm.shopDoor;
    if(tx===sd.x && ty===sd.y){ enterBuilding('shop_interior','farm'); return; }
    const stD = World.farm.stableDoor;
    if(tx===stD.x && ty===stD.y){ if(!Game.onHorse) openShop({name:'Stable',role:'Horses',shop:'horses'}); return; }
    const cD = World.farm.carpenterDoor;
    if(tx===cD.x && ty===cD.y){ enterBuilding('blacksmith_interior','farm',()=>openShop({name:'Carpenter',role:'Build',shop:'build'})); return; }
    const cp = World.farm.cavePos;
    if(Math.abs(tx-cp.x)<3 && Math.abs(ty-cp.y)<2){
      dismountHorse();
      Snd.play('door'); Game.mineEntry = 'farm';
      fadeTo(()=>{ Game.map='mine'; generateMine(1); });
      return;
    }
    if(tx===28 && ty===26){ openShippingUI(); return; }
    // Pet bowl
    const pb = World.farm.petBowlPos;
    if(tx===pb.x && ty===pb.y){
      if(Game.hasPet){
        if(Game.petFed && Game.petFedDay === Game.day){ toast('Already fed today'); return; }
        if((Game.inv.fish||0) > 0 || (Game.inv.milk||0) > 0){
          if(Game.inv.fish) Game.inv.fish--;
          else Game.inv.milk--;
          Game.petFed = true; Game.petFedDay = Game.day;
          Snd.play('bark');
          toast(t('petFed'));
          if(Game.pet) Game.pet.happy = 100;
        } else toast('Need fish or milk to feed');
      } else toast('No pet — buy at Maggie Ranch');
      return;
    }
  }
  if(Game.map==='mountain'){
    if(tx>=22 && tx<=26 && ty>=4 && ty<=6){
      dismountHorse();
      Snd.play('door'); Game.mineEntry = 'mountain';
      fadeTo(()=>{ Game.map='mine'; generateMine(1); });
      return;
    }
  }
  if(Game.map==='farmhouse' || Game.map==='house_interior' || Game.map==='shop_interior' || Game.map==='blacksmith_interior' || Game.map==='museum_interior'){
    const m = currentMap();
    const exitX = Math.floor(m.w/2);
    if(ty >= m.h-1 && (tx===exitX || tx===exitX+1)){ exitBuilding(Game.prevMap || 'farm', Game.map); return; }
    if(Game.map==='farmhouse'){
      const bed = findObjectAt(tx,ty);
      if(bed && bed.type==='bed'){ showConfirm(t('sleepConfirm'), ()=>startSleep()); return; }
    }
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      if(b.door && tx===b.door.x && ty===b.door.y){
        if((b.type==='shop'||b.type==='blacksmith'||b.type==='tavern'||b.type==='carpenter') && !isShopOpen()){
          toast(t('shopClosed')); Snd.play('error'); return;
        }
        if(b.type==='museum'){ enterBuilding('museum_interior','town'); return; }
        if(b.type==='shop'){ openShop({name:'General Store',role:'Goods',shop:'seeds'}); return; }
        if(b.type==='blacksmith'){ openShop({name:'Blacksmith',role:'Weapons',shop:'weapons'}); return; }
        if(b.type==='tavern'){ openShop({name:'Tavern',role:'Drinks',shop:'drinks'}); return; }
        if(b.type==='carpenter'){ openShop({name:'Carpenter',role:'Build',shop:'build'}); return; }
        if(b.residents && b.residents.length){ enterBuilding('house_interior','town',null, b.name); return; }
        if(b.type==='townhall'){ toast('Town Hall'); Snd.play('door'); return; }
      }
    }
  }

  const mon = findMonsterAt(tx,ty);
  if(mon){ attack(tx,ty); return; }
  if(Game.map==='farm'){
    const an = World.farm.animals.find(a=>Math.abs(a.x-(tx*TILE+8))<14 && Math.abs(a.y-(ty*TILE+16))<14);
    if(an){ collectAnimal(an); return; }
  }
  const npc = findNPCAt(tx,ty);
  if(npc){ startDialogue(npc); return; }

  const tool = Game.hotbar[Game.selected];
  const t2 = tileAt(tx,ty);
  const obj = findObjectAt(tx,ty);

  if(obj && obj.type==='crop' && obj.stage===4){
    const quality = getCropQuality();
    const key = obj.cropType;
    // Add crop to inventory
    Game.inv[key] = (Game.inv[key]||0)+1;
    const price = Math.floor(CROP_DATA[key].price * CROP_QUALITY_MULT[quality]);
    toast('+1 '+CROP_QUALITY_ICON[quality]+key+' ('+price+'🪙)'); Snd.play('harvest');
    removeObject(obj);
    addSkill('farming', 5); startAction('use'); consumeEnergy(1); return;
  }
  if(obj && obj.type==='crop_withered'){ removeObject(obj); startAction('use'); return; }
  if(tool==='axe'){
    if(obj && (obj.type==='tree'||obj.type==='pine')){
      startAction('use'); obj.hp -= Math.floor(toolPower('axe')); Snd.play('chop');
      spawnParticle(obj.x,obj.y-20,'#8a5a30'); consumeEnergy(2);
      if(obj.hp<=0){
        let n = 3+Math.floor(Math.random()*3);
        if(Game.professions['foraging_5'] === 'forester') n += 1;
        Game.inv.wood += n; toast('+'+n+' 🪵'); removeObject(obj); addSkill('foraging', 5);
      }
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='pick'){
    if(obj && (obj.type==='rock_s'||obj.type==='rock_m'||obj.type==='rock_l'||obj.type==='rock_small')){
      startAction('use'); obj.hp = (obj.hp ?? 2)-Math.floor(toolPower('pick')); Snd.play('pick');
      spawnParticle(obj.x,obj.y-8,'#a0a0a8'); consumeEnergy(2);
      if(obj.hp<=0){ const n = 2+Math.floor(Math.random()*3); Game.inv.stone += n; toast('+'+n+' 🪨'); removeObject(obj); addSkill('mining', 5); }
      return;
    }
    if(t2===T_CU||t2===T_IR||t2===T_GO||t2===T_IRID){
      startAction('use'); Snd.play('pick'); consumeEnergy(2);
      let ore = 'copper', cnt = 1+Math.floor(Math.random()*2);
      if(t2===T_IR) ore='iron'; else if(t2===T_GO) ore='gold_ore'; else if(t2===T_IRID) ore='iri';
      if(Game.professions['mining_5'] === 'miner') cnt += 1;
      Game.inv[ore] = (Game.inv[ore]||0)+cnt;
      currentMap().tiles[ty][tx] = T_CAVE;
      addSkill('mining', 5); toast('+'+cnt+' '+ore);
      return;
    }
    Snd.play('error'); return;
  }
  if(tool==='hoe'){ if(t2===T_GRASS){ currentMap().tiles[ty][tx] = T_TILL; startAction('use'); consumeEnergy(2); return; } return; }
  if(tool==='can'){ if(t2===T_TILL){ currentMap().tiles[ty][tx] = T_TILL_WET; startAction('use'); Snd.play('water'); consumeEnergy(1); return; } return; }
  if(tool==='seed'){
    if(Game.inv.seeds<=0){ Snd.play('error'); toast('No seeds'); return; }
    if(t2===T_TILL||t2===T_TILL_WET){
      if(findObjectAt(tx,ty)){ Snd.play('error'); toast('Already planted'); return; }
      const available = CROPS.filter(c => cropInSeason(c));
      if(available.length === 0){ Snd.play('error'); toast('No crops this season'); return; }
      Game.inv.seeds--; consumeEnergy(1);
      const type = available[Math.floor(Math.random()*available.length)];
      currentMap().objects.push({type:'crop',cropType:type,x:tx*TILE+8,y:(ty+1)*TILE,tx,ty,stage:0,watered:false,solid:false,sortY:(ty+1)*TILE,growthPoints:0});
      startAction('use'); Snd.play('plant'); return;
    }
    return;
  }
  if(tool==='rod'){ if(t2===T_WATER||t2===T_DEEP){ startFishing(); return; } Snd.play('error'); toast(t('clickWater')); return; }
}

function startFishing(){
  if(Game.fishing || FishMinigame.active) return;
  Game.fishing = { phase:'casting', timer:0 };
  startAction('use'); Snd.play('cast');
}
function getFishingResult(){
  const hour = Math.floor(Game.time/60)%24;
  const time = (hour<20&&hour>=6)?'day':'night';
  const fx = player.x+12 + (player.dir==='l'?-24:player.dir==='r'?24:0);
  const fy = player.y+24 + (player.dir==='u'?-24:player.dir==='d'?24:0);
  const targetTile = tileAt(Math.floor(fx/TILE), Math.floor(fy/TILE));
  if(targetTile !== T_WATER && targetTile !== T_DEEP){
    // fallback — try other directions
    for(const dir of ['d','u','l','r']){
      const tfx = player.x+12 + (dir==='l'?-24:dir==='r'?24:0);
      const tfy = player.y+24 + (dir==='u'?-24:dir==='d'?24:0);
      const tt = tileAt(Math.floor(tfx/TILE), Math.floor(tfy/TILE));
      if(tt === T_WATER || tt === T_DEEP){
        player.dir = dir;
        break;
      }
    }
  }
  const isDeep = tileAt(Math.floor((player.x+12)/TILE), Math.floor((player.y+24)/TILE)) === T_DEEP ||
                 tileAt(Math.floor(fx/TILE), Math.floor(fy/TILE)) === T_DEEP;
  const loc = Game.map==='beach' ? (isDeep?'deep':'beach') : 'farm';
  let pool = FISH_LIST.filter(f=>(f.loc===loc||(f.loc==='beach'&&loc==='deep')) && (f.time===time||f.time==='any'));
  if(!pool.length) pool = FISH_LIST.filter(f=>f.loc==='beach');
  let total = 0; for(const f of pool) total += f.chance;
  let r = Math.random()*total;
  for(const f of pool){ r -= f.chance; if(r<=0) return f; }
  return pool[0];
}
function collectAnimal(a){
  startAction('use');
  if(a.growthStage<1){ toast('Still young'); return; }
  if(a.type==='horse'){ toggleHorse(a); return; }
  if(a.produceReady){
    const type = ANIMAL_TYPES[a.type];
    let yieldN = 1;
    if(Game.professions['farming_5'] === 'rancher') yieldN = 2;
    Game.inv[type.product] = (Game.inv[type.product]||0)+yieldN;
    a.produceReady = false; a.produceTimer = type.time;
    toast(type.icon+' +'+yieldN+' '+type.product);
    Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
    addSkill('farming', 3);
  } else Snd.play(a.type==='chicken'||a.type==='duck'?'cluck':'moo');
}
function toggleHorse(horse){
  if(Game.onHorse){
    Game.onHorse = false;
    if(horse){ horse.mounted = false; player.x = horse.x-8; player.y = horse.y; }
    toast('Dismounted'); Snd.play('neigh');
  } else {
    if(!horse) horse = World.farm.animals.find(a=>a.type==='horse'&&a.growthStage>=1);
    if(!horse){ toast('No horse'); return; }
    const d = Math.hypot(player.x-horse.x, player.y-horse.y);
    if(d<60){ Game.onHorse = true; horse.mounted = true; toast('Mounted!'); Snd.play('neigh'); }
    else toast('Get closer');
  }
}

function openShippingUI(){
  Game.menuOpen = true; Snd.stopAll();
  $('gameMenu').classList.add('show');
  $('menuTabs').style.display = 'none';
  updateMenuHeader();
  renderShipping();
}
function renderShipping(){
  const box = $('menuContent'); box.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = '📤 Shipping Bin'; box.appendChild(h);
  const info = document.createElement('div');
  info.style.cssText = 'color:#8ac04a;font-size:11px;margin-bottom:10px;background:#1a2a1a;padding:8px;border-radius:4px';
  info.textContent = 'Place items — they sell overnight (8🪙 each).';
  box.appendChild(info);
  const invGrid = document.createElement('div'); invGrid.className = 'inv-grid-visual';
  const keys = Object.keys(Game.inv).filter(k => (Game.inv[k]||0) > 0);
  for(const k of keys){
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    slot.innerHTML = '<div class="icon">'+(ITEM_ICONS[k]||'❓')+'</div><div class="count">'+Game.inv[k]+'</div>';
    slot.onclick = ()=>{ Game.inv[k]--; Game.shipping[k] = (Game.shipping[k]||0)+1; Snd.play('click'); renderShipping(); };
    invGrid.appendChild(slot);
  }
  box.appendChild(invGrid);
  const sh = document.createElement('h3'); sh.textContent = 'In Bin:'; sh.style.marginTop = '14px'; box.appendChild(sh);
  let totalValue = 0, any = false;
  const shGrid = document.createElement('div'); shGrid.className = 'inv-grid-visual';
  for(const k in Game.shipping){
    const n = Game.shipping[k]||0;
    if(!n) continue;
    any = true; totalValue += n * 8;
    const slot = document.createElement('div');
    slot.className = 'inv-slot'; slot.style.borderColor = '#8ac04a';
    slot.innerHTML = '<div class="icon">'+(ITEM_ICONS[k]||'❓')+'</div><div class="count">'+n+'</div>';
    slot.onclick = ()=>{ Game.inv[k] = (Game.inv[k]||0) + Game.shipping[k]; Game.shipping[k] = 0; Snd.play('click'); renderShipping(); };
    shGrid.appendChild(slot);
  }
  if(!any){ const d = document.createElement('div'); d.style.cssText = 'color:#a08060;font-size:11px;text-align:center;padding:8px'; d.textContent = 'Empty'; shGrid.appendChild(d); }
  box.appendChild(shGrid);
  const val = document.createElement('div');
  val.style.cssText = 'color:#e8c060;text-align:center;font-size:13px;margin-top:10px;font-weight:bold';
  val.textContent = 'Total: ' + totalValue + ' 🪙';
  box.appendChild(val);
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Close';
  closeBtn.style.cssText = 'display:block;margin:12px auto 0;background:#6a2020;border:3px solid #a04040;padding:10px 24px;font-family:inherit;color:#ffe8b0;border-radius:4px;cursor:pointer;font-weight:bold';
  closeBtn.onclick = closeMenu;
  box.appendChild(closeBtn);
}

function startDialogue(npc){
  const db = DIALOGUE_DB[npc.id];
  if(!db){ toast(npc.name+': Hello!'); return; }
  greetNPC(npc); Snd.play('click');
  const activeQ = Game.activeQuests.find(q => q.npcId === npc.id);
  if(activeQ){
    const have = Game.inv[activeQ.item]||0;
    if(have >= activeQ.count){
      Game.inv[activeQ.item] -= activeQ.count;
      Game.gold += activeQ.reward;
      npc.hearts = Math.min(10, npc.hearts+2);
      npc.questDone = true;
      Game.activeQuests = Game.activeQuests.filter(q => q !== activeQ);
      Game.completedQuests++;
      Snd.play('levelup');
      openDialogue(npc, ["Wait — you brought me "+activeQ.count+' '+(ITEM_NAMES[activeQ.item]||activeQ.item)+'?!',"Here, take this reward. +"+activeQ.reward+" gold +2♥"]);
      return;
    }
  }
  if(!npc.questGiven){
    npc.questGiven = true;
    Game.activeQuests.push({npcId:npc.id, item:npc.quest.item, count:npc.quest.count, reward:npc.quest.reward});
    openDialogue(npc, ["Actually, I could use a favor.","Could you bring me "+npc.quest.count+' '+(ITEM_NAMES[npc.quest.item]||npc.quest.item)+'?',"I'll pay you "+npc.quest.reward+" gold."]);
    return;
  }
  if(npc.shop){
    openDialogue(npc, ["Hello! What can I help you with?"], [
      {text:"See your wares", effect:0, reply:"Of course!", action:()=>{ closeDialogue(); openShop(npc); }},
      {text:"Just saying hi", effect:0.2, reply:"Well, hello!"},
      {text:"What's new?", effect:0.3, reply:"Same old."}
    ]);
    return;
  }
  if(!npc.metBefore){ npc.metBefore = true; openDialogue(npc, db.firstMeet); return; }
  if(isNPCBirthday(npc)){ openDialogue(npc, ["Today's my birthday! How did you know?","Thank you for remembering."]); npc.hearts = Math.min(10, npc.hearts+0.5); return; }
  if(npc.storiesSeen.length < db.stories.length){
    const nextStory = db.stories[npc.storiesSeen.length];
    if(npc.hearts >= nextStory.hearts && Math.random() < 0.4){
      npc.storiesSeen.push(nextStory);
      openDialogue(npc, nextStory.lines);
      return;
    }
  }
  const unasked = db.questions.filter(q => npc.hearts >= q.hearts && !npc.questionsAsked.includes(q));
  if(unasked.length && Math.random() < 0.5){
    const q = unasked[Math.floor(Math.random()*unasked.length)];
    npc.questionsAsked.push(q);
    openDialogue(npc, [q.question], q.options.map(o=>({text:o.text,effect:o.effect,reply:o.reply})));
    return;
  }
  const line = db.daily[Math.floor(Math.random()*db.daily.length)];
  openDialogue(npc, [line]);
}
function openDialogue(npc, lines, options){
  Game.dialogue = { npc, lines: lines.slice(), currentLine: 0, options: options || null, choices: null };
  renderDialogue();
}
let portraitRAF = null;
function drawPortraitFrame(){
  const d = Game.dialogue;
  if(!d){ portraitRAF = null; return; }
  const pc = $('dialoguePortrait'); const pg = pc.getContext('2d');
  pg.imageSmoothingEnabled = false;
  pg.fillStyle = '#2a1a0a'; pg.fillRect(0,0,pc.width,pc.height);
  const idx = NPC_DATA.indexOf(d.npc);
  const sp = S['npc'+idx+'_d'];
  if(sp){
    const breathe = Math.sin(performance.now()/900) * 0.5;
    pg.drawImage(sp, 0, Math.round(breathe), 24, 32);
  }
  if(Game.dialogue) portraitRAF = requestAnimationFrame(drawPortraitFrame);
}
function renderDialogue(){
  const d = Game.dialogue; if(!d) return;
  $('dialogueBox').classList.add('show');
  $('dialogueName').textContent = d.npc.name;
  $('dialogueText').textContent = d.lines[d.currentLine];
  if(portraitRAF){ cancelAnimationFrame(portraitRAF); portraitRAF = null; }
  portraitRAF = requestAnimationFrame(drawPortraitFrame);
  const opts = $('dialogueOptions'); opts.innerHTML = '';
  const hint = $('dialogueHint');
  if(d.currentLine === d.lines.length - 1 && d.options && !d.choices){
    d.options.forEach((opt)=>{
      const btn = document.createElement('button');
      btn.textContent = opt.text;
      btn.onclick = (e)=>{ e.stopPropagation(); applyDialogueChoice(opt); };
      opts.appendChild(btn);
    });
    hint.textContent = '';
  } else hint.textContent = t('continue');
}
function applyDialogueChoice(opt){
  const d = Game.dialogue; if(!d) return;
  d.choices = opt;
  d.npc.hearts = Math.max(0, Math.min(10, d.npc.hearts + opt.effect));
  if(opt.effect > 0) Snd.play('giftGood'); else if(opt.effect < 0) Snd.play('giftBad'); else Snd.play('click');
  if(opt.reply){
    const eff = opt.effect > 0 ? ' (+'+opt.effect+'♥)' : opt.effect < 0 ? ' ('+opt.effect+'♥)' : '';
    d.lines.push(opt.reply + eff);
    d.currentLine = d.lines.length - 1; d.options = null;
    renderDialogue();
    if(opt.action) setTimeout(()=>{ closeDialogue(); opt.action(); }, 700);
    return;
  }
  if(opt.action){ closeDialogue(); opt.action(); return; }
  d.currentLine = d.lines.length - 1; d.options = null;
  renderDialogue();
}
function advanceDialogue(){
  const d = Game.dialogue; if(!d) return;
  if(d.currentLine < d.lines.length - 1){ d.currentLine++; renderDialogue(); }
  else closeDialogue();
}
function closeDialogue(){
  Game.dialogue = null; $('dialogueBox').classList.remove('show');
  if(portraitRAF){ cancelAnimationFrame(portraitRAF); portraitRAF = null; }
}
$('dialogueBox').addEventListener('pointerdown', (e)=>{ e.stopPropagation(); if(e.target.tagName === 'BUTTON') return; advanceDialogue(); });

function openElevator(){
  const menu = $('elevatorMenu'); const floors = $('elevatorFloors'); floors.innerHTML = '';
  const surfBtn = document.createElement('button');
  surfBtn.className = 'floor-btn surface';
  surfBtn.textContent = '⬆ Surface';
  surfBtn.onclick = ()=>{ closeElevator(); fadeTo(()=>{
    Game.map = Game.mineEntry || 'farm';
    if(Game.mineEntry==='mountain'){ player.x = 24*TILE+8; player.y = 8*TILE; }
    else { player.x = World.farm.cavePos.x*TILE+8; player.y = (World.farm.cavePos.y+2)*TILE; }
  }); };
  floors.appendChild(surfBtn);
  for(let f=5;f<=Game.mineMaxFloor;f+=5){
    const btn = document.createElement('button');
    btn.className = 'floor-btn';
    btn.textContent = '🛗 Floor ' + f + (f % 20 === 0 ? ' ✨' : '');
    btn.onclick = ()=>{ closeElevator(); fadeTo(()=>{ generateMine(f); }); };
    floors.appendChild(btn);
  }
  if(Game.mineMaxFloor < 5){
    const msg = document.createElement('div');
    msg.style.cssText = 'color:#8ac04a;font-size:11px;text-align:center;padding:8px';
    msg.textContent = 'Reach Floor 5 to unlock';
    floors.appendChild(msg);
  }
  menu.classList.add('show'); Game.paused = true;
}
function closeElevator(){
  $('elevatorMenu').classList.remove('show');
  if(!Game.dialogue && !Game.menuOpen && !CharEdit.mode && !$('confirmModal').classList.contains('show')) Game.paused = false;
}

function enterBuilding(mapName, fromMap, cb, houseName){
  if(Game._entering) return;
  Game._entering = true;
  dismountHorse();
  fadeTo(()=>{
    Game._entering = false;
    Game.prevMap = fromMap;
    Game.houseOwner = houseName || null;
    Game.map = mapName;
    const m = currentMap();
    if(mapName === 'house_interior'){
      m.tiles = makeIndoor(12, 8);
      m.objects = houseName && HOUSE_INTERIORS[houseName] ? HOUSE_INTERIORS[houseName].slice() : [];
    } else if(mapName === 'museum_interior'){ m.tiles = makeIndoor(14, 10); m.objects = []; }
    else if(mapName === 'farmhouse'){
      m.tiles = makeIndoor(14, 10);
      m.objects = [
        {type:'bed',tx:1,ty:1,solid:true},{type:'table',tx:5,ty:1,solid:true},
        {type:'chest',tx:10,ty:1,solid:true},{type:'bookshelf',tx:11,ty:5,solid:true},
        {type:'workbench',tx:6,ty:7,solid:true}
      ];
      // Pet inside
      if(Game.hasPet){
        m.objects.push({type:'pet_bowl',tx:8,ty:5,solid:false});
      }
    } else if(mapName === 'shop_interior' || mapName === 'blacksmith_interior'){
      m.tiles = makeIndoor(12, 9);
      m.objects = [
        {type:'table',tx:3,ty:3,solid:true},{type:'chest',tx:8,ty:3,solid:true},
        {type:'barrel',tx:9,ty:6,solid:true}
      ];
    }
    player.x = Math.floor(m.w/2)*TILE;
    player.y = Math.floor(m.h*0.7)*TILE;
    player.targetX = null; player.targetY = null; player.actionTarget = null;
    Snd.play('door');
    if(cb) setTimeout(cb, 200);
  });
}
function exitBuilding(targetMap, fromMap){
  fadeTo(()=>{
    Game.map = targetMap;
    if(targetMap==='farm'){
      if(fromMap==='farmhouse'){ player.x = World.farm.houseDoor.x*TILE+8; player.y = (World.farm.houseDoor.y+1)*TILE; }
      else if(fromMap==='shop_interior'){ player.x = World.farm.shopDoor.x*TILE+8; player.y = (World.farm.shopDoor.y+1)*TILE; }
      else if(fromMap==='blacksmith_interior'){ player.x = World.farm.carpenterDoor.x*TILE+8; player.y = (World.farm.carpenterDoor.y+1)*TILE; }
      else { player.x = 28*TILE; player.y = 24*TILE; }
    } else if(targetMap==='town'){
      const door = World.town.buildings.find(b=>{
        if(fromMap==='museum_interior') return b.type==='museum';
        if(fromMap==='house_interior' && Game.houseOwner) return b.name === Game.houseOwner;
        return false;
      });
      if(door && door.door){ player.x = door.door.x*TILE+8; player.y = (door.door.y+1)*TILE; }
      else { player.x = 30*TILE; player.y = 26*TILE; }
    } else { player.x = 28*TILE; player.y = 24*TILE; }
    Game.houseOwner = null;
    player.targetX = null; player.targetY = null; player.actionTarget = null;
    Snd.play('door');
  });
}
