function drawTile(t2,x,y){
  const s = Game.season;
  switch(t2){
    case T_GRASS:{ const v = (x*7+y*13)%4; ctx.drawImage(S['t_grass_'+s+'_'+v], x, y); break; }
    case T_PATH: ctx.drawImage(S['t_dirt'], x, y); break;
    case T_WATER: ctx.drawImage(S['t_water'], x, y); break;
    case T_DEEP: ctx.drawImage(S['t_deep'], x, y); break;
    case T_TILL: ctx.drawImage(S['t_till'], x, y); break;
    case T_TILL_WET: ctx.drawImage(S['t_till_wet'], x, y); break;
    case T_FLOOR: ctx.drawImage(S['t_floor'], x, y); break;
    case T_WALL: ctx.drawImage(S['t_wall'], x, y); break;
    case T_SAND: ctx.drawImage(S['t_sand'], x, y); break;
    case T_ROCK: ctx.drawImage(S['t_rock'], x, y); break;
    case T_CAVE: ctx.drawImage(S['t_cave'], x, y); break;
    case T_CU: ctx.drawImage(S['t_copper'], x, y); break;
    case T_IR: ctx.drawImage(S['t_iron'], x, y); break;
    case T_GO: ctx.drawImage(S['t_gold'], x, y); break;
    case T_IRID: ctx.drawImage(S['t_iri'], x, y); break;
  }
}
function drawObject(o){
  let key = null, w = 16, h = 16;
  if(o.type==='tree'){ key='tree_'+Game.season; w=32; h=48; }
  else if(o.type==='pine'){ key='pine_'+Game.season; w=32; h=56; }
  else if(o.type==='rock_s'){ key='rock_s'; w=16; h=14; }
  else if(o.type==='rock_m'){ key='rock_m'; w=24; h=20; }
  else if(o.type==='rock_l'){ key='rock_l'; w=32; h=26; }
  else if(o.type==='crop'){ key='crop_'+o.cropType+'_'+o.stage; w=16; h=16; }
  else if(o.type==='bed'){ key='bed'; w=32; h=48; }
  else if(o.type==='flower_r'||o.type==='flower_y'||o.type==='flower_b'||o.type==='flower_w'||o.type==='mushroom'){ key=o.type; w=8; h=10; }
  else if(S[o.type]){ key=o.type; w=S[o.type].width; h=S[o.type].height; }
  if(!key || !S[key]) return;
  const dx = Math.round(o.x - w/2);
  const dy = Math.round(o.y - h);
  ctx.drawImage(S[key], dx, dy);
  if(o.hp!==undefined && o.maxHp!==undefined && o.hp<o.maxHp){
    const bw = 20, bx = Math.round(o.x-bw/2), by = dy-5;
    ctx.fillStyle = '#000'; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle = '#c04030'; ctx.fillRect(bx+1,by+1,(bw-2)*(o.hp/o.maxHp),1);
  }
}
function drawPlayer(){
  if(Game.onHorse){
    const hk = player.dir==='l' ? 'h_l_' : 'h_r_';
    const hf = player.walkPhase % 2;
    const hsp = S[hk+hf];
    if(hsp) ctx.drawImage(hsp, Math.round(player.x-10), Math.round(player.y+2));
  }
  ctx.drawImage(S['shadow'], Math.round(player.x+6), Math.round(player.y+26));
  let key;
  if(player.action==='sleep') key = 'c_'+player.dir+'_sleep';
  else if(player.action==='use') key = 'c_'+player.dir+'_use';
  else if(player.walkPhase>0) key = 'c_'+player.dir+'_'+player.walkPhase;
  else key = 'c_'+player.dir+'_idle';
  const sp = S[key] || S['c_d_idle'];
  if(player.invuln>0 && Math.floor(performance.now()/80)%2===0) ctx.globalAlpha = 0.5;
  const yOff = Game.onHorse ? -8 : 0;
  ctx.drawImage(sp, Math.round(player.x), Math.round(player.y+yOff));
  ctx.globalAlpha = 1;
}
function drawAnimal(a){
  let key;
  if(a.growthStage<1){
    const t2 = ANIMAL_TYPES[a.type];
    key = t2.baby || (a.type==='cow' ? 'a_calf' : a.type==='pig' ? 'a_piglet' : 'a_chick');
  }
  else if(a.type==='chicken') key = 'a_chicken'+(a.frame?'_1':'');
  else if(a.type==='duck') key = 'a_duck'+(a.frame?'_1':'');
  else if(a.type==='rabbit') key = 'a_rabbit'+(a.frame?'_1':'');
  else if(a.type==='pig') key = 'a_pig'+(a.frame?'_1':'');
  else if(a.type==='cow') key = 'a_cow'+(a.frame?'_1':'');
  else if(a.type==='goat') key = 'a_goat'+(a.frame?'_1':'');
  else if(a.type==='horse'){ if(a.mounted) return; key = 'h_r_'+(a.frame?1:0); }
  const sp = S[key]; if(!sp) return;
  const w = sp.width, h = sp.height;
  ctx.drawImage(S['shadow'], Math.round(a.x-w/2), Math.round(a.y-4));
  if(a.dir<0){
    ctx.save();
    ctx.translate(Math.round(a.x)+w/2, 0); ctx.scale(-1,1); ctx.translate(-(Math.round(a.x)+w/2), 0);
    ctx.drawImage(sp, Math.round(a.x-w/2), Math.round(a.y-h));
    ctx.restore();
  } else ctx.drawImage(sp, Math.round(a.x-w/2), Math.round(a.y-h));
  if(a.produceReady && a.growthStage>=1 && a.type!=='horse'){
    const bob = Math.sin(performance.now()/300)*1.5;
    const t2 = ANIMAL_TYPES[a.type];
    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(t2.icon, Math.round(a.x-5), Math.round(a.y-h-4+bob));
  }
}
function drawNPC(n){
  const idx = NPC_DATA.indexOf(n);
  const sp = S['npc'+idx+'_'+n.dir] || S['npc'+idx+'_d'];
  if(!sp) return;
  ctx.drawImage(S['shadow'], Math.round(n.x-10), Math.round(n.y-4));
  ctx.drawImage(sp, Math.round(n.x-16), Math.round(n.y-32));
  if(n.hearts>0){
    ctx.font = 'bold 8px sans-serif'; ctx.fillStyle = '#ff6080';
    ctx.fillText('♥'+Math.floor(n.hearts), Math.round(n.x-8), Math.round(n.y-36));
  }
  if(n.questGiven && !n.questDone){
    const bob = Math.sin(performance.now()/300)*2;
    ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#ffd54a';
    ctx.fillText('!', Math.round(n.x-2), Math.round(n.y-42+bob));
  }
}
function drawMonster(m){
  const sp = S[m.sprite] || S['m_slime'];
  const w = sp.width, h = sp.height;
  ctx.drawImage(S['shadow'], Math.round(m.x-w/2-2), Math.round(m.y-4));
  if(m.hitTimer>0 && Math.floor(performance.now()/60)%2) ctx.globalAlpha = 0.5;
  if(m.dir<0){
    ctx.save();
    ctx.translate(Math.round(m.x)+w/2, 0); ctx.scale(-1,1); ctx.translate(-(Math.round(m.x)+w/2), 0);
    ctx.drawImage(sp, Math.round(m.x-w/2), Math.round(m.y-h));
    ctx.restore();
  } else ctx.drawImage(sp, Math.round(m.x-w/2), Math.round(m.y-h));
  ctx.globalAlpha = 1;
  if(m.hp<m.maxHp){
    const bw = 20, bx = Math.round(m.x-bw/2), by = Math.round(m.y-h)-5;
    ctx.fillStyle = '#000'; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle = '#c04030'; ctx.fillRect(bx+1,by+1,(bw-2)*(m.hp/m.maxHp),1);
  }
}

function drawWorld(){
  const dn = Game.dayNight;
  let skyTop = '#87ceeb', skyBot = '#c8e0f0';
  if(Game.map==='mine'){ skyTop = '#1a1520'; skyBot = '#2a2028'; }
  else if(Game.season===2){ skyTop = '#c89a60'; skyBot = '#e8c890'; }
  else if(Game.season===3){ skyTop = '#a8b8c8'; skyBot = '#d8e0e8'; }
  if(dn>0 && Game.map!=='mine'){
    skyTop = 'rgb('+Math.round(135*(1-dn)+15*dn)+','+Math.round(206*(1-dn)+15*dn)+','+Math.round(235*(1-dn)+40*dn)+')';
    skyBot = 'rgb('+Math.round(200*(1-dn)+10*dn)+','+Math.round(220*(1-dn)+10*dn)+','+Math.round(240*(1-dn)+25*dn)+')';
  }
  const grad = ctx.createLinearGradient(0,0,0,LH);
  grad.addColorStop(0, skyTop); grad.addColorStop(1, skyBot);
  ctx.fillStyle = grad; ctx.fillRect(0,0,LW,LH);

  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  const m = currentMap();
  if(!m.tiles || !m.tiles.length){ ctx.restore(); return; }
  const startX = Math.max(0, Math.floor(camera.x/TILE));
  const endX = Math.min(m.w-1, Math.ceil((camera.x+LW)/TILE));
  const startY = Math.max(0, Math.floor(camera.y/TILE));
  const endY = Math.min(m.h-1, Math.ceil((camera.y+LH)/TILE));
  for(let y=startY;y<=endY;y++) for(let x=startX;x<=endX;x++) drawTile(m.tiles[y][x], x*TILE, y*TILE);

  if(Game.map==='mine' && m.ladder){
    ctx.drawImage(S['ladder'], m.ladder.x*TILE, m.ladder.y*TILE);
  }
  if(Game.map==='farm'){
    const ha = World.farm.houseArea;
    ctx.drawImage(S['house'], ha.x*TILE, ha.y*TILE);
    const sp = World.farm.shopPos;
    ctx.drawImage(S['shop'], sp.x*TILE, sp.y*TILE);
    const st = World.farm.stablePos;
    ctx.drawImage(S['stable']||S['house'], st.x*TILE, st.y*TILE);
    const cp = World.farm.carpenterPos;
    ctx.drawImage(S['carpenter'], cp.x*TILE, cp.y*TILE);
    const cm = World.farm.communityPos;
    ctx.drawImage(S['community'], cm.x*TILE, cm.y*TILE);
  }
  if(Game.map==='town' && World.town.buildings){
    for(const b of World.town.buildings){
      const sp = S[b.type];
      if(sp) ctx.drawImage(sp, b.x*TILE, b.y*TILE);
    }
  }

  if(player.targetX!==null){
    const tp = performance.now()/400;
    const pulse = 0.6+0.4*Math.sin(tp*Math.PI*2);
    ctx.strokeStyle = 'rgba(255,220,80,'+(0.5+pulse*0.4)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.targetX, player.targetY, 4+pulse*2, 0, Math.PI*2); ctx.stroke();
  }

  const items = [];
  if(m.objects) for(const o of m.objects) items.push({y:o.sortY||o.y, draw:()=>drawObject(o)});
  if(Game.map==='farm') for(const a of World.farm.animals) if(!a.mounted) items.push({y:a.y, draw:()=>drawAnimal(a)});
  for(const n of NPC_DATA) if(n.loc===Game.map) items.push({y:n.y, draw:()=>drawNPC(n)});
  if(Game.map==='mine') for(const mon of Game.monsters) items.push({y:mon.y, draw:()=>drawMonster(mon)});
  items.push({y:player.y+32, draw:drawPlayer});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items) it.draw();

  if(Game.fishing){
    const px = player.x+16, py = player.y+16;
    let fx = px, fy = py;
    if(player.dir==='d') fy += TILE*2; else if(player.dir==='u') fy -= TILE*2;
    else if(player.dir==='l') fx -= TILE*2; else fx += TILE*2;
    ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px+6, py-6); ctx.lineTo(fx, fy); ctx.stroke();
    const bob = Math.sin(performance.now()/200)*1.5;
    ctx.drawImage(S['bobber'], fx-3, fy-3+bob);
  }
  for(const p of Game.particles){
    ctx.globalAlpha = p.life/p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-1, p.y-1, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if(dn>0){ ctx.fillStyle = 'rgba(10,10,30,'+(dn*0.5)+')'; ctx.fillRect(0,0,LW,LH); }
  if(Game.weather==='rain' || Game.weather==='storm'){
    ctx.fillStyle = 'rgba(80,80,120,0.15)'; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<60;i++){
      const rx = (i*53+performance.now()*0.3)%LW;
      const ry = (i*37+performance.now()*0.6)%LH;
      ctx.fillStyle = 'rgba(180,200,255,0.5)';
      ctx.fillRect(rx, ry, 1, 4);
    }
  }
  if(Game.weather==='snow'){
    ctx.fillStyle = 'rgba(220,230,240,0.1)'; ctx.fillRect(0,0,LW,LH);
    for(let i=0;i<40;i++){
      const rx = (i*53+performance.now()*0.05)%LW;
      const ry = (i*37+performance.now()*0.15)%LH;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(rx, ry, 2, 2);
    }
  }
  if(Game.weather==='fog'){ ctx.fillStyle = 'rgba(220,220,230,0.25)'; ctx.fillRect(0,0,LW,LH); }
}

function drawHUD(){
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,6,110,44);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1; ctx.strokeRect(6.5,6.5,109,43);
  ctx.fillStyle = '#e8c060'; ctx.font = 'bold 9px monospace';
  const h = Math.floor(Game.time/60)%24, mn = Math.floor(Game.time%60);
  ctx.fillText(t('day')+' '+Game.day+' • '+t(SEASONS[Game.season]), 10, 18);
  ctx.fillText((h<10?'0':'')+h+':'+(mn<10?'0':'')+mn+'  '+Game.seasonDay+'/7', 10, 30);
  ctx.fillStyle = '#fff'; ctx.fillText('🪙 '+Game.gold, 10, 44);

  const locNames = {farm:'🌾 '+t('farm'), town:'🏘 '+t('town'), beach:'🏖 '+t('beach'),
    forest:'🌲 '+t('forest'), mountain:'🏔 '+t('mountain'), mine:'⛏ '+t('mine')+' '+World.mine.depth};
  ctx.fillStyle = 'rgba(20,15,10,0.85)';
  const lw = ctx.measureText(locNames[Game.map]).width+16;
  ctx.fillRect(6,54,lw,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,54.5,lw-1,15);
  ctx.fillStyle = '#e8c060'; ctx.fillText(locNames[Game.map], 10, 65);

  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(6,74,80,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(6.5,74.5,79,15);
  const wi = {sunny:'☀️ '+t('sunny'), rain:'🌧 '+t('rain'), storm:'⛈ '+t('storm'), snow:'❄️ '+t('snow'), fog:'🌫 '+t('fog')}[Game.weather];
  ctx.fillStyle = '#e8c060'; ctx.fillText(wi, 10, 85);

  // HP
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,6,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,6.5,117,15);
  const hP = Game.hp/Game.maxHp;
  ctx.fillStyle = '#3a1010'; ctx.fillRect(LW-121,9,112,10);
  ctx.fillStyle = '#d04040'; ctx.fillRect(LW-121,9,112*hP,10);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
  ctx.fillText('❤ '+Math.round(Game.hp), LW-117, 18);

  // Energy
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,26,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,26.5,117,15);
  const eP = Game.energy/Game.maxEnergy;
  ctx.fillStyle = '#3a2a10'; ctx.fillRect(LW-121,29,112,10);
  ctx.fillStyle = eP>0.5 ? '#6ac04a' : eP>0.25 ? '#e0c040' : '#c04040';
  ctx.fillRect(LW-121,29,112*eP,10);
  ctx.fillStyle = '#fff'; ctx.fillText('⚡ '+Math.round(Game.energy), LW-117, 38);

  // Weapon info
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(LW-124,46,118,16);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(LW-123.5,46.5,117,15);
  ctx.fillStyle = '#e8c060'; ctx.fillText('⚔ '+WEAPONS[Game.weaponLevel].name, LW-121, 57);

  // Buttons I/M/Q
  const btns = [['I','inv',LW-124],['M','map',LW-84],['Q','quest',LW-44]];
  for(const [label,action,x] of btns){
    ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(x,64,38,16);
    ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(x+0.5,64.5,37,15);
    ctx.fillStyle = '#e8c060'; ctx.font = 'bold 10px monospace';
    ctx.fillText(label, x+14, 75);
  }

  // Hotbar
  const hbW = 7*24+4;
  const hbX = (LW-hbW)/2;
  const hbY = LH-32;
  ctx.fillStyle = 'rgba(20,15,10,0.9)'; ctx.fillRect(hbX, hbY, hbW, 28);
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2;
  ctx.strokeRect(hbX+1, hbY+1, hbW-2, 26); ctx.lineWidth = 1;
  for(let i=0;i<7;i++){
    const x = hbX+2+i*24, y = hbY+2;
    ctx.fillStyle = i===Game.selected ? 'rgba(232,192,96,0.35)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(x, y, 20, 20);
    if(i===Game.selected){ ctx.strokeStyle = '#e8c060'; ctx.lineWidth = 2; ctx.strokeRect(x,y,20,20); ctx.lineWidth = 1; }
    if(S['i_'+Game.hotbar[i]]) ctx.drawImage(S['i_'+Game.hotbar[i]], x+2, y+2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 7px monospace';
    ctx.fillText(String(i+1), x+1, y+8);
  }
  ctx.font = 'bold 9px monospace';
  const tn = toolName(Game.hotbar[Game.selected]);
  const tw = ctx.measureText(tn).width+12;
  ctx.fillStyle = 'rgba(20,15,10,0.85)'; ctx.fillRect(hbX, hbY-14, tw, 12);
  ctx.strokeStyle = '#8a5a2a'; ctx.strokeRect(hbX+0.5, hbY-13.5, tw-1, 11);
  ctx.fillStyle = '#e8c060'; ctx.fillText(tn, hbX+6, hbY-5);

  // Toast
  if(Game.toastTimer>0){
    const alpha = Math.min(1, Game.toastTimer/300);
    ctx.font = 'bold 11px monospace';
    const tw2 = ctx.measureText(Game.toast).width+22;
    ctx.fillStyle = 'rgba(20,15,10,'+(0.9*alpha)+')';
    ctx.fillRect((LW-tw2)/2, 60, tw2, 18);
    ctx.strokeStyle = 'rgba(138,90,42,'+alpha+')';
    ctx.strokeRect((LW-tw2)/2+0.5, 60.5, tw2-1, 17);
    ctx.fillStyle = 'rgba(232,192,96,'+alpha+')';
    ctx.textAlign = 'center';
    ctx.fillText(Game.toast, LW/2, 73);
    ctx.textAlign = 'left';
  }

  // Quests panel
  const ql = $('questList');
  if(Game.activeQuests.length){
    let html = '<div class="q">📜 '+t('quests')+':</div>';
    for(const q of Game.activeQuests){
      const npc = NPC_DATA.find(n=>n.id===q.npcId);
      const have = Game.inv[q.item]||0;
      html += '<div>• '+(npc?npc.name:'?')+': '+q.item+' '+have+'/'+q.count+'</div>';
    }
    ql.innerHTML = html; ql.classList.add('show');
  } else ql.classList.remove('show');
}

// ============================================================
// LOOP
// ============================================================
function loop(now){
  let dt = now-lastTime;
  lastTime = now;
  if(dt>100) dt = 100;
  if(dt<0) dt = 0;
  try{
    update(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,CW,CH);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    drawWorld();
    if(!Game.paused) drawHUD();
  }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

// ============================================================
// WORLD POPULATION
// ============================================================
function populateWorld(){
  const w = World.farm;
  w.objects = [];
  const occ = new Set();
  // Reserve building areas
  for(let y=w.houseArea.y-1;y<w.houseArea.y+w.houseArea.h+1;y++)
    for(let x=w.houseArea.x-1;x<w.houseArea.x+w.houseArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.shopPos.y-1;y<w.shopPos.y+5;y++)
    for(let x=w.shopPos.x-1;x<w.shopPos.x+5;x++) occ.add(x+','+y);
  for(let y=w.penArea.y-1;y<w.penArea.y+w.penArea.h+1;y++)
    for(let x=w.penArea.x-1;x<w.penArea.x+w.penArea.w+1;x++) occ.add(x+','+y);
  for(let y=w.stablePos.y-1;y<w.stablePos.y+5;y++)
    for(let x=w.stablePos.x-1;x<w.stablePos.x+5;x++) occ.add(x+','+y);
  for(let y=w.carpenterPos.y-1;y<w.carpenterPos.y+5;y++)
    for(let x=w.carpenterPos.x-1;x<w.carpenterPos.x+6;x++) occ.add(x+','+y);
  for(let y=w.communityPos.y-1;y<w.communityPos.y+6;y++)
    for(let x=w.communityPos.x-1;x<w.communityPos.x+8;x++) occ.add(x+','+y);
  for(let y=15;y<25;y++) for(let x=18;x<30;x++) occ.add(x+','+y);

  let id = 0;
  // Trees on farm
  for(let t2=0;t2<60;t2++){
    const tx = 2+Math.floor(Math.random()*46);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    let nw = false;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(w.tiles[ty+dy] && w.tiles[ty+dy][tx+dx]===T_WATER){ nw = true; break; }
    }
    if(nw) continue;
    const isPine = Math.random()<0.25;
    w.objects.push({ id:'t'+(id++), type:isPine?'pine':'tree',
      x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }
  // Rocks
  for(let t2=0;t2<30;t2++){
    const tx = 2+Math.floor(Math.random()*46);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    const kind = Math.random()<0.5 ? 'rock_s' : (Math.random()<0.6 ? 'rock_m' : 'rock_l');
    const hp = kind==='rock_s' ? 2 : kind==='rock_m' ? 3 : 4;
    w.objects.push({ id:'r'+(id++), type:kind,
      x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty,
      hp, maxHp:hp, solid:true, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }
  // Farm decor
  const decorTypes = ['flower_r','flower_y','flower_b','flower_w','mushroom','bush','rock_small','wood_stump','barrel'];
  for(let t2=0;t2<80;t2++){
    const tx = 2+Math.floor(Math.random()*46);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ.has(tx+','+ty)) continue;
    if(w.tiles[ty][tx]!==T_GRASS) continue;
    const type = decorTypes[Math.floor(Math.random()*decorTypes.length)];
    w.objects.push({ id:'d'+(id++), type, x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty, solid:false, sortY:(ty+1)*TILE });
    occ.add(tx+','+ty);
  }

  // Town decor
  const town = World.town;
  town.objects = [];
  const occ2 = new Set();
  for(const b of town.buildings){
    for(let y=b.y-1;y<b.y+b.h+1;y++) for(let x=b.x-1;x<b.x+b.w+1;x++) occ2.add(x+','+y);
  }
  for(let x=0;x<50;x++) occ2.add(x+',20');
  for(let y=0;y<40;y++) occ2.add('25,'+y);
  for(let y=18;y<24;y++) for(let x=22;x<30;x++) occ2.add(x+','+y);
  for(let t2=0;t2<40;t2++){
    const tx = 2+Math.floor(Math.random()*46);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ2.has(tx+','+ty)) continue;
    if(town.tiles[ty][tx]!==T_GRASS) continue;
    const dt = ['flower_r','flower_y','flower_b','flower_w','bush','rock_small'];
    const type = dt[Math.floor(Math.random()*dt.length)];
    town.objects.push({ id:'td'+(id++), type, x:tx*TILE+TILE/2, y:(ty+1)*TILE, tx, ty, solid:false, sortY:(ty+1)*TILE });
    occ2.add(tx+','+ty);
  }
  // Lamps along main road
  for(let x=4;x<46;x+=8){
    if(town.tiles[19][x]===T_PATH || town.tiles[20][x]===T_PATH){
      town.objects.push({ id:'tl'+(id++), type:'lamp', x:x*TILE+8, y:19*TILE+16, tx:x, ty:19, solid:false, sortY:19*TILE+16 });
    }
  }
  // Benches in plaza
  for(let i=0;i<6;i++){
    const x = 21+i*2, y = 18;
    if(town.tiles[y][x]===T_FLOOR){
      town.objects.push({ id:'tb'+(id++), type:'bench', x:x*TILE+8, y:(y+1)*TILE, tx:x, ty:y, solid:false, sortY:(y+1)*TILE });
    }
  }

  // Forest
  const f = World.forest;
  f.objects = [];
  const occ3 = new Set();
  for(let y=18;y<24;y++) occ3.add('0,'+y);
  for(let y=18;y<24;y++) occ3.add('39,'+y);
  for(let x=18;x<24;x++) occ3.add(x+',0');
  for(let t2=0;t2<150;t2++){
    const tx = 2+Math.floor(Math.random()*36);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ3.has(tx+','+ty)) continue;
    if(f.tiles[ty][tx]!==T_GRASS) continue;
    const isPine = Math.random()<0.35;
    f.objects.push({ id:'ft'+(id++), type:isPine?'pine':'tree',
      x:tx*TILE+8, y:(ty+1)*TILE, tx, ty,
      hp:isPine?5:4, maxHp:isPine?5:4, solid:true, sortY:(ty+1)*TILE });
    occ3.add(tx+','+ty);
  }
  for(let t2=0;t2<40;t2++){
    const tx = 2+Math.floor(Math.random()*36);
    const ty = 2+Math.floor(Math.random()*36);
    if(occ3.has(tx+','+ty)) continue;
    if(f.tiles[ty][tx]!==T_GRASS) continue;
    const dt = ['mushroom','flower_b','flower_w','bush','rock_small'];
    const type = dt[Math.floor(Math.random()*dt.length)];
    f.objects.push({ id:'fd'+(id++), type, x:tx*TILE+8, y:(ty+1)*TILE, tx, ty, solid:false, sortY:(ty+1)*TILE });
    occ3.add(tx+','+ty);
  }

  // Mountain
  const mt = World.mountain;
  mt.objects = [];
  for(let t2=0;t2<60;t2++){
    const tx = 2+Math.floor(Math.random()*36);
    const ty = 2+Math.floor(Math.random()*36);
    if(mt.tiles[ty][tx]!==T_GRASS) continue;
    const kind = Math.random()<0.4 ? 'rock_s' : (Math.random()<0.5 ? 'rock_m' : 'rock_l');
    const hp = kind==='rock_s' ? 2 : kind==='rock_m' ? 3 : 4;
    mt.objects.push({ id:'mr'+(id++), type:kind,
      x:tx*TILE+8, y:(ty+1)*TILE, tx, ty,
      hp, maxHp:hp, solid:true, sortY:(ty+1)*TILE });
  }

  // Beach
  const b = World.beach;
  b.objects = [];
  for(let t2=0;t2<30;t2++){
    const tx = 2+Math.floor(Math.random()*46);
    const ty = 2+Math.floor(Math.random()*16);
    if(b.tiles[ty][tx]!==T_SAND) continue;
    const dt = ['rock_small','flower_w','mushroom'];
    const type = dt[Math.floor(Math.random()*dt.length)];
    b.objects.push({ id:'bd'+(id++), type, x:tx*TILE+8, y:(ty+1)*TILE, tx, ty, solid:false, sortY:(ty+1)*TILE });
  }
}
populateWorld();

// ============================================================
// SPAWN ANIMAL
// ============================================================
function spawnAnimal(type){
  const pa = World.farm.penArea;
  const tx = pa.x+1+Math.floor(Math.random()*(pa.w-2));
  const ty = pa.y+1+Math.floor(Math.random()*(pa.h-2));
  World.farm.animals.push({
    type, x:tx*TILE+8, y:ty*TILE+16, tx:tx*TILE+8, ty:ty*TILE+16,
    dir:1, frame:0, frameTimer:0, moveTimer:1500+Math.random()*2000,
    produceReady:false, produceTimer:ANIMAL_TYPES[type].time,
    growthStage:0, growTimer:0,
  });
  toast(ANIMAL_TYPES[type].name+' purchased!');
}

// ============================================================
// MENUS
// ============================================================
function newGame(){
  try{ localStorage.removeItem('pixelfarm_save'); }catch(e){}
  Game.time = 6*60; Game.day = 1; Game.season = 0; Game.seasonDay = 1; Game.weather = 'sunny';
  Game.energy = 100; Game.maxEnergy = 100; Game.hp = 100; Game.maxHp = 100; Game.gold = 80;
  Game.inv = { wood:0, stone:0, seeds:10, fish:0, food:3,
    wheat:0, carrot:0, tomato:0, potato:0, corn:0, pumpkin:0,
    egg:0, milk:0, goat_milk:0, wool:0, truffle:0, feather:0,
    copper:0, iron:0, gold_ore:0, iri:0, coal:0, slime:0, bone:0, potion:0 };
  Game.fishCaught = {};
  Game.selected = 0;
  Game.map = 'farm';
  Game.sleeping = false; Game.paused = false;
  Game.fishing = null; Game.particles = []; Game.shopOpen = false;
  Game.dayNight = 0; Game.panelOpen = null;
  Game.weaponLevel = 0; Game.armorLevel = 0;
  Game.activeQuests = []; Game.completedQuests = 0;
  Game.kills = {};
  Game.monsters = [];
  Game.onHorse = false; Game.stuckTimer = 0; Game.invuln = 0;
  Game.bundles = BUNDLES.map(b=>({...b}));

  player.x = 24*TILE+8; player.y = 19*TILE;
  player.targetX = null; player.targetY = null;
  player.actionTarget = null; player.action = null;
  player.dir = 'd'; player.walkPhase = 0;

  World.farm.tiles = makeFarm();
  World.town.tiles = makeTown();
  World.beach.tiles = makeBeach();
  World.forest.tiles = makeForest();
  World.mountain.tiles = makeMountain();
  World.farm.animals = [];
  World.town.objects = [];
  World.beach.objects = [];
  World.forest.objects = [];
  World.mountain.objects = [];
  populateWorld();

  for(const n of NPC_DATA){
    n.hearts = 0; n.questDone = false; n.questGiven = false; n.giftedToday = false;
    n.x = n.hx*TILE+8; n.y = n.hy*TILE+16;
    n.wanderTarget = {x:n.x, y:n.y};
  }
  camera.x = player.x-LW/2;
  camera.y = player.y-LH/2;

  Snd.init(); Snd.resume(); Snd.startMusic();
  $('menuMain').classList.add('hidden');
  $('menuPause').classList.add('hidden');
  $('menuHelp').classList.add('hidden');
}
function pauseGame(){
  if(Game.paused || Game.sleeping) return;
  Game.paused = true;
  Snd.stopAll();
  $('menuPause').classList.remove('hidden');
  Snd.play('click');
}
function resumeGame(){
  Game.paused = false;
  $('menuPause').classList.add('hidden');
  $('menuHelp').classList.add('hidden');
  Snd.unpause();
}

$('btnNew').onclick = ()=>{ Snd.init(); Snd.resume(); Snd.play('click'); newGame(); };
$('btnContinue').onclick = ()=>{
  Snd.init(); Snd.resume();
  if(loadGame()){
    Snd.play('click');
    $('menuMain').classList.add('hidden');
    Snd.startMusic();
  } else toast(t('noSave'));
};
$('btnSettings').onclick = ()=>{ Snd.init(); Snd.resume(); Snd.play('click'); openSettingsPanel(); };
$('btnHelp').onclick = ()=>{ Snd.play('click'); $('menuMain').classList.add('hidden'); $('menuHelp').classList.remove('hidden'); };
$('btnHelpBack').onclick = ()=>{ Snd.play('click'); $('menuHelp').classList.add('hidden'); $('menuMain').classList.remove('hidden'); };
$('btnResume').onclick = resumeGame;
$('btnSave2').onclick = ()=>{ Snd.play('click'); saveGame(); };
$('btnSettings2').onclick = ()=>{ Snd.play('click'); openSettingsPanel(); };
$('btnToMain').onclick = ()=>{
  Snd.play('click');
  Game.paused = false;
  Game.panelOpen = null;
  Snd.stopAll();
  $('menuPause').classList.add('hidden');
  $('menuMain').classList.remove('hidden');
};

if(hasSave()) $('btnContinue').style.display = 'block';
else $('btnContinue').style.display = 'none';

lastTime = performance.now();
requestAnimationFrame(loop);

})();
</script>
