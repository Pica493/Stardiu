  } else if (type === 'chicken') {
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.6), skinMat);
    body.position.y = 0.4; g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), headMat);
    head.position.set(0, 0.8, -0.3); g.add(head);
    const beak = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.2), new THREE.MeshLambertMaterial({color:0xffaa00}));
    beak.position.set(0, 0.78, -0.55); g.add(beak);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), new THREE.MeshLambertMaterial({color:0xffaa00}));
    legL.position.set(-0.15, 0.15, 0); g.add(legL);
    const legR = legL.clone(); legR.position.x = 0.15; g.add(legR);
  } else {
    // Гуманоидоподобные: зомби, скелет, свинья, корова
    const bodyH = t.height * 0.55;
    const headH = t.height * 0.28;
    const legH = t.height * 0.4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(t.width * 0.9, bodyH, t.width * 0.55), skinMat);
    body.position.y = legH + bodyH / 2; g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(headH * 1.1, headH, headH * 1.1), headMat);
    head.position.y = legH + bodyH + headH / 2; g.add(head);
    const eyeMat = new THREE.MeshBasicMaterial({ color: t.eyeColor });
    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(headH*0.15, headH*0.15, 0.02), eyeMat);
    const eyeR = eyeL.clone();
    eyeL.position.set(-headH*0.25, legH + bodyH + headH*0.6, -headH*0.56);
    eyeR.position.set( headH*0.25, legH + bodyH + headH*0.6, -headH*0.56);
    g.add(eyeL); g.add(eyeR);
    // руки
    const armH = bodyH * 0.9;
    const armL = new THREE.Mesh(new THREE.BoxGeometry(t.width*0.2, armH, t.width*0.2), skinMat);
    armL.position.set(-t.width*0.6, legH + bodyH - armH/2, 0);
    g.add(armL);
    const armR = armL.clone();
    armR.position.x = t.width*0.6;
    g.add(armR);
    // ноги
    const legL = new THREE.Mesh(new THREE.BoxGeometry(t.width*0.25, legH, t.width*0.25), skinMat);
    legL.position.set(-t.width*0.25, legH/2, 0); g.add(legL);
    const legR = legL.clone();
    legR.position.x = t.width*0.25; g.add(legR);
  }
  return g;
}

function spawnMob(type, x, y, z) {
  if (mobs.length >= MOB_MAX) return null;
  const t = MOB_TYPES[type];
  const mesh = createMobMesh(type);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  const mob = {
    id: mobIdCounter++,
    type, hp: t.hp, maxHp: t.hp,
    pos: new THREE.Vector3(x, y, z),
    vel: new THREE.Vector3(),
    yaw: Math.random() * Math.PI * 2,
    mesh, width: t.width, height: t.height,
    attackTimer: 0,
    wanderTimer: 0,
    wanderDir: new THREE.Vector3(),
    burnTimer: 0,
    onGround: false,
    hurtTimer: 0
  };
  mobs.push(mob);
  return mob;
}

function mobCollides(mob, pos) {
  const hw = mob.width / 2;
  const x0 = Math.floor(pos.x - hw), x1 = Math.floor(pos.x + hw);
  const y0 = Math.floor(pos.y), y1 = Math.floor(pos.y + mob.height);
  const z0 = Math.floor(pos.z - hw), z1 = Math.floor(pos.z + hw);
  for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    const b = world.getBlock(x, y, z);
    if (b !== B.AIR && b !== B.WATER && BLOCKS[b] && BLOCKS[b].solid) return true;
  }
  return false;
}

function moveMobAxis(mob, axis, delta) {
  if (delta === 0) return;
  const saved = mob.pos[axis];
  mob.pos[axis] += delta;
  if (mobCollides(mob, mob.pos)) {
    mob.pos[axis] = saved;
    if (axis === 'y') {
      if (delta < 0) mob.onGround = true;
      mob.vel.y = 0;
    } else mob.vel[axis] = 0;
  }
}

function getLightAt(x, y, z) {
  // Приблизительная оценка освещённости: день = 15, ночь = 4
  const isDay = timeOfDay > 0.22 && timeOfDay < 0.78;
  // Простая проверка: если блок неба над головой — полный свет
  const cx = Math.floor(x / CHUNK_W), cz = Math.floor(z / CHUNK_D);
  const c = world.chunks.get(world.key(cx, cz));
  if (!c) return isDay ? 15 : 4;
  const lx = x - cx*CHUNK_W, lz = z - cz*CHUNK_D;
  let topY = -1;
  for (let yy = CHUNK_H - 1; yy > Math.floor(y); yy--) {
    const b = c.getBlock(lx, yy, lz);
    if (b !== B.AIR && b !== B.WATER && !TRANSPARENT_BLOCKS.has(b)) { topY = yy; break; }
  }
  if (topY >= 0) return 3; // под крышей — темно
  return isDay ? 15 : 4;
}

function updateMobs(dt) {
  const isDay = timeOfDay > 0.22 && timeOfDay < 0.78;

  // Спавн
  mobSpawnTimer -= dt;
  if (mobSpawnTimer <= 0 && player && world) {
    mobSpawnTimer = isDay ? 3.0 : 1.5;
    if (mobs.length < MOB_MAX) {
      const night = timeOfDay < 0.2 || timeOfDay > 0.8;
      // Выбираем тип
      let types = [];
      if (night) types = ['zombie','skeleton','spider','zombie','skeleton'];
      else types = ['pig','cow','chicken','pig','cow'];
      const type = types[(Math.random() * types.length) | 0];
      const info = MOB_TYPES[type];

      // Пытаемся найти точку спавна 12-28 блоков от игрока
      for (let attempt = 0; attempt < 8; attempt++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = 12 + Math.random() * 16;
        const sx = Math.floor(player.pos.x + Math.cos(ang) * dist);
        const sz = Math.floor(player.pos.z + Math.sin(ang) * dist);
        const hy = world.getHeightAt(sx, sz);
        if (hy < 1) continue;
        const above = world.getBlock(sx, hy + 1, sz);
        const above2 = world.getBlock(sx, hy + 2, sz);
        if (above !== B.AIR || above2 !== B.AIR) continue;
        if (hy + 1 <= 20) continue; // не спавним в воде
        const light = getLightAt(sx, hy + 1, sz);
        if (night && light > 7) continue;
        if (!night && light < 9) continue;
        spawnMob(type, sx + 0.5, hy + 1, sz + 0.5);
        break;
      }
    }
  }

  // Обновление мобов
  for (let i = mobs.length - 1; i >= 0; i--) {
    const mob = mobs[i];
    const t = MOB_TYPES[mob.type];

    if (mob.hurtTimer > 0) mob.hurtTimer -= dt;
    if (mob.attackTimer > 0) mob.attackTimer -= dt;

    // Горение на солнце (враждебные)
    if (t.burnsInDay && isDay) {
      const aboveHead = world.getBlock(Math.floor(mob.pos.x), Math.floor(mob.pos.y + mob.height + 0.5), Math.floor(mob.pos.z));
      if (aboveHead === B.AIR) {
        mob.burnTimer += dt;
        if (mob.burnTimer >= 1.0) {
          mob.burnTimer = 0;
          mob.hp -= 2;
          // частицы огня
          spawnBreakParticles(Math.floor(mob.pos.x), Math.floor(mob.pos.y + 0.5), Math.floor(mob.pos.z), B.TORCH);
          if (mob.hp <= 0) { killMob(mob, i); continue; }
        }
        // подсветка горящего моба
        if (mob.mesh && mob.hurtTimer <= 0) {
          mob.mesh.traverse(o => { if (o.material) o.material.emissive && o.material.emissive.setHex(0x442200); });
        }
      } else {
        mob.burnTimer = 0;
      }
    } else {
      mob.burnTimer = 0;
      if (mob.mesh && mob.hurtTimer <= 0) {
        mob.mesh.traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setHex(0x000000); });
      }
    }

    // Красная вспышка при ударе
    if (mob.hurtTimer > 0) {
      mob.mesh.traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setHex(0x882222); });
    } else if (!(t.burnsInDay && isDay)) {
      mob.mesh.traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setHex(0x000000); });
    }

    // Логика движения
    const dx = player.pos.x - mob.pos.x;
    const dz = player.pos.z - mob.pos.z;
    const dy = player.pos.y - mob.pos.y;
    const distToPlayer = Math.hypot(dx, dz);

    const hostile = t.hostile && !(isDay && t.burnsInDay);
    if (hostile && distToPlayer < 20) {
      // Преследование
      const ang = Math.atan2(dx, dz);
      mob.yaw = ang;
      const speed = t.speed;
      const vx = Math.sin(ang) * speed;
      const vz = Math.cos(ang) * speed;
      // Прыжок через 1 блок
      const aheadX = Math.floor(mob.pos.x + Math.sin(ang) * 0.6);
      const aheadZ = Math.floor(mob.pos.z + Math.cos(ang) * 0.6);
      const aheadY = Math.floor(mob.pos.y);
      const aheadB = world.getBlock(aheadX, aheadY, aheadZ);
      if (aheadB !== B.AIR && mob.onGround) mob.vel.y = 7;
      mob.vel.x = lerp(mob.vel.x, vx, clamp(8*dt, 0, 1));
      mob.vel.z = lerp(mob.vel.z, vz, clamp(8*dt, 0, 1));

      // Атака
      if (distToPlayer < 1.5 && Math.abs(dy) < 2 && mob.attackTimer <= 0) {
        mob.attackTimer = t.attackCooldown;
        if (player.mode === 'survival') player.damage(t.damage);
        sfx.hurt();
      }
    } else {
      // Блуждание
      mob.wanderTimer -= dt;
      if (mob.wanderTimer <= 0) {
        mob.wanderTimer = 2 + Math.random() * 3;
        if (Math.random() < 0.3) {
          mob.vel.x = 0; mob.vel.z = 0;
        } else {
          const a = Math.random() * Math.PI * 2;
          mob.yaw = a;
          mob.vel.x = Math.sin(a) * t.speed * 0.4;
          mob.vel.z = Math.cos(a) * t.speed * 0.4;
        }
      }
      // Избегание края
      const aheadX = Math.floor(mob.pos.x + mob.vel.x * 0.3);
      const aheadZ = Math.floor(mob.pos.z + mob.vel.z * 0.3);
      const aheadY = Math.floor(mob.pos.y) - 1;
      const below = world.getBlock(aheadX, aheadY, aheadZ);
      if (below === B.AIR && mob.onGround) {
        mob.vel.x = -mob.vel.x; mob.vel.z = -mob.vel.z;
      }
    }

    // Гравитация
    mob.vel.y -= 25 * dt;
    mob.vel.y = clamp(mob.vel.y, -30, 30);

    // Движение с коллизиями
    mob.onGround = false;
    moveMobAxis(mob, 'x', mob.vel.x * dt);
    moveMobAxis(mob, 'z', mob.vel.z * dt);
    moveMobAxis(mob, 'y', mob.vel.y * dt);

    // Падение в воду — всплытие
    const inWater = world.getBlock(Math.floor(mob.pos.x), Math.floor(mob.pos.y + 0.5), Math.floor(mob.pos.z)) === B.WATER;
    if (inWater) { mob.vel.y = 2; }

    // Обновление меша
    mob.mesh.position.copy(mob.pos);
    mob.mesh.rotation.y = mob.yaw;

    // Удаление при уходе далеко
    if (distToPlayer > 80) {
      scene.remove(mob.mesh);
      mob.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      mobs.splice(i, 1);
    }
  }
}

function killMob(mob, index) {
  const t = MOB_TYPES[mob.type];
  // Дроп
  for (const drop of t.drops) {
    if (Math.random() < drop.chance) {
      const count = drop.min + Math.floor(Math.random() * (drop.max - drop.min + 1));
      for (let k = 0; k < count; k++) {
        spawnItemDrop(mob.pos.x + (Math.random()-0.5)*0.5, mob.pos.y + 0.5, mob.pos.z + (Math.random()-0.5)*0.5, drop.id, 1);
      }
    }
  }
  // Частицы
  for (let k = 0; k < 6; k++) {
    spawnBreakParticles(Math.floor(mob.pos.x), Math.floor(mob.pos.y), Math.floor(mob.pos.z), B.DIRT);
  }
  scene.remove(mob.mesh);
  mob.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  mobs.splice(index, 1);
}

// Попадание по мобу при ударе (левой кнопкой)
function hitMobAtCursor() {
  if (!player || !camera) return false;
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  let best = null, bestT = 6;
  for (const mob of mobs) {
    const toMob = new THREE.Vector3().subVectors(mob.pos, origin);
    toMob.y += mob.height * 0.5;
    const proj = toMob.dot(dir);
    if (proj < 0 || proj > 6) continue;
    const closest = origin.clone().addScaledVector(dir, proj);
    const dist = closest.distanceTo(mob.pos.clone().add(new THREE.Vector3(0, mob.height*0.5, 0)));
    if (dist < mob.width && proj < bestT) { bestT = proj; best = mob; }
  }
  if (best) {
    best.hp -= 4;
    best.hurtTimer = 0.3;
    sfx.hit && sfx.hit();
    if (best.hp <= 0) {
      const idx = mobs.indexOf(best);
      if (idx >= 0) killMob(best, idx);
    } else {
      // Отбрасывание
      const kb = new THREE.Vector3().subVectors(best.pos, player.pos).normalize().multiplyScalar(3);
      best.vel.x += kb.x; best.vel.z += kb.z; best.vel.y = 5;
    }
    return true;
  }
  return false;
}

function setupClouds() {
  cloudGroup = new THREE.Group();
  scene.add(cloudGroup);
  const cloudMat = new THREE.MeshLambertMaterial({
    color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false
  });
  const cloudGeo = new THREE.BoxGeometry(1, 1, 1);
  for (let i = 0; i < 24; i++) {
    const g = new THREE.Group();
    const parts = 2 + ((Math.random() * 4) | 0);
    for (let k = 0; k < parts; k++) {
      const p = new THREE.Mesh(cloudGeo, cloudMat);
      p.scale.set(8 + Math.random()*8, 3 + Math.random()*2, 6 + Math.random()*6);
      p.position.set((k - parts/2) * 6 + (Math.random()-0.5)*3, (Math.random()-0.5)*2, (Math.random()-0.5)*4);
      g.add(p);
    }
    const ang = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    g.position.set(Math.cos(ang) * dist, 55 + Math.random() * 10, Math.sin(ang) * dist);
    g.userData.speed = 0.8 + Math.random() * 1.2;
    cloudGroup.add(g);
    clouds.push(g);
  }
}

function updateClouds(dt) {
  if (!cloudGroup || !player) return;
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    // Возврат облака с другой стороны если ушло далеко
    const dx = c.position.x - player.pos.x;
    const dz = c.position.z - player.pos.z;
    if (Math.abs(dx) > 100) {
      c.position.x = player.pos.x - Math.sign(dx) * 100;
      c.position.z = player.pos.z + (Math.random()-0.5) * 120;
    }
  }
  cloudGroup.position.x = 0;
  cloudGroup.position.z = 0;
}

let rainSystem = null;

function setupRain() {
  const count = 800;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i*3+0] = (Math.random() - 0.5) * 40;
    positions[i*3+1] = Math.random() * 25;
    positions[i*3+2] = (Math.random() - 0.5) * 40;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0x9bb8e8, size: 0.12, transparent: true, opacity: 0.7 });
  rainSystem = new THREE.Points(geo, mat);
  rainSystem.visible = false;
  scene.add(rainSystem);
}

function updateWeather(dt) {
  weatherChangeIn -= dt;
  if (weatherChangeIn <= 0) {
    weatherState = weatherState === 'clear' ? 'rain' : 'clear';
    weatherChangeIn = weatherState === 'rain' ? (30 + Math.random() * 60) : (60 + Math.random() * 90);
  }
  if (rainSystem && player) {
    rainSystem.visible = weatherState === 'rain';
    if (weatherState === 'rain') {
      rainSystem.position.set(player.pos.x, player.pos.y + 8, player.pos.z);
      const arr = rainSystem.geometry.attributes.position.array;
      for (let i = 0; i < arr.length; i += 3) {
        arr[i+1] -= 18 * dt;
        if (arr[i+1] < -8) {
          arr[i+1] = 20 + Math.random() * 5;
          arr[i]   = (Math.random() - 0.5) * 40;
          arr[i+2] = (Math.random() - 0.5) * 40;
        }
      }
      rainSystem.geometry.attributes.position.needsUpdate = true;
    }
  }
}

let hotbar = [null, null, null, null, null, null, null, null, null];
let backpack = [];
let selectedSlot = 0;

function addToInventory(id, count) {
  // Сначала в хотбар
  for (let i = 0; i < 9; i++) if (hotbar[i] && hotbar[i].id === id) { hotbar[i].count += count; updateHotbarUI(); return; }
  for (let i = 0; i < 9; i++) if (!hotbar[i]) { hotbar[i] = { id, count }; updateHotbarUI(); return; }
  // Затем в рюкзак
  for (const s of backpack) if (s.id === id) { s.count += count; return; }
  backpack.push({ id, count });
}

function removeFromInventory(id, count) {
  let need = count;
  for (let i = 0; i < 9; i++) if (hotbar[i] && hotbar[i].id === id) {
    const take = Math.min(need, hotbar[i].count);
    hotbar[i].count -= take; need -= take;
    if (hotbar[i].count <= 0) hotbar[i] = null;
    if (need <= 0) { updateHotbarUI(); return true; }
  }
  for (let i = 0; i < backpack.length; i++) if (backpack[i].id === id) {
    const take = Math.min(need, backpack[i].count);
    backpack[i].count -= take; need -= take;
    if (backpack[i].count <= 0) backpack.splice(i, 1);
    if (need <= 0) { updateHotbarUI(); return true; }
  }
  return need <= 0;
}

function countItem(id) {
  let c = 0;
  for (const s of hotbar) if (s && s.id === id) c += s.count;
  for (const s of backpack) if (s.id === id) c += s.count;
  return c;
}

function drawBlockIcon(cv, id) {
  const S = 40;
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, S, S);

  // Спец-иконки для предметов (не блоков)
  if (id >= 100) { drawItemIcon(ctx, id, S); return; }

  // Факел — рисуем как настоящий факел (не кубик)
  if (id === B.TORCH) {
    // палка
    ctx.fillStyle = '#5c3a1e';
    ctx.fillRect(S*0.42, S*0.35, S*0.16, S*0.6);
    ctx.fillStyle = '#7a4e2a';
    ctx.fillRect(S*0.42, S*0.35, S*0.08, S*0.6);
    // пламя
    ctx.fillStyle = '#ff5500';
    ctx.beginPath(); ctx.arc(S*0.5, S*0.28, S*0.20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(S*0.5, S*0.28, S*0.14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffee66';
    ctx.beginPath(); ctx.arc(S*0.5, S*0.27, S*0.07, 0, Math.PI*2); ctx.fill();
    return;
  }

  // Обычный блок — изометрия
  const info = BLOCKS[id];
  if (!info) { ctx.fillStyle = '#444'; ctx.fillRect(0,0,S,S); return; }
  const tile = atlasTexture.image;
  const topUV = tileUV(info.top);
  const sideUV = tileUV(info.side);
  const tx = Math.floor(topUV.u0 * tile.width), ty = Math.floor((1 - topUV.v1) * tile.height);
  const sx = Math.floor(sideUV.u0 * tile.width), sy = Math.floor((1 - sideUV.v1) * tile.height);

  // Верх
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(S/2, 2); ctx.lineTo(S-2, S*0.27); ctx.lineTo(S/2, S*0.52); ctx.lineTo(2, S*0.27);
  ctx.closePath(); ctx.clip();
  ctx.drawImage(tile, tx, ty, TILE, TILE, 0, 0, S, S);
  ctx.restore();

  // Левая грань
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(2, S*0.27); ctx.lineTo(S/2, S*0.52); ctx.lineTo(S/2, S-2); ctx.lineTo(2, S*0.75);
  ctx.closePath(); ctx.clip();
  ctx.drawImage(tile, sx, sy, TILE, TILE, 0, 0, S, S);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.moveTo(2, S*0.27); ctx.lineTo(S/2, S*0.52); ctx.lineTo(S/2, S-2); ctx.lineTo(2, S*0.75);
  ctx.closePath(); ctx.fill();

  // Правая грань
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(S-2, S*0.27); ctx.lineTo(S/2, S*0.52); ctx.lineTo(S/2, S-2); ctx.lineTo(S-2, S*0.75);
  ctx.closePath(); ctx.clip();
  ctx.drawImage(tile, sx, sy, TILE, TILE, 0, 0, S, S);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath();
  ctx.moveTo(S-2, S*0.27); ctx.lineTo(S/2, S*0.52); ctx.lineTo(S/2, S-2); ctx.lineTo(S-2, S*0.75);
  ctx.closePath(); ctx.fill();
}

function drawItemIcon(ctx, id, S) {
  ctx.clearRect(0, 0, S, S);
  switch (id) {
    case IT.APPLE:
      ctx.fillStyle = '#cc2222';
      ctx.beginPath(); ctx.arc(S/2, S*0.58, S*0.32, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#aa1111';
      ctx.beginPath(); ctx.arc(S*0.38, S*0.5, S*0.08, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5a3010';
      ctx.fillRect(S*0.48, S*0.18, S*0.05, S*0.14);
      ctx.fillStyle = '#3a8020';
      ctx.beginPath(); ctx.ellipse(S*0.62, S*0.24, S*0.1, S*0.05, 0.4, 0, Math.PI*2); ctx.fill();
      break;
    case IT.BREAD:
      ctx.fillStyle = '#c08040';
      ctx.beginPath();
      ctx.ellipse(S/2, S*0.55, S*0.38, S*0.22, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#a06020';
      ctx.fillRect(S*0.18, S*0.45, S*0.64, S*0.03);
      ctx.fillRect(S*0.2, S*0.58, S*0.6, S*0.03);
      ctx.fillStyle = '#e0a060';
      ctx.beginPath(); ctx.ellipse(S/2, S*0.48, S*0.38, S*0.14, 0, 0, Math.PI*2); ctx.fill();
      break;
    case IT.RAW_MEAT:
      ctx.fillStyle = '#e06070';
      ctx.beginPath(); ctx.ellipse(S/2, S*0.55, S*0.32, S*0.24, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(S*0.34, S*0.42, S*0.32, S*0.08);
      ctx.fillStyle = '#aa3040';
      ctx.beginPath(); ctx.arc(S*0.42, S*0.62, S*0.06, 0, Math.PI*2); ctx.fill();
      break;
    case IT.COOKED_MEAT:
      ctx.fillStyle = '#7a3a1e';
      ctx.beginPath(); ctx.ellipse(S/2, S*0.55, S*0.32, S*0.24, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#a05030';
      ctx.beginPath(); ctx.ellipse(S*0.42, S*0.5, S*0.14, S*0.08, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(S*0.3, S*0.5); ctx.lineTo(S*0.7, S*0.6); ctx.stroke();
      break;
    case IT.ROTTEN_FLESH:
      ctx.fillStyle = '#6a5a3a';
      ctx.beginPath(); ctx.ellipse(S/2, S*0.55, S*0.32, S*0.24, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a6a20';
      ctx.beginPath(); ctx.arc(S*0.4, S*0.5, S*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(S*0.6, S*0.6, S*0.05, 0, Math.PI*2); ctx.fill();
      break;
    case IT.BONE:
      ctx.fillStyle = '#eaeae0';
      ctx.fillRect(S*0.28, S*0.45, S*0.44, S*0.12);
      ctx.beginPath(); ctx.arc(S*0.25, S*0.4, S*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(S*0.25, S*0.62, S*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(S*0.75, S*0.4, S*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(S*0.75, S*0.62, S*0.1, 0, Math.PI*2); ctx.fill();
      break;
    case IT.STRING:
      ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const t = i / 16;
        const x = S*0.2 + Math.sin(t * Math.PI * 3) * S*0.3;
        const y = S*0.15 + t * S*0.7;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      break;
    case IT.SPIDER_EYE:
      ctx.fillStyle = '#8a1a2a';
      ctx.beginPath(); ctx.arc(S/2, S/2, S*0.32, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#300008';
      ctx.beginPath(); ctx.arc(S/2, S/2, S*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff5566';
      ctx.beginPath(); ctx.arc(S/2 - S*0.06, S/2 - S*0.06, S*0.05, 0, Math.PI*2); ctx.fill();
      break;
    case IT.GUNPOWDER:
      ctx.fillStyle = '#3a3a3a';
      for (let i = 0; i < 20; i++) {
        const x = S*0.2 + Math.random() * S*0.6;
        const y = S*0.3 + Math.random() * S*0.5;
        ctx.fillRect(x, y, 3, 3);
      }
      break;
    case IT.FEATHER:
      ctx.fillStyle = '#f4f4f4';
      ctx.beginPath();
      ctx.ellipse(S*0.5, S*0.4, S*0.1, S*0.28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#d0d0d0';
      ctx.fillRect(S*0.48, S*0.2, S*0.04, S*0.6);
      break;
    case IT.WHEAT:
      ctx.strokeStyle = '#c8a040'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(S*0.5, S*0.85); ctx.lineTo(S*0.5, S*0.25); ctx.stroke();
      ctx.fillStyle = '#e0b840';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(S*0.42, S*0.3 + i*S*0.1, S*0.05, S*0.03, -0.4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.ellipse(S*0.58, S*0.3 + i*S*0.1, S*0.05, S*0.03, 0.4, 0, Math.PI*2); ctx.fill();
      }
      break;
    case IT.STICK:
      ctx.strokeStyle = '#7a4a20'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(S*0.28, S*0.78); ctx.lineTo(S*0.72, S*0.22); ctx.stroke();
      ctx.strokeStyle = '#5a3010'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(S*0.34, S*0.72); ctx.lineTo(S*0.66, S*0.28); ctx.stroke();
      break;
    default:
      ctx.fillStyle = '#888';
      ctx.fillRect(S*0.2, S*0.2, S*0.6, S*0.6);
  }
}

function renderCrafting() {
  const list = document.getElementById('craftList');
  list.innerHTML = '';
  for (const r of RECIPES) {
    const can = r.req.every(q => countItem(q.id) >= q.count);
    const el = document.createElement('div');
    el.className = 'craft-item' + (can ? '' : ' no');
    const cv = document.createElement('canvas');
    drawBlockIcon(cv, r.result.id);
    el.appendChild(cv);
    const info = document.createElement('div');
    info.style.flex = '1';
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = `${r.name} ×${r.result.count}`;
    info.appendChild(nm);
    const req = document.createElement('div');
    req.className = 'req';
    req.textContent = r.req.map(q => `${itemName(q.id)}×${q.count}`).join(', ');
    info.appendChild(req);
    el.appendChild(info);
    if (can) {
      el.addEventListener('click', () => {
        if (!r.req.every(q => countItem(q.id) >= q.count)) return;
        for (const q of r.req) removeFromInventory(q.id, q.count);
        addToInventory(r.result.id, r.result.count);
        sfx.craft();
        renderCrafting();
        renderInventoryGrids();
      });
    }
    list.appendChild(el);
  }
}

function renderInventoryGrids() {
  const g = document.getElementById('invGrid');
  g.innerHTML = '';
  for (let i = 0; i < 27; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const item = backpack[i];

      const cv = document.createElement('canvas');
      drawBlockIcon(cv, item.id);
      slot.appendChild(cv);
      const c = document.createElement('span');
      c.className = 'cnt'; c.textContent = item.count;
      slot.appendChild(c);
      slot.title = itemName(item.id);
      slot.addEventListener('click', () => {
        for (let j = 0; j < 9; j++) {
          if (!hotbar[j]) {
            hotbar[j] = item;
            backpack.splice(i, 1);
            renderInventoryGrids(); updateHotbarUI();
            return;
          }
        }
      });
    }
    g.appendChild(slot);
  }
  const hb = document.getElementById('invHotbar');
  hb.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const item = hotbar[i];
    if (item) {
      const cv = document.createElement('canvas');
      drawBlockIcon(cv, item.id);
      slot.appendChild(cv);
      const c = document.createElement('span');
      c.className = 'cnt'; c.textContent = item.count;
      slot.appendChild(c);
      slot.title = itemName(item.id);

  }

function updateHotbarUI() {
  const h = document.getElementById('hotbar');

  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (i === selectedSlot ? ' sel' : '');

      drawBlockIcon(cv, item.id);
      slot.appendChild(cv);

let audioCtx = null, musicGain = null, sfxGain = null;
let musicPlaying = false;
let musicTimeout = null;

function initAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain(); musicGain.gain.value = settings.musicVol;
    musicGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = settings.sfxVol;
    sfxGain.connect(audioCtx.destination);
    startMusic();
  } catch (e) {}
}

const sfx = {
  _play(type, freq, dur, vol, freqEnd) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(now); o.stop(now + dur);
  },
  footstep(mat) {
    const base = mat === 'stone' ? 280 : mat === 'wood' ? 220 : mat === 'sand' ? 380 : mat === 'snow' ? 500 : mat === 'water' ? 400 : 200;
    const noise = mat === 'sand' || mat === 'snow' ? 'square' : 'triangle';
    this._play(noise, base + Math.random()*40, 0.08, 0.05);
  },
  breakBlock(mat) {
    const base = mat === 'stone' ? 150 : mat === 'wood' ? 180 : mat === 'sand' ? 300 : mat === 'glass' ? 800 : 140;
    this._play('square', base, 0.14, 0.08, base * 0.5);
    setTimeout(() => this._play('triangle', base*0.8, 0.1, 0.05), 30);
  },
  place(mat) {
    const base = mat === 'stone' ? 260 : mat === 'wood' ? 320 : 240;
    this._play('triangle', base, 0.09, 0.08);
  },
  jump() { this._play('sine', 380, 0.12, 0.04, 520); },
  hurt() { this._play('sawtooth', 260, 0.22, 0.1, 140); },
  hit() { this._play('square', 200, 0.08, 0.08, 100); },
  pickup() { this._play('sine', 720, 0.08, 0.05, 980); },
  craft() { this._play('sine', 520, 0.12, 0.08, 780); setTimeout(() => this._play('sine', 780, 0.14, 0.08, 1000), 90); },
  eat() { this._play('triangle', 200, 0.12, 0.08, 300); setTimeout(() => this._play('triangle', 240, 0.1, 0.06, 320), 100); }
};

function stopMusic() {
  musicPlaying = false;
  if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; }
}
function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;
  const chords = [
    [220, 261.63, 329.63], [174.61, 220, 261.63],
    [261.63, 329.63, 392], [196, 246.94, 293.66]
  ];
  let chordIdx = 0;
  function playChord() {
    if (!audioCtx || !musicPlaying) return;
    const chord = chords[chordIdx % chords.length];
    const now = audioCtx.currentTime;
    const bass = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();
    bass.type = 'sine'; bass.frequency.value = chord[0] / 2;
    bassGain.gain.setValueAtTime(0.001, now);
    bassGain.gain.linearRampToValueAtTime(0.06, now + 0.3);
    bassGain.gain.linearRampToValueAtTime(0.001, now + 2.5);
    bass.connect(bassGain); bassGain.connect(musicGain);
    bass.start(now); bass.stop(now + 2.6);
    chord.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, now + i*0.05);
      g.gain.linearRampToValueAtTime(0.025, now + 0.4 + i*0.05);
      g.gain.linearRampToValueAtTime(0.001, now + 2.4);
      o.connect(g); g.connect(musicGain);
      o.start(now + i*0.05); o.stop(now + 2.5);
    });
    chordIdx++;
    musicTimeout = setTimeout(playChord, 2800);
  }
  playChord();
}

let state = 'menu';

function updateDayNight(dt) {
  timeOfDay += dt / (settings.dayLength * 60);
  if (timeOfDay > 1) timeOfDay -= 1;
  const sunAngle = timeOfDay * Math.PI * 2 - Math.PI / 2;
  const sunX = Math.cos(sunAngle) * 80;
  const sunY = Math.sin(sunAngle) * 80;
  sunLight.position.set(sunX, sunY, 30);
  sunSprite.position.copy(sunLight.position).normalize().multiplyScalar(140);
  sunSprite.position.y = Math.max(-20, sunSprite.position.y);

  const elev = Math.max(0, sunY / 80);
  const isNight = elev < 0.1;
  sunLight.intensity = (isNight ? 0.15 : (0.4 + elev * 0.9)) * settings.brightness;
  ambientLight.intensity = (isNight ? 0.25 : (0.4 + elev * 0.4)) * settings.brightness;
  ambientLight.color.setHex(isNight ? 0x304070 : 0xffffff);

  const dayTop = new THREE.Color(0x1a3a6b), dayBot = new THREE.Color(0x87ceeb);
  const nightTop = new THREE.Color(0x050814), nightBot = new THREE.Color(0x1a2040);
  const sunsetTop = new THREE.Color(0x503060), sunsetBot = new THREE.Color(0xff8050);
  let top, bot;
  if (timeOfDay > 0.2 && timeOfDay < 0.3) {
    const t = (timeOfDay - 0.2) / 0.1;
    top = nightTop.clone().lerp(sunsetTop, t).lerp(dayTop, t*t);
    bot = nightBot.clone().lerp(sunsetBot, t).lerp(dayBot, t*t);
  } else if (timeOfDay > 0.7 && timeOfDay < 0.8) {
    const t = (timeOfDay - 0.7) / 0.1;
    top = dayTop.clone().lerp(sunsetTop, t).lerp(nightTop, t*t);
    bot = dayBot.clone().lerp(sunsetBot, t).lerp(nightBot, t*t);
  } else if (timeOfDay >= 0.3 && timeOfDay <= 0.7) { top = dayTop; bot = dayBot; }
  else { top = nightTop; bot = nightBot; }
  skyMat.uniforms.topColor.value.copy(top);
  skyMat.uniforms.bottomColor.value.copy(bot);
  scene.fog.color.copy(bot);
  renderer.setClearColor(bot);

  const moonAngle = timeOfDay * Math.PI * 2 + Math.PI / 2;
  moonSprite.position.set(Math.cos(moonAngle) * 140, Math.sin(moonAngle) * 140, 30);
}

function updateChunksProgressive() {
  if (!player || !world) return;
  const pcx = Math.floor(player.pos.x / CHUNK_W);
  const pcz = Math.floor(player.pos.z / CHUNK_D);
  const R = settings.renderDist;
  const toLoad = [];
  for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
    if (dx*dx + dz*dz > R*R) continue;
    const cx = pcx + dx, cz = pcz + dz;
    if (!world.chunks.has(world.key(cx, cz))) toLoad.push({ cx, cz, d: dx*dx + dz*dz });
  }
  toLoad.sort((a, b) => a.d - b.d);
  for (let i = 0; i < Math.min(chunkLoadBudget, toLoad.length); i++) world.loadChunk(toLoad[i].cx, toLoad[i].cz);
  chunkLoadBudget = 0;
  for (const key of Array.from(world.chunks.keys())) {
    const c = world.chunks.get(key);
    const dx = c.cx - pcx, dz = c.cz - pcz;
    if (dx*dx + dz*dz > (R + 2) * (R + 2)) world.unloadChunk(key);
  }
  world.updateChunkMeshes();
}

function updateCameraFromPlayer() {
  if (!player) return;
  const eye = player.getEyePosition();
  if (player.thirdPerson) {
    const back = new THREE.Vector3(
      Math.sin(player.yaw) * Math.cos(player.pitch),
      Math.sin(player.pitch),
      Math.cos(player.yaw) * Math.cos(player.pitch)
    );
    camera.position.copy(eye).addScaledVector(back, 4);
    camera.lookAt(eye);
    if (player.model) {
      player.model.position.copy(player.pos);
      player.model.rotation.y = player.yaw;
      player.model.visible = true;
    }
  } else {
    camera.position.copy(eye);
    camera.rotation.set(player.pitch, player.yaw, 0);
    if (player.model) player.model.visible = false;
  }
}

/* =========================================================
   СОХРАНЕНИЕ
========================================================= */
const SAVE_KEY = 'cubeverse_save_v3';
function saveGame() {
  if (!world || !player) return;
  try {
    const data = {
      seed: world.seed, mode: player.mode,
      playerPos: { x: player.pos.x, y: player.pos.y, z: player.pos.z },
      playerYaw: player.yaw, playerPitch: player.pitch,
      playerHP: player.hp, playerAir: player.air, playerHunger: player.hunger,
      hotbar, backpack, selectedSlot,
      modified: Array.from(world.modified.entries()),
      timeOfDay
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {}
}
function loadSave() { try { const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }

/* =========================================================
   ЗАПУСК / ОЧИСТКА
========================================================= */
function cleanupWorld() {
  if (world) {
    world.dispose();
    world = null;
  }
  for (const d of drops) {
    scene.remove(d.mesh);
    if (d.geo) d.geo.dispose();
    if (d.mat && d.mat._isItemMat) d.mat.dispose();
  }
  drops.length = 0;
  for (const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  for (const m of mobs) {
    scene.remove(m.mesh);
    m.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  }
  mobs.length = 0;
  if (player && player.model) { scene.remove(player.model); player.model = null; }
  player = null;
  stopMining();
}

function findSpawnY(x, z) {
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const cx = Math.floor((x + dx * 8) / CHUNK_W);
    const cz = Math.floor((z + dz * 8) / CHUNK_D);
    if (!world.chunks.has(world.key(cx, cz))) world.loadChunk(cx, cz);
  }
  for (let y = CHUNK_H - 1; y > 0; y--) {
    const b = world.getBlock(x, y, z);
    if (b !== B.AIR && b !== B.WATER && BLOCKS[b] && BLOCKS[b].solid) return y + 1;
  }
  return 32;
}

function startGame(mode) {
  const seedStr = (document.getElementById('seedInput').value || '').trim();
  const seed = seedStr ? hashString(seedStr) : (Math.random() * 0x7fffffff) | 0;
  cleanupWorld();
  world = new World(seed, scene);
  const spawnY = findSpawnY(0, 0);
  player = new Player(world);
  player.pos.set(0.5, spawnY + 0.2, 0.5);
  player.mode = mode;
  player.yaw = 0; player.pitch = 0;
  player.model = buildPlayerModel(); player.model.visible = false;
  scene.add(player.model);
  hotbar = [null,null,null,null,null,null,null,null,null];
  backpack = []; selectedSlot = 0;
  if (mode === 'creative') {
    const items = [B.GRASS, B.STONE, B.PLANKS, B.LOG, B.GLASS, B.TABLE, B.TORCH, B.SAND, B.LEAVES];
    for (let i = 0; i < 9; i++) hotbar[i] = { id: items[i], count: 999 };
  }
  timeOfDay = 0.3;
  updateHotbarUI(); updateStatsUI();
  enterGame();
}

function continueGame() {
  const save = loadSave();
  if (!save) { showToast('Сохранение не найдено'); return; }
  cleanupWorld();
  world = new World(save.seed, scene);
  if (Array.isArray(save.modified)) for (const [k, v] of save.modified) world.modified.set(k, v);
  player = new Player(world);
  player.mode = save.mode || 'survival';
  player.pos.set(save.playerPos.x, save.playerPos.y, save.playerPos.z);
  player.yaw = save.playerYaw ?? 0;
  player.pitch = save.playerPitch ?? 0;
  player.hp = save.playerHP ?? player.maxHp;
  player.air = save.playerAir ?? player.maxAir;
  player.hunger = save.playerHunger ?? player.maxHunger;
  hotbar = Array.isArray(save.hotbar) ? save.hotbar : [null,null,null,null,null,null,null,null,null];
  backpack = Array.isArray(save.backpack) ? save.backpack : [];
  selectedSlot = save.selectedSlot ?? 0;
  timeOfDay = save.timeOfDay ?? 0.3;
  player.model = buildPlayerModel();
  player.model.visible = false;
  scene.add(player.model);
  updateHotbarUI(); updateStatsUI();
  enterGame();
}

function enterGame() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('settings').classList.add('hidden');
  document.getElementById('inventory').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  if (isTouch) document.getElementById('touchUI').classList.remove('hidden');
  else document.getElementById('touchUI').classList.add('hidden');
  state = 'playing';
  paused = false;
  lastFrame = performance.now();
  applySettingsToWorld();
  initAudio();
  if (!isTouch) canvas.requestPointerLock();
}

function applySettingsToWorld() {
  if (!camera) return;
  camera.fov = settings.fov;
  camera.updateProjectionMatrix();
  const pr = settings.quality === 'low' ? 1
            : settings.quality === 'medium' ? Math.min(1.5, window.devicePixelRatio)
            : Math.min(2, window.devicePixelRatio);
  renderer.setPixelRatio(pr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  const far = settings.renderDist * CHUNK_W * 1.2 + 40;
  scene.fog.near = Math.max(20, settings.renderDist * CHUNK_W * 0.6);
  scene.fog.far = far;
  camera.far = far + 60;
  camera.updateProjectionMatrix();
  document.getElementById('debug').style.display = settings.showDebug ? 'block' : 'none';
  if (musicGain) musicGain.gain.value = settings.musicVol;
  if (sfxGain) sfxGain.gain.value = settings.sfxVol;
}

/* =========================================================
   ПЕРЕНАЗНАЧЕНИЕ КЛАВИШ
========================================================= */
function renderKeybinds() {
  const list = document.getElementById('keybindList');
  if (!list) return;
  list.innerHTML = '';
  for (const key of Object.keys(KEYBIND_LABELS)) {
    const row = document.createElement('div');
    row.className = 'keybind-row';
    const label = document.createElement('span');
    label.textContent = KEYBIND_LABELS[key];
    row.appendChild(label);
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (rebindingKey === key ? ' wait' : '');
    btn.textContent = rebindingKey === key ? 'нажмите...' : codeToLabel(settings.keybinds[key]);
    btn.addEventListener('click', () => {
      rebindingKey = (rebindingKey === key) ? null : key;
      renderKeybinds();
    });
    row.appendChild(btn);
    list.appendChild(row);
  }
}

/* =========================================================
   ESCAPE
========================================================= */
function handleEscape() {
  if (state === 'menu') {
    const settingsEl = document.getElementById('settings');
    if (!settingsEl.classList.contains('hidden')) {
      settingsEl.classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    }
    return;
  }
  if (state === 'playing' && paused) {
    const inv = document.getElementById('inventory');
    const menu = document.getElementById('menu');
    const settingsEl = document.getElementById('settings');
    if (!inv.classList.contains('hidden')) {
      closeInventory();
    } else if (!settingsEl.classList.contains('hidden')) {
      settingsEl.classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    } else if (!menu.classList.contains('hidden')) {
      document.getElementById('menu').classList.add('hidden');
      paused = false;
      if (!isTouch) canvas.requestPointerLock();
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Escape' && !rebindingKey) {
    if (state === 'menu') {
      const s = document.getElementById('settings');
      if (!s.classList.contains('hidden')) {
        e.preventDefault(); e.stopImmediatePropagation();
        handleEscape();
      }
    } else if (state === 'playing' && paused) {
      e.preventDefault(); e.stopImmediatePropagation();
      handleEscape();
    }
  }
}, true);

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
========================================================= */
genAtlas();
setupKeyboard();
setupMouse(canvas);
setupTouch(canvas);
setupClouds();
setupRain();

/* =========================================================
   МЕНЮ
========================================================= */
let menuMode = 'survival';

document.querySelectorAll('#modeSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#modeSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    menuMode = btn.dataset.mode;
  });
});

document.getElementById('btnNew').addEventListener('click', () => startGame(menuMode));

document.getElementById('btnContinue').addEventListener('click', () => {
  if (state === 'playing' && paused) {
    document.getElementById('menu').classList.add('hidden');
    paused = false;
    if (!isTouch) canvas.requestPointerLock();
    return;
  }
  continueGame();
});

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('settings').classList.remove('hidden');

  renderKeybinds();
});

document.getElementById('btnSettingsBack').addEventListener('click', () => {
  document.getElementById('settings').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');

});

/* =========================================================
   НАСТРОЙКИ: СЛАЙДЕРЫ
========================================================= */
function bindSlider(id, valId, key, fmt, onChange) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(valId);
  if (!el) return;
  const update = () => {
    const v = parseFloat(el.value);
    if (key === 'musicVol') { settings.musicVol = v / 100; if (musicGain) musicGain.gain.value = settings.musicVol; }
    else if (key === 'sfxVol') { settings.sfxVol = v / 100; if (sfxGain) sfxGain.gain.value = settings.sfxVol; }
    else settings[key] = v;
    valEl.textContent = fmt(v);
    if (onChange) onChange(v);
    saveSettings();
  };
  el.addEventListener('input', update);
}

bindSlider('rdSlider', 'rdVal', 'renderDist', v => v, () => applySettingsToWorld());
bindSlider('fovSlider', 'fovVal', 'fov', v => v, () => { if (camera) { camera.fov = settings.fov; camera.updateProjectionMatrix(); } });
bindSlider('sensSlider', 'sensVal', 'sensitivity', v => v.toFixed(1));
bindSlider('tLookSlider', 'tLookVal', 'touchLook', v => v.toFixed(1));
bindSlider('musSlider', 'musVal', 'musicVol', v => v.toFixed(0) + '%');
bindSlider('sfxSlider', 'sfxVal', 'sfxVol', v => v.toFixed(0) + '%');
bindSlider('brightSlider', 'brightVal', 'brightness', v => v.toFixed(2));
bindSlider('daySlider', 'dayVal', 'dayLength', v => v.toFixed(0));

/* =========================================================
   НАСТРОЙКИ: СЕГМЕНТЫ
========================================================= */
document.querySelectorAll('#qualitySeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#qualitySeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.quality = btn.dataset.q;
    applySettingsToWorld();
    saveSettings();
  });
});
document.querySelectorAll('#invertSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#invertSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.invertY = btn.dataset.inv === '1';
    saveSettings();
  });
});
document.querySelectorAll('#debugSeg .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#debugSeg .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.showDebug = btn.dataset.d === '1';
    document.getElementById('debug').style.display = settings.showDebug ? 'block' : 'none';
    saveSettings();
  });
});

document.getElementById('btnResetKeys').addEventListener('click', () => {
  settings.keybinds = { ...DEFAULT_KEYBINDS };
  renderKeybinds();
  saveSettings();
  showToast('Клавиши сброшены');
});

document.getElementById('btnInvClose').addEventListener('click', () => closeInventory());

function syncSettingsUI() {
  const set = (id, val, valId, fmt) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
    if (valId) {
      const v = document.getElementById(valId);
      if (v) v.textContent = fmt ? fmt(val) : val;
    }
  };
  set('rdSlider', settings.renderDist, 'rdVal');
  set('fovSlider', settings.fov, 'fovVal');
  set('sensSlider', settings.sensitivity, 'sensVal', v => v.toFixed(1));
  set('tLookSlider', settings.touchLook, 'tLookVal', v => v.toFixed(1));
  set('musSlider', settings.musicVol * 100, 'musVal', v => v.toFixed(0) + '%');
  set('sfxSlider', settings.sfxVol * 100, 'sfxVal', v => v.toFixed(0) + '%');
  set('brightSlider', settings.brightness, 'brightVal', v => v.toFixed(2));
  set('daySlider', settings.dayLength, 'dayVal', v => v.toFixed(0));
  document.querySelectorAll('#qualitySeg .btn').forEach(b => b.classList.toggle('active', b.dataset.q === settings.quality));
  document.querySelectorAll('#invertSeg .btn').forEach(b => b.classList.toggle('active', (b.dataset.inv === '1') === settings.invertY));
  document.querySelectorAll('#debugSeg .btn').forEach(b => b.classList.toggle('active', (b.dataset.d === '1') === settings.showDebug));
}

/* =========================================================
   АНИМАЦИЯ ФОНА МЕНЮ
========================================================= */
const menuCanvas = document.getElementById('menuCanvas');
const menuCtx = menuCanvas.getContext('2d');
const menuCubes = Array.from({ length: 18 }, () => ({
  x: Math.random(), y: Math.random(),
  size: 12 + Math.random() * 22,
  speed: 0.02 + Math.random() * 0.06,
  phase: Math.random() * Math.PI * 2,
  hue: 200 + Math.random() * 60
}));

function resizeMenuCanvas() {
  const r = menuCanvas.getBoundingClientRect();
  menuCanvas.width = Math.max(1, r.width);
  menuCanvas.height = Math.max(1, r.height);
}
window.addEventListener('resize', resizeMenuCanvas);
resizeMenuCanvas();

function animateMenu() {
  requestAnimationFrame(animateMenu);
  if (state !== 'menu') return;
  const W = menuCanvas.width, H = menuCanvas.height;
  menuCtx.clearRect(0, 0, W, H);
  const t = performance.now() / 1000;
  for (const c of menuCubes) {
    const cx = (c.x * W + Math.cos(t * c.speed + c.phase) * 60) % (W + 100) - 50;
    const cy = (c.y * H + Math.sin(t * c.speed * 1.3 + c.phase) * 40) % (H + 100) - 50;
    menuCtx.save();
    menuCtx.translate(cx, cy);
    menuCtx.rotate(t * 0.3 + c.phase);
    const g = menuCtx.createLinearGradient(-c.size/2, -c.size/2, c.size/2, c.size/2);
    g.addColorStop(0, `hsla(${c.hue}, 90%, 70%, 0.7)`);
    g.addColorStop(1, `hsla(${c.hue + 40}, 90%, 50%, 0.1)`);
    menuCtx.fillStyle = g;
    menuCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
    menuCtx.strokeStyle = `hsla(${c.hue}, 100%, 80%, 0.5)`;
    menuCtx.lineWidth = 1;
    menuCtx.strokeRect(-c.size/2, -c.size/2, c.size, c.size);
    menuCtx.restore();
  }
}
animateMenu();

/* =========================================================
   ПРАВКИ БЛОКОВ: удар по мобу в приоритете
========================================================= */
const _origStartMining = startMining;
startMining = function() {
  if (hitMobAtCursor()) return;
  _origStartMining();
};

/* =========================================================
   ГЛАВНЫЙ ЦИКЛ
========================================================= */
function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    fps = fpsFrames / fpsAccum;
    fpsAccum = 0; fpsFrames = 0;
  }

  if (state === 'playing' && !paused && player) {
    chunkLoadBudget = Math.max(1, Math.min(4, Math.round(40 / Math.max(20, fps))));
    player.update(dt, input);
    updateCameraFromPlayer();
    updateMining(dt);
    updateDrops(dt);
    updateParticles(dt);
    updateMobs(dt);
    updateDayNight(dt);
    updateChunksProgressive();
    updateClouds(dt);
    updateWeather(dt);
    updateStatsUI();

    autoSaveTimer += dt;
    if (autoSaveTimer > 30) { autoSaveTimer = 0; saveGame(); }
  }

  if (settings.showDebug && state === 'playing' && player && world) {
    const biome = world.getBiomeAt(Math.floor(player.pos.x), Math.floor(player.pos.z));
    document.getElementById('debug').innerHTML =
      `<b>FPS:</b> ${fps.toFixed(0)}<br>` +
      `<b>XYZ:</b> ${player.pos.x.toFixed(1)} ${player.pos.y.toFixed(1)} ${player.pos.z.toFixed(1)}<br>` +
      `<b>Биом:</b> ${BIOME_NAMES[biome] || '?'}<br>` +
      `<b>Режим:</b> ${player.mode === 'creative' ? 'Творческий' : 'Выживание'}<br>` +
      `<b>Чанки:</b> ${world.chunks.size}<br>` +
      `<b>Мобы:</b> ${mobs.length}<br>` +
      `<b>Погода:</b> ${weatherState === 'rain' ? 'дождь' : 'ясно'}<br>` +
      `<b>Вода:</b> ${player.headInWater ? 'да' : 'нет'}`;
  }

  if (sky) sky.position.copy(camera.position);

  renderer.render(scene, camera);
}
requestAnimationFrame(gameLoop);

/* =========================================================
   RESIZE
========================================================= */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  resizeMenuCanvas();
});

/* =========================================================
   СТАРТ
========================================================= */
applySettingsToWorld();
syncSettingsUI();
renderKeybinds();

if (!hasSave()) {
  document.getElementById('btnContinue').classList.add('disabled');
} else {
  document.getElementById('btnContinue').classList.remove('disabled');
}

state = 'menu';
document.getElementById('menu').classList.remove('hidden');

window.addEventListener('beforeunload', () => {
  try { stopMusic(); } catch (e) {}
  try { clearDropMaterialCache(); clearParticleMatCache(); } catch (e) {}
});
