<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>Pixel Farm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a1a0a;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    position: fixed;
  }
  #canvasWrapper {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center;
    background: #0a1a0a;
    overflow: hidden;
  }
  #gameCanvas {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    touch-action: none;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  #touchControls {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 50; display: none;
  }
  #touchControls.active { display: block; }
  .tc-btn {
    position: absolute; pointer-events: auto;
    background: rgba(142,201,111,0.35);
    border: 2px solid rgba(142,201,111,0.75);
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    color: #fff; font-weight: bold;
    user-select: none; -webkit-user-select: none;
    transition: background 0.06s, transform 0.06s;
  }
  .tc-btn:active, .tc-btn.pressed {
    background: rgba(142,201,111,0.9);
    transform: scale(0.94);
  }
  .tc-dpad-up    { bottom: 180px; left: 70px;  width: 60px; height: 60px; font-size: 22px; }
  .tc-dpad-down  { bottom: 60px;  left: 70px;  width: 60px; height: 60px; font-size: 22px; }
  .tc-dpad-left  { bottom: 120px; left: 10px;  width: 60px; height: 60px; font-size: 22px; }
  .tc-dpad-right { bottom: 120px; left: 130px; width: 60px; height: 60px; font-size: 22px; }
  .tc-atk   { bottom: 90px;  right: 30px;  width: 80px; height: 80px; font-size: 18px; }
  .tc-item  { bottom: 190px; right: 40px;  width: 60px; height: 60px; font-size: 14px; }
  .tc-sleep { bottom: 90px;  right: 130px; width: 60px; height: 60px; font-size: 14px; }
  .screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: linear-gradient(135deg, #1a2a1a 0%, #0d0d0d 100%);
    z-index: 100; padding: 20px; gap: 10px;
    overflow-y: auto;
  }
  .screen.hidden { display: none; }
  .screen h1 {
    font-size: clamp(32px, 9vw, 64px);
    letter-spacing: 4px; color: #8ec96f;
    text-shadow: 0 4px 0 #1a2a1a, 0 8px 20px rgba(142,201,111,0.4);
    margin-bottom: 20px; font-family: 'Courier New', monospace;
    text-align: center;
  }
  .screen h2 {
    font-size: clamp(22px, 6vw, 36px);
    color: #8ec96f; margin-bottom: 20px;
    letter-spacing: 2px; text-align: center;
  }
  .screen button {
    background: #2a4a2a; color: #d8ffd0;
    border: 2px solid #4a7a4a;
    padding: 14px 32px;
    font-size: clamp(14px, 4vw, 18px);
    cursor: pointer; border-radius: 6px;
    font-family: inherit; letter-spacing: 1px;
    transition: all 0.15s ease;
    min-width: 220px; max-width: 90vw;
    touch-action: manipulation;
  }
  .screen button:hover { background: #3a6a3a; border-color: #8ec96f; }
  .screen button:active { transform: scale(0.97); }
  .screen button.danger { background: #4a2020; border-color: #7a3a3a; color: #ffb0b0; }
  .screen button.small { min-width: 120px; padding: 10px 20px; font-size: 14px; }
  .slider-row {
    display: flex; align-items: center; gap: 12px;
    width: min(400px, 90vw); padding: 10px 0; font-size: 14px;
  }
  .slider-row label { width: 80px; color: #b0d8a0; }
  .slider-row input[type=range] {
    flex: 1; accent-color: #8ec96f; height: 8px; cursor: pointer;
  }
  .slider-row .val { width: 44px; text-align: right; color: #8ec96f; }
  .slot {
    width: min(440px, 90vw);
    padding: 14px 20px;
    background: #1a2a1a; border: 2px solid #3a5a3a;
    border-radius: 6px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    transition: all 0.15s; gap: 10px;
  }
  .slot:hover { border-color: #8ec96f; background: #223422; }
  .slot .info { text-align: left; flex: 1; min-width: 0; }
  .slot .name { font-size: 15px; color: #d8ffd0; }
  .slot .date { font-size: 11px; color: #7a9a7a; margin-top: 4px; }
  .slot .empty { color: #5a7a5a; font-style: italic; }
  .slot .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .slot .actions button { min-width: auto; padding: 6px 10px; font-size: 11px; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .credits { position: fixed; bottom: 10px; color: #4a6a4a; font-size: 11px; }
  #hud {
    position: fixed; top: 10px; left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px; border-radius: 6px;
    border: 1px solid #3a3a3a;
    font-size: 11px; line-height: 1.5;
    pointer-events: none; display: none;
    z-index: 40; max-width: 200px;
  }
  #hud b { color: #ffd54a; }
  #loadingOverlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #0d0d0d;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 200; color: #8ec96f;
    font-size: 16px; gap: 16px;
    transition: opacity 0.3s;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid #2a4a2a;
    border-top-color: #8ec96f;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #errorBar {
    position: fixed; top: 0; left: 0; right: 0;
    background: #800; color: #fff;
    padding: 8px 12px;
    font-family: monospace; font-size: 11px;
    z-index: 9999;
    display: none;
    word-break: break-all;
  }
  #assetStatus {
    position: fixed; top: 10px; right: 10px;
    background: rgba(0,0,0,0.85);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    color: #8ec96f;
    border: 1px solid #8ec96f;
    z-index: 45;
    pointer-events: none;
    display: none;
    max-width: 240px;
    line-height: 1.5;
    white-space: pre-line;
  }
  #assetStatus.err { color: #ffb0b0; border-color: #7a3a3a; }
  #assetStatus.warn { color: #ffd54a; border-color: #8a7a3a; }
  @media (max-width: 700px) and (orientation: portrait) {
    .tc-dpad-up    { bottom: 220px; left: 80px;  width: 65px; height: 65px; }
    .tc-dpad-down  { bottom: 80px;  left: 80px;  width: 65px; height: 65px; }
    .tc-dpad-left  { bottom: 150px; left: 15px;  width: 65px; height: 65px; }
    .tc-dpad-right { bottom: 150px; left: 145px; width: 65px; height: 65px; }
    .tc-atk   { bottom: 120px; right: 25px;  width: 90px; height: 90px; }
    .tc-item  { bottom: 230px; right: 40px;  width: 65px; height: 65px; }
    .tc-sleep { bottom: 120px; right: 130px; width: 65px; height: 65px; }
  }
</style>
</head>
<body>

<div id="errorBar"></div>
<div id="assetStatus"></div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div>Загрузка...</div>
</div>

<div id="canvasWrapper">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<div id="touchControls"></div>

<div id="hud">
  <b>WASD</b> / стрелки<br>
  <b>Пробел</b> — атака<br>
  <b>E</b> — предмет<br>
  <b>Z</b> — сон<br>
  <b>Esc</b> — пауза
</div>

<div id="menuMain" class="screen hidden">
  <h1>PIXEL FARM</h1>
  <button id="btnNew">Новая игра</button>
  <button id="btnLoad">Загрузить игру</button>
  <button id="btnSettings">Настройки</button>
  <div class="credits">v1.2</div>
</div>

<div id="menuSettings" class="screen hidden">
  <h2>Настройки</h2>
  <div class="slider-row">
    <label>Музыка</label>
    <input type="range" id="musicVol" min="0" max="100" value="40">
    <span class="val" id="musicVal">40%</span>
  </div>
  <div class="slider-row">
    <label>Звуки</label>
    <input type="range" id="sfxVol" min="0" max="100" value="70">
    <span class="val" id="sfxVal">70%</span>
  </div>
  <div class="row">
    <button id="btnBackFromSettings" class="small">Назад</button>
  </div>
</div>

<div id="menuSaves" class="screen hidden">
  <h2 id="savesTitle">Сохранения</h2>
  <div id="slotsContainer" style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;"></div>
  <div class="row">
    <button id="btnBackFromSaves" class="small">Назад</button>
  </div>
</div>

<div id="menuPause" class="screen hidden">
  <h2>Пауза</h2>
  <button id="btnResume">Продолжить</button>
  <button id="btnSavePause">Сохранить</button>
  <button id="btnSettingsPause">Настройки</button>
  <button id="btnToMain" class="danger">В главное меню</button>
</div>

<script>
(function(){
'use strict';

const errorBar = document.getElementById('errorBar');
window.addEventListener('error', (e) => {
  errorBar.style.display = 'block';
  errorBar.textContent = 'JS Error: ' + (e.message || e.error);
  setTimeout(() => { errorBar.style.display = 'none'; }, 6000);
});
function $(id) { return document.getElementById(id); }

// ============================================================
// КОНСТАНТЫ
// ============================================================
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const SCALE = 2;
const WIDTH = canvas.width / SCALE;
const HEIGHT = canvas.height / SCALE;
const TILE_SIZE = 32;
const MAP_COLS = 20;
const MAP_ROWS = 15;
const TILESET_COLS = 8;

// ============================================================
// SAFE STORAGE
// ============================================================
const Storage = {
  get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } },
  remove(k) { try { localStorage.removeItem(k); return true; } catch(e) { return false; } }
};

// ============================================================
// АУДИО
// ============================================================
const Audio = {
  ctx: null, musicGain: null, sfxGain: null,
  musicTimer: null, musicPlaying: false,
  musicVol: 0.4, sfxVol: 0.7,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVol;
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = this.sfxVol;
      this.sfxGain.connect(this.ctx.destination);
    } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch(e) {} } },
  setMusicVol(v) { this.musicVol = v; if (this.musicGain) this.musicGain.gain.value = v; },
  setSfxVol(v) { this.sfxVol = v; if (this.sfxGain) this.sfxGain.gain.value = v; },
  play(type) {
    if (!this.ctx || !this.sfxGain) return;
    const now = this.ctx.currentTime;
    const out = this.sfxGain;
    try {
      if (type === 'step') {
        const buf = this.ctx.createBuffer(1, 900, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/150);
        const src = this.ctx.createBufferSource(); src.buffer = buf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = 900;
        src.connect(flt).connect(out); src.start(now);
      } else if (type === 'attack') {
        const osc = this.ctx.createOscillator(); osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.18);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.35, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(g).connect(out); osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'item') {
        [523.25, 783.99, 1046.5].forEach((freq, i) => {
          const t = now + i * 0.06;
          const osc = this.ctx.createOscillator();
          osc.type = 'sine'; osc.frequency.value = freq;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.25, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(g).connect(out); osc.start(t); osc.stop(t + 0.4);
        });
      } else if (type === 'sleep') {
        const osc = this.ctx.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.linearRampToValueAtTime(70, now + 0.7);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.3, now + 0.25);
        g.gain.linearRampToValueAtTime(0.0, now + 0.85);
        osc.connect(g).connect(out); osc.start(now); osc.stop(now + 0.9);
      } else if (type === 'click') {
        const osc = this.ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 880;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.12, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(g).connect(out); osc.start(now); osc.stop(now + 0.07);
      }
    } catch(e) {}
  },
  startMusic() {
    if (!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    const melody = [
      { f: 392.00, d: 0.45 }, { f: 440.00, d: 0.45 }, { f: 493.88, d: 0.45 },
      { f: 587.33, d: 0.9 },  { f: 523.25, d: 0.45 }, { f: 493.88, d: 0.45 },
      { f: 440.00, d: 0.45 }, { f: 392.00, d: 0.9 },
      { f: 349.23, d: 0.45 }, { f: 392.00, d: 0.45 }, { f: 440.00, d: 0.45 },
      { f: 493.88, d: 1.35 },
    ];
    let idx = 0;
    const step = () => {
      if (!this.musicPlaying || !this.ctx) return;
      const note = melody[idx];
      const t = this.ctx.currentTime;
      try {
        const osc = this.ctx.createOscillator();
        osc.type = 'triangle'; osc.frequency.value = note.f;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.04);
        g.gain.linearRampToValueAtTime(0.10, t + note.d * 0.6);
        g.gain.linearRampToValueAtTime(0, t + note.d);
        osc.connect(g).connect(this.musicGain);
        osc.start(t); osc.stop(t + note.d);
      } catch(e) {}
      idx = (idx + 1) % melody.length;
    };
    step();
    this.musicTimer = setInterval(step, 500);
  },
  stopMusic() {
    this.musicPlaying = false;
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
  }
};
try {
  const s = JSON.parse(Storage.get('pixelfarm_audio') || '{}');
  if (typeof s.music === 'number') Audio.musicVol = s.music;
  if (typeof s.sfx === 'number') Audio.sfxVol = s.sfx;
} catch(e) {}
function saveAudioSettings() {
  Storage.set('pixelfarm_audio', JSON.stringify({ music: Audio.musicVol, sfx: Audio.sfxVol }));
}

// ============================================================
// АССЕТЫ: загружаем ДВА файла отдельно
// ============================================================
// Персонаж: assets/character.png (или сгенерированный canvas)
// Тайлы:    tileset.png          (или сгенерированный canvas)

let charSheet = null;   // Image или Canvas — спрайт-лист персонажа
let tilesSheet = null;  // Image или Canvas — тайлсет
let charReady = false;
let tilesReady = false;
let charSourceName = 'код';
let tilesSourceName = 'код';

const CHAR_CANDIDATES = [
  'assets/character.png',
  'assets/character.PNG',
  'assets/Character.png',
  'character.png',
  'sprite.png',
  'assets/sprite.png',
  'assets.png'
];
const TILES_CANDIDATES = [
  'tileset.png',
  'tileset.PNG',
  'Tileset.png',
  'assets/tileset.png',
  'tiles.png',
  'assets/tiles.png',
  'assets.png'
];

function showAssetStatus(cls, text) {
  const el = $('assetStatus');
  el.className = cls;
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 12000);
}

function refreshAssetStatus() {
  const chOK = (charSourceName !== 'код');
  const tlOK = (tilesSourceName !== 'код');
  if (chOK && tlOK) {
    showAssetStatus('', '✓ Ассеты загружены\nПерсонаж: ' + charSourceName + '\nТайлы: ' + tilesSourceName);
  } else if (chOK) {
    showAssetStatus('warn', '⚠ Персонаж: ' + charSourceName + '\n⚠ Тайлы: сгенерированы (tileset.png не найден)');
  } else if (tlOK) {
    showAssetStatus('warn', '⚠ Персонаж: сгенерирован\n⚠ Тайлы: ' + tilesSourceName);
  } else {
    showAssetStatus('err', '✗ Ни один файл не найден\nОжидается:\n  assets/character.png\n  tileset.png\nСпрайты нарисованы кодом.');
  }
}

function tryLoadImage(candidates, idx, onOk, onFail) {
  if (idx >= candidates.length) { onFail(); return; }
  const name = candidates[idx];
  const img = new Image();
  let done = false;
  const to = setTimeout(() => {
    if (done) return; done = true;
    tryLoadImage(candidates, idx + 1, onOk, onFail);
  }, 1500);
  img.onload = () => {
    if (done) return; done = true; clearTimeout(to);
    if (img.naturalWidth < 64 || img.naturalHeight < 64) {
      tryLoadImage(candidates, idx + 1, onOk, onFail); return;
    }
    onOk(img, name);
  };
  img.onerror = () => {
    if (done) return; done = true; clearTimeout(to);
    tryLoadImage(candidates, idx + 1, onOk, onFail);
  };
  // Кэш-бастер, чтобы после изменения файла на GitHub игра подхватила новую версию
  img.src = name + '?v=' + Date.now();
}

// --- Сначала запускаем загрузку картинок ---
tryLoadImage(CHAR_CANDIDATES, 0,
  (img, name) => { charSheet = img; charReady = true; charSourceName = name; refreshAssetStatus(); },
  () => { charSheet = null; charReady = false; charSourceName = 'код'; refreshAssetStatus(); }
);
tryLoadImage(TILES_CANDIDATES, 0,
  (img, name) => { tilesSheet = img; tilesReady = true; tilesSourceName = name; refreshAssetStatus(); },
  () => { tilesSheet = null; tilesReady = false; tilesSourceName = 'код'; refreshAssetStatus(); }
);

// --- Генерируем процедурный атлас (fallback, используется где не нашлось картинки) ---
const C = {
  hatTop:'#d4a04a',hatBrim:'#a87830',hatBand:'#6a3a1a',skin:'#f5c898',skinD:'#d4a878',
  hair:'#5a3a1a',eye:'#1a0d05',shirt:'#3a6ab0',shirtD:'#2a4a80',pants:'#6a4a2a',boot:'#2a1a0a',
  leafDark:'#2a5a1a',leafMid:'#3a7a2a',leafHi:'#5aa83a',trunk:'#5a3a1a',trunkD:'#3a2a0a',
  rock:'#7a7a80',rockHi:'#a0a0a8',rockLo:'#4a4a50',dirt:'#8a6a3a',dirtD:'#6a4a2a',dirtHi:'#a8804a',
  grass:'#4a8c3a',grassD:'#3a7028',grassHi:'#6ab04a',water:'#3a6ac0',waterHi:'#5a8ad0',
  waterD:'#2a4aa0',crop:'#5aa03a',cropD:'#3a7028',wood:'#8a5a30',woodD:'#5a3a1a'
};
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function genChar(c,ox,oy,dir,frame,anim){
  if(anim==='sleep'){rect(c,ox+4,oy+18,24,8,C.shirt);rect(c,ox+4,oy+18,24,2,C.shirtD);
    rect(c,ox+2,oy+20,4,4,C.skin);rect(c,ox+1,oy+19,5,3,C.hatBrim);
    rect(c,ox+2,oy+18,3,2,C.hatTop);rect(c,ox+26,oy+22,4,2,C.boot);
    const zx=ox+22,zy=oy+8;rect(c,zx,zy,5,1,'#fff');rect(c,zx+4,zy,1,3,'#fff');
    rect(c,zx,zy+2,5,1,'#fff');if(frame===1){rect(c,zx+5,zy-4,4,1,'#a0d0ff');

function showScreen(name) {
  [ui.main, ui.settings, ui.saves, ui.pause].forEach(s => { if (s) s.classList.add('hidden'); });
  if (name === 'main') ui.main.classList.remove('hidden');
  if (name === 'settings') {
    ui.musicVol.value = Math.round(Audio.musicVol * 100);
    ui.sfxVol.value = Math.round(Audio.sfxVol * 100);
    ui.musicVal.textContent = Math.round(Audio.musicVol * 100) + '%';
    ui.sfxVal.textContent = Math.round(Audio.sfxVol * 100) + '%';
    ui.settings.classList.remove('hidden');
  }
  if (name === 'saves') { renderSlots(); ui.saves.classList.remove('hidden'); }
  if (name === 'pause') ui.pause.classList.remove('hidden');
  ui.hud.style.display = (name === 'none') ? 'block' : 'none';

    [ui.main, ui.settings, ui.saves, ui.pause].forEach(s => { if (s) s.classList.add('hidden'); });
  }
}

function saveGame(slot) {
  return Storage.set('pixelfarm_save_' + slot, JSON.stringify({
    player: { x: player.x, y: player.y, direction: player.direction, state: 'idle' },
    map: mapData, timestamp: Date.now(),
  }));
}
function loadGame(slot) {
  const raw = Storage.get('pixelfarm_save_' + slot);
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    player = createPlayer();
    player.x = data.player.x; player.y = data.player.y;
    player.direction = data.player.direction || 'down';
    mapData = data.map || DEFAULT_MAP.map(r => r.slice());
    return true;
  } catch(e) { return false; }
}
function getSaveInfo(slot) {
  const raw = Storage.get('pixelfarm_save_' + slot);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e) { return null; }
}
function formatDate(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function renderSlots() {
  ui.savesTitle.textContent = savesMode === 'load' ? 'Загрузить игру' : 'Сохранить игру';
  ui.slotsContainer.innerHTML = '';
  for (let i = 1; i <= 3; i++) {
    const info = getSaveInfo(i);
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (info) {
      slot.innerHTML = '<div class="info"><div class="name">Слот ' + i + '</div><div class="date">' + formatDate(info.timestamp) + '</div></div>';
      if (savesMode === 'load') {
        slot.addEventListener('click', () => { Audio.play('click'); if (loadGame(i)) startGame(); });
      } else {
        const actions = document.createElement('div'); actions.className = 'actions';
        const b1 = document.createElement('button'); b1.className = 'small'; b1.textContent = 'Перезаписать';
        b1.onclick = (e) => { e.stopPropagation(); Audio.play('click'); saveGame(i); renderSlots(); };
        const b2 = document.createElement('button'); b2.className = 'small danger'; b2.textContent = 'Удалить';
        b2.onclick = (e) => { e.stopPropagation(); Audio.play('click'); Storage.remove('pixelfarm_save_' + i); renderSlots(); };
        actions.appendChild(b1); actions.appendChild(b2); slot.appendChild(actions);
      }
    } else {
      slot.innerHTML = '<div class="info"><div class="name empty">Слот ' + i + ' — пусто</div></div>';
      if (savesMode === 'save') {
        slot.addEventListener('click', () => { Audio.play('click'); saveGame(i); renderSlots(); });
      }
    }
    ui.slotsContainer.appendChild(slot);
  }
}

};

$('btnSettings').onclick = () => { Audio.init(); Audio.resume(); Audio.play('click'); showScreen('settings'); };
$('btnBackFromSettings').onclick = () => { Audio.play('click'); if (gameState === GS.PAUSED) showScreen('pause'); else showScreen('main'); };
$('btnBackFromSaves').onclick = () => { Audio.play('click'); if (gameState === GS.PAUSED) showScreen('pause'); else showScreen('main'); };
$('btnResume').onclick = () => { Audio.play('click'); resumeGame(); };
$('btnSavePause').onclick = () => { Audio.play('click'); savesMode = 'save'; showScreen('saves'); };
$('btnSettingsPause').onclick = () => { Audio.play('click'); showScreen('settings'); };
$('btnToMain').onclick = () => {
  Audio.play('click');
  if (confirm('Выйти в главное меню? Несохранённый прогресс будет потерян.')) {
    gameState = GS.MAIN; showScreen('main'); Audio.stopMusic();
  }
};
ui.musicVol.oninput = (e) => {
  Audio.setMusicVol(parseInt(e.target.value) / 100);
  ui.musicVal.textContent = e.target.value + '%'; saveAudioSettings();
};
ui.sfxVol.oninput = (e) => {
  Audio.setSfxVol(parseInt(e.target.value) / 100);
  ui.sfxVal.textContent = e.target.value + '%'; saveAudioSettings(); Audio.play('click');
};

// ============================================================
// СТАРТ/ПАУЗА
// ============================================================
function startGame() {
  gameState = GS.PLAYING; showScreen('none');
  Audio.init(); Audio.resume(); Audio.startMusic();
}
function pauseGame() {
  if (gameState !== GS.PLAYING) return;
  gameState = GS.PAUSED; showScreen('pause');
}
function resumeGame() {
  gameState = GS.PLAYING; showScreen('none'); Audio.resume();
}
function triggerAction(action) {
  if (gameState !== GS.PLAYING) return;
  if (player.state === 'attack' || player.state === 'useItem') return;
  if (action === 'attack') { player.state = 'attack'; player.frameIndex = 0; player.frameTimer = 0; Audio.play('attack'); }
  else if (action === 'useItem') { player.state = 'useItem'; player.frameIndex = 0; player.frameTimer = 0; Audio.play('item'); }
  else if (action === 'sleep') { if (player.state !== 'sleep') { player.state = 'sleep'; player.frameIndex = 0; player.frameTimer = 0; Audio.play('sleep'); } }
}
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (k === 'escape') {
    if (gameState === GS.PLAYING) pauseGame();
    else if (gameState === GS.PAUSED) resumeGame();
    return;
  }
  if (gameState !== GS.PLAYING) return;
  if (k === ' ') triggerAction('attack');
  else if (k === 'e') triggerAction('useItem');
  else if (k === 'z') triggerAction('sleep');
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

// ============================================================
// TOUCH
// ============================================================
let touchSetup = false;
function setupTouchControls() {
  if (touchSetup) return;
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) return;
  touchSetup = true;
  const container = $('touchControls');
  container.classList.add('active');
  const defs = [
    { key: 'arrowup', label: '▲', cls: 'tc-dpad-up' },
    { key: 'arrowdown', label: '▼', cls: 'tc-dpad-down' },
    { key: 'arrowleft', label: '◀', cls: 'tc-dpad-left' },
    { key: 'arrowright', label: '▶', cls: 'tc-dpad-right' },
    { action: 'attack', label: 'A', cls: 'tc-atk' },
    { action: 'useItem', label: 'E', cls: 'tc-item' },
    { action: 'sleep', label: 'Z', cls: 'tc-sleep' },
  ];
  defs.forEach(d => {
    const el = document.createElement('div');
    el.className = 'tc-btn ' + d.cls; el.textContent = d.label;
    const onStart = (e) => { e.preventDefault(); el.classList.add('pressed');
      if (d.key) keys[d.key] = true;
      if (d.action) triggerAction(d.action); };
    const onEnd = (e) => { e.preventDefault(); el.classList.remove('pressed');
      if (d.key) keys[d.key] = false; };
    el.addEventListener('touchstart', onStart, { passive: false });
    el.addEventListener('touchend', onEnd, { passive: false });
    el.addEventListener('touchcancel', onEnd, { passive: false });
    el.addEventListener('mousedown', onStart);
    el.addEventListener('mouseup', onEnd);
    el.addEventListener('mouseleave', onEnd);
    container.appendChild(el);
  });
}
setupTouchControls();

// ============================================================
// КОЛЛИЗИИ
// ============================================================
function isSolidAt(px, py) {
  const col = Math.floor(px / TILE_SIZE);
  const row = Math.floor(py / TILE_SIZE);
  if (col < 0 || col >= MAP_COLS || row < 0 || row >= MAP_ROWS) return true;
  return SOLID_TILES.includes(mapData[row][col]);
}
function checkCollision(nx, ny) {
  const padX = 8, padTop = 18, padBottom = 4;
  return isSolidAt(nx + padX, ny + padTop) ||
         isSolidAt(nx + 32 - padX, ny + padTop) ||
         isSolidAt(nx + padX, ny + 32 - padBottom) ||
         isSolidAt(nx + 32 - padX, ny + 32 - padBottom);
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  if (gameState !== GS.PLAYING) return;

  if (player.state === 'sleep') {
    const moving = keys['w']||keys['a']||keys['s']||keys['d']||
                   keys['arrowup']||keys['arrowleft']||keys['arrowdown']||keys['arrowright'];
    if (moving) { player.state = 'idle'; player.frameIndex = 0; player.frameTimer = 0; }
    else {
      player.frameTimer += dt;
      const cfg = animConfig.sleep;
      if (player.frameTimer > cfg.speed) {
        player.frameTimer = 0;
        player.frameIndex = (player.frameIndex + 1) % cfg.frames;
        if (player.frameIndex === 0) Audio.play('sleep');
      }
      return;
    }
  }

  if (player.state === 'attack' || player.state === 'useItem') {
    player.frameTimer += dt;
    const cfg = animConfig[player.state];
    if (player.frameTimer > cfg.speed) {
      player.frameTimer = 0; player.frameIndex++;
      if (player.frameIndex >= cfg.frames) {
        player.state = 'idle'; player.frameIndex = 0; player.frameTimer = 0;
      }
    }
    return;
  }

  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    { dy = -1; player.direction = 'up'; }
  if (keys['s'] || keys['arrowdown'])  { dy =  1; player.direction = 'down'; }
  if (keys['a'] || keys['arrowleft'])  { dx = -1; player.direction = 'left'; }
  if (keys['d'] || keys['arrowright']) { dx =  1; player.direction = 'right'; }
  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
  player.isMoving = (dx !== 0 || dy !== 0);
  player.vx = dx * player.speed;
  player.vy = dy * player.speed;
  if (player.vx !== 0) {
    const nx = player.x + player.vx;
    if (!checkCollision(nx, player.y)) player.x = nx;
  }
  if (player.vy !== 0) {
    const ny = player.y + player.vy;
    if (!checkCollision(player.x, ny)) player.y = ny;
  }
  let animState = 'idle';
  if (player.isMoving) {
    animState = 'walk' + player.direction.charAt(0).toUpperCase() + player.direction.slice(1);
  }
  if (player.state !== animState) {
    player.state = animState; player.frameIndex = 0; player.frameTimer = 0; player.lastStepFrame = -1;
  }
  player.frameTimer += dt;
  const cfg = animConfig[player.state];
  if (player.frameTimer > cfg.speed) {
    player.frameTimer = 0;
    const prevIdx = player.frameIndex;
    if (cfg.loop) player.frameIndex = (player.frameIndex + 1) % cfg.frames;
    else if (player.frameIndex < cfg.frames - 1) player.frameIndex++;
    if (cfg.stepFrames && cfg.stepFrames.includes(player.frameIndex) &&
        player.frameIndex !== prevIdx && player.isMoving) {
      Audio.play('step');
    }
  }
  camera.x = player.x - WIDTH / 2 + 16;
  camera.y = player.y - HEIGHT / 2 + 16;
  camera.x = Math.max(0, Math.min(camera.x, MAP_COLS * TILE_SIZE - WIDTH));
  camera.y = Math.max(0, Math.min(camera.y, MAP_ROWS * TILE_SIZE - HEIGHT));
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));

  // Тайлы
  const tilesImg = getTilesImage();
  const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
  const endCol = Math.min(MAP_COLS - 1, Math.ceil((camera.x + WIDTH) / TILE_SIZE));
  const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
  const endRow = Math.min(MAP_ROWS - 1, Math.ceil((camera.y + HEIGHT) / TILE_SIZE));

  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      const idx = mapData[row][col];
      const dx = col * TILE_SIZE;
      const dy = row * TILE_SIZE;
      const tCol = idx % TILESET_COLS;
      const tRow = Math.floor(idx / TILESET_COLS);
      const sx = tCol * TILE_SIZE;    // без смещения — тайлсет отдельный файл
      const sy = tRow * TILE_SIZE;
      try {
        ctx.drawImage(tilesImg, sx, sy, TILE_SIZE, TILE_SIZE, dx, dy, TILE_SIZE, TILE_SIZE);
      } catch(e) {
        ctx.fillStyle = '#4a8c3a';
        ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Тень игрока
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(player.x + 16, player.y + 30, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Игрок
  const charImg = getCharImage();
  const cfg = animConfig[player.state] || animConfig.idle;
  const sx = player.frameIndex * TILE_SIZE;   // без смещения — отдельный файл
  const sy = cfg.y;
  try {
    ctx.drawImage(charImg, sx, sy, TILE_SIZE, TILE_SIZE,
                  Math.round(player.x), Math.round(player.y), TILE_SIZE, TILE_SIZE);
  } catch(e) {
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(player.x + 8, player.y + 6, 16, 12);
  }

  ctx.restore();

  if (gameState === GS.PLAYING) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(8, HEIGHT - 24, 150, 18);
    ctx.fillStyle = '#8ec96f';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('State: ' + player.state, 14, HEIGHT - 11);
  }
}

// ============================================================
// ЦИКЛ
// ============================================================
let lastTime = performance.now();
function gameLoop(now) {
  let dt = now - lastTime; lastTime = now;
  if (dt > 100) dt = 100;
  if (dt < 0) dt = 0;
  try { update(dt); draw(); }
  catch(e) {
    errorBar.style.display = 'block';
    errorBar.textContent = 'Loop Error: ' + e.message;
  }
  requestAnimationFrame(gameLoop);
}

showScreen('main');
requestAnimationFrame(gameLoop);

window.addEventListener('blur', () => { if (gameState === GS.PLAYING) pauseGame(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && gameState === GS.PLAYING) Audio.resume();
});

})();
</script>
